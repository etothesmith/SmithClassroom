<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Smith's Classroom · Assignment</title>
<!-- Smith's Classroom 2.0 assignment games. One engine (ag.js), one content
     file per game (ag/<id>.js), picked with ?g=<id>. No CDNs: everything is
     on this site so it loads on the school network. -->
<style>
@font-face{font-family:"Baloo 2";font-weight:800;font-display:swap;src:url(fonts/baloo-2-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Nunito";font-weight:600;font-display:swap;src:url(fonts/nunito-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Nunito";font-weight:800;font-display:swap;src:url(fonts/nunito-latin-800-normal.woff2) format("woff2")}
:root{--char:#2B2B2B;--ink:#1E1B18;--dim:#6E655B;--page:#FFF4DE;--gold:#F2B632;--red:#C8102E;--green:#13804A;--blue:#1F5FD0;--acc:#C8102E}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-weight:600;line-height:1.45}
body{background-image:radial-gradient(rgba(200,16,46,.05) 1.2px,transparent 1.4px);background-size:22px 22px;min-height:100vh}
h1,h2,h3{font-family:"Baloo 2",system-ui,sans-serif;line-height:1.05;margin:0}
button{font:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:14px 14px 40px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bar .t{flex:1;min-width:0;font-family:"Baloo 2";font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{border:2px solid var(--char);border-radius:99px;background:#fff;padding:2px 10px;font-weight:800;font-size:13px;white-space:nowrap}
.lang{display:inline-flex;border:2px solid var(--char);border-radius:99px;overflow:hidden;background:#fff}
.lang button{border:0;background:none;padding:3px 9px;font-weight:800;color:var(--dim)}
.lang button[aria-pressed=true]{background:var(--char);color:#fff}
.card{background:#fff;border:2.5px solid var(--char);border-radius:20px;box-shadow:0 5px 0 var(--char);padding:18px;margin:14px 0}
.hero{position:relative;border:2.5px solid var(--char);border-radius:22px;overflow:hidden;box-shadow:0 6px 0 var(--char);background:#ddd}
.hero img.cv{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.hero .ttl{position:absolute;left:14px;bottom:14px;right:14px;background:rgba(255,255,255,.94);border:2.5px solid var(--char);border-radius:16px;padding:10px 14px}
.hero .ttl h1{font-size:clamp(28px,6vw,44px)}
.eyebrow{font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2.5px solid var(--char);border-radius:14px;box-shadow:0 4px 0 var(--char);
  background:#fff;color:var(--ink);font-weight:800;padding:10px 16px;min-height:46px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--char)}
.btn.go{background:var(--gold)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.guide{display:flex;gap:12px;align-items:flex-end;margin:10px 0}
.guide img{width:86px;flex:none}
.guide .bub{background:#fff;border:2.5px solid var(--char);border-radius:18px 18px 18px 4px;box-shadow:0 3px 0 var(--char);padding:10px 14px}
.scene{display:flex;gap:14px;align-items:flex-end;background:linear-gradient(180deg,#FFF1D6,#FFE3B0);border:2.5px solid var(--char);border-radius:18px;padding:12px;margin-bottom:12px}
.scene img.me{height:150px;flex:none;filter:drop-shadow(0 4px 0 rgba(0,0,0,.2))}
.scene .say{flex:1;background:#fff;border:2px solid var(--char);border-radius:14px;padding:10px 12px;font-size:15px}
@media(max-width:560px){.scene img.me{height:110px}}
.q{font-size:19px;font-weight:800;margin:4px 0 12px}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:#fff;border:2.5px solid var(--char);border-radius:14px;box-shadow:0 3px 0 var(--char);padding:11px 13px;font-weight:700;color:var(--ink)}
.opt.sel{border-color:var(--blue);box-shadow:0 3px 0 var(--blue);background:#EEF4FF}
.opt.right{border-color:var(--green);box-shadow:0 3px 0 var(--green);background:#E6F6EC}
.opt.wrong{border-color:var(--red);box-shadow:0 3px 0 var(--red);background:#FDE8EB}
.fb{border-radius:14px;padding:11px 13px;margin-top:12px;border:2.5px solid}
.fb.ok{background:#E6F6EC;border-color:var(--green)}
.fb.no{background:#FFF6DA;border-color:#E8B53C}
.fb.bad{background:#FDE8EB;border-color:var(--red)}
input.num{font:inherit;font-size:22px;font-weight:800;width:200px;max-width:100%;border:2.5px solid var(--char);border-radius:12px;padding:8px 12px}
.bins{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-top:10px}
.bin{border:2.5px dashed var(--char);border-radius:14px;padding:8px;min-height:90px;background:#FFFDF8}
.bin h4{margin:0 0 6px;font-size:14px}
.chipx{display:inline-block;border:2px solid var(--char);border-radius:10px;background:#fff;padding:5px 9px;margin:3px;font-weight:700;font-size:14px;box-shadow:0 2px 0 var(--char)}
.chipx.picked{background:#FFE7A6;border-color:var(--red)}
.chipx.right{background:#E6F6EC;border-color:var(--green)}
.chipx.wrong{background:#FDE8EB;border-color:var(--red)}
.pool{border:2.5px solid var(--char);border-radius:14px;padding:8px;background:#fff;min-height:54px}
.steps{display:grid;gap:8px}
.step{display:flex;gap:10px;align-items:center;background:#fff;border:2.5px solid var(--char);border-radius:12px;padding:8px 10px;box-shadow:0 2px 0 var(--char)}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--char);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.step .tx{flex:1}
.step button{border:2px solid var(--char);background:#fff;border-radius:8px;width:34px;height:34px;font-weight:800}
.prog{height:12px;background:#F1E6D2;border:2px solid var(--char);border-radius:99px;overflow:hidden;margin:6px 0 14px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#2FBF71,var(--gold))}
.lesson h2{font-size:26px;margin-bottom:6px}
.lesson p{font-size:17px}
.term{display:inline-block;background:#FFE7A6;border-radius:6px;padding:0 4px;font-weight:800}
.cert{text-align:center;border:6px double #F2B632;border-radius:20px;background:#fff;padding:22px;box-shadow:0 6px 0 var(--char)}
.cert img.me{height:200px}
.cert h1{font-size:clamp(28px,6vw,42px)}
.muted{color:var(--dim)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sr{position:absolute;left:-9999px}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>
<script src="world-link.js"></script>
<script src="ag.js"></script>
</body>
</html>
