<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0F1F">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Smith's Classroom</title>
<style>
/* ============================================================
   DESIGN TOKENS — pulled from the Smith's World title art:
   sunset sky, castle stone, gold arcade lettering, robe blue.
   ============================================================ */
:root{
  --void:#120A2E;
  --cab:#1C1142;
  --cab2:#271654;
  --gold:#F2B441;
  --robe:#2F6BD8;
  --crt:#4DE0B1;      /* stays green: this one means "correct" */
  --hot:#FF2E86;
  --neon:#22D8F0;     /* the cyan half of the neon pair */
  --ink:#F1ECFF;
  --dim:#A79CD0;
  --line:rgba(255,255,255,.12);
  --r:14px;
  --disp:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Courier New",ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--void);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom);overscroll-behavior-y:contain}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:9;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}body::before{display:none}}
h1,h2,h3{font-family:var(--disp);margin:0;letter-spacing:.02em}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.wrap{max-width:960px;margin:0 auto;padding:0 16px 112px}

/* ---------- marquee header ---------- */
.marquee{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,#2E1A63,#180E3A);
  border-bottom:2px solid var(--gold);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:12px}
.marquee::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:2px;
  background:linear-gradient(90deg,var(--neon),var(--hot),var(--gold));opacity:.55}
.logo{font-family:var(--disp);font-weight:800;font-size:15px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold);text-shadow:0 0 14px rgba(242,180,65,.45);white-space:nowrap;text-align:left}
.logo small{display:block;font-size:9px;letter-spacing:.28em;color:var(--dim);text-shadow:none}
.marquee .spacer{flex:1}
.tokenbar{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:13px}
.coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE29A,var(--gold));
  border:2px solid #7A5A12;display:grid;place-items:center;font-size:11px;font-weight:700;color:#5A3F06;flex:none}
.langsw{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.langsw button{padding:4px 9px;font-size:11px;font-family:var(--mono);color:var(--dim)}
.langsw button[aria-pressed="true"]{background:var(--gold);color:#2A1D00;font-weight:700}

/* ---------- title screen: the signature moment ---------- */
#title{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;
  justify-content:space-between;background:#12203A;
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#titleArt,#titleCanvas{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
#title .veil{position:fixed;inset:0;background:linear-gradient(180deg,rgba(6,4,14,.42),rgba(6,4,14,.05) 34%,rgba(6,4,14,.86))}
#title .top{position:relative;z-index:3;text-align:center;width:100%;
  padding:calc(5vh + env(safe-area-inset-top)) 18px 0}
#title .bottom{position:relative;z-index:3;width:100%;
  padding:24px 18px calc(28px + env(safe-area-inset-bottom))}
.wordmark{font-family:var(--disp);font-weight:800;text-transform:uppercase;line-height:.92;
  font-size:clamp(34px,12vw,80px);letter-spacing:.02em;color:var(--gold);
  text-shadow:0 4px 0 #8A5A0C,0 8px 0 #4C3106,0 10px 26px rgba(0,0,0,.7);margin-bottom:6px}
.wordmark span{display:block;color:#EAF2FF;text-shadow:0 4px 0 #1C4FA8,0 8px 0 #0E2A5C,0 10px 26px rgba(0,0,0,.7)}
.subtitle{font-family:var(--disp);letter-spacing:.26em;text-transform:uppercase;font-size:clamp(11px,3.4vw,15px);
  color:#EFEAFB;text-shadow:0 2px 6px #000;margin-bottom:26px}
.startmenu{display:flex;flex-direction:column;gap:10px;max-width:380px;margin:0 auto}
@media(min-width:700px){.hero{left:4%;height:66%;max-height:560px}}
.startmenu button{font-family:var(--disp);font-weight:800;text-transform:uppercase;letter-spacing:.14em;
  font-size:17px;padding:14px;border-radius:12px;border:2px solid rgba(255,255,255,.22);
  background:rgba(12,9,26,.66);color:#FFF}
.startmenu button.go{border-color:var(--gold);color:var(--gold);animation:blink 1.6s steps(1,end) infinite}
@keyframes blink{0%,60%{opacity:1}61%,100%{opacity:.5}}
.hero{position:fixed;left:-4%;bottom:0;height:50%;max-height:420px;z-index:2;
  filter:drop-shadow(0 12px 22px rgba(0,0,0,.55));pointer-events:none}

/* ---------- panels ---------- */
.panel{background:var(--cab);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:14px 0}
.panel.raised{background:var(--cab2);border-color:rgba(34,216,240,.22)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--neon)}
.big{font-size:clamp(28px,7.4vw,44px);font-weight:800;line-height:1.02;text-transform:uppercase;
  letter-spacing:.01em;
  background:linear-gradient(96deg,var(--gold) 8%,var(--hot) 58%,var(--neon) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-fill-color:transparent}
/* a solid-colour .big for the places that set their own colour (pass/fail) */
.big[style*="color"]{background:none;-webkit-text-fill-color:currentColor;color:inherit}
.muted{color:var(--dim)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:12px}
@media(min-width:700px){.grid.two{grid-template-columns:1fr 1fr}}
.coach{display:flex;gap:14px;align-items:flex-end;margin-top:14px}
.coach img{width:92px;height:auto;flex:none;filter:drop-shadow(0 6px 12px rgba(0,0,0,.5))}
.coach .bubble{background:var(--cab2);border:1px solid var(--line);border-radius:14px 14px 14px 4px;
  padding:10px 14px;font-size:14px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--cab2);
  border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-weight:600;min-height:46px;
  transition:transform .12s,border-color .12s}
.btn:hover{border-color:var(--dim)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,#FFD273,var(--gold));color:#2A1D00;border-color:#8A6512;font-weight:800}
.btn.ghost{background:transparent}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- nav dock ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:11;display:flex;gap:4px;
  margin:0 auto;max-width:660px;padding:6px;
  margin-bottom:calc(8px + env(safe-area-inset-bottom));
  background:#1B1046;
  border:1px solid rgba(34,216,240,.28);border-radius:16px;
  box-shadow:0 8px 24px rgba(0,0,0,.55)}
@media(max-width:700px){.dock{left:8px;right:8px}}
.dock button{flex:1;min-width:0;padding:8px 4px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:11px}
.dock button[aria-current="page"]{color:#160B2E;font-weight:800;
  background:linear-gradient(135deg,var(--neon),var(--hot));
  box-shadow:0 0 18px rgba(255,46,134,.4)}
.dock .ic{font-size:19px;line-height:1}
body.playing .dock{display:none}
body.playing .wrap{padding-bottom:24px}

/* ---------- progress + quiz ---------- */
.meter{height:9px;background:#0D0920;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--crt),var(--gold));transition:width .4s}
.chip{display:inline-block;font-family:var(--mono);font-size:11px;padding:3px 8px;border:1px solid var(--line);
  border-radius:999px;color:var(--dim)}
.chip.on{color:var(--crt);border-color:rgba(77,224,177,.5)}
.chip.warn{color:var(--gold);border-color:rgba(242,180,65,.5)}
.chip.bad{color:var(--hot);border-color:rgba(255,77,157,.5)}
.qtext{font-size:19px;font-weight:600;margin:6px 0 14px}
.opt{display:block;width:100%;text-align:left;background:var(--cab2);border:1px solid var(--line);
  border-radius:12px;padding:14px;margin:8px 0;min-height:52px}
.opt.sel{border-color:var(--gold)}
.opt.right{border-color:var(--crt);background:rgba(77,224,177,.10)}
.opt.wrong{border-color:var(--hot);background:rgba(255,77,157,.10)}
.why{border-left:3px solid var(--crt);padding:10px 12px;margin-top:12px;background:rgba(255,255,255,.03);
  border-radius:0 8px 8px 0;font-size:14px}
input[type=text],input[type=number],textarea,select{width:100%;background:#0D0920;border:1px solid var(--line);
  color:var(--ink);border-radius:10px;padding:12px;font:inherit;min-height:46px}
textarea{font-family:var(--mono);font-size:12px;min-height:110px}
label{display:block;font-size:13px;color:var(--dim);margin:10px 0 4px}
.timer{font-family:var(--mono);font-size:14px;color:var(--crt)}
.timer.low{color:var(--hot)}
.hidden{display:none!important}
canvas.game{display:block;width:100%;background:#07050F;border-radius:12px;border:1px solid var(--line);touch-action:none}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);z-index:30;background:var(--cab2);
  border:1px solid var(--gold);color:var(--ink);padding:10px 16px;border-radius:999px;font-size:14px;
  box-shadow:0 8px 30px rgba(0,0,0,.5)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.slot{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.slot .thumb{width:46px;height:46px;border-radius:8px;background:#0D0920;border:1px solid var(--line);
  display:grid;place-items:center;overflow:hidden;flex:none}
.slot .thumb img{max-width:100%;max-height:100%}
.slot .nm{flex:1;font-size:14px}
.slot code{font-family:var(--mono);font-size:11px;color:var(--dim);display:block}

/* ---------- marquee sign + arcade cards, after the mockup slides ---------- */
.marquee{border-bottom:none;box-shadow:0 3px 0 #8A6512,0 4px 18px rgba(0,0,0,.55);
  background:linear-gradient(180deg,#33265C,#150F2B);position:sticky}
.marquee::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;
  background:repeating-linear-gradient(90deg,var(--gold) 0 6px,#7A5A12 6px 12px)}
.zonestrip{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 12px;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.zonestrip .zone{flex:none;width:104px;scroll-snap-align:start;border:2px solid var(--line);
  border-radius:10px;overflow:hidden;background:#0D0920;padding:0;text-align:left}
.zonestrip .zone.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(242,180,65,.25)}
.zonestrip .zone img{display:block;width:100%;height:62px;object-fit:cover}
.zonestrip .zone span{display:block;font-size:10px;line-height:1.25;padding:5px 6px;color:var(--dim)}
.zonestrip .zone.on span{color:var(--gold)}

/* ---------- teacher question bank ---------- */
details.bankpack,details.bankunit{border:1px solid var(--line);border-radius:10px;
  margin-top:8px;background:var(--cab2);overflow:hidden}
details.bankunit{background:#150F2B;margin:8px 8px 8px 0}
details.bankpack>summary,details.bankunit>summary{padding:10px 12px;font-weight:700;cursor:pointer;
  list-style:none;display:flex;align-items:center;gap:8px}
details.bankpack>summary::-webkit-details-marker,details.bankunit>summary::-webkit-details-marker{display:none}
details.bankpack>summary::before{content:"▸";color:var(--gold);transition:transform .15s}
details.bankpack[open]>summary::before{transform:rotate(90deg)}
details.bankunit>summary::before{content:"▸";color:var(--dim);transition:transform .15s}
details.bankunit[open]>summary::before{transform:rotate(90deg)}
details.bankpack>*:not(summary){padding:0 10px 10px}
.bankitem{background:var(--cab);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0}
.bankq{font-size:14px;font-weight:600;margin:8px 0 6px}
.bankchoices{margin:0;padding-left:20px;font-size:13px}
.bankchoices li{margin:2px 0;color:var(--dim)}
.bankchoices li.right{color:var(--crt);font-weight:700}
.bankans{font-size:13px;color:var(--crt);margin-top:4px}
.bankwhy{font-size:12px;color:var(--dim);margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
#bankSearch{margin-top:2px}
ul.ctrl{margin:6px 0 12px;padding-left:18px;font-size:14px}
ul.ctrl li{margin:4px 0;color:var(--ink)}
/* narrow phones: the marquee must never push its own controls off screen */
.marquee{flex-wrap:nowrap;gap:8px}
.logo{overflow:hidden;text-overflow:ellipsis;min-width:0;flex-shrink:1}
.tokenbar,.langsw{flex:none}
@media (max-width:380px){
  .logo{font-size:12px;letter-spacing:.10em}
  .logo small{display:none}
  .marquee{padding-left:10px;padding-right:10px;gap:6px}
  .langsw button{padding:4px 7px}
  .wrap{padding-left:12px;padding-right:12px}
}

/* ---------- language picker (first run) ---------- */
#langpick{position:fixed;inset:0;z-index:60;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 30%,#2B2150,#0B0F1F 70%);padding:24px;text-align:center}
#langpick .lp{max-width:420px;width:100%}
#langpick .flag{font-size:30px;line-height:1}
#langpick .lpbtn{display:flex;align-items:center;gap:14px;width:100%;margin:10px 0;padding:16px 18px;
  border:2px solid var(--line);border-radius:14px;background:rgba(12,9,26,.7);text-align:left;
  font-family:var(--disp);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:18px}
#langpick .lpbtn:hover,#langpick .lpbtn:focus-visible{border-color:var(--gold);color:var(--gold)}
#langpick .lpbtn small{display:block;font-family:var(--body);font-weight:400;font-size:12px;
  letter-spacing:.02em;text-transform:none;color:var(--dim)}
#langpick img{height:150px;width:auto;margin-bottom:6px;
  filter:drop-shadow(0 10px 20px rgba(0,0,0,.6))}

/* ---------- study gate ---------- */
.readbox{max-height:270px;overflow-y:auto;padding-right:10px;font-size:16px;line-height:1.7;
  border:1px solid var(--line);border-radius:10px;background:#0D0920;padding:14px}
.readbox::-webkit-scrollbar{width:8px}
.readbox::-webkit-scrollbar-thumb{background:#33265C;border-radius:99px}
.clock{font-family:var(--mono);font-size:28px;margin:6px 0 8px}
.gate{border:1px dashed var(--line);border-radius:12px;padding:14px;margin-top:14px;background:#150F2B}
.gate.open{border-style:solid;border-color:var(--crt)}
.coach.small img{width:64px}

/* ---------- study RPG ---------- */
.eprow{display:flex;align-items:center;gap:8px;margin:14px 0 8px}
.epstage{display:flex;gap:16px;align-items:flex-start}
.epart{flex:none;width:120px;display:grid;place-items:center;
  background:linear-gradient(180deg,#2B2150,#150F2B);border:1px solid var(--line);
  border-radius:12px;padding:10px;min-height:130px}
.epart img{width:100%;height:auto;image-rendering:pixelated;
  filter:drop-shadow(0 6px 12px rgba(0,0,0,.55))}
.epbody{flex:1;min-width:0}
.smit{display:block;max-width:100%;height:auto;image-rendering:pixelated}
.smitsm{width:52px;height:auto;image-rendering:pixelated;vertical-align:middle}
.epsay{font-size:16px;line-height:1.65;margin:8px 0 0}
.epread{max-height:230px;overflow-y:auto;padding:14px;border:1px solid var(--line);
  border-radius:10px;background:#0D0920;font-size:16px;line-height:1.7;margin-top:8px}
.epread::-webkit-scrollbar{width:8px}
.epread::-webkit-scrollbar-thumb{background:#33265C;border-radius:99px}
.epworked{border-left:3px solid var(--crt);background:rgba(255,255,255,.03);
  padding:10px 12px;border-radius:0 8px 8px 0;margin-top:12px}
.epreact{display:flex;align-items:center;gap:10px;margin-top:10px}
@media(max-width:640px){
  .epstage{flex-direction:column}
  .epart{width:100%;max-width:150px;margin:0 auto}
}
/* widgets */
.wcanvas{display:block;width:100%;height:auto;background:#0D0920;
  border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
.wslider{width:100%;-webkit-appearance:none;appearance:none;height:28px;background:transparent}
.wslider::-webkit-slider-runnable-track{height:8px;background:#0D0920;
  border:1px solid var(--line);border-radius:99px}
.wslider::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-10px;
  border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE29A,var(--gold));
  border:2px solid #7A5A12;cursor:grab}
.wslider::-moz-range-track{height:8px;background:#0D0920;border:1px solid var(--line);border-radius:99px}
.wslider::-moz-range-thumb{width:24px;height:24px;border-radius:50%;
  background:var(--gold);border:2px solid #7A5A12;cursor:grab}
.wreadout{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;
  background:var(--cab2);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.wreadout div{display:flex;flex-direction:column;gap:2px}
.wreadout b{font-family:var(--mono);font-size:18px}
.wbudget{display:flex;justify-content:space-between;align-items:center;
  background:var(--cab2);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.wbar{height:10px;background:#0D0920;border:1px solid var(--line);
  border-radius:99px;overflow:hidden;margin-top:4px}
.wbar i{display:block;height:100%;transition:width .18s}
.wquiz:not(:empty){margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}

/* ---------- route picker ---------- */
.routegrid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media(min-width:640px){.routegrid{grid-template-columns:repeat(3,1fr)}}
.routecard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 10px;
  border:2px solid var(--line);border-radius:14px;background:var(--cab2);text-align:center;
  transition:transform .15s,border-color .15s,background .15s}
.routecard:hover{transform:translateY(-3px);border-color:var(--gold);background:rgba(242,180,65,.08)}
.routecard.on{border-color:var(--gold);background:rgba(242,180,65,.14)}
.routeicon{font-size:30px;line-height:1}
.routecard b{font-size:14px}
.routecard small{color:var(--dim);font-size:11px;line-height:1.3}

/* ---------- four-part remediation ---------- */
.remstack{display:grid;gap:10px;margin-top:10px}
.rembox{border-left:4px solid var(--line);background:rgba(255,255,255,.03);
  padding:10px 14px;border-radius:0 10px 10px 0;animation:riseIn .3s ease both}
.rembox p{margin:5px 0 0;font-size:14.5px;line-height:1.55}
.remlabel{font-family:var(--disp);font-weight:800;text-transform:uppercase;
  letter-spacing:.09em;font-size:10.5px;color:var(--dim)}
.rembox.r1{border-left-color:var(--hot)}
.rembox.r2{border-left-color:#9B7BE0}
.rembox.r3{border-left-color:var(--gold)}
.rembox.r4{border-left-color:var(--crt)}
.rembox.r1{animation-delay:.02s}.rembox.r2{animation-delay:.09s}
.rembox.r3{animation-delay:.16s}.rembox.r4{animation-delay:.23s}

/* ---------- big, self-explaining action buttons ---------- */
.bigbtns{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:620px){.bigbtns{grid-template-columns:1fr 1fr}}
.bigbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  padding:14px 16px;min-height:66px;border:2px solid var(--line);border-radius:14px;
  background:var(--cab2);transition:transform .14s,border-color .14s,background .14s}
.bigbtn:hover:not(:disabled){transform:translateY(-2px);border-color:var(--gold);
  background:rgba(242,180,65,.08)}
.bigbtn:active:not(:disabled){transform:scale(.985)}
.bigbtn.go{border-color:var(--gold);background:linear-gradient(180deg,rgba(242,180,65,.16),rgba(242,180,65,.05))}
.bigbtn.off{opacity:.45;cursor:not-allowed}
.bb-ico{flex:none;width:42px;height:42px;display:grid;place-items:center;border-radius:11px;
  background:var(--gold);color:#2A1D00;font-size:19px;font-weight:800}
.bigbtn.off .bb-ico{background:var(--line);color:var(--dim)}
.bb-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.bb-txt b{font-size:15px;line-height:1.2}
.bb-txt small{color:var(--dim);font-size:11.5px;line-height:1.35}
.classhead{text-align:left}
.classtitle{font-family:var(--disp);font-weight:800;text-transform:uppercase;
  letter-spacing:.05em;font-size:clamp(20px,5.5vw,30px);color:var(--gold);
  text-shadow:0 3px 0 #8A5A0C;margin:6px 0 0}

/* ---------- study: one area per class ---------- */
.packtabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.packtab{display:flex;flex-direction:column;gap:2px;padding:10px 14px;text-align:left;
  border:2px solid var(--line);border-radius:10px;background:var(--cab2);
  transition:transform .15s,border-color .15s}
.packtab small{color:var(--dim);font-size:11px}
.packtab.on{border-color:var(--gold);background:rgba(242,180,65,.12);transform:translateY(-2px)}
.packtab:hover{transform:translateY(-2px)}
.unitcard{border-left:4px solid var(--line);animation:riseIn .34s ease both}
.unitcard.done{border-left-color:var(--crt)}
.unithead{display:flex;gap:14px;align-items:flex-start}
.unitart{flex:none;width:74px;background:linear-gradient(180deg,#2B2150,#150F2B);
  border:1px solid var(--line);border-radius:10px;padding:6px;display:grid;place-items:center}
.unitart img{width:100%;height:auto;image-rendering:pixelated}
.unitmeta{flex:1;min-width:0}
.unitmeta h3{font-size:17px;margin:4px 0 8px;line-height:1.3}
@media(max-width:520px){.unitart{width:56px}}

/* ---------- motion ---------- */
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 0 rgba(242,180,65,0)}50%{box-shadow:0 0 18px rgba(242,180,65,.55)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes shimmer{0%{background-position:-300px 0}100%{background-position:300px 0}}
.epart img{animation:floaty 3.4s ease-in-out infinite}
.panel{animation:riseIn .3s ease both}
.chunkcard{transition:transform .16s,border-color .16s}
.chunkcard:not(.locked):hover{transform:translateX(5px);border-left-color:var(--gold)}
.chunkcard.started{border-left-color:var(--gold)}
.revcard{transition:transform .16s}
.revcard:hover{transform:translateX(5px)}
.btn.primary{transition:transform .12s,filter .12s}
.btn.primary:hover{transform:translateY(-2px);filter:brightness(1.1)}
.btn:active{transform:scale(.97)}
.opt,.jeoopt{transition:transform .12s,border-color .12s,background .12s}
.opt:not(:disabled):hover,.jeoopt:not(:disabled):hover{transform:translateX(3px)}
.opt.right,.jeoopt.right{animation:popIn .3s ease both,glowPulse 1.1s ease 1}
.opt.wrong,.jeoopt.wrong{animation:shakeX .4s ease both}
@keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}
  40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.meter i{transition:width .5s cubic-bezier(.2,.8,.2,1)}
.chip.on{animation:popIn .28s ease both}
.jeocell:not(.used){transition:transform .12s,box-shadow .12s}
.jeocell:not(.used):hover{transform:scale(1.05);box-shadow:0 0 16px rgba(242,180,65,.5)}
.jeoverdict{animation:popIn .34s ease both}
.wordmark{background:linear-gradient(90deg,var(--gold),#FFF0C0,var(--gold));
  background-size:300px 100%;-webkit-background-clip:text;background-clip:text;
  animation:shimmer 3.4s linear infinite}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;
    transition-duration:.001s!important}
}

/* ---------- chunk learning ---------- */
.chunkcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  border-left:4px solid var(--line);cursor:pointer}
.chunkcard.done{border-left-color:var(--crt)}
.chunkcard.locked{opacity:.45;cursor:not-allowed}
.chunknum{flex:none;width:40px;height:40px;display:grid;place-items:center;
  border-radius:50%;background:var(--cab2);border:2px solid var(--line);
  font-family:var(--mono);font-weight:700;color:var(--gold)}
.chunkcard.done .chunknum{background:var(--crt);color:#03201A;border-color:var(--crt)}
.chunkbody{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.chunkbody small{color:var(--dim);font-size:12px}
.chunkgo{flex:none;font-size:12px;color:var(--gold);font-weight:700}
.termrow{display:flex;flex-direction:column;gap:2px;padding:10px 12px;margin-bottom:8px;
  background:var(--cab2);border-left:3px solid var(--gold);border-radius:0 8px 8px 0}
.termrow b{color:var(--gold);font-size:16px}
.termrow span{font-size:14px;line-height:1.5;color:var(--ink)}
/* ---------- game-show challenge ---------- */
.showbar{display:flex;gap:3px;margin-bottom:12px}
.showbar i{flex:1;height:6px;border-radius:99px;background:#251C44}
.showbar i.ok{background:var(--crt)} .showbar i.no{background:var(--hot)}
.showbar i.now{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.showpanel{background:linear-gradient(180deg,#141C6B,#0B0F3F);border-color:var(--gold)}
.showq{font-size:clamp(16px,4vw,22px);text-align:center;margin:10px 0 16px}

/* ---------- review arcade ---------- */
.revcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  border-left:4px solid var(--line);cursor:pointer}
.revcard.done{border-left-color:var(--crt)}
.revicon{font-size:28px;color:var(--gold);flex:none;width:40px;text-align:center}
.revtext{flex:1;display:flex;flex-direction:column;gap:2px}
.revtext small{color:var(--dim);font-size:13px}
.flashcard{perspective:1000px;cursor:pointer;margin-top:8px}
.fcinner{position:relative;width:100%;min-height:220px;transition:transform .5s;
  transform-style:preserve-3d}
.flashcard.flipped .fcinner{transform:rotateY(180deg)}
.fcface{position:absolute;inset:0;backface-visibility:hidden;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;
  border:2px solid var(--line);border-radius:16px;text-align:center}
.fcfront{background:linear-gradient(180deg,#2B2150,#150F2B);border-color:var(--gold)}
.fcfront h2{font-size:clamp(22px,6vw,32px);color:var(--gold)}
.fcback{background:var(--cab2);transform:rotateY(180deg)}
.fcback p{font-size:16px;line-height:1.6;margin:0}
@media (prefers-reduced-motion:reduce){.fcinner{transition:none}}
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mtile{background:var(--cab2);border:1px solid var(--line);border-radius:10px;
  padding:12px;font-size:13px;line-height:1.4;text-align:left;min-height:64px}
.mtile.term{font-weight:700;color:var(--gold);font-size:15px}
.mtile.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(242,180,65,.3)}
.mtile.done{opacity:.25;border-color:var(--crt)}
@media(min-width:700px){.matchgrid{grid-template-columns:repeat(3,1fr)}}

/* ---------- home course cards ---------- */
.coursecard{display:flex;align-items:center;gap:12px;text-align:left;padding:14px;
  border:1px solid var(--line);position:relative;overflow:hidden;
  transition:transform .16s,border-color .16s,box-shadow .16s}
.coursecard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,var(--cc),var(--hot))}
.coursecard:hover{transform:translateY(-3px);border-color:var(--neon);
  box-shadow:0 10px 28px rgba(0,0,0,.4),0 0 20px rgba(34,216,240,.14)}
.ccart{flex:0 0 auto;width:58px}
.ccart img{width:100%;display:block}
.ccbody{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.ccbody b{font-family:var(--disp);font-size:20px;line-height:1.1;text-wrap:pretty}
.ccchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.ccgo{flex:0 0 auto;color:var(--neon);font-size:20px}

/* ---------- how it works ---------- */
.howto{text-align:left}
.howhead{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.howart{width:82px;flex:0 0 auto}
.howart img{width:100%;display:block}
.howsteps{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.howsteps li{display:flex;gap:12px;align-items:flex-start;
  animation:howIn .42s cubic-bezier(.2,.9,.25,1) both}
.howsteps li:nth-child(1){animation-delay:.04s}
.howsteps li:nth-child(2){animation-delay:.09s}
.howsteps li:nth-child(3){animation-delay:.14s}
.howsteps li:nth-child(4){animation-delay:.19s}
.howsteps li:nth-child(5){animation-delay:.24s}
.howsteps li:nth-child(6){animation-delay:.29s}
@keyframes howIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hownum{flex:0 0 auto;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;
  background:var(--gold);color:#2A1D00;font-family:var(--mono);font-weight:800;font-size:14px}
.howicon{flex:0 0 auto;width:28px;height:28px;display:grid;place-items:center;border-radius:8px;
  background:var(--cab2);border:1px solid var(--line);color:var(--gold);font-size:15px}
.howbody{display:flex;flex-direction:column;gap:2px;min-width:0}
.howbody b{font-size:15px}
.howbody small{font-size:13px;color:var(--dim);line-height:1.45;text-wrap:pretty}
.howextras{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.howx{display:flex;gap:12px;align-items:flex-start}

/* ---------- smartboard buzzers ---------- */
/* Room-scale buzzers: these get tapped by a student standing at a smartboard
   from across the room, so the target is large, the name wraps instead of
   truncating, and the number stays readable at the back of the class. */
.buzzbar{display:grid;gap:12px;margin-top:12px;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.buzzer{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:22px 14px;min-height:164px;border:4px solid var(--line);border-radius:20px;
  background:linear-gradient(180deg,#2B2150,#150F2B);
  transition:transform .1s,border-color .1s,background .1s}
.buzzer:hover:not(:disabled){transform:translateY(-3px);border-color:var(--gold)}
.buzzer:active:not(:disabled){transform:scale(.95)}
.buzzer.won{border-color:var(--crt);background:linear-gradient(180deg,#0E4A3A,#04241C);
  animation:glowPulse 1s ease infinite}
.buzzer.out{opacity:.28}
.bznum{width:54px;height:54px;display:grid;place-items:center;border-radius:50%;
  background:var(--gold);color:#2A1D00;font-family:var(--mono);font-weight:800;font-size:26px}
.buzzer.won .bznum{background:var(--crt);color:#03201A}
.bzname{font-size:21px;line-height:1.15;font-weight:800;max-width:100%;
  white-space:normal;overflow-wrap:anywhere;text-align:center}
.bzscore{font-family:var(--mono);font-size:15px;color:var(--dim)}
.bzhint{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}

/* The runner call, sized to be read from the back row. */
.uprow{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:10px;
  border:3px solid var(--line);border-radius:16px;background:var(--cab2)}
.upteam{flex:1;font-size:23px;font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.upwho{font-family:var(--mono);font-weight:800;font-size:34px;color:#2A1D00;
  background:var(--gold);border-radius:12px;padding:6px 18px;white-space:nowrap}
.upwho.all{background:var(--neon);color:#02222B;font-size:20px}
.sizerow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.sizename{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sizepick{display:flex;gap:5px}
.szbtn{width:38px;height:38px;border:2px solid var(--line);border-radius:9px;
  background:var(--cab2);font-family:var(--mono);font-weight:700}
.szbtn.on{border-color:var(--gold);background:var(--gold);color:#2A1D00}
.whosup{display:flex;gap:14px;align-items:center;
  border:2px solid var(--gold);background:linear-gradient(180deg,rgba(242,180,65,.16),rgba(242,180,65,.04));
  animation:popIn .3s ease both}
.whosupart{flex:none;width:74px}
.whosupart img{width:100%;height:auto;image-rendering:pixelated}
.whosupbody{flex:1;min-width:0}
.whosupname{font-family:var(--disp);font-weight:800;text-transform:uppercase;
  letter-spacing:.04em;font-size:clamp(17px,4.4vw,25px);color:var(--gold);margin:4px 0 0}

/* ---------- game show ---------- */
.jeoctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;
  border-color:var(--gold)}
.jeoctl .ctldot{width:12px;height:12px;border-radius:50%;background:var(--gold);
  box-shadow:0 0 0 0 rgba(242,180,65,.7);animation:ctlPulse 1.6s ease-out infinite;flex:0 0 auto}
@keyframes ctlPulse{70%{box-shadow:0 0 0 12px rgba(242,180,65,0)}100%{box-shadow:0 0 0 0 rgba(242,180,65,0)}}
.jeoctl .ctltext{font-size:15px}
.jeoctl .ctltext b{color:var(--gold)}

.seatbadge{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 5px;

.jeotitle{font-family:var(--disp);font-weight:800;text-transform:uppercase;

.tbtn{width:52px;height:52px;border:2px solid var(--line);border-radius:10px;

.topicgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:700px){.topicgrid{grid-template-columns:repeat(3,1fr)}}
.topicbtn{display:flex;flex-direction:column;gap:3px;padding:12px;text-align:left;
  border:2px solid var(--line);border-radius:10px;background:var(--cab2)}

.topicbtn.on{border-color:var(--gold);background:rgba(242,180,65,.12)}

.jeoscores{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px}

.jeoteam{display:flex;align-items:center;gap:8px;background:var(--cab2);

.jt-name{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.jeostatus{text-align:center;margin-top:16px;min-height:42px;display:grid;place-items:center}
.jeocount{font-family:var(--mono);font-size:38px;font-weight:700;color:var(--gold);

@keyframes jpulse{0%{transform:scale(1);opacity:1}70%{transform:scale(1.35);opacity:.5}100%{transform:scale(1);opacity:1}}

.creditline{display:flex;justify-content:space-between;gap:12px;padding:8px 0;

.codebox{width:100%;min-height:74px;font-family:var(--mono);font-size:11px;line-height:1.5;

  color:var(--ink);resize:vertical;word-break:break-all}

.codebox{width:100%;min-height:74px;font-family:var(--mono);font-size:11px;line-height:1.5;
  background:#0D0920;border:1px solid var(--line);border-radius:10px;padding:10px;

/* ---------- certificate of review prompt ---------- */

  background:rgba(6,4,14,.9);padding:20px;animation:popIn .3s ease both}
.certask{display:flex;gap:16px;align-items:center;max-width:460px;width:100%;
  background:var(--cab);border:2px solid var(--gold);border-radius:16px;padding:20px;
  box-shadow:0 14px 44px rgba(0,0,0,.6)}
.certaskart{flex:none;width:96px}
.certaskart img{width:100%;height:auto;image-rendering:pixelated;animation:floaty 3s ease-in-out infinite}
.certaskbody{flex:1;min-width:0}
@media(max-width:520px){.certask{flex-direction:column;text-align:center}.certaskart{width:110px}}

/* ---------- theme song / dance stage ---------- */
.tracklist{display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:10px}
.trackbtn{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;
  padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--cab);
  transition:border-color .16s,transform .12s}
.trackbtn:hover{border-color:var(--neon);transform:translateY(-2px)}
.trackbtn.on{border-color:var(--hot);background:rgba(255,46,134,.12)}
.trackbtn b{font-size:13px}
.trackbtn small{font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim)}
.trackbtn.on small{color:var(--hot)}
#dance{position:fixed;inset:0;z-index:70;display:flex;justify-content:center;
  align-items:safe center;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:rgba(6,4,14,.92);padding:20px}
.dancewrap{width:100%;max-width:660px;text-align:center;margin:auto}
#danceCv{display:block;width:100%;height:auto;border:2px solid var(--gold);
  border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.dancebar{display:flex;gap:10px;justify-content:center;margin-top:12px}

/* ---------- test review ---------- */
.revrow{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;background:var(--cab2)}
.revrow.ok{border-left:4px solid var(--crt)}
.revrow.no{border-left:4px solid var(--hot)}
.revrow .qn{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.1em}
.revrow p{margin:6px 0}
.revrow .ya{color:var(--hot)}
.revrow .ca{color:var(--crt)}
.scorering{font-family:var(--mono);font-size:44px;margin:4px 0}
.stage{position:relative;width:100%;background:#07050F;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}

/* ============================================================
   JUICE LAYER — cabinet glow, boot-up, coin flight, dock light,
   ripples and screen transitions. Purely additive: every rule
   below decorates markup that already exists.
   ============================================================ */

/* --- slow cabinet glow behind everything --- */
#fxbg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#fxbg i{position:absolute;display:block;border-radius:50%;filter:blur(70px);opacity:.30;
  animation:drift 28s ease-in-out infinite alternate}
#fxbg i:nth-child(1){width:56vw;height:56vw;left:-16vw;top:-12vh;background:#2F6BD8}
#fxbg i:nth-child(2){width:48vw;height:48vw;right:-14vw;top:22vh;background:#7A2ED8;animation-duration:36s}
#fxbg i:nth-child(3){width:40vw;height:40vw;left:16vw;bottom:-16vh;background:#F2B441;opacity:.14;animation-duration:44s}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(7vw,5vh,0) scale(1.2)}}
.wrap{position:relative;z-index:1}

/* --- particle stage --- */
#fxlayer{position:fixed;inset:0;z-index:35;pointer-events:none;overflow:hidden}
.fxcoin{position:fixed;width:24px;height:24px;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,#FFF0C4,#F2B441 58%,#B37D12);
  border:2px solid #7A5A12;box-shadow:0 0 16px rgba(242,180,65,.85);will-change:transform,opacity}
.fxspark{position:fixed;width:9px;height:9px;border-radius:2px;will-change:transform,opacity}

/* --- screen transitions --- */
@keyframes viewIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes riseInJ{from{opacity:0;transform:translateY(18px) scale(.99)}to{opacity:1;transform:none}}
#view.vin{animation:viewIn .3s cubic-bezier(.2,.9,.25,1) both}
#view.vin>*{animation:riseInJ .44s cubic-bezier(.18,.9,.24,1) both}
#view.vin>*:nth-child(1){animation-delay:.02s}
#view.vin>*:nth-child(2){animation-delay:.07s}
#view.vin>*:nth-child(3){animation-delay:.12s}
#view.vin>*:nth-child(4){animation-delay:.17s}
#view.vin>*:nth-child(5){animation-delay:.21s}
#view.vin>*:nth-child(6){animation-delay:.25s}
#view.vin>*:nth-child(n+7){animation-delay:.28s}
#view.shake{animation:shakeX .34s ease both}

/* --- marquee: chasing bulbs, live coin --- */
.marquee::after{background-size:12px 3px;animation:bulbs 1.15s linear infinite}
@keyframes bulbs{to{background-position:12px 0}}
.tokenbar{transition:transform .18s}
.coin{transition:transform .18s,box-shadow .18s}
.coin.hit{animation:coinPop .52s cubic-bezier(.2,1.7,.3,1)}
@keyframes coinPop{0%{transform:scale(1)}35%{transform:scale(1.5) rotate(-14deg);
  box-shadow:0 0 22px rgba(242,180,65,.9)}100%{transform:scale(1)}}
#tokenCount{font-variant-numeric:tabular-nums;min-width:1.4em;display:inline-block}
.mutebtn{position:relative;width:30px;height:30px;flex:none;display:grid;place-items:center;
  border:1px solid var(--line);border-radius:999px;color:var(--gold);font-size:14px;line-height:1;
  background:rgba(255,255,255,.03);transition:transform .14s,color .14s,border-color .14s}
.mutebtn:hover{border-color:var(--gold)}
.mutebtn:active{transform:scale(.9)}
.mutebtn.off{color:var(--dim)}
.mutebtn.off::after{content:"";position:absolute;left:5px;right:5px;top:50%;height:1.5px;
  background:var(--dim);transform:rotate(-38deg)}

/* --- dock: sliding light bar --- */
.dock button{position:relative;overflow:hidden;transition:color .18s,transform .14s}
.dock button::before{content:"";position:absolute;inset:0;border-radius:11px;pointer-events:none;
  background:linear-gradient(135deg,rgba(34,216,240,.18),rgba(255,46,134,.18));
  opacity:0;transition:opacity .18s}
@media(hover:hover){.dock button:hover:not([aria-current="page"])::before{opacity:1}}
.dock button:active{transform:scale(.9)}
.dock button[aria-current="page"] .ic{animation:iconPop .46s cubic-bezier(.2,1.7,.3,1) both}
@keyframes iconPop{0%{transform:translateY(4px) scale(.78)}58%{transform:translateY(-4px) scale(1.22)}
  100%{transform:none}}

/* --- press feel + ripples --- */
.btn,.opt,.mtile,.buzzer,.zone,.startmenu button,.chunkcard,.revcard{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.45),rgba(255,255,255,0) 70%)}
.btn.primary::after{content:"";position:absolute;top:-60%;bottom:-60%;left:-50%;width:32%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
  transform:skewX(-18deg);pointer-events:none;animation:sheen 4.2s ease-in-out infinite}
@keyframes sheen{0%,72%{left:-50%}100%{left:135%}}
.panel{transition:transform .18s,box-shadow .18s,border-color .18s}
@media(hover:hover) and (min-width:700px){
  .panel:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,.35)}
  .zone:hover{transform:translateY(-3px)}
}
.zone{transition:transform .16s,border-color .16s,box-shadow .16s}
.zone.on{animation:popIn .3s ease both}

/* --- answer feedback, louder --- */
.opt.right,.jeoopt.right{animation:rightPop .46s cubic-bezier(.2,1.6,.3,1) both,glowPulse 1.1s ease 1}
@keyframes rightPop{0%{transform:scale(1)}40%{transform:scale(1.035)}100%{transform:none}}
.opt.wrong,.jeoopt.wrong{animation:shakeX .42s ease both;filter:saturate(1.2)}
.why{animation:riseInJ .4s cubic-bezier(.2,.9,.25,1) both}

/* --- meters: fill with a moving highlight --- */
.meter i{position:relative;overflow:hidden;transition:width .7s cubic-bezier(.2,.85,.2,1)}
.meter i::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
  background-size:140px 100%;animation:shimmer 2s linear infinite}

/* --- toast: spring in, fade out --- */
.toast{animation:toastIn .42s cubic-bezier(.2,1.7,.3,1) both,toastOut .5s ease 2.05s both}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,26px) scale(.9)}
  to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,-10px) scale(.96)}}

/* --- title screen: CRT boot, sweep, parallax layers --- */
#title .crtboot{position:absolute;inset:0;z-index:9;pointer-events:none;background:#0B0F1F;
  animation:bootFade 1s ease-out both}
@keyframes bootFade{0%{opacity:1}55%{opacity:.55}100%{opacity:0}}
#title .crtline{position:absolute;left:0;right:0;top:50%;height:3px;z-index:10;pointer-events:none;
  background:#EFEAFB;box-shadow:0 0 26px 8px rgba(239,234,251,.8);animation:crtOpen .72s ease-out both}
@keyframes crtOpen{0%{transform:scaleX(.1);opacity:0}18%{transform:scaleX(1);opacity:1}
  100%{transform:scaleX(1) scaleY(60);opacity:0}}
#title .sweep{position:absolute;left:0;right:0;height:34%;z-index:8;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(255,255,255,.07),transparent);
  animation:sweepDown 5.5s linear infinite}
@keyframes sweepDown{from{top:-36%}to{top:106%}}
#titleCanvas,#titleArt{transition:transform .28s ease-out}
#title .top{animation:titleDrop .8s cubic-bezier(.2,1.35,.3,1) .3s both;transition:transform .3s ease-out}
@keyframes titleDrop{from{opacity:0;transform:translateY(-38px) scale(.94)}to{opacity:1;transform:none}}
#title .hero{animation:heroIn .8s cubic-bezier(.2,1.2,.3,1) .25s both,floaty 4.2s ease-in-out 1.1s infinite}
@keyframes heroIn{from{opacity:0;transform:translateX(-46px)}to{opacity:1;transform:none}}
#title .startmenu button{animation:riseInJ .5s cubic-bezier(.2,.9,.25,1) both;transition:transform .14s,border-color .14s}
#title .startmenu button:nth-child(1){animation-delay:.55s}
#title .startmenu button:nth-child(2){animation-delay:.63s}
#title .startmenu button:nth-child(3){animation-delay:.7s}
#title .startmenu button:nth-child(4){animation-delay:.76s}
#title .startmenu button:nth-child(n+5){animation-delay:.82s}
@media(hover:hover){#title .startmenu button:hover{transform:translateY(-2px) scale(1.02);border-color:var(--gold)}}
#title .startmenu button.go{animation:riseInJ .5s cubic-bezier(.2,.9,.25,1) .55s both,
  blink 1.6s steps(1,end) 1.1s infinite}

/* --- flashcards: real flip, springier --- */
.fcinner{transition:transform .6s cubic-bezier(.3,1.25,.35,1)}
.flashcard{transition:transform .16s}
.flashcard:active{transform:scale(.99)}

/* --- arcade screens read as a CRT --- */
.stage,canvas.game{position:relative}
.stage::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:12px;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.16) 0 2px,transparent 2px 4px);
  box-shadow:inset 0 0 70px rgba(0,0,0,.65)}
.stage.hitshake{animation:shakeX .3s ease both}

/* --- certificate prompt lands like a prize --- */
#certAsk .certask{animation:prizeIn .55s cubic-bezier(.2,1.55,.3,1) both}
@keyframes prizeIn{from{opacity:0;transform:translateY(26px) scale(.9)}to{opacity:1;transform:none}}
#certAsk::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 50% 50%,rgba(242,180,65,.22),transparent 62%);
  animation:prizeGlow 2.6s ease-in-out infinite}
@keyframes prizeGlow{0%,100%{opacity:.5}50%{opacity:1}}

/* ============================================================================
   3. STATE  —  survives reloads, moves between devices, tolerates new versions
   ========================================================================== */
const KEY="smiths.save", KEY_ART="smiths.art", KEY_OLD="tokenhall.save";
const blank=()=>({v:SCHEMA,name:"",lang:"en",langChosen:false,tokens:0,xp:0,streak:0,lastDay:"",
  prog:{},certs:[],best:{},session:null,extraPacks:[],skin:"smith",racer:"smith",route:"",pin:"",zone:{},arcade:{},
  studied:{},   /* unitId -> {sec:engagedSeconds, read:{sectionIndex:true}} */
  cfg:{classes:3,weeks:18,perWeek:3,perChallenge:15,examQs:25,examPass:70,studyMin:8}});
let S=blank(), T_=T.en;

function load(){
  try{const r=localStorage.getItem(KEY)||localStorage.getItem(KEY_OLD); if(r) S=upgrade(JSON.parse(r));}catch(e){}
  try{const a=localStorage.getItem(KEY_ART); if(a) ARTS=JSON.parse(a);}catch(e){}
  T_=T[S.lang]||T.en; document.documentElement.lang=S.lang;
}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }
/* Old saves keep working: fill in anything a newer version added. */
function upgrade(o){ const b=blank(); const out={...b,...o,cfg:{...b.cfg,...(o.cfg||{})}};
  out.prog=o.prog||{}; out.certs=o.certs||[]; out.best=o.best||{}; out.extraPacks=o.extraPacks||[];
  out.zone=o.zone||{}; out.arcade=o.arcade||{}; out.studied=o.studied||{};
  out.racer=o.racer||out.skin||"smith";
  out.route=o.route||"";
  out.v=SCHEMA; return out; }
/* Merge instead of overwrite, so loading a save never destroys newer work. */
function merge(inc){
  const a=upgrade(inc);
  S.name=S.name||a.name;
  S.tokens=Math.max(S.tokens,a.tokens); S.xp=Math.max(S.xp,a.xp); S.streak=Math.max(S.streak,a.streak);
  for(const k in a.prog){const m=S.prog[k]||{seen:0,right:0}; const n=a.prog[k];
    S.prog[k]={seen:Math.max(m.seen,n.seen||0),right:Math.max(m.right,n.right||0),last:n.last||m.last};}
  for(const g in a.best) S.best[g]=Math.max(S.best[g]||0,a.best[g]);
  S.studied=S.studied||{};
  for(const uid in (a.studied||{})){ const m=S.studied[uid]||{sec:0,read:{}}, n=a.studied[uid]||{};
    S.studied[uid]={sec:Math.max(m.sec||0,n.sec||0),read:{...(m.read||{}),...(n.read||{})}}; }
  S.arcade=S.arcade||{}; for(const g in (a.arcade||{})) S.arcade[g]=Math.max(S.arcade[g]||1,a.arcade[g]);
  const ids=new Set(S.certs.map(c=>c.code)); a.certs.forEach(c=>{if(!ids.has(c.code))S.certs.push(c);});
  a.extraPacks.forEach(p=>{ if(!S.extraPacks.some(x=>x.id===p.id)) S.extraPacks.push(p); });
  save();
}
const allPacks=()=>PACKS.concat(S.extraPacks||[]);
const allUnits=()=>allPacks().flatMap(p=>p.units.map(u=>({...u,pack:p})));
const findUnit=id=>allUnits().find(u=>u.id===id);

/* Keys the arcade asks for that no art file ever provided. Without these the
   games drew flat rectangles instead of characters. */
/* The seven racer_* keys never had art of their own: they resolved to pose
   names that were not in the pack, so every shuttle run fired seven 404s and
   drew pink rectangles instead of vehicles. Point them at the kart sprites,
   which do exist, and the traffic renders. Keys that DEFAULT_ART already
   carries (kart_*, foe_*) need no alias at all — art() finds them directly. */
const ART_ALIAS={
  racer_miner:"kart_cat",       racer_robo:"kart_saucer",
  racer_lizard:"kart_plant",    racer_pirate:"kart_pirate",
  racer_ghost:"kart_wizard",    racer_alien:"kart_saucer",

};
function art(k){
  if(ARTS[k]) return ARTS[k];
  if(POSES.indexOf(k)>=0){ const s=S.skin||"smith";
    return DEFAULT_ART[s+"_"+k]||DEFAULT_ART["smith_"+k]||DEFAULT_ART["smith_idle"]; }
  if(DEFAULT_ART[k]) return DEFAULT_ART[k];
  if(ART_ALIAS[k]) return ARTS[ART_ALIAS[k]] || DEFAULT_ART[ART_ALIAS[k]] || "";
  /* Unknown key: return nothing rather than guessing a path. The old guess
     asked the server for files that were never shipped — the 19 bg_* zone
     backdrops alone meant a 404 every time a student picked a zone. Every
     draw site already guards with drawable(), so "" degrades to the painted
     fallback silently. Teacher-supplied art arrives through ARTS, not here. */
  return "";
}
function artIsUpload(k){ return !!(ARTS[k]&&ARTS[k].indexOf("data:")===0); }
/* Optional art: returns "" unless the key resolves to something that actually
   exists (an upload or a built-in). art() otherwise guesses an assets/<k>.png
   path for extras that may never have been added, and requesting a file that
   isn't there is a console resource error even when onerror hides the tag. */
function artOpt(k){
  if(ARTS[k]) return ARTS[k];
  if(DEFAULT_ART[k]) return DEFAULT_ART[k];
  if(ART_ALIAS[k]) return art(k);
  return "";
}
function saveArt(){ try{ localStorage.setItem(KEY_ART,JSON.stringify(ARTS)); return true; }catch(e){ return false; } }
function artTag(k,cls){ const u=art(k); return u?`<img src="${u}" alt="" ${cls?`class="${cls}"`:""} onerror="this.remove()">`:""; }
function setArt(k,file){
  const big=(k==="title"), r=new FileReader();
  r.onload=()=>{ const im=new Image();
    im.onload=()=>{ const lim=big?1400:420, sc=Math.min(1,lim/Math.max(im.width,im.height));
      const c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(im.width*sc)); c.height=Math.max(1,Math.round(im.height*sc));
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      const prev=ARTS[k];
      ARTS[k]=big?c.toDataURL("image/jpeg",.82):c.toDataURL("image/png");
      if(!saveArt()){ if(prev)ARTS[k]=prev; else delete ARTS[k]; toast(T_.artBig); }
      render(); };
    im.onerror=()=>toast(T_.artBad);
    im.src=r.result; };
  r.readAsDataURL(file);
}
function clearArt(k){ delete ARTS[k]; saveArt(); render(); }
function setSkin(k){ S.skin=k; save(); render(); }
/* One Image per URL, shared with the cache art.js warms after first paint.

function spriteOf(k){ return artImage(art(k)); }

/* Built-in scene, in the spirit of the Smith's World art: sunset, gate, castle,
   and one floating island — drawn so the app still looks right with no files. */
function paintTitleScene(cv){
  if(!cv) return;
  cv.width=cv.clientWidth||window.innerWidth; cv.height=cv.clientHeight||window.innerHeight;
  const x=cv.getContext("2d"),W=cv.width,H=cv.height;
  const sky=x.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,"#3A2E6B"); sky.addColorStop(.42,"#B96A8B"); sky.addColorStop(.62,"#F0A15E"); sky.addColorStop(.78,"#FBD98C");
  x.fillStyle=sky; x.fillRect(0,0,W,H);
  x.fillStyle="#FFF0C2"; x.beginPath(); x.arc(W*.22,H*.62,86,0,7); x.fill();
  x.globalAlpha=.35; x.fillStyle="#FFFFFF";
  [[.12,.2,120],[.35,.14,90],[.72,.22,140],[.9,.12,80]].forEach(([a,b,r])=>{
    x.beginPath(); x.ellipse(W*a,H*b,r,r*.34,0,0,7); x.fill(); });
  x.globalAlpha=1;
  /* castle on the right */
  x.fillStyle="#6E6A8C";
  x.fillRect(W*.72,H*.42,W*.2,H*.3);
  [0,1,2].forEach(i=>{ const tx=W*(.72+i*.083);
    x.fillRect(tx,H*.3,W*.05,H*.42);
    x.beginPath(); x.moveTo(tx-6,H*.3); x.lineTo(tx+W*.025,H*.24); x.lineTo(tx+W*.05+6,H*.3); x.closePath();
    x.fillStyle="#8C4B5E"; x.fill(); x.fillStyle="#6E6A8C"; });
  /* stone gate, centre */
  x.fillStyle="#8E8AA8";
  x.fillRect(W*.42,H*.46,W*.05,H*.28); x.fillRect(W*.56,H*.46,W*.05,H*.28);
  x.fillRect(W*.4,H*.42,W*.23,H*.05);
  x.strokeStyle="#5C5878"; x.lineWidth=6; x.strokeRect(W*.47,H*.5,W*.09,H*.24);
  /* floating island, upper left */
  x.fillStyle="#4E7A3A"; x.beginPath(); x.ellipse(W*.14,H*.2,86,26,0,0,7); x.fill();
  x.fillStyle="#6B4A31"; x.beginPath(); x.moveTo(W*.14-70,H*.2); x.lineTo(W*.14,H*.32); x.lineTo(W*.14+70,H*.2); x.closePath(); x.fill();
  x.fillStyle="#C9CBD6"; x.fillRect(W*.115,H*.13,64,54);
  x.fillStyle="#7E8496"; x.beginPath(); x.arc(W*.115+32,H*.13+28,17,0,7); x.fill();
  /* ground and hedges */
  x.fillStyle="#3E6B33"; x.fillRect(0,H*.74,W,H*.26);
  x.fillStyle="#2F5427";
  for(let i=0;i<14;i++){ x.beginPath(); x.arc(i*W/13,H*.75,44,Math.PI,0); x.fill(); }
  x.fillStyle="#C6A56B"; x.beginPath();
  x.moveTo(W*.44,H); x.lineTo(W*.5,H*.74); x.lineTo(W*.56,H*.74); x.lineTo(W*.62,H); x.closePath(); x.fill();
  /* sparkles */
  x.fillStyle="#FFE9A8";
  [[.3,.34],[.36,.28],[.64,.36],[.68,.3],[.24,.44]].forEach(([a,b])=>{
    x.beginPath(); x.arc(W*a,H*b,5,0,7); x.fill(); });
}

/* ---------- secret teacher unlock: type the phrase anywhere ---------- */
/* Two phrases unlock teacher mode, typed anywhere on any screen. The buffer is
   kept as long as the longest phrase and every phrase is checked against its
   own tail, so a shorter code still matches while a longer one is in progress.
   This is how you get in on a borrowed laptop with no sign-in. */
const TEACHER_CODES=["coachsmiththegoat","coachneedaccess"];
const TEACHER_BUFMAX=Math.max.apply(null,TEACHER_CODES.map(c=>c.length));
let teacherBuf="";
window.addEventListener("keydown",e=>{
  if(TEACHER_OK) return;
  if(!e.key||e.key.length!==1) return;
  /* ignore typing inside a field, or a student answering a question would
     unlock the teacher tab by accident */
  const t=e.target&&e.target.tagName;
  if(t==="INPUT"||t==="TEXTAREA"||(e.target&&e.target.isContentEditable)) return;
  teacherBuf=(teacherBuf+e.key.toLowerCase()).slice(-TEACHER_BUFMAX);
  for(const code of TEACHER_CODES){
    if(teacherBuf.slice(-code.length)===code){ teacherBuf=""; unlockTeacherSecret(); return; }
  }
});
function unlockTeacherSecret(){
  TEACHER_OK=true;

  render();

}
/* Short label for a course, so it fits in the dock. The teacher's own titles
   are long ("Unit 4 · Citizenship, Elections, Participation"), and a dock item
   has room for about ten characters. */
const PACK_TAB={ "ap-econ":{en:"AP Econ",es:"AP Econ",icon:"▤"},
                 "us-gov":{en:"Gov",es:"Gobierno",icon:"⚖"},
                 "econ-h":{en:"Econ H",es:"Econ H",icon:"◱"} };
function packTabInfo(pk){
  const t=PACK_TAB[pk.id];
  if(t) return {label:L(t), icon:t.icon};
  const nm=L(pk.name)||pk.id;
  return {label:nm.length>10?nm.slice(0,9)+"…":nm, icon:"▤"};
}
function dock(){
  /* One menu item per class rather than a single "Study" tab holding all
     three. Not every student takes all three courses, and a shared tab made
     every one of them scroll past two classes they are not enrolled in. */
  const tabs=[["home","▣",T_.home]];
  allPacks().forEach(pk=>{ const ti=packTabInfo(pk); tabs.push(["pack:"+pk.id, ti.icon, ti.label]); });
  tabs.push(["arcade","◕",T_.arcade],["art","✎",T_.art]);
  if(TEACHER_OK) tabs.push(["teacher","◈",T_.teacher]);
  const el=document.getElementById("dock");
  /* Hide the nav for the whole game show: it is a fixed bar over the lower
     third of the screen, and that is where the buzzers, the runner panel's
     confirm button and the clock controls live. Keyed off the tab alone — the
     teacher enters with JEO still null, so testing JEO here would miss. */
  const inShow=TAB==="gameshow";

/* ============================================================================
   6b. TYPED ANSWERS — graded on ideas, not on string matching
   ----------------------------------------------------------------------------
   The old check was keys.some(k => text.includes(k)). That fails in both
   directions: one keyword anywhere passed the whole answer, and any typo,
   plural, hyphen or synonym failed it outright. "oportunity cost" missed.
   "sacrificed" missed when the key was "give up".

   Every keyword a unit already carries is treated here as one more accepted
   surface form of the same idea, then matched with normalisation, light
   stemming and bounded typo tolerance. No existing question needs rewriting.
   A unit can opt into stricter marking by giving an item its own `spec` with
   several ideas, all of which must appear.
   ========================================================================== */
const CONTRACTIONS={dont:"do not",doesnt:"does not",didnt:"did not",isnt:"is not",
  arent:"are not",wasnt:"was not",wont:"will not",cant:"can not",couldnt:"could not",
  wouldnt:"would not",shouldnt:"should not",its:"it is",thats:"that is",theres:"there is",
  youre:"you are",theyre:"they are",whats:"what is",hes:"he is",shes:"she is"};

function normalise(v){
  return String(v||"").toLowerCase()
    .replace(/[\u2018\u2019\u02bc]/g,"'").replace(/[\u201c\u201d]/g,'"')
    .replace(/[\u2010-\u2015]/g," ")               /* every dash variant -> space */
    .replace(/[^a-z0-9'\s.\/]/g," ")               /* keep . and / for arithmetic */
    .replace(/'/g,"").replace(/\s+/g," ").trim();
}
function tokenise(v){
  const raw=normalise(v).split(" ").filter(Boolean), out=[];
  for(let w of raw){
    if(!/\d[.\/]\d/.test(w)) w=w.replace(/^[.\/]+|[.\/]+$/g,"");
    if(!w) continue;
    if(CONTRACTIONS[w]) out.push.apply(out,CONTRACTIONS[w].split(" ")); else out.push(w);
  }
  return out;
}
/* Deliberately conservative. Aggressive stemming turns "costly" into "cost",
   and a false pass tells a student they understood something they did not. */
const IRREGULAR={chosen:"choose",chose:"choose",taken:"take",took:"take",given:"give",
  gave:"give",lost:"lose",made:"make",paid:"pay",spent:"spend",forgone:"forgo",
  foregone:"forgo",forwent:"forgo",bought:"buy",sold:"sell",kept:"keep",got:"get",
  rose:"rise",risen:"rise",fell:"fall",fallen:"fall",grew:"grow",grown:"grow"};
function stem(w){
  if(IRREGULAR[w]) return IRREGULAR[w];
  if(w.length<=3) return w;
  if(/(sses|shes|ches|xes)$/.test(w)) return w.slice(0,-2);
  if(/ies$/.test(w)) return w.slice(0,-3)+"y";
  if(/([^s])s$/.test(w)) return w.slice(0,-1);
  if(/ing$/.test(w)&&w.length>5) return w.slice(0,-3);
  if(/ed$/.test(w)&&w.length>4) return w.slice(0,-2);
  return w;
}
/* Bounded Levenshtein: bails out as soon as the best possible score passes max. */
function editDistance(a,b,max){
  if(a===b) return 0;
  if(Math.abs(a.length-b.length)>max) return max+1;
  const m=a.length,n=b.length;
  let prev=new Array(n+1),cur=new Array(n+1);
  for(let j=0;j<=n;j++) prev[j]=j;
  for(let i2=1;i2<=m;i2++){
    cur[0]=i2; let rowMin=cur[0];
    for(let j=1;j<=n;j++){
      const cost=a[i2-1]===b[j-1]?0:1;
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+cost);
      if(cur[j]<rowMin) rowMin=cur[j];
    }
    if(rowMin>max) return max+1;
    const t=prev; prev=cur; cur=t;
  }
  return prev[n];
}
/* Short words get no slack: one edit turns "cost" into "cast" or "most". */
function tolerance(w){ return w.length<=4?0:w.length<=7?1:2; }
function wordMatches(a0,b0){
  const a=stem(a0),b=stem(b0);
  if(a===b) return true;
  if(a.indexOf(b)===0&&b.length>=5) return true;
  if(b.indexOf(a)===0&&a.length>=5) return true;
  const tol=tolerance(b);
  return tol>0&&editDistance(a,b,tol)<=tol;
}
const FILLER=new Set(["the","a","an","of","to","is","are","was","were","that","this","it",
  "you","your","we","they","he","she","would","will","can","could","in","on","for","up",
  "and","or","be","been","being","get","got","have","has","had","do","does","did","by",
  "as","at","so","then","than","its","their"]);
/* Allows filler between the words of a phrase, so "give it all up" still
   matches "give up" and "the next, best alternative" matches "next best". */
function findPhrase(tokens,words,slack){
  outer:
  for(let i2=0;i2<tokens.length;i2++){
    let ti=i2,used=0,first=-1;
    for(let q=0;q<words.length;q++){
      let matched=false;
      while(ti<tokens.length){
        if(wordMatches(tokens[ti],words[q])){ if(first<0) first=ti; matched=true; ti++; break; }
        if(FILLER.has(tokens[ti])){ ti++; continue; }
        if(used<slack){ used++; ti++; continue; }
        continue outer;
      }
      if(!matched) continue outer;
    }
    return {start:i2,first:first<0?i2:first,end:ti};
  }
  return null;
}
const NEGATORS=new Set(["not","no","never","isnt","arent","cant","cannot","doesnt","dont",
  "wasnt","wouldnt","shouldnt","neither","nor","without","except"]);
/* Hedging is not denying, and students hedge constantly. Without these breaks,
   "I don't know but maybe it's the next best option" reads as a negation. */
const CLAUSE_BREAK=new Set(["but","however","so","because","since","although","though",
  "maybe","perhaps","actually","unless","while","whereas","yet","know","sure","think",
  "guess","remember","understand"]);
function isNegated(tokens,span){
  const from=(span.first==null?span.start:span.first);
  /* "it is not what you give up" matches the phrase "give up" starting at token
     zero, because everything before it is filler or slack. The negator then sat
     inside the match rather than before it and was missed entirely, so a student
     writing the exact opposite of the right answer was marked correct. */
  for(let i2=from;i2<span.end;i2++) if(NEGATORS.has(tokens[i2])) return true;
  for(let i2=from-1;i2>=Math.max(0,from-4);i2--){
    if(CLAUSE_BREAK.has(tokens[i2])) return false;
    if(NEGATORS.has(tokens[i2])) return true;
  }
  return false;
}
const WORD_NUM={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,
  ten:10,eleven:11,twelve:12,fifteen:15,twenty:20,forty:40,fifty:50,hundred:100,
  quarter:0.25,half:0.5};
function numbersIn(text){
  const t=normalise(text),out=[];
  const div=/(\d+(?:\.\d+)?)\s*(?:\/|divided by|divide by|over|per)\s*(\d+(?:\.\d+)?)/g;
  let m;
  while((m=div.exec(t))!==null){ const a=Number(m[1]),b=Number(m[2]);
    if(b) out.push(a/b); out.push(a,b); }
  const num=/\d+(?:\.\d+)?/g;
  while((m=num.exec(t))!==null) out.push(Number(m[0]));
  t.split(" ").forEach(w=>{ if(w in WORD_NUM) out.push(WORD_NUM[w]); });
  return out;
}
function hasNumber(text,target,tol){
  return numbersIn(text).some(n=>Math.abs(n-target)<=(tol==null?0.001:tol));
}
/* spec = { ideas:[{label, any:[...], pattern}], number:{value,tol,label},
            reject:[{any:[...],why}], minWords, onPass }                     */
function gradeText(answer,spec){
  const tokens=tokenise(answer);
  const res={pass:false,found:[],missing:[],negated:[],rejected:null,tooShort:false};
  if(spec.number) res.numberOk=hasNumber(answer,spec.number.value,spec.number.tol);
  const hasMaths=/\d/.test(answer);
  if(!hasMaths&&tokens.length<(spec.minWords==null?3:spec.minWords)){
    res.tooShort=true; res.missing=(spec.ideas||[]).map(i2=>i2.label); return res;
  }
  (spec.reject||[]).forEach(r=>{
    (r.any||[]).forEach(form=>{
      const sp=findPhrase(tokens,form.split(" "),1);
      if(sp&&!isNegated(tokens,sp)) res.rejected=r.why;
    });
  });
  const norm=normalise(answer);
  const check=idea=>{
    if(idea.pattern&&idea.pattern.test(norm)) return "found";
    for(const form of (idea.any||[])){
      const words=String(form).toLowerCase().split(/\s+/).filter(Boolean);
      if(!words.length) continue;
      const sp=findPhrase(tokens,words,words.length>1?2:0);
      if(!sp) continue;
      return isNegated(tokens,sp)?"negated":"found";
    }
    return "missing";
  };
  (spec.ideas||[]).forEach(idea=>{
    const r=check(idea);
    if(r==="found") res.found.push(idea.label);
    else if(r==="negated") res.negated.push(idea.label);
    else res.missing.push(idea.label);
  });
  (spec.optional||[]).forEach(idea=>{ if(check(idea)==="found") res.found.push(idea.label); });
  if(spec.number&&!res.numberOk) res.missing.push(spec.number.label);
  res.pass=!res.missing.length&&!res.negated.length&&!res.rejected;
  return res;
}
function gradeFeedback(res,spec){
  if(res.tooShort) return T_.gradeShort;
  if(res.rejected) return res.rejected;
  if(res.negated.length) return T_.gradeFlip+" "+res.negated[0].toLowerCase()+".";
  if(res.pass) return spec.onPass||T_.gradePass;
  if(res.missing.length===1) return T_.gradeMiss1+" "+res.missing[0].toLowerCase()+".";
  return T_.gradeMissN+" "+res.missing.map(m=>m.toLowerCase()).join(", ")+".";
}
/* A unit written before this existed carries only `keys`. Each key becomes one
   more accepted wording of a single required idea, which is exactly the old
   behaviour plus tolerance for how students actually type. */
function specFor(it){
  if(it.spec) return it.spec;
  const keys=(it.keys||[]).map(k=>String(k).toLowerCase()).filter(Boolean);
  if(!keys.length) return {ideas:[],minWords:1};
  return {minWords:3,ideas:[{label:L(it.ideaLabel)||T_.gradeIdea,any:keys}]};
}

/* ============================================================================
   6c. STUDY TIME — engaged minutes, not elapsed minutes
   ----------------------------------------------------------------------------
   A plain countdown is beaten by opening the tab and going to lunch. This only
   accrues while the student is demonstrably present: the clock stops when the
   tab is hidden and when there has been no input for a while, and a unit does
   not unlock until every part of the notes has been scrolled through.

   It is not tamper-proof. Nothing in a browser tab is, and a determined student
   can nudge a mouse. It is honest enough that idling costs more effort than
   reading, which is the realistic bar.
   ========================================================================== */
const IDLE_AFTER=25;
let ST=null;
function studyRec(uid){ S.studied=S.studied||{};
  if(!S.studied[uid]) S.studied[uid]={sec:0,read:{}};
  const r=S.studied[uid]; r.read=r.read||{}; r.sec=r.sec||0; return r; }
function studyNeed(){ return Math.max(0,(S.cfg.studyMin==null?8:S.cfg.studyMin))*60; }
function studyStop(){ if(ST){ ST.destroy(); ST=null; } }
function studyStart(uid,onTick){
  studyStop();
  const rec=studyRec(uid);
  const t={idle:false,hidden:false,last:Date.now()/1000,n:0};
  const mark=()=>{ t.last=Date.now()/1000; t.idle=false; };
  const evs=["pointerdown","pointermove","keydown","wheel","touchstart","scroll"];
  evs.forEach(e=>window.addEventListener(e,mark,{passive:true}));
  const vis=()=>{ t.hidden=document.hidden; };
  document.addEventListener("visibilitychange",vis);
  t.timer=setInterval(()=>{
    const now=Date.now()/1000;
    t.idle=(now-t.last)>IDLE_AFTER;
    if(!t.idle&&!t.hidden){ rec.sec++; t.n++; if(t.n%10===0) save(); }
    if(onTick) onTick(t,rec);
  },1000);
  t.destroy=()=>{ clearInterval(t.timer);
    evs.forEach(e=>window.removeEventListener(e,mark));
    document.removeEventListener("visibilitychange",vis); save(); };
  ST=t; return t;
}
/* The notes are one block of prose. Splitting them into a few parts is what
   makes "scrolled to the end" mean anything, and it gives a student somewhere
   to stop rather than one intimidating wall of text. */
function briefParts(u){
  const txt=L(u.brief)||"";
  const sent=txt.match(/[^.!?]+[.!?]+["')\]]*\s*/g)||[txt];
  const want=Math.min(3,Math.max(1,Math.ceil(sent.length/3)));
  const per=Math.ceil(sent.length/want), out=[];
  for(let i2=0;i2<sent.length;i2+=per) out.push(sent.slice(i2,i2+per).join("").trim());
  return out.filter(Boolean);
}
function studyUnlocked(u){
  if(TEACHER_OK) return true;
  const rec=studyRec(u.id);
  /* An episode that reached the wrap scene counts as the notes being done.
     Saves from before the RPG existed still unlock on the old read-flags, so
     nobody loses access to a unit they already worked through. */
  const legacy=briefParts(u).every((_,i2)=>rec.read&&rec.read[i2]);
  return (unitChunksComplete(u.id)||rec.done||legacy) && rec.sec>=studyNeed();
}
function fmtMin(sec){ const m=Math.floor(sec/60),x=Math.floor(sec%60);
  return m+":"+String(x).padStart(2,"0"); }

/* ============================================================================
   REMEDIATION  —  four parts, not one line
   ----------------------------------------------------------------------------
   A wrong answer used to get the item's `why` and nothing else, which tells a
   student what the right answer was without telling them what they did. These
   four parts are the shape the PPC lesson uses and they answer four different
   questions:

     what went wrong   — names the specific error, not "incorrect"
     in plain words    — the idea again, stripped of the exam register
     a concrete case   — the same idea in the student's chosen world
     the right answer  — stated once, plainly, at the end

   Items can carry an authored `rem` object. Anything without one gets a built
   version: the error is inferred from the answer type, the plain-words part
   reuses the item's own explanation, and the concrete case is drawn from the
   route the student picked. That is honest about what it knows — it never
   invents a fact, it only reframes one.
   ========================================================================== */
const REM_BY_TYPE = {
  mcq:    {en:"You picked an option that sounds close but says something different.",
           es:"Elegiste una opcion que suena parecida pero dice otra cosa."},
  multi:  {en:"You missed part of it — this one has more than one correct answer.",
           es:"Te falto una parte: esta tiene mas de una respuesta correcta."},
  numeric:{en:"The method was probably right but the arithmetic came out wrong.",
           es:"El metodo puede estar bien, pero el calculo salio mal."},
  short:  {en:"Your answer is missing the idea the question is actually testing.",
           es:"A tu respuesta le falta la idea que la pregunta evalua."}
};
function remFor(it, unit){
  if (it && it.rem) return it.rem;                    /* teacher-authored wins */
  const rt = routeFor(unit);
  const type = (it && it.type) || "mcq";
  return {
    whatWrong: L(REM_BY_TYPE[type] || REM_BY_TYPE.mcq),
    plain: L(it.why),
    example: L(rt.example || {en:"", es:""}) ||
      (T_.remCaseLead + " " + L(rt.place) + ": " + L(rt.a) + " " + T_.remVs + " " + L(rt.b) + "."),
    answer: correctText(it)
  };
}

/* ============================================================================
   CHUNK LEARNING  —  study a topic, not a whole unit
   ----------------------------------------------------------------------------
   A unit is roughly forty minutes of material. That is more than one sitting
   and more than working memory holds, so a student who studies "Unit 3" tends
   to remember the first idea and the last one. Each unit is now broken into its
   topics, and a topic is one episode: a few terms, one reading beat, checks,
   one hands-on scene, one boss round. Ten minutes, one idea, a clear finish.

   The unit still exists as the container. Completing every topic in a unit
   completes the unit, which is what the test and certificate still gate on.
   ========================================================================== */

/* Terms and questions that belong to one topic. Questions are matched to a
   topic by their vocabulary: an item counts for a topic when it mentions one of
   that topic's terms. Anything unmatched is shared across the unit's topics so
   no question is ever orphaned. */
function itemsForTopic(unitId, topic){
  const u = findUnit(unitId); if (!u) return [];
  const terms = vocabByTopic(unitId, topic).map(v => L2(v.w,"en").toLowerCase());
  if (!terms.length) return u.items;
  const hit = [], rest = [];
  u.items.forEach(it => {
    const hay = (L2(it.q,"en") + " " + L2(it.why,"en") + " " +
                 ((it.c && it.c.en) || []).join(" ")).toLowerCase();
    (terms.some(t => hay.indexOf(t) >= 0) ? hit : rest).push(it);
  });
  /* A topic needs enough to check understanding. Below four, top up from the
     unpaired pool rather than shipping a two-question episode. */
  const out = hit.slice();
  let i = 0;
  while (out.length < 4 && i < rest.length) out.push(rest[i++]);
  return out.length ? out : u.items;
}

function topicRec(unitId, topic){
  const r = studyRec(unitId);
  if (!r.topics) r.topics = {};
  if (!r.topics[topic]) r.topics[topic] = {done:false, und:50, scene:0};
  return r.topics[topic];
}
function topicDone(unitId, topic){ return !!topicRec(unitId, topic).done; }
function unitTopicProgress(unitId){
  const ts = topicsOf(unitId);
  if (!ts.length) return {done:0, total:0, pct:0};
  const done = ts.filter(t => topicDone(unitId, t)).length;
  return {done, total:ts.length, pct:Math.round(done/ts.length*100)};
}
/* A unit's notes count as done when every topic in it is done. Units with no
   vocabulary fall back to the whole-unit episode, as before. */
function unitChunksComplete(unitId){
  const ts = topicsOf(unitId);
  if (!ts.length) return !!studyRec(unitId).done;
  return ts.every(t => topicDone(unitId, t));
}

/* ---------- topic picker for a unit ---------- */

    const started = (r.scene||0) > 0 && !r.done;

/* ============================================================================
   GAME-SHOW CHALLENGE  —  the solo timed run, presented like the board game
   ----------------------------------------------------------------------------
   Same questions, same scoring rules, different presentation: a streak
   multiplier that actually changes the points, a dramatic reveal, and Coach
   Smith reacting. The multiplier is the real change — a clean run is worth
   materially more than a scrappy one, so there's a reason to slow down and
   read the question.
   ========================================================================== */
function chDraw(){
  const it = Q.list[Q.idx];
  if (!it) return finishSet(false);
  const timed = Q.endsAt && Q.endsAt !== Infinity;
  const mult = 1 + Math.min(4, Math.floor((Q.streak||0)/3));
  const set = spriteSetFor(Q.unit);
  V().innerHTML = `
  <div class="eprow">
    <button class="btn ghost" style="padding:8px 12px;min-height:0" onclick="leaveSet()">← ${T_.exit}</button>
    <span style="flex:1"></span>
    ${timed?`<span class="timer" id="clk">${fmt(Q.endsAt-Date.now())}</span>`:""}
    <span class="chip ${mult>1?'on':''}">×${mult}</span>
    <span class="chip warn" id="chScore">${Q.points||0}</span>
  </div>
  <div class="showbar">
    ${Q.list.map((_,i)=>`<i class="${i<Q.idx?(Q.answers[i]?'ok':'no'):(i===Q.idx?'now':'')}"></i>`).join("")}
  </div>
  <section class="panel raised showpanel">
    <div class="eyebrow">${T_.question} ${Q.idx+1}/${Q.list.length}
      ${(Q.streak||0)>=3?` · <span style="color:var(--gold)">${T_.onFire} ${Q.streak}</span>`:""}</div>
    <p class="qtext showq">${esc(L(it.q))}</p>
    ${questionBody(it)}
    <div id="fb"></div>
    <div id="chStatus" class="jeostatus"></div>
    <button class="btn primary wide" style="margin-top:12px" id="epGo">${T_.check}</button>
  </section>`;
  /* Reuse the episode question wiring — same grader, same feedback, so a typed
     answer is marked identically here and in study mode. */
  const savedEP = EP;
  EP = EP || {checked:false, retry:false, und:50, streak:0};
  EP.checked = false;
  wireQuestion(it, ok => {
    Q.answers[Q.idx] = ok;
    Q.picks = Q.picks || []; Q.picks[Q.idx] = capturePick(it);
    if (ok){
      Q.streak = (Q.streak||0)+1;
      const gained = 100*mult;
      Q.points = (Q.points||0) + gained;
      const st = document.getElementById("chStatus");
      if (st) st.innerHTML = `<span class="jeoverdict ok">+${gained}</span>`;
    } else {
      Q.streak = 0;
      const st = document.getElementById("chStatus");
      if (st) st.innerHTML = `<span class="jeoverdict no">${T_.streakLost}</span>`;
    }
    const go = document.getElementById("epGo");
    go.textContent = (Q.idx >= Q.list.length-1) ? T_.finish : T_.next;
    go.onclick = () => { Q.idx++; EP = savedEP;
      if (Q.idx >= Q.list.length) finishSet(false); else chDraw(); };
  });
  window.scrollTo(0,0);
}
