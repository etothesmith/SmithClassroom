/* canvas-relative pointer helper — the source used window.innerWidth, which is
   wrong whenever the canvas is not the full window */
function canvasPoint(cv,touch){
  const r=cv.getBoundingClientRect();
  return {x:(touch.clientX-r.left)/r.width, y:(touch.clientY-r.top)/r.height};
}
function drawBack(x,img,zone,W,H,off){
  x.fillStyle=zone.sky; x.fillRect(0,0,W,H);
  if(!drawable(img)) img=zoneTile(zone);         /* optional .jpg missing -> built-in tile */
  if(!drawable(img)) return;
  if(img.naturalWidth<200){                      /* a tile, not a scene */
    const pat=tilePattern(x,img);
    if(pat){ x.save(); x.translate(-((off||0)%img.naturalWidth),0);
      x.fillStyle=pat; x.fillRect(0,0,W+img.naturalWidth,H); x.restore(); return; }
  }
  const s=Math.max(W/img.naturalWidth,H/img.naturalHeight);
  const w=img.naturalWidth*s,h=img.naturalHeight*s;
  const dx=off?-((off)%w):(W-w)/2;
  x.drawImage(img,dx,(H-h)/2,w,h);
  if(off) x.drawImage(img,dx+w,(H-h)/2,w,h);
}
function tilePattern(x,img){ try{ return drawable(img)?x.createPattern(img,"repeat"):null; }catch(e){ return null; } }
function sprite(x,im,cx,by,h){            /* draw centred on cx, sitting on by */
  const w=im.naturalWidth/im.naturalHeight*h;
  x.drawImage(im,cx-w/2,by-h,w,h);
}

/* ============================================================================
   GAME 1 — SMITH'S SPRINT (momentum platformer)
   ========================================================================== */
/* ============================================================================
   GAME 1 — SMITH'S RUN  ·  parallax platform runner
   ----------------------------------------------------------------------------
   Rebuilt around one complaint: you couldn't see what you were doing or where
   you were going. That turned out to be three separate faults, all measurable:

     1. UNSOLVABLE JUMPS. Gravity 0.6 with a 13.5 impulse gives a ceiling of
        152px. The generator was placing platforms up to 150px higher than the
        one you were standing on — a two-pixel margin, so a "miss" was often
        the level, not the player. Generation now derives its limits from the
        physics constants and caps rise at 55% of the real ceiling.

     2. NO RUNWAY. The camera put the player 30% in from the left and never
        looked further ahead as speed rose, so at level 8 you had 571ms between
        a hazard appearing and reaching you. The camera now leads by an amount
        proportional to current speed, holding reaction time near a second at
        every level.

     3. MUD. A 35% black wash sat over the whole frame including the
        gameplay, so the player, the coins and the ground were all the same
        value. The wash is now confined to the sky, the play band is lit, and
        everything you can touch carries an outline.

   The three environments come from the level pack: Neon City, Mystic Forest and
   Scorched Desert, plus three more built in the same style. They are drawn as
   backdrop only — the parallax never enters the play band, because scenery you
   can't collide with must never read as scenery you can.
   ========================================================================== */

/* ---- environments -------------------------------------------------------
   Each supplies a sky painter and a parallax stack. Keeping them data-driven
   means adding an environment is a table entry, not a new code path. */
const RUN_ENVS = [
 {k:"neon", name:{en:"Neon City",es:"Ciudad neón"},
  sky:["#01012b","#21004a","#580066"], band:"#0A0618", accent:"#FF007C", second:"#00F3FF",
  ground:"#1A1030", groundTop:"#FF007C", coin:"#FFE100", art:"tile_cosmic", prop:"prop_deck"},
 {k:"forest", name:{en:"Mystic Forest",es:"Bosque místico"},
  sky:["#03111f","#06222b","#0A3833"], band:"#04140F", accent:"#4DE0B1", second:"#CCFF00",
  ground:"#072018", groundTop:"#4DE0B1", coin:"#CCFF00", art:"tile_campus", prop:"prop_hut"},
 {k:"desert", name:{en:"Scorched Desert",es:"Desierto ardiente"},
  sky:["#FF3300","#FF7700","#FFCC55"], band:"#2A0A00", accent:"#FFB432", second:"#FF6A00",
  ground:"#4A1400", groundTop:"#FFB432", coin:"#FFE100", art:"tile_volcanic", prop:"prop_volcano"},
 {k:"campus", name:{en:"Campus at Dusk",es:"Campus al anochecer"},
  sky:["#14213A","#2B2150","#6B3A6B"], band:"#0D0920", accent:"#F2B441", second:"#4DE0B1",
  ground:"#1C2A18", groundTop:"#F2B441", coin:"#F2B441", art:"tile_campus", prop:"prop_hut"},
 {k:"deep", name:{en:"Deep Current",es:"Corriente profunda"},
  sky:["#001A2E","#00334D","#005266"], band:"#001018", accent:"#00D9FF", second:"#8AF29E",
  ground:"#032630", groundTop:"#00D9FF", coin:"#8AF29E", art:"tile_cosmic", prop:"prop_deck"},
 {k:"forge", name:{en:"The Forge",es:"La fragua"},
  sky:["#1A0000","#3D0A00","#6B1400"], band:"#140200", accent:"#FF6A00", second:"#FFE100",
  ground:"#2A0800", groundTop:"#FF6A00", coin:"#FFE100", art:"tile_volcanic", prop:"prop_volcano"}
];
const runEnv = lvl => RUN_ENVS[(Math.max(1,lvl)-1) % RUN_ENVS.length];

function gameSprint(cv,id,lvl,zone){
  const x=cv.getContext("2d"), W=cv.width, H=cv.height;
  const E = runEnv(lvl);

  /* The play band is the bottom slice of the screen. Nothing decorative is
     drawn inside it and nothing interactive is drawn outside it, so a student
     never has to work out whether something is scenery. */
  const SKY_H = Math.round(H*0.46);
  const BAND_Y = SKY_H;

  /* ---- physics, and the generator limits derived from them --------------- */
  const GRAV=0.62, JUMP_V=14.2, COYOTE=7, BUFFER=8;
  const AIR = 2*JUMP_V/GRAV;                       /* frames aloft            */
  const JUMP_H = (JUMP_V*JUMP_V)/(2*GRAV);         /* real ceiling, ~163px    */
  const runSpeed = 7.2 + Math.min(lvl,8)*0.42;     /* auto-run, gentler curve */
  const JUMP_D = AIR*runSpeed;                     /* real horizontal reach   */
  const MAX_GAP  = JUMP_D*0.52;                    /* generous margin         */
  const MAX_RISE = JUMP_H*0.55;                    /* was 150 against 152     */
  const MAX_DROP = 190;

  /* ---- art ---- */
  const tile   = spriteOf(E.art);
  const propIm = spriteOf(E.prop);
  const heroRun= spriteOf("run")||spriteOf("idle");
  const heroAir= spriteOf("point")||heroRun;
  const heroRoll=spriteOf("walk")||heroRun;
  const foes   = FOES.map(spriteOf);
  const coinIm = spriteOf("item_coin");

  /* ---- world ---- */
  const GROUND_Y = H-70;
  let plats=[{x:-400, y:GROUND_Y, w:1600}];
  let items=[], props=[], nextX=1200;
  let camX=0, camTarget=0;
  let f=0, hp=3, sc=0, combo=0, best=0, over=false;
  let framesLeft=GAMES[0].dur*60;
  let shake=0, flash=0, msg=null, msgT=0;

  const p={x:120, y:GROUND_Y-90, vx:runSpeed, vy:0, w:40, h:80,
           grounded:true, coyote:0, buffer:0, roll:false, invuln:0, rot:0,
           ammo:3, cool:0, shield:0, boost:0, magnet:0, face:1};
  let shots=[], sparks=[];
  const AMMO_MAX=6;

  /* Chalk shot. Limited ammo so it supplements reading the road instead of
     replacing it, and a cooldown so it can't be spammed through a wall. */
  function fire(){
    if(over||p.ammo<=0||p.cool>0) return;
    p.ammo--; p.cool=11;
    shots.push({x:p.x+p.w, y:p.y+p.h*0.42, vx:13, life:70});
    sparks.push({x:p.x+p.w, y:p.y+p.h*0.42, life:9, c:E.second});
  }

  /* parallax layers: cheap procedural silhouettes, regenerated per env */
  const layers=[];
  for(let d=0; d<3; d++){
    const pts=[];
    const step = 90 + d*40;
    for(let i=0;i<Math.ceil(W/step)+4;i++)
      pts.push({x:i*step, h: (28+d*30) + Math.random()*(40+d*46)});
    layers.push({d:d, step:step, pts:pts, off:0,
                 speed:0.08+d*0.13, alpha:0.30+d*0.22});
  }
  const stars=[];
  for(let i=0;i<70;i++) stars.push({x:Math.random()*W, y:Math.random()*SKY_H*0.8,
                                    s:Math.random()*1.8+0.4, a:Math.random()*0.6+0.2,
                                    tw:(Math.random()*0.03+0.008)*(Math.random()<0.5?-1:1)});
  const motes=[];
  for(let i=0;i<26;i++) motes.push({x:Math.random()*W, y:BAND_Y+Math.random()*(H-BAND_Y),
                                    l:Math.random()*26+8, t:Math.random()*2+1,
                                    a:Math.random()*0.3+0.08, s:Math.random()*0.8+0.7});

  /* ---- input -------------------------------------------------------------
     Auto-run alone left the student with two verbs and nothing to aim. You now
     drive the character: left and right change speed within a band, and the
     chalk shot clears a hazard at range so a bad approach is recoverable
     instead of just costing a life. */
  const keys={jump:false, down:false, left:false, right:false, fire:false};
  const kd=e=>{
    if(e.code==="ArrowUp"||e.code==="KeyW"){
      if(!keys.jump) p.buffer=BUFFER;               /* buffered jump          */
      keys.jump=true; e.preventDefault();
    }
    if(e.code==="ArrowDown"||e.code==="KeyS"){ keys.down=true; e.preventDefault(); }
    if(e.code==="ArrowLeft"||e.code==="KeyA"){ keys.left=true; e.preventDefault(); }
    if(e.code==="ArrowRight"||e.code==="KeyD"){ keys.right=true; e.preventDefault(); }
    if(e.code==="Space"||e.code==="KeyJ"){ if(!keys.fire) fire(); keys.fire=true; e.preventDefault(); }
  };
  const ku=e=>{
    if(e.code==="ArrowUp"||e.code==="KeyW"){
      keys.jump=false;
      if(p.vy<-4) p.vy=-4;                          /* variable jump height   */
      e.preventDefault();
    }
    if(e.code==="ArrowDown"||e.code==="KeyS"){ keys.down=false; e.preventDefault(); }
    if(e.code==="ArrowLeft"||e.code==="KeyA"){ keys.left=false; e.preventDefault(); }
    if(e.code==="ArrowRight"||e.code==="KeyD"){ keys.right=false; e.preventDefault(); }
    if(e.code==="Space"||e.code==="KeyJ"){ keys.fire=false; e.preventDefault(); }
  };
  window.addEventListener("keydown",kd); window.addEventListener("keyup",ku);
  /* Touch: tap the upper part of the canvas to jump, hold the lower to roll.
     One finger, two verbs, no on-screen d-pad to learn. */
  const tstart=e=>{
    const t=canvasPoint(cv,e.touches[0]);
    if(t.y<0.58){ p.buffer=BUFFER; keys.jump=true; }
    else if(t.x>0.62){ fire(); }
    else keys.down=true;
    e.preventDefault();
  };
  const tend=e=>{
    if(keys.jump && p.vy<-4) p.vy=-4;
    keys.jump=false; keys.down=false; e.preventDefault();
  };
  cv.addEventListener("touchstart",tstart,{passive:false});
  cv.addEventListener("touchend",tend,{passive:false});
  cv.addEventListener("touchcancel",tend,{passive:false});
  cleanupInput=()=>{
    window.removeEventListener("keydown",kd); window.removeEventListener("keyup",ku);
    cv.removeEventListener("touchstart",tstart); cv.removeEventListener("touchend",tend);
    cv.removeEventListener("touchcancel",tend);
  };

  /* ---- generation -------------------------------------------------------
     Every platform is placed inside the reach computed above, and hazards keep
     clear of landing zones so you are never asked to land on a spike you had
     no way to avoid. */
  function generate(){
    const last = plats[plats.length-1];
    const lastRight = last.x + last.w;
    const gap = 60 + Math.random()*(MAX_GAP-60);
    const rise = (Math.random()*2-1);
    let y = last.y + (rise<0 ? -Math.random()*MAX_RISE : Math.random()*MAX_DROP);
    y = Math.max(BAND_Y+70, Math.min(GROUND_Y+10, y));
    const w = 260 + Math.random()*420;
    const plat = {x:lastRight+gap, y:y, w:w};
    plats.push(plat);

    /* coins arc over the gap, so collecting them teaches the jump */
    const n = 4+Math.floor(Math.random()*4);
    for(let i=0;i<n;i++){
      const t=i/(n-1);
      const cx = lastRight + gap*t - 10;
      const arc = Math.sin(t*Math.PI)*Math.min(90, gap*0.5);
      items.push({t:"coin", x:cx, y:Math.min(last.y,y)-56-arc, w:22, h:22});
    }
    /* power-ups: one per platform at most, and never on the very edge where a
       student would have to choose between the pickup and the landing */
    if(w > 300 && Math.random() < 0.42){
      const kinds = ["ammo","shield","boost","magnet"];
      const k = kinds[Math.floor(Math.random()*kinds.length)];
      items.push({t:"power", k:k, x:plat.x+120+Math.random()*(w-240), y:y-96, w:30, h:30});
    }
    /* hazards live only in the middle of a platform, never near either edge */
    const room = w - 200;
    if(room > 120 && Math.random() < Math.min(0.72, 0.28+lvl*0.05)){
      const hx = plat.x + 100 + Math.random()*room;
      items.push({t:"foe", x:hx, y:y-52, w:48, h:52,
                  k:Math.floor(Math.random()*Math.max(1,foes.length))});
    }
    /* a second hazard only on a long platform, and only far from the first */
    if(w > 520 && Math.random() < 0.3){
      items.push({t:"foe", x:plat.x+w-140, y:y-52, w:48, h:52,
                  k:Math.floor(Math.random()*Math.max(1,foes.length))});
    }
    /* scenery sits behind the platform, inside the band but never on the line */
    if(Math.random()<0.5)
      props.push({x:plat.x+Math.random()*w, y:y, s:0.5+Math.random()*0.4});

    nextX = plat.x + w;
  }
  for(let i=0;i<6;i++) generate();

  function hurt(reason){
    if(p.invuln>0) return;
    if(p.shield>0){                       /* the shield eats one hit */
      p.shield=0; p.invuln=70; shake=10;
      msg=T_.puShieldGone; msgT=40;
      for(let k=0;k<10;k++) sparks.push({x:p.x+p.w/2, y:p.y+p.h/2, life:16, c:"#4DE0B1"});
      return;
    }
    hp--; p.invuln=100; combo=0; shake=16; flash=12;
    msg=reason; msgT=48;
    if(hp<=0){ over=true; endGame(id, Math.round(sc), false); }
  }

  /* ---- loop ---- */
  startLoop(function(){
    f++;
    if(!over){
      framesLeft--;
      if(framesLeft<=0){ over=true; endGame(id, Math.round(sc), true); }
      if(p.invuln>0) p.invuln--;
      if(shake>0) shake--;
      if(flash>0) flash--;
      if(msgT>0) msgT--;

      /* run: the student sets the pace inside a band, so a nervous player can
         hang back and a confident one can push */
      let want = runSpeed;
      if(keys.left)  want = runSpeed*0.66;
      if(keys.right) want = runSpeed*1.34;
      if(p.roll) want *= 1.18;
      if(p.boost>0){ want *= 1.5; p.boost--; }
      p.vx += (want - p.vx)*0.14;
      p.x += p.vx;
      sc += 0.12;
      if(p.cool>0) p.cool--;
      if(p.shield>0) p.shield--;
      if(p.magnet>0) p.magnet--;

      /* shots */
      for(const sh of shots){ sh.x += sh.vx; sh.life--; }
      shots = shots.filter(sh=>sh.life>0);
      for(const sp of sparks) sp.life--;
      sparks = sparks.filter(sp=>sp.life>0);

      /* magnet pulls nearby coins in */
      if(p.magnet>0){
        for(const it of items){
          if(it.t!=="coin") continue;
          const dx=(p.x+p.w/2)-(it.x+it.w/2), dy=(p.y+p.h/2)-(it.y+it.h/2);
          const d=Math.hypot(dx,dy);
          if(d<190&&d>1){ it.x += dx/d*6; it.y += dy/d*6; }
        }
      }

      /* roll: faster and shorter, but you can't jump out of it instantly */
      p.roll = keys.down && p.grounded;
      p.h = p.roll ? 46 : 80;

      /* jump with coyote time and an input buffer, so a jump pressed a frame
         early or a step after the ledge still fires. Without these a runner
         feels broken even when the numbers are right. */
      if(p.coyote>0) p.coyote--;
      if(p.buffer>0) p.buffer--;
      if(p.buffer>0 && (p.grounded||p.coyote>0)){
        p.vy = -JUMP_V; p.grounded=false; p.coyote=0; p.buffer=0;
      }
      p.vy += GRAV;
      if(p.vy>19) p.vy=19;
      p.y += p.vy;

      /* land */
      const wasGrounded=p.grounded;
      p.grounded=false;
      for(const c of plats){
        if(p.x+p.w>c.x && p.x<c.x+c.w){
          if(p.vy>=0 && p.y+p.h>=c.y && p.y+p.h-p.vy<=c.y+14){
            p.y=c.y-p.h; p.vy=0; p.grounded=true;
          }
        }
      }
      if(wasGrounded && !p.grounded && p.vy>=0) p.coyote=COYOTE;

      /* fell */
      if(p.y > H+120){
        const safe = plats.find(c=>c.x+c.w > p.x) || plats[plats.length-1];
        p.x = safe.x+60; p.y = safe.y-140; p.vy=0;
        hurt(T_.runFell);
      }

      /* camera: lead by speed so reaction time stays constant across levels */
      camTarget = p.x - W*0.26 + runSpeed*7;
      camX += (camTarget-camX)*0.12;

      /* world upkeep */
      while(nextX < camX + W*2.2) generate();
      plats = plats.filter(c=>c.x+c.w > camX-600);
      items = items.filter(i=>i.x > camX-600);
      props = props.filter(i=>i.x > camX-600);

      /* a chalk shot clears a hazard outright */
      for(let si=shots.length-1;si>=0;si--){
        const sh=shots[si];
        for(let i=items.length-1;i>=0;i--){
          const it=items[i];
          if(it.t!=="foe") continue;
          if(sh.x>it.x && sh.x<it.x+it.w && sh.y>it.y && sh.y<it.y+it.h){
            items.splice(i,1); shots.splice(si,1);
            sc += 80; combo++; best=Math.max(best,combo);
            for(let k=0;k<7;k++) sparks.push({x:it.x+it.w/2, y:it.y+it.h/2, life:14, c:"#FF4D9D"});
            msg=T_.runZapped; msgT=32;
            break;
          }
        }
      }

      /* pickups and hits */
      for(let i=items.length-1;i>=0;i--){
        const it=items[i];
        if(p.x < it.x+it.w && p.x+p.w > it.x && p.y < it.y+it.h && p.y+p.h > it.y){
          if(it.t==="coin"){
            items.splice(i,1); combo++; best=Math.max(best,combo);
            sc += 10 + Math.min(40, combo*2);       /* combo rewards a clean line */
            if(combo%10===0){ msg="×"+combo; msgT=40; }
          } else if(it.t==="power"){
            items.splice(i,1);
            if(it.k==="ammo"){   p.ammo=Math.min(AMMO_MAX,p.ammo+3); msg=T_.puAmmo; }
            if(it.k==="shield"){ p.shield=600;  msg=T_.puShield; }
            if(it.k==="boost"){  p.boost=240;   msg=T_.puBoost; }
            if(it.k==="magnet"){ p.magnet=540;  msg=T_.puMagnet; }
            msgT=44; sc+=25;
            for(let k=0;k<6;k++) sparks.push({x:it.x+15, y:it.y+15, life:16, c:E.coin});
          } else {
            /* rolling or stomping clears a hazard; anything else costs a life */
            if(p.roll || p.vy>6){
              items.splice(i,1); sc+=60; p.vy=-9; shake=8;
              msg=T_.runCleared; msgT=30;
            } else hurt(T_.runHit);
          }
        }
      }
    }

    /* ====================== draw ====================== */
    x.save();
    if(shake>0){ const m=shake*0.5; x.translate(rnd(-m,m), rnd(-m,m)); }

    /* --- sky: gradient + celestial body + stars --- */
    const g=x.createLinearGradient(0,0,0,BAND_Y);
    g.addColorStop(0,E.sky[0]); g.addColorStop(0.55,E.sky[1]); g.addColorStop(1,E.sky[2]);
    x.fillStyle=g; x.fillRect(0,0,W,BAND_Y);
    for(const s of stars){
      s.a += s.tw; if(s.a>0.9||s.a<0.15) s.tw*=-1;
      x.fillStyle="rgba(255,255,255,"+Math.max(0,s.a)+")";
      x.fillRect(s.x, s.y, s.s, s.s);
    }
    const sunR=Math.min(W,H)*0.11, sunX=W*0.72, sunY=BAND_Y*0.42;
    const sg=x.createRadialGradient(sunX,sunY,0,sunX,sunY,sunR*2.2);
    sg.addColorStop(0,E.accent); sg.addColorStop(0.35,E.accent); sg.addColorStop(1,"rgba(0,0,0,0)");
    x.globalAlpha=0.5; x.fillStyle=sg;
    x.beginPath(); x.arc(sunX,sunY,sunR*2.2,0,7); x.fill(); x.globalAlpha=1;
    x.fillStyle=E.accent;
    x.beginPath(); x.arc(sunX,sunY,sunR,0,7); x.fill();

    /* --- parallax ridges, sky only, never entering the band --- */
    for(const L of layers){
      L.off = (camX*L.speed) % L.step;
      x.globalAlpha=L.alpha;
      x.fillStyle = L.d===2 ? E.band : (L.d===1 ? shadeMix(E.sky[2],E.band,0.45)
                                                : shadeMix(E.sky[1],E.band,0.3));
      x.beginPath(); x.moveTo(-L.step, BAND_Y);
      L.pts.forEach((pt,i)=>{
        const px = i*L.step - L.off - L.step;
        x.lineTo(px, BAND_Y - pt.h);
        x.lineTo(px + L.step*0.5, BAND_Y - pt.h*0.72);
      });
      x.lineTo(W+L.step, BAND_Y); x.closePath(); x.fill();
      x.globalAlpha=1;
    }
    /* haze where sky meets play band, so the seam reads as depth */
    const hz=x.createLinearGradient(0,BAND_Y-52,0,BAND_Y);
    hz.addColorStop(0,"rgba(0,0,0,0)"); hz.addColorStop(1,E.band);
    x.fillStyle=hz; x.fillRect(0,BAND_Y-52,W,52);

    /* --- play band: lit, flat, uncluttered --- */
    x.fillStyle=E.band; x.fillRect(0,BAND_Y,W,H-BAND_Y);
    for(const m of motes){
      m.x -= (runSpeed*m.s*0.5);
      if(m.x+m.l<0){ m.x=W+rnd(0,90); m.y=BAND_Y+Math.random()*(H-BAND_Y); }
      x.globalAlpha=m.a; x.fillStyle=E.second;
      x.fillRect(m.x, m.y, m.l, m.t);
    }
    x.globalAlpha=1;

    /* --- scenery behind the platforms, dimmed so it can't be mistaken for one --- */
    if(drawable(propIm)) for(const pr of props){
      const sx=pr.x-camX;
      if(sx<-200||sx>W+200) continue;
      x.globalAlpha=0.30;
      sprite(x, propIm, sx, pr.y, 120*pr.s);
      x.globalAlpha=1;
    }

    /* --- platforms: solid body, bright cap, hard outline --- */
    const pat = tilePattern(x, tile);
    for(const c of plats){
      const sx=c.x-camX;
      if(sx>W+80 || sx+c.w<-80) continue;
      const bodyH=H-c.y;
      if(pat){
        x.save(); x.beginPath(); x.rect(sx,c.y,c.w,bodyH); x.clip();
        x.translate(-(camX%64),0);
        x.fillStyle=pat; x.fillRect(sx-64,c.y,c.w+128,bodyH);
        x.restore();
        x.fillStyle="rgba(0,0,0,.42)"; x.fillRect(sx,c.y,c.w,bodyH);
      } else {
        x.fillStyle=E.ground; x.fillRect(sx,c.y,c.w,bodyH);
      }
      x.fillStyle=E.groundTop; x.fillRect(sx,c.y,c.w,6);
      x.fillStyle="rgba(0,0,0,.55)";
      x.fillRect(sx,c.y+6,3,bodyH); x.fillRect(sx+c.w-3,c.y+6,3,bodyH);
    }

    /* --- the landing shadow. The single biggest readability win in a
           platformer: an ellipse on the surface directly below the player, so
           height and horizontal position can be judged at a glance. --- */
    let below=null;
    for(const c of plats)
      if(p.x+p.w>c.x && p.x<c.x+c.w && c.y>=p.y+p.h-2)
        if(!below||c.y<below.y) below=c;
    if(below){
      const drop=below.y-(p.y+p.h);
      const t=Math.max(0,Math.min(1,drop/240));
      x.globalAlpha=0.42*(1-t)+0.08;
      x.fillStyle="#000";
      x.beginPath();
      x.ellipse(p.x-camX+p.w/2, below.y+3, (p.w*0.6)*(1-t*0.4), 6*(1-t*0.4), 0,0,7);
      x.fill(); x.globalAlpha=1;
    }

    /* --- shots and sparks --- */
    for(const sh of shots){
      const sx=sh.x-camX;
      x.fillStyle=E.second;
      x.fillRect(sx-14, sh.y-3, 18, 6);
      x.fillStyle="#FFF"; x.fillRect(sx-4, sh.y-2, 8, 4);
    }
    for(const sp of sparks){
      x.globalAlpha=sp.life/16; x.fillStyle=sp.c||E.coin;
      x.fillRect(sp.x-camX-2, sp.y-2, 5, 5);
    }
    x.globalAlpha=1;

    /* --- items, all outlined --- */
    for(const it of items){
      const sx=it.x-camX;
      if(sx<-90||sx>W+90) continue;
      if(it.t==="coin"){
        const bob=Math.sin(f*0.12+it.x*0.02)*3;
        if(drawable(coinIm)) x.drawImage(coinIm, sx, it.y+bob, it.w, it.h);
        else {
          x.fillStyle=E.coin;
          x.beginPath(); x.arc(sx+it.w/2, it.y+it.h/2+bob, it.w/2, 0,7); x.fill();
          x.strokeStyle="rgba(0,0,0,.6)"; x.lineWidth=2; x.stroke();
        }
      } else if(it.t==="power"){
        const bob=Math.sin(f*0.1+it.x*0.03)*4;
        const cx2=sx+15, cy2=it.y+15+bob;
        x.globalAlpha=0.35+Math.sin(f*0.14)*0.12;
        x.fillStyle=E.coin;
        x.beginPath(); x.arc(cx2,cy2,20,0,7); x.fill();
        x.globalAlpha=1;
        x.fillStyle="#0B0F1F"; x.beginPath(); x.arc(cx2,cy2,13,0,7); x.fill();
        x.strokeStyle=E.coin; x.lineWidth=2; x.stroke();
        x.fillStyle=E.coin; x.font="bold 14px 'Trebuchet MS',sans-serif";
        x.textAlign="center"; x.textBaseline="middle";
        x.fillText({ammo:"✦",shield:"◈",boost:"»",magnet:"◎"}[it.k]||"?", cx2, cy2+1);
        x.textAlign="left"; x.textBaseline="alphabetic";
      } else {
        const im=foes[it.k];
        /* glow ring first so a hazard pops against any backdrop */
        x.globalAlpha=0.30+Math.sin(f*0.15)*0.10;
        x.fillStyle="#FF4D9D";
        x.beginPath(); x.ellipse(sx+it.w/2, it.y+it.h, it.w*0.8, 10, 0,0,7); x.fill();
        x.globalAlpha=1;
        if(drawable(im)) sprite(x, im, sx+it.w/2, it.y+it.h, 64);
        else {
          x.fillStyle="#FF4D9D";
          x.beginPath(); x.moveTo(sx+it.w/2,it.y); x.lineTo(sx+it.w,it.y+it.h);
          x.lineTo(sx,it.y+it.h); x.closePath(); x.fill();
        }
      }
    }

    /* --- incoming-hazard warning at the right edge, so nothing arrives
           without notice even at the highest run speed --- */
    for(const it of items){
      if(it.t!=="foe") continue;
      const sx=it.x-camX;
      if(sx>W && sx<W+520){
        const a=1-((sx-W)/520);
        x.globalAlpha=a*0.85;
        x.fillStyle="#FF4D9D";
        x.beginPath();
        x.moveTo(W-6, it.y+it.h/2); x.lineTo(W-24, it.y+it.h/2-11);
        x.lineTo(W-24, it.y+it.h/2+11); x.closePath(); x.fill();
        x.globalAlpha=1;
      }
    }

    /* --- the player, always the brightest thing on screen --- */
    if(p.invuln<=0 || f%8<5){
      const cx=p.x-camX+p.w/2, by=p.y+p.h;
      let im = p.grounded ? (p.roll?heroRoll:heroRun) : heroAir;
      x.save();
      if(p.roll){ p.rot += 0.32; x.translate(cx,p.y+p.h/2); x.rotate(p.rot);
                  x.translate(-cx,-(p.y+p.h/2)); }
      /* rim light so the silhouette separates from a busy background */
      x.shadowColor=E.accent; x.shadowBlur=14;
      if(drawable(im)) sprite(x, im, cx, by, p.h);
      else { x.fillStyle="#EFEAFB"; x.fillRect(p.x-camX, p.y, p.w, p.h); }
      x.shadowBlur=0;
      x.restore();
      if(p.shield>0){
        x.globalAlpha=0.30+Math.sin(f*0.18)*0.12;
        x.strokeStyle="#4DE0B1"; x.lineWidth=3;
        x.beginPath(); x.arc(cx, p.y+p.h/2, p.h*0.72, 0, 7); x.stroke();
        x.globalAlpha=1;
      }
    }
    x.restore();

    /* --- damage flash and callouts --- */
    if(flash>0){ x.fillStyle="rgba(255,77,157,"+(flash/12*0.3)+")"; x.fillRect(0,0,W,H); }
    if(msgT>0 && msg){
      x.globalAlpha=Math.min(1,msgT/18);
      x.fillStyle=E.coin; x.font="800 26px 'Trebuchet MS',sans-serif";
      x.textAlign="center"; x.fillText(msg, W/2, BAND_Y-30);
      x.globalAlpha=1;
    }
    /* ammo pips and active power-ups */
    x.fillStyle="rgba(11,15,31,.7)"; x.fillRect(10,H-34,130,26);
    for(let i=0;i<AMMO_MAX;i++){
      x.fillStyle = i<p.ammo ? E.second : "rgba(255,255,255,.16)";
      x.fillRect(18+i*19, H-26, 13, 10);
    }
    let px=150;
    const badge=(on,label,col)=>{ if(on<=0) return;
      x.fillStyle="rgba(11,15,31,.7)"; x.fillRect(px,H-34,58,26);
      x.fillStyle=col; x.font="bold 11px 'Courier New',monospace";
      x.fillText(label, px+8, H-17);
      x.fillStyle="rgba(255,255,255,.25)";
      x.fillRect(px+8, H-14, Math.min(42, on/14), 3);
      px+=64; };
    badge(p.shield,"SHIELD","#4DE0B1");
    badge(p.boost,"BOOST",E.coin);
    badge(p.magnet,"MAGNET","#9B7BE0");

    /* combo meter */
    if(combo>2){
      x.fillStyle="rgba(11,15,31,.7)"; x.fillRect(10,10,104,26);
      x.fillStyle=E.coin; x.font="bold 14px 'Courier New',monospace"; x.textAlign="left";
      x.fillText("COMBO ×"+combo, 18, 28);
    }
    x.fillStyle="rgba(255,255,255,.35)"; x.font="11px 'Courier New',monospace";
    x.textAlign="right"; x.fillText(L(E.name).toUpperCase(), W-12, 22);

    setHUD(hp, combo, framesLeft, Math.round(sc));
  });
}

/* Blend two hex colours; used to derive parallax silhouettes from a sky. */
function shadeMix(a,b,t){
  const pa=[1,3,5].map(i=>parseInt(a.slice(i,i+2),16));
  const pb=[1,3,5].map(i=>parseInt(b.slice(i,i+2),16));
  const c=pa.map((v,i)=>Math.round(v+(pb[i]-v)*t));
  return "rgb("+c.join(",")+")";
}

/* ============================================================================
   GAME 2 — CAMPUS SHUTTLE (lane dodger)
   ========================================================================== */
function gameShuttle(cv,id,lvl,zone){
  const x=cv.getContext("2d"),W=cv.width,H=cv.height;
  let f=0,hp=3,sc=0,over=false,framesLeft=GAMES[1].dur*60;
  let lane=1,speed=0,dist=0,invuln=90,hasPass=false,passTimer=0;
  const maxSpeed=12+(lvl*0.8);
  let traffic=[],stops=[],nextStop=800;
  const laneH=Math.round(H/5), roadY=Math.round(H/2-laneH*1.5);
  const back=spriteOf(zone.bg), kart=spriteOf("kart_player"), rivals=TRAFFIC.map(spriteOf);

  const keys={ArrowUp:false,ArrowDown:false,ArrowLeft:false,ArrowRight:false};
  let prevUp=false,prevDown=false;
  const kd=e=>{ if(keys[e.code]!==undefined){ keys[e.code]=true; e.preventDefault(); } };
  const ku=e=>{ if(keys[e.code]!==undefined){ keys[e.code]=false; e.preventDefault(); } };
  window.addEventListener("keydown",kd); window.addEventListener("keyup",ku);
  let ty=0;
  const ts=e=>{ const t=e.touches[0]; ty=t.clientY;
    if(canvasPoint(cv,t).x>0.5) keys.ArrowRight=true; else keys.ArrowLeft=true; e.preventDefault(); };
  const tm=e=>{ const nty=e.touches[0].clientY;
    if(nty<ty-30){ keys.ArrowUp=true; keys.ArrowDown=false; ty=nty; }
    else if(nty>ty+30){ keys.ArrowDown=true; keys.ArrowUp=false; ty=nty; }
    e.preventDefault(); };
  const te=e=>{ keys.ArrowUp=keys.ArrowDown=keys.ArrowRight=keys.ArrowLeft=false; e.preventDefault(); };
  cv.addEventListener("touchstart",ts,{passive:false});
  cv.addEventListener("touchmove",tm,{passive:false});
  cv.addEventListener("touchend",te,{passive:false});
  cleanupInput=()=>{ window.removeEventListener("keydown",kd); window.removeEventListener("keyup",ku);
    cv.removeEventListener("touchstart",ts); cv.removeEventListener("touchmove",tm); cv.removeEventListener("touchend",te); };

  startLoop(function(){
    f++;
    if(!over){
      framesLeft--;
      if(framesLeft<=0){ over=true; endGame(id,sc,true); }
      if(invuln>0) invuln--;
      if(keys.ArrowUp&&!prevUp) lane=Math.max(0,lane-1);
      if(keys.ArrowDown&&!prevDown) lane=Math.min(2,lane+1);
      prevUp=keys.ArrowUp; prevDown=keys.ArrowDown;
      if(keys.ArrowRight) speed=Math.min(speed+0.15,maxSpeed);
      else if(keys.ArrowLeft) speed=Math.max(speed-0.4,0);
      else speed=Math.max(speed-0.05,0);
      dist+=speed;
      if(dist>nextStop&&stops.length===0){
        stops.push({x:W+200,lane:Math.random()>0.5?0:2,type:hasPass?"drop":"pick",active:true});
        nextStop=dist+1000+Math.random()*2000;
      }
      stops.forEach(st=>{
        st.x-=speed;
        if(st.active&&lane===st.lane&&Math.abs((st.x+55)-160)<95&&speed<3){
          st.active=false;
          if(st.type==="pick"){ hasPass=true; passTimer=1000+(lvl*50); sc+=50; }
          else { hasPass=false; sc+=200+Math.max(0,Math.floor(passTimer/5)); }
        }
      });
      stops=stops.filter(st=>st.x>-260);
      if(hasPass&&passTimer>0) passTimer--;
      if(f%Math.max(25,80-lvl*5)===0){
        const tspd=3+Math.random()*5, fromBehind=speed<=tspd;
        let tl=Math.floor(Math.random()*3);
        if(fromBehind&&tl===lane) tl=(tl+1+Math.floor(Math.random()*2))%3;  /* never rear-end blind */
        traffic.push({x:fromBehind?-200:W+200,lane:tl,speed:tspd,hit:false,
                      k:Math.floor(Math.random()*rivals.length)});
      }
      traffic.forEach(t=>{
        t.x+=(t.speed-speed);
        if(!t.hit&&invuln<=0&&t.lane===lane&&Math.abs((t.x+50)-160)<88){
          t.hit=true; hp--; invuln=60; speed*=0.2;
          if(hp<=0){ over=true; endGame(id,sc,false); }
        }
      });
      traffic=traffic.filter(t=>t.x>-300&&t.x<W+300);
    }
    /* draw */
    drawBack(x,back,zone,W,H,dist*0.35);
    x.fillStyle="rgba(8,5,18,.45)"; x.fillRect(0,0,W,H);
    x.fillStyle="#1b1b22"; x.fillRect(0,roadY,W,laneH*3);
    x.fillStyle="rgba(255,255,255,.85)";
    for(let i=1;i<3;i++) x.fillRect(0,roadY+i*laneH-1,W,2);
    x.fillStyle="#F2B441"; x.fillRect(0,roadY-4,W,4); x.fillRect(0,roadY+laneH*3,W,4);
    stops.forEach(st=>{
      if(!st.active) return;
      x.strokeStyle=st.type==="pick"?"#4DE0B1":"#F2B441"; x.lineWidth=5;
      x.strokeRect(st.x-20,roadY+st.lane*laneH+6,150,laneH-12);
      x.fillStyle=st.type==="pick"?"rgba(77,224,177,.18)":"rgba(242,180,65,.18)";
      x.fillRect(st.x-20,roadY+st.lane*laneH+6,150,laneH-12);
    });
    traffic.forEach(t=>{
      const im=rivals[t.k], by=roadY+t.lane*laneH+laneH-8;
      if(drawable(im)) sprite(x,im,t.x+50,by,laneH-14);
      else { x.fillStyle="#FF4D9D"; x.fillRect(t.x,roadY+t.lane*laneH+15,100,laneH-30); }
    });
    if(invuln%10<5){
      const by=roadY+lane*laneH+laneH-6;
      if(drawable(kart)) sprite(x,kart,160,by,laneH-10);
      else { x.fillStyle="#2F6BD8"; x.fillRect(105,roadY+lane*laneH+10,110,laneH-20); }
      if(hasPass){ x.fillStyle="#EFEAFB"; x.beginPath(); x.arc(160,by-laneH+6,12,0,7); x.fill(); }
    }
    x.fillStyle="#EFEAFB"; x.font="bold 20px 'Courier New',monospace";
    x.fillText(Math.round(speed*8)+" km/h",16,30);
    if(hasPass){ x.fillStyle="#4DE0B1"; x.fillText(T_.rider+" "+Math.ceil(passTimer/60)+"s",16,56); }
    setHUD(hp,null,framesLeft,sc);
  });
}

/* ============================================================================
   GAME 3 — CAMPUS TAXI  ·  Mode 7 fare driving
   ----------------------------------------------------------------------------
   The lap racer is gone. You now drive Coach Smith's golf cart around campus
   picking up students and getting them where they need to be.

   The loop is the one Crazy Taxi runs on, and it is a better fit for a
   classroom game than a race: there is no last place. A student who drives
   badly makes fewer fares and runs out of clock; a student who drives well
   keeps extending it. Nobody sits in 6th of 6 watching everyone else finish.

     1. A rider is waiting somewhere on campus, marked by a beam of light and
        an arrow at the top of the screen with the distance in metres.
     2. Drive into the beam to pick them up. They tell you where they're going
        and the arrow re-points.
     3. Reach the drop-off. You get paid, and the clock gets extra time based
        on how far the trip was and how fast you took it.
     4. Run out of clock and the shift ends. Fares completed is the score.

   The road network is an actual campus layout — a ring road with cross streets
   and a quad — rather than a single closed loop, because a fare has to be able
   to be anywhere and you have to be able to get there more than one way.
   ========================================================================== */
