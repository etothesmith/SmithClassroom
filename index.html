/* ---- campus builder -----------------------------------------------------
   Paints a road network onto one 512x512 texture, then derives a mask of what
   is drivable and a list of legal fare points. Everything else — buildings,
   the quad — is scenery you steer around. */
function buildCampus(lvl, zone){
  const SIZE=512, pal=paletteOf(zone);
  const cv=document.createElement("canvas"); cv.width=cv.height=SIZE;
  const c=cv.getContext("2d");

  c.fillStyle=pal.grass; c.fillRect(0,0,SIZE,SIZE);
  const tile=spriteOf(zone.tile||"tile_campus");
  if(drawable(tile)){
    try{ const pt=c.createPattern(tile,"repeat");
      c.globalAlpha=0.32; c.fillStyle=pt; c.fillRect(0,0,SIZE,SIZE); c.globalAlpha=1; }catch(e){}
  }
  for(let i=0;i<520;i++){
    c.fillStyle=pal.grassLight; c.globalAlpha=Math.random()*0.35+0.08;
    c.beginPath(); c.arc(Math.random()*SIZE,Math.random()*SIZE,2+Math.random()*9,0,7); c.fill();
  }
  c.globalAlpha=1;

  /* the network: a ring road, two cross streets, and a service loop round the
     quad. Segments are stored so fares can be placed on real road, not grass. */
  const RW=40;
  const segs=[];
  const road=(x1,y1,x2,y2)=>{ segs.push({x1,y1,x2,y2}); };
  const M=70, N=SIZE-70;
  road(M,M,N,M); road(N,M,N,N); road(N,N,M,N); road(M,N,M,M);   /* ring */
  road(SIZE/2,M,SIZE/2,N);                                       /* vertical  */
  road(M,SIZE/2,N,SIZE/2);                                       /* horizontal*/
  road(M+80,M+80,N-80,M+80); road(N-80,M+80,N-80,N-80);          /* inner loop*/
  road(N-80,N-80,M+80,N-80); road(M+80,N-80,M+80,M+80);

  c.lineCap="round"; c.lineJoin="round";
  const stroke=(w,style)=>{ c.strokeStyle=style; c.lineWidth=w;
    segs.forEach(s=>{ c.beginPath(); c.moveTo(s.x1,s.y1); c.lineTo(s.x2,s.y2); c.stroke(); }); };
  stroke(RW+12, pal.kerb2);
  stroke(RW+6,  pal.kerb1);
  stroke(RW,    pal.road);
  c.setLineDash([9,11]);
  c.strokeStyle=pal.lane; c.lineWidth=2;
  segs.forEach(s=>{ c.beginPath(); c.moveTo(s.x1,s.y1); c.lineTo(s.x2,s.y2); c.stroke(); });
  c.setLineDash([]);

  /* the quad in the middle: grass you cannot drive across */
  c.fillStyle=pal.grassLight; c.globalAlpha=0.5;
  c.beginPath(); c.arc(SIZE/2,SIZE/2,44,0,7); c.fill(); c.globalAlpha=1;

  /* Road mask stamped from the geometry, not read back from the canvas.
     Painting and then sampling the pixels looked tidy but made the drivable
     area depend on getImageData succeeding and on colour matching surviving
     antialiasing. Stamping the same segments that were drawn gives an exact
     mask that cannot disagree with what the student sees. */
  const mask=new Uint8Array(SIZE*SIZE);
  const half=RW/2;
  segs.forEach(sg=>{
    const dx=sg.x2-sg.x1, dy=sg.y2-sg.y1;
    const len=Math.max(1,Math.hypot(dx,dy));
    const steps=Math.ceil(len);
    for(let i=0;i<=steps;i++){
      const t=i/steps;
      const px=sg.x1+dx*t, py=sg.y1+dy*t;
      for(let oy=-half;oy<=half;oy++) for(let ox=-half;ox<=half;ox++){
        if(ox*ox+oy*oy>half*half) continue;
        const gx=((px+ox)|0), gy=((py+oy)|0);
        if(gx<0||gy<0||gx>=SIZE||gy>=SIZE) continue;
        mask[gy*SIZE+gx]=1;
      }
    }
  });
  /* the quad in the middle is not drivable, whatever the paint says */
  for(let gy=0;gy<SIZE;gy++) for(let gx=0;gx<SIZE;gx++){
    if(Math.hypot(gx-SIZE/2, gy-SIZE/2) < 46) mask[gy*SIZE+gx]=0;
  }
  let img;
  try{ img=c.getImageData(0,0,SIZE,SIZE); }
  catch(e){ img={width:SIZE,height:SIZE,data:new Uint8ClampedArray(SIZE*SIZE*4)}; }

  /* fare points: sample each segment, keep only spots that are on tarmac and
     far enough apart that two fares never overlap */
  const spots=[];
  segs.forEach(s=>{
    const len=Math.hypot(s.x2-s.x1, s.y2-s.y1);
    const n=Math.max(2, Math.floor(len/56));
    for(let i=1;i<n;i++){
      const t=i/n;
      const px=s.x1+(s.x2-s.x1)*t, py=s.y1+(s.y2-s.y1)*t;
      const gx=Math.floor(px)&(SIZE-1), gy=Math.floor(py)&(SIZE-1);
      if(!mask[gy*SIZE+gx]) continue;
      if(spots.some(o=>Math.hypot(o.x-px,o.y-py)<70)) continue;
      spots.push({x:px,y:py});
    }
  });

  /* buildings line the streets without blocking them */
  const props=(zone.props&&zone.props.length)?zone.props:["prop_hut"];
  const buildings=[];
  segs.forEach(s=>{
    const len=Math.hypot(s.x2-s.x1,s.y2-s.y1);
    const nx=-(s.y2-s.y1)/len, ny=(s.x2-s.x1)/len;
    const n=Math.floor(len/64);
    for(let i=1;i<n;i++){
      const t=i/n, side=(Math.random()<0.5?-1:1);
      const off=RW*0.5+22+Math.random()*22;
      const bx=s.x1+(s.x2-s.x1)*t+nx*off*side;
      const by=s.y1+(s.y2-s.y1)*t+ny*off*side;
      const gx=Math.floor(bx)&(SIZE-1), gy=Math.floor(by)&(SIZE-1);
      if(mask[gy*SIZE+gx]) continue;
      if(Math.random()<0.55)
        buildings.push({x:bx,y:by,p:props[Math.floor(Math.random()*props.length)],
                        s:0.8+Math.random()*0.7});
    }
  });

  const start = spots[0] || {x:SIZE/2, y:M};
  return {size:SIZE, texture:img, road:mask, spots, buildings, pal,
          startX:start.x, startY:start.y};
}

function gameKart(cv,id,lvl,zone){
  const x=cv.getContext("2d"), W=cv.width, H=cv.height;
  const HORIZON=Math.round(H*0.42);
  const GROUND_H=H-HORIZON;
  const CAM_HEIGHT=140, FOCAL=GROUND_H*0.7;

  const map = buildCampus(lvl, zone);
  const TEX=map.texture, TS=map.size, ROAD=map.road, PAL=map.pal;
  const texArr=TEX.data;

  const groundBuf=x.createImageData(W,GROUND_H);
  const gArr=groundBuf.data;
  for(let i=3;i<gArr.length;i+=4) gArr[i]=255;
  const mistR=parseInt(PAL.mist.slice(1,3),16),
        mistG=parseInt(PAL.mist.slice(3,5),16),
        mistB=parseInt(PAL.mist.slice(5,7),16);

  /* ---- sky ---- */
  const back=spriteOf(zone.bg);
  const skyH=HORIZON;
  const hasPanorama=()=>drawable(back)&&back.naturalWidth>=400&&back.naturalWidth>back.naturalHeight;
  const PANO_W=1024, PANO_H=256;
  function buildPano(){
    const c2=document.createElement("canvas"); c2.width=PANO_W; c2.height=PANO_H;
    const g2=c2.getContext("2d");
    const sky=g2.createLinearGradient(0,0,0,PANO_H);
    sky.addColorStop(0,zone.sky); sky.addColorStop(0.72,PAL.mist); sky.addColorStop(1,PAL.mist);
    g2.fillStyle=sky; g2.fillRect(0,0,PANO_W,PANO_H);
    g2.globalAlpha=0.16; g2.fillStyle="#FFFFFF";
    for(let i=0;i<26;i++){
      g2.beginPath();
      g2.ellipse(Math.random()*PANO_W, Math.random()*PANO_H*0.5,
                 30+Math.random()*90, 8+Math.random()*16, 0,0,7);
      g2.fill();
    }
    g2.globalAlpha=1;
    const ridge=(baseY,amp,col,seed)=>{
      g2.fillStyle=col; g2.beginPath(); g2.moveTo(0,PANO_H);
      for(let px=0;px<=PANO_W;px+=8){
        const t=px/PANO_W*Math.PI*2;
        g2.lineTo(px, baseY-Math.abs(Math.sin(t*3+seed))*amp
                       -Math.abs(Math.sin(t*7.3+seed*2))*amp*0.4);
      }
      g2.lineTo(PANO_W,PANO_H); g2.closePath(); g2.fill();
    };
    ridge(PANO_H*0.80, PANO_H*0.34, "rgba(255,255,255,.10)", 1.7);
    ridge(PANO_H*0.90, PANO_H*0.26, "rgba(0,0,0,.28)", 3.1);
    const hz=g2.createLinearGradient(0,PANO_H-46,0,PANO_H);
    hz.addColorStop(0,"rgba(0,0,0,0)"); hz.addColorStop(1,PAL.mist);
    g2.fillStyle=hz; g2.fillRect(0,PANO_H-46,PANO_W,46);
    return c2;
  }
  const pano=buildPano();
  function drawSky(camA){
    x.fillStyle=PAL.mist; x.fillRect(0,0,W,skyH);
    const img=hasPanorama()?back:pano;
    const iw=img.width||img.naturalWidth, ih=img.height||img.naturalHeight;
    const sc=skyH/ih, bw=iw*sc;
    let off=((camA/(Math.PI*2))*bw)%bw; if(off<0) off+=bw;
    for(let px=-off;px<W;px+=bw) x.drawImage(img,px,0,bw,skyH);
  }

  /* ---- art ---- */
  const cart=spriteOf("kart_player");
  const propImgs={}; (zone.props||["prop_hut"]).forEach(k=>propImgs[k]=spriteOf(k));
  const riderSprites=["idle","point","cheer","walk"].map(spriteOf);

  /* ---- state ---- */
  const you=currentRacer();
  const p={x:map.startX, y:map.startY, a:0, speed:0, offRoad:false};
  const st={
    time: 62 + lvl*2,               /* seconds on the clock                  */
    fares: 0, cash: 0, combo: 0,
    rider: null,                    /* the fare currently in the cart        */
    target: null,                   /* where the arrow points                */
    stage: "pickup",                /* pickup | dropoff                      */
    over:false, msg:null, msgT:0, shake:0, flash:0, tipT:0, tipTxt:""
  };

  const MAX_SPEED = 1.9 + lvl*0.10;
  const ACCEL=0.034, BRAKE=0.06, REVERSE=-0.55, TURN=0.040;
  const OFF_DECEL=0.012, OFF_CAP=0.5;
  const DT=1/60;

  function farAway(from){
    /* pick a spot that is a real trip away, so a fare is never two metres */
    let best=null, bestD=-1;
    for(let i=0;i<26;i++){
      const s=map.spots[Math.floor(Math.random()*map.spots.length)];
      if(!s) continue;
      const d=Math.hypot(s.x-from.x, s.y-from.y);
      if(d>bestD){ bestD=d; best=s; }
      if(d>170) break;
    }
    return best||map.spots[0];
  }
  function newFare(){
    const spot=farAway(p);
    st.rider=TAXI_RIDERS[Math.floor(Math.random()*TAXI_RIDERS.length)];
    st.riderSprite=riderSprites[Math.floor(Math.random()*riderSprites.length)];
    st.target=spot; st.stage="pickup";
    st.msg=T_.taxiHail+" — "+L(st.rider.n); st.msgT=90;
  }
  newFare();

  /* ---- input ---- */
  const keys={left:false,right:false,brake:false,horn:false};
  const kd=e=>{
    if(e.code==="ArrowLeft"||e.code==="KeyA"){keys.left=true;e.preventDefault();}
    if(e.code==="ArrowRight"||e.code==="KeyD"){keys.right=true;e.preventDefault();}
    if(e.code==="ArrowDown"||e.code==="KeyS"||e.code==="Space"){keys.brake=true;e.preventDefault();}
  };
  const ku=e=>{
    if(e.code==="ArrowLeft"||e.code==="KeyA")keys.left=false;
    if(e.code==="ArrowRight"||e.code==="KeyD")keys.right=false;
    if(e.code==="ArrowDown"||e.code==="KeyS"||e.code==="Space")keys.brake=false;
  };
  window.addEventListener("keydown",kd); window.addEventListener("keyup",ku);
  let touchX=null, touchBrake=false;
  const th=e=>{
    if(!e.touches.length){ touchX=null; touchBrake=false; return; }
    const t=canvasPoint(cv,e.touches[0]);
    touchX=t.x; touchBrake=(t.y>0.72);
    e.preventDefault();
  };
  const tOff=e=>{ touchX=null; touchBrake=false; e.preventDefault(); };
  cv.addEventListener("touchstart",th,{passive:false});
  cv.addEventListener("touchmove",th,{passive:false});
  cv.addEventListener("touchend",tOff,{passive:false});
  cv.addEventListener("touchcancel",tOff,{passive:false});
  cleanupInput=()=>{
    window.removeEventListener("keydown",kd); window.removeEventListener("keyup",ku);
    cv.removeEventListener("touchstart",th); cv.removeEventListener("touchmove",th);
    cv.removeEventListener("touchend",tOff); cv.removeEventListener("touchcancel",tOff);
  };

  /* ---- projection ---- */
  function project(wx,wy){
    const camA=p.a, camX=p.x-Math.cos(camA)*62, camY=p.y-Math.sin(camA)*62;
    const dx=wx-camX, dy=wy-camY;
    const cosA=Math.cos(camA), sinA=Math.sin(camA);
    const z = dx*sinA + dy*cosA;
    const xr= dx*cosA - dy*sinA;
    if(z<8) return null;
    const scale=FOCAL/z;
    return {sx:W/2 + xr*scale, sy:HORIZON+CAM_HEIGHT*FOCAL/z, scale, z};
  }
  function renderGround(){
    const camA=p.a, camX=p.x-Math.cos(camA)*62, camY=p.y-Math.sin(camA)*62;
    const cosA=Math.cos(camA), sinA=Math.sin(camA);
    const halfW=W/2;
    let outI=0;
    for(let sy=0;sy<GROUND_H;sy++){
      const z=CAM_HEIGHT*FOCAL/(sy+1);
      const fog=Math.min(1,Math.max(0,(z-150)/230));
      const inv=1-fog, stepX=z/FOCAL;
      let wx=camX+(-halfW)*stepX*cosA+z*sinA;
      let wy=camY-(-halfW)*stepX*sinA+z*cosA;
      const dwx=cosA*stepX, dwy=-sinA*stepX;
      for(let sx=0;sx<W;sx++){
        const tx=((wx|0)%TS+TS)&(TS-1), ty=((wy|0)%TS+TS)&(TS-1);
        const sI=(ty*TS+tx)*4;
        gArr[outI]  =texArr[sI]  *inv+mistR*fog;
        gArr[outI+1]=texArr[sI+1]*inv+mistG*fog;
        gArr[outI+2]=texArr[sI+2]*inv+mistB*fog;
        outI+=4; wx+=dwx; wy+=dwy;
      }
    }
    x.putImageData(groundBuf,0,HORIZON);
  }
  function drawBillboard(im,wx,wy,worldH,tint){
    const q=project(wx,wy); if(!q) return;
    if(q.z<22) return;
    let h=worldH*q.scale;
    if(h<3) return;
    if(h>H*0.7) h=H*0.7;
    if(drawable(im)){
      const w=im.naturalWidth/im.naturalHeight*h;
      x.drawImage(im,q.sx-w/2,q.sy-h,w,h);
      if(tint){ x.save(); x.globalAlpha=0.35; x.globalCompositeOperation="source-atop";
        x.fillStyle=tint; x.fillRect(q.sx-w/2,q.sy-h,w,h); x.restore(); }
    } else { x.fillStyle=tint||"#FFF"; x.fillRect(q.sx-h*0.25,q.sy-h,h*0.5,h); }
  }

  /* ---- loop ---- */
  startLoop(function(){
    if(!st.over){
      st.time -= DT;
      if(st.shake>0) st.shake--;
      if(st.flash>0) st.flash--;
      if(st.msgT>0) st.msgT--;
      if(st.tipT>0) st.tipT--;
      if(st.time<=0){ st.time=0; st.over=true;
        const score=st.cash + st.fares*120;
        S.best[id]=Math.max(S.best[id]||0,score);
        endGame(id, score, st.fares>=3);
      }

      /* driving */
      let steer=0;
      if(keys.left) steer-=1;
      if(keys.right) steer+=1;
      if(touchX!==null && !touchBrake){
        const o=(touchX-0.5)*2.4;
        steer=Math.max(-1,Math.min(1,o));
        if(Math.abs(o)<0.12) steer=0;
      }
      const braking = keys.brake || touchBrake;
      p.a += steer*TURN*(0.45+Math.min(1,Math.abs(p.speed)/MAX_SPEED));
      if(braking){
        /* brake, then reverse once stopped, so you can always turn around */
        p.speed = (p.speed>0.02) ? p.speed-BRAKE : Math.max(REVERSE, p.speed-0.02);
      } else {
        p.speed = Math.min(MAX_SPEED, p.speed + ACCEL);
      }

      const nx=p.x+Math.cos(p.a)*p.speed, ny=p.y+Math.sin(p.a)*p.speed;
      p.x=(nx+TS)%TS; p.y=(ny+TS)%TS;

      const gx=Math.floor(p.x)&(TS-1), gy=Math.floor(p.y)&(TS-1);
      p.offRoad = !ROAD[gy*TS+gx];
      if(p.offRoad){
        p.speed=Math.max(REVERSE, p.speed-OFF_DECEL);
        const cap=MAX_SPEED*OFF_CAP;
        if(p.speed>cap) p.speed=cap;
      }

      /* buildings stop you rather than letting you drive through them */
      for(const b of map.buildings){
        const d=Math.hypot(b.x-p.x, b.y-p.y);
        if(d < 13*b.s){
          const push=(13*b.s-d)+0.5;
          p.x -= Math.cos(p.a)*push; p.y -= Math.sin(p.a)*push;
          p.speed *= -0.25; st.shake=8;
        }
      }

      /* the fare itself */
      if(st.target){
        const d=Math.hypot(st.target.x-p.x, st.target.y-p.y);
        if(d < 17){
          if(st.stage==="pickup"){
            st.stage="dropoff";
            st.target=farAway(p);
            st.tripLen=Math.hypot(st.target.x-p.x, st.target.y-p.y);
            st.tripClock=0;
            st.msg=T_.taxiTo+" "+L(st.rider.to); st.msgT=100;
            st.flash=8;
          } else {
            /* paid: distance plus a speed bonus, and time back on the clock */
            const base=Math.round(20+st.tripLen*0.55);
            const quick=st.tripClock < st.tripLen/ (MAX_SPEED*45);
            if(quick){ st.combo++; } else { st.combo=0; }
            const tip=quick? Math.round(base*0.5)+st.combo*10 : 0;
            st.cash += base+tip;
            st.fares++;
            const added=Math.max(6, Math.round(8+st.tripLen*0.05));
            st.time += added;
            st.tipTxt = "+$"+(base+tip)+"  +"+added+"s"+(st.combo>1?"  ×"+st.combo:"");
            st.tipT=110;
            st.msg=T_.taxiPaid; st.msgT=70;
            st.flash=10;
            newFare();
          }
        }
      }
      if(st.stage==="dropoff") st.tripClock += DT;
    }

    /* ======================= draw ======================= */
    x.save();
    if(st.shake>0){ const m=st.shake*0.6; x.translate(rnd(-m,m),rnd(-m,m)); }

    drawSky(p.a);
    renderGround();

    /* z-sorted scenery, the fare beam, and the rider */
    const draws=[];
    for(const b of map.buildings)
      draws.push({x:b.x,y:b.y,fn:()=>drawBillboard(propImgs[b.p],b.x,b.y,120*b.s)});
    if(st.target){
      const tg=st.target;
      draws.push({x:tg.x,y:tg.y,fn:()=>{
        const q=project(tg.x,tg.y); if(!q) return;
        const col = st.stage==="pickup" ? "#4DE0B1" : "#F2B441";
        /* beam of light, so a fare is visible from across campus */
        const h=Math.min(H*0.9, 260*q.scale);
        const w=Math.max(6, 26*q.scale);
        const g=x.createLinearGradient(0,q.sy-h,0,q.sy);
        g.addColorStop(0,"rgba(0,0,0,0)");
        g.addColorStop(1,col);
        x.globalAlpha=0.42+Math.sin(st.time*4)*0.12;
        x.fillStyle=g; x.fillRect(q.sx-w/2, q.sy-h, w, h);
        x.globalAlpha=1;
        x.fillStyle=col;
        x.beginPath(); x.ellipse(q.sx,q.sy,w*0.8,w*0.3,0,0,7); x.fill();
        if(st.stage==="pickup" && st.riderSprite)
          drawBillboard(st.riderSprite, tg.x, tg.y, 62);
      }});
    }
    const camA=p.a, camX=p.x-Math.cos(camA)*62, camY=p.y-Math.sin(camA)*62;
    const cosA=Math.cos(camA), sinA=Math.sin(camA);
    for(const d of draws) d.d=(d.x-camX)*sinA+(d.y-camY)*cosA;
    draws.sort((a,b)=>b.d-a.d);
    x.save();
    x.beginPath(); x.rect(0,HORIZON,W,H-HORIZON-46); x.clip();
    for(const d of draws) if(d.d>22) d.fn();
    x.restore();

    /* the cart, dead centre */
    const kh=Math.round(H*0.21), ky=H-58;
    x.save();
    const lean=(keys.left||(touchX!==null&&touchX<0.4))?-0.09:
               (keys.right||(touchX!==null&&touchX>0.6))?0.09:0;
    x.translate(W/2,ky); x.rotate(lean); x.translate(-W/2,-ky);
    if(drawable(cart)) sprite(x,cart,W/2,ky,kh);
    else { x.fillStyle=you.col; x.fillRect(W/2-kh*0.4,ky-kh,kh*0.8,kh*0.7); }
    x.restore();
    /* the rider, sitting in the cart while you carry them */
    if(st.stage==="dropoff" && st.riderSprite && drawable(st.riderSprite)){
      const rh=kh*0.52;
      const rw=st.riderSprite.naturalWidth/st.riderSprite.naturalHeight*rh;
      x.drawImage(st.riderSprite, W/2-rw/2+kh*0.12, ky-kh*0.92-rh*0.15, rw, rh);
    }
    x.restore();

    if(st.flash>0){ x.fillStyle="rgba(242,180,65,"+(st.flash/12*0.28)+")"; x.fillRect(0,0,W,H); }

    /* ---- direction arrow + distance, the thing you actually steer by ---- */
    if(st.target && !st.over){
      const dx=st.target.x-p.x, dy=st.target.y-p.y;
      const dist=Math.hypot(dx,dy);
      let rel=Math.atan2(dy,dx)-p.a;
      while(rel>Math.PI) rel-=Math.PI*2;
      while(rel<-Math.PI) rel+=Math.PI*2;
      const col = st.stage==="pickup" ? "#4DE0B1" : "#F2B441";
      const cx=W/2, cy=48;
      x.save(); x.translate(cx,cy); x.rotate(rel);
      x.fillStyle=col;
      x.beginPath(); x.moveTo(0,-26); x.lineTo(17,14); x.lineTo(0,5); x.lineTo(-17,14);
      x.closePath(); x.fill();
      x.restore();
      x.fillStyle="rgba(11,15,31,.72)"; x.fillRect(cx-58,cy+22,116,22);
      x.fillStyle=col; x.font="bold 13px 'Courier New',monospace"; x.textAlign="center";
      x.fillText(Math.round(dist*2)+" m  ·  "+
        (st.stage==="pickup"?T_.taxiPickup:T_.taxiDropoff), cx, cy+37);
      x.textAlign="left";
    }

    /* ---- HUD ---- */
    x.fillStyle="rgba(11,15,31,0.76)"; x.fillRect(0,H-46,W,46);
    x.strokeStyle="#F2B441"; x.lineWidth=2;
    x.beginPath(); x.moveTo(0,H-46); x.lineTo(W,H-46); x.stroke();
    x.textBaseline="middle";
    const cell=(label,val,vcol,px)=>{
      x.fillStyle="#EFEAFB"; x.font="bold 12px 'Courier New',monospace";
      x.fillText(label,px,H-31);
      x.fillStyle=vcol; x.font="bold 19px 'Courier New',monospace";
      x.fillText(val,px,H-12);
    };
    const low = st.time<10;
    cell(T_.taxiTime.toUpperCase(), Math.ceil(st.time)+"s",
         low?(Math.floor(st.time*4)%2?"#FF4D9D":"#EFEAFB"):"#F2B441", 12);
    cell(T_.taxiFares.toUpperCase(), String(st.fares), "#4DE0B1", W*0.28);
    cell(T_.taxiCash.toUpperCase(), "$"+st.cash, "#F2B441", W*0.52);
    cell("SPD", Math.round(Math.abs(p.speed)/MAX_SPEED*45)+" km/h", "#4DE0B1", W*0.76);
    x.textBaseline="alphabetic";

    if(st.tipT>0){
      x.globalAlpha=Math.min(1,st.tipT/25);
      x.fillStyle="#4DE0B1"; x.font="800 24px 'Trebuchet MS',sans-serif";
      x.textAlign="center"; x.fillText(st.tipTxt, W/2, H*0.30);
      x.globalAlpha=1; x.textAlign="left";
    }
    if(st.msgT>0 && st.msg){
      x.globalAlpha=Math.min(1,st.msgT/25);
      x.fillStyle="rgba(11,15,31,.8)"; x.fillRect(0,HORIZON+6,W,30);
      x.fillStyle="#F2B441"; x.font="bold 15px 'Trebuchet MS',sans-serif";
      x.textAlign="center"; x.fillText(st.msg, W/2, HORIZON+26);
      x.globalAlpha=1; x.textAlign="left";
    }
    if(p.offRoad && !st.over){
      x.fillStyle="rgba(255,77,157,.8)"; x.font="bold 13px 'Trebuchet MS',sans-serif";
      x.textAlign="center"; x.fillText(T_.offRoad.toUpperCase(), W/2, H-56);
      x.textAlign="left";
    }
    /* mini-map: the whole campus, the cart, and where you're headed */
    const MM=70, mx=W-MM-10, my=HORIZON+8;
    x.fillStyle="rgba(11,15,31,.66)"; x.fillRect(mx,my,MM,MM);
    x.strokeStyle="#F2B441"; x.lineWidth=1; x.strokeRect(mx,my,MM,MM);
    x.fillStyle="rgba(255,255,255,.30)";
    for(const s2 of map.spots) x.fillRect(mx+s2.x/TS*MM-1, my+s2.y/TS*MM-1, 2,2);
    if(st.target){
      x.fillStyle = st.stage==="pickup" ? "#4DE0B1" : "#F2B441";
      x.fillRect(mx+st.target.x/TS*MM-3, my+st.target.y/TS*MM-3, 6,6);
    }
    x.fillStyle="#FF4D9D";
    x.fillRect(mx+p.x/TS*MM-2, my+p.y/TS*MM-2, 4,4);

    setHUD(null, st.fares, Math.ceil(st.time)*60, st.cash);
  });
}

/* ============================================================================
   GAME 5 — CHALK BRIGADE  ·  run-and-gun platformer
   ----------------------------------------------------------------------------
   PHASE 1: physics and the Cartesian core.

   Smith's Run is a 1D auto-runner: the world scrolls at a speed the game owns,
   the player only picks moments. This is the opposite contract. The player owns
   a position in a 2D plane, the world is static geometry, and the camera merely
   watches. Everything below exists to make that plane behave predictably.

   COORDINATE SPACE
     Levels are authored against a fixed 960x576 virtual stage in pixels, y
     increasing downward (screen convention, so gravity is +y). The context is
     scaled once per frame, so a 360px phone and a 960px laptop run byte-for-byte
     the same level geometry — no layout reflows into a different game.

   TIME
     startLoop() already advances the world at a fixed 60Hz with a time
     accumulator, so DT is the constant 1/60 s. That is what makes the motion
     frame-rate independent: a 144Hz screen renders more often but steps the
     same integer number of 1/60 s slices, and a dropped frame is caught up by
     running two steps rather than by taking one larger, different step. Every
     constant below is therefore written in real units — px/s, px/s^2 — not in
     per-frame nudges.

   KINEMATICS (semi-implicit Euler, exact for constant acceleration)
     P(t) = P0 + V*dt + 0.5*A*dt^2
     V(t) = V0 + A*dt
     The 0.5*A*dt^2 term is not decoration: dropping it makes the apex of a jump
     land half a gravity-step low, which is a visible 3px error at 60Hz and a
     wrong-feeling jump at any other rate.

   JUMP PHYSICS (derived, not tuned)
     Given a desired peak height H and time-to-apex T:
       g     = 2H / T^2
       V_y0  = sqrt(2*g*H)     ( = g*T, the two agree by construction)
     H = 132px clears the 24px platforms with a 40px margin; T = 0.36s is the
     snappy end of the arcade range. That yields g = 2037 px/s^2 and
     V_y0 = 733 px/s. Change H or T and every other number follows.

   AABB COLLISION
     Solids are axis-aligned boxes. For each overlap we compute the penetration
     depth on both axes and resolve on the axis of LEAST penetration, pushing
     along the sign of the centre-to-centre difference. Least-penetration is the
     correct disambiguation here because per-step displacement is bounded well
     under a box's dimensions (max |dx| = 320/60 = 5.3px, max |dy| = 733/60 =
     12.2px, versus a 24px minimum solid thickness), so the shallow axis is
     always the axis the body actually entered through.
   ========================================================================== */

/* Level geometry. Each solid is [x, y, w, h] in stage pixels. Level 1 is the
   only one Phase 1 loads; the array shape is already the multi-level one so
   Phase 4 adds entries rather than rewriting the loader. */
const GUN_LEVELS=[
 {id:1, w:4200, name:{en:"East Hallway",es:"Pasillo este"},
  spawn:{x:80,y:420}, exit:4120,
  checkpoints:[80,1300,2320,3120],
  solids:[
    [0,496,1180,80],[1300,496,900,80],[2320,496,700,80],[3120,496,1080,80],
    [520,400,120,24],[760,320,120,24],[1000,400,140,24],
    [1480,392,160,24],[1760,300,160,24],
    [2120,410,110,86],
    [2480,392,150,24],[2700,300,150,24],[2980,410,120,24],
    [3400,392,180,24],[3640,296,180,24],
    [3880,330,120,166]
  ],
  /* PHASE 3 enemy spawns. `kind` selects the automaton, the rest are its
     parameters: A/B are the sine amplitude (px) and angular frequency (rad/s);
     patrollers take a speed and find their own turning points by edge test. */
  enemies:[
    {kind:"monitor", x:640,  y:444, spd:70},
    {kind:"drone",   x:980,  y:330, A:52, B:2.1, spd:44},
    {kind:"monitor", x:1560, y:444, spd:82},
    {kind:"drone",   x:1900, y:250, A:70, B:1.6, spd:56},
    {kind:"monitor", x:2420, y:444, spd:74},
    {kind:"drone",   x:2600, y:300, A:60, B:2.6, spd:50},
    {kind:"monitor", x:2860, y:444, spd:96},
    {kind:"drone",   x:3260, y:280, A:80, B:1.9, spd:52},
    {kind:"monitor", x:3420, y:340, spd:60},
    {kind:"monitor", x:3760, y:444, spd:104},
    {kind:"drone",   x:3980, y:240, A:46, B:3.0, spd:38}
  ]}
];

function gameGunner(cv,id,lvl,zone){
  const x=cv.getContext("2d");
  const VW=960, VH=576;                       /* virtual stage */
  const level=GUN_LEVELS[0];

  /* ---- derived constants (see header) ---------------------------------- */
  const DT=1/60;
  const JUMP_H=132, JUMP_T=0.36;
  const GRAV=(2*JUMP_H)/(JUMP_T*JUMP_T);      /* 2037 px/s^2 */
  const JUMP_V=Math.sqrt(2*GRAV*JUMP_H);      /* 733 px/s    */
  const CUT_V=-JUMP_V*0.36;                   /* release clamp -> short hop  */
  const MAX_FALL=1150;                        /* terminal velocity           */
  const RUN_MAX=320+lvl*6, RUN_ACC=2400, RUN_FRIC=3200, AIR_ACC=1500;
  const COYOTE=0.10, BUFFER=0.12;             /* seconds of forgiveness      */

  const p={x:level.spawn.x, y:level.spawn.y, vx:0, vy:0,
           w:34, h:56, ground:false, face:1, coyote:0, buffer:0, held:false,
           anim:0, crouch:false, inv:0};
  const H_STAND=56, H_CROUCH=34;
  const cam={x:0,y:0};

  /* ==========================================================================
     PHASE 2 — projectile geometry, health, weapons

     AIM ANGLES. θ is in the standard maths convention (0° = +x, growing
     counter-clockwise as a human reads a protractor) even though the render
     space has +y downward. The single place that reconciles the two is the
     velocity decomposition:
         V_x = V * cosθ
         V_y = -V * sinθ        ← the negation IS the y-flip
     Doing it once here means every downstream calculation (spread offsets,
     laser raycasts, muzzle placement) can be reasoned about in ordinary
     trigonometry with no per-site sign corrections.

     The 8 directions are the vector sum of the held direction keys quantised to
     45° steps: (±1,0)→0°/180°, (±1,±1)→45°/135°/225°/315°, (0,±1)→90°/270°.
     ========================================================================== */
  const BULLET_V=680, LASER_RANGE=1400;
  const WEAPONS={
    chalk:{name:{en:"CHALK",es:"TIZA"}, cd:0.16, col:"#FFFFFF", dmg:1},
    spread:{name:{en:"SPREAD",es:"ABANICO"}, cd:0.26, col:"#F2B441", dmg:1},
    laser:{name:{en:"LASER",es:"LÁSER"}, cd:0.42, col:"#7CE0FF", dmg:3}
  };
  let weapon="chalk", ammo=Infinity, cool=0, aimDeg=0;

  /* OBJECT POOL. Bullets are allocated once and recycled by flipping .on, so a
     firefight never triggers a GC pause mid-jump. Capacity 90 is comfortably
     above the worst case: spread fires 3 at cd 0.26s with a ~1.6s max lifetime
     at range, i.e. ~19 live. */
  const POOL_N=90;
  const pool=[]; for(let i=0;i<POOL_N;i++) pool.push({on:false,x:0,y:0,vx:0,vy:0,life:0,dmg:1,col:"#fff",r:4});
  function spawnBullet(bx,by,deg,col,dmg){
    const b=pool.find(o=>!o.on); if(!b) return null;
    const r=deg*Math.PI/180;
    b.on=true; b.x=bx; b.y=by;
    b.vx=BULLET_V*Math.cos(r);      /* V_x = V cosθ */
    b.vy=-BULLET_V*Math.sin(r);     /* V_y = -V sinθ (screen y grows downward) */
    b.life=1.6; b.dmg=dmg; b.col=col; b.r=4;
    return b;
  }
  const beams=[];  /* instantaneous laser segments, drawn then decayed */

  /* ==========================================================================
     PHASE 3 — enemy automata

     MONITOR (linear patrol with edge detection). Walks a constant velocity and
     reverses when either (a) the point one step ahead at foot level +2px is not
     over a solid — the ledge test — or (b) that point is inside a solid — the
     wall test. Both are single-point samples rather than swept boxes, which is
     sufficient because the step is spd*DT ≤ 1.7px against 24px geometry.

     DRONE (trigonometric flight). Y(t) = y0 + A*sin(B*t + φ), drifting in x at a
     constant rate. Phase φ is seeded from the spawn x so a row of drones sweeps
     out of step rather than in formation.

     Both carry an integer hp, a hit-flash timer, and an AABB. Damage is a pure
     intersection test — no physics response — so a shot never pushes a body.
     ========================================================================== */
  const EK={
    monitor:{w:34,h:52,hp:2,score:60,col:"#FF7A5C"},
    drone:  {w:38,h:26,hp:1,score:40,col:"#C58BFF"}
  };
  const foes=level.enemies.map(e=>({
    ...EK[e.kind], ...e, y0:e.y, spawnX0:e.x, dir:-1, flash:0, alive:true,
    t0:(e.x%360)/360*6.283
  }));
  const pops=[];   /* short-lived death rings; the real emitter arrives Phase 5 */

  const solidAt=(qx,qy)=>level.solids.some(s=>qx>s[0]&&qx<s[0]+s[2]&&qy>s[1]&&qy<s[1]+s[3]);

  function damage(f,n){
    f.hp-=n; f.flash=0.12;
    if(f.hp<=0){
      f.alive=false; sc+=f.score; sfx("coin");
      pops.push({x:f.x+f.w/2, y:f.y+f.h/2, t:0.32, col:f.col});
    }
  }

  function updateFoes(){
    for(const f of foes){
      if(!f.alive) continue;
      f.flash=Math.max(0,f.flash-DT);
      /* asleep until they are within a screen and a half — keeps distant
         patrollers from walking themselves off the level before you arrive */
      if(Math.abs((f.x+f.w/2)-(p.x+p.w/2))>VW*0.75) continue;

      if(f.kind==="monitor"){
        const step=f.spd*f.dir*DT;
        const probeX=f.dir>0?f.x+f.w+2:f.x-2;
        const ledge=!solidAt(probeX,f.y+f.h+3);   /* nothing to walk onto     */
        const wall=solidAt(probeX,f.y+f.h-8);     /* something in the way     */
        if(ledge||wall) f.dir*=-1; else f.x+=step;
      }else{
        f.t0+=DT;
        f.x+=f.spd*f.dir*DT;
        f.y=f.y0+f.A*Math.sin(f.B*f.t0);          /* Y(t) = y0 + A sin(Bt) */
        /* drones turn on walls and on their patrol leash, not on ledges */
        if(solidAt(f.dir>0?f.x+f.w+2:f.x-2, f.y+f.h/2)) f.dir*=-1;
        /* leash: drift no further than 260px either side of the spawn */
        if(Math.abs(f.x-f.spawnX0)>260) f.dir*=-1;
      }

      /* contact damage: player AABB vs enemy AABB */
      if(p.inv<=0&&overlaps(p.x,p.y,p.w,p.h,[f.x,f.y,f.w,f.h])) hurt(1);
    }
    for(let i=pops.length-1;i>=0;i--){ pops[i].t-=DT; if(pops[i].t<=0) pops.splice(i,1); }
  }

  function fire(){
    if(cool>0) return;
    const w=WEAPONS[weapon];
    cool=w.cd;
    /* muzzle sits at the throwing hand: half a body forward along θ, hand height */
    const r=aimDeg*Math.PI/180;
    const cx=p.x+p.w/2+Math.cos(r)*22, cy=p.y+p.h*0.24-Math.sin(r)*22;
    if(weapon==="laser"){
      /* RAYCAST. March the ray in 6px steps and stop at the first solid; the
         step is well under the 24px minimum solid thickness so nothing is
         tunnelled through. Enemy AABBs are tested at every sample and the
         beam pierces them — only level geometry terminates the ray. */
      let hx=cx, hy=cy, d=0;
      const struck=new Set();
      while(d<LASER_RANGE){
        hx+=Math.cos(r)*6; hy-=Math.sin(r)*6; d+=6;
        for(const f of foes){
          if(!f.alive||struck.has(f)) continue;
          if(hx>f.x&&hx<f.x+f.w&&hy>f.y&&hy<f.y+f.h){ struck.add(f); damage(f,w.dmg); }
        }
        if(level.solids.some(s=>hx>s[0]&&hx<s[0]+s[2]&&hy>s[1]&&hy<s[1]+s[3])) break;
      }
      beams.push({x1:cx,y1:cy,x2:hx,y2:hy,t:0.16});
      sfx("zap");
    }else if(weapon==="spread"){
      /* [θ-15°, θ, θ+15°] */
      [-15,0,15].forEach(o=>spawnBullet(cx,cy,aimDeg+o,w.col,w.dmg));
      sfx("shoot");
    }else{
      spawnBullet(cx,cy,aimDeg,w.col,w.dmg);
      sfx("shoot");
    }
    if(ammo!==Infinity&&--ammo<=0){ weapon="chalk"; ammo=Infinity; }
  }

  /* Power-up crates. Shooting is not required to collect — walk into one. */
  const drops=[
    {x:900, y:452, kind:"spread", on:true},
    {x:1800,y:256, kind:"laser",  on:true},
    {x:2740,y:256, kind:"spread", on:true},
    {x:3690,y:252, kind:"laser",  on:true}
  ];
  let hp=3, sc=0, framesLeft=GAMES.find(g=>g.id==="gunner").dur*60;
  let over=false, cp=0, best=level.spawn.x, t=0;
  /* Last position the player was actually standing on ground. Respawn uses this
     rather than raw p.x: horizontal velocity is retained through a fall, so a
     player who drops into a gap crosses the far checkpoint mid-air and would
     otherwise be handed the progress the gap exists to deny. */
  let safe={x:level.spawn.x, y:level.spawn.y};

  const heroRun=spriteOf("run"), heroIdle=spriteOf("idle"), heroJump=spriteOf("walk");

  /* ---- input ----------------------------------------------------------- */
  const keys={left:false,right:false,up:false,down:false,jump:false,fire:false};
  const MAP={ArrowLeft:"left",KeyA:"left",ArrowRight:"right",KeyD:"right",
             ArrowUp:"up",KeyW:"up",ArrowDown:"down",KeyS:"down",
             Space:"jump",KeyK:"jump",
             KeyJ:"fire",KeyF:"fire",KeyX:"fire",ShiftLeft:"fire",ShiftRight:"fire"};
  const kd=e=>{ const k=MAP[e.code]; if(k){ keys[k]=true; e.preventDefault(); } };
  const ku=e=>{ const k=MAP[e.code]; if(k){ keys[k]=false; e.preventDefault(); } };
  window.addEventListener("keydown",kd); window.addEventListener("keyup",ku);
  let padX=null;
  /* Touch zones: left half is a relative run pad, the right half splits into
     jump (upper) and fire (lower) so both are reachable with one thumb. */
  const readTouch=e=>{
    let l=false,r=false,j=false,f=false,u=false,d=false;
    for(const tc of e.touches){
      const pt=canvasPoint(cv,tc);
      if(pt.x<0.5){ if(padX===null) padX=pt.x; const dx=pt.x-padX;
        if(dx<-0.03) l=true; else if(dx>0.03) r=true;
        else if(pt.x<0.22) l=true; else r=true;
        if(pt.y<0.32) u=true; else if(pt.y>0.8) d=true; }
      else if(pt.y<0.5) j=true;
      else f=true;
    }
    keys.left=l; keys.right=r; keys.jump=j; keys.fire=f; keys.up=u; keys.down=d;
    if(!l&&!r) padX=null;
  };
  const ts=e=>{ padX=null; readTouch(e); e.preventDefault(); };
  const tm=e=>{ readTouch(e); e.preventDefault(); };
  const te=e=>{ readTouch(e); if(!e.touches.length){ keys.left=keys.right=keys.jump=keys.fire=keys.up=keys.down=false; padX=null; } e.preventDefault(); };
  cv.addEventListener("touchstart",ts,{passive:false});
  cv.addEventListener("touchmove",tm,{passive:false});
  cv.addEventListener("touchend",te,{passive:false});
  cv.addEventListener("touchcancel",te,{passive:false});
  cleanupInput=()=>{ window.removeEventListener("keydown",kd); window.removeEventListener("keyup",ku);
    cv.removeEventListener("touchstart",ts); cv.removeEventListener("touchmove",tm);
    cv.removeEventListener("touchend",te); cv.removeEventListener("touchcancel",te); };

  /* ---- AABB helpers ---------------------------------------------------- */
  const overlaps=(ax,ay,aw,ah,b)=>ax<b[0]+b[2]&&ax+aw>b[0]&&ay<b[1]+b[3]&&ay+ah>b[1];

  /* Resolve every overlap on its axis of least penetration. One pass is enough
     for convex, non-overlapping solids at these speeds; two passes are run so a
     body wedged into a corner settles in the same step it entered. */
  function resolve(){
    p.ground=false;
    for(let pass=0;pass<2;pass++){
      for(const s of level.solids){
        if(!overlaps(p.x,p.y,p.w,p.h,s)) continue;
        /* penetration depth on each axis: how far the boxes interpenetrate */
        const penX=Math.min(p.x+p.w,s[0]+s[2])-Math.max(p.x,s[0]);
        const penY=Math.min(p.y+p.h,s[1]+s[3])-Math.max(p.y,s[1]);
        /* sign: direction from the solid's centre to the body's centre */
        const sx=Math.sign((p.x+p.w/2)-(s[0]+s[2]/2))||1;
        const sy=Math.sign((p.y+p.h/2)-(s[1]+s[3]/2))||1;
        if(penX<penY){ p.x+=penX*sx; if(Math.sign(p.vx)===-sx) p.vx=0; }
        else{
          p.y+=penY*sy;
          if(sy<0){ p.ground=true; if(p.vy>0) p.vy=0; }   /* landed on top    */
          else if(p.vy<0) p.vy=0;                          /* head on a ceiling */
        }
      }
    }
  }

  function hurt(n){
    if(p.inv>0||over) return;
    hp-=n||1; p.inv=1.1; sfx("hit");     /* invincibility frames, in seconds */
    if(hp<=0){ over=true; endGame(id,sc,false); }
  }

  function respawn(){
    hp--; sfx("hit");
    if(hp<=0){ over=true; endGame(id,sc,false); return; }
    /* the later of the last grounded spot and its checkpoint, backed off the
       ledge so you land with room to run at the gap again */
    const c=level.checkpoints[cp];
    p.x=Math.max(c, safe.x-30); p.y=safe.y-8; p.vx=0; p.vy=0;
    p.inv=1.1;
  }

  /* ---- procedural backdrop -------------------------------------------- */
  /* Drawn, not loaded: a chalkboard-slate sky over two silhouette bands of
     campus buildings and corridor lockers. Deterministic PRNG so the skyline is
     identical on every run instead of shimmering. */
  const rnd=(seed=>()=>{ seed=(seed+0x6D2B79F5)|0; let a=seed;
    a=Math.imul(a^(a>>>15),a|1); a^=a+Math.imul(a^(a>>>7),a|61);
    return ((a^(a>>>14))>>>0)/4294967296; })(90210);
  const sky1=zone.sky||"#14213A";
  const far=[],mid=[];
  for(let i=0;i<70;i++) far.push({x:i*140+rnd()*60, w:70+rnd()*80, h:90+rnd()*170, lit:rnd()});
  for(let i=0;i<90;i++) mid.push({x:i*96, h:120+rnd()*40, tone:rnd()});
  const stars=[]; for(let i=0;i<80;i++) stars.push({x:rnd()*VW,y:rnd()*300,r:rnd()*1.4+0.3});

  function backdrop(){
    const g=x.createLinearGradient(0,0,0,VH);
    g.addColorStop(0,sky1); g.addColorStop(0.62,"#2A2044"); g.addColorStop(1,"#3A2438");
    x.fillStyle=g; x.fillRect(0,0,VW,VH);
    x.fillStyle="rgba(255,255,255,.5)";
    stars.forEach(s=>{ x.globalAlpha=0.25+0.35*Math.sin(t*1.3+s.x); x.beginPath();
      x.arc(s.x,s.y,s.r,0,6.283); x.fill(); });
    x.globalAlpha=1;
    /* chalk grid, the one nod to the hub's blackboard */
    x.strokeStyle="rgba(255,255,255,.045)"; x.lineWidth=1;
    for(let gx=-((cam.x*0.12)%80); gx<VW; gx+=80){ x.beginPath(); x.moveTo(gx,0); x.lineTo(gx,VH); x.stroke(); }
    for(let gy=40; gy<VH; gy+=80){ x.beginPath(); x.moveTo(0,gy); x.lineTo(VW,gy); x.stroke(); }
    /* far skyline, depth 0.22 */
    far.forEach(b=>{
      const bx=b.x-cam.x*0.22; if(bx>VW||bx+b.w<0) return;
      x.fillStyle="#1B1730"; x.fillRect(bx,420-b.h,b.w,b.h+40);
      x.fillStyle="rgba(242,180,65,.5)";
      for(let wy=420-b.h+14; wy<400; wy+=26)
        for(let wx=bx+10; wx<bx+b.w-10; wx+=22)
          if(((wx+wy)|0)%3===(b.lit>0.5?0:1)) x.fillRect(wx,wy,8,10);
    });
    /* corridor lockers, depth 0.55 */
    mid.forEach(b=>{
      const bx=b.x-cam.x*0.55; if(bx>VW||bx+96<0) return;
      x.fillStyle=b.tone>0.5?"#243A52":"#1F3247"; x.fillRect(bx,496-b.h,92,b.h);
      x.fillStyle="rgba(0,0,0,.35)"; x.fillRect(bx+44,496-b.h,4,b.h);
      x.fillStyle="rgba(124,224,255,.35)";
      x.fillRect(bx+14,496-b.h+22,14,3); x.fillRect(bx+58,496-b.h+22,14,3);
      x.fillStyle="rgba(255,255,255,.06)"; x.fillRect(bx,496-b.h,92,3);
    });
    x.fillStyle="rgba(10,8,20,.55)"; x.fillRect(0,470,VW,VH-470);
  }

  function drawSolid(s){
    const sx=s[0]-cam.x, sy=s[1]-cam.y;
    if(sx>VW||sx+s[2]<0) return;
    x.fillStyle="#2B2440"; x.fillRect(sx,sy,s[2],s[3]);
    x.fillStyle="#3D3358"; x.fillRect(sx,sy,s[2],6);
    x.fillStyle="rgba(124,224,255,.8)"; x.fillRect(sx,sy,s[2],2);
    /* chalk hatching so the floor reads as a surface, not a colour field */
    x.strokeStyle="rgba(255,255,255,.07)"; x.lineWidth=1;
    for(let hx=sx+8; hx<sx+s[2]; hx+=18){
      x.beginPath(); x.moveTo(hx,sy+8); x.lineTo(hx-8,sy+s[3]); x.stroke();
    }
  }

  startLoop(function(){
    t+=DT;
    if(!over){
      framesLeft--;
      if(framesLeft<=0){ over=true; endGame(id,sc,false); }

      /* --- crouch: shrink the box from the top so the feet stay planted --- */
      const wantCrouch=keys.down&&p.ground;
      if(wantCrouch!==p.crouch){
        const nh=wantCrouch?H_CROUCH:H_STAND;
        /* standing up is refused if the taller box would clip a ceiling */
        const ny=p.y+p.h-nh;
        const blocked=!wantCrouch&&level.solids.some(s=>overlaps(p.x,ny,p.w,nh,s));
        if(!blocked){ p.y=ny; p.h=nh; p.crouch=wantCrouch; }
      }

      /* --- horizontal: accelerate toward the held direction ------------- */
      const dir=(keys.right?1:0)-(keys.left?1:0);
      const acc=p.ground?RUN_ACC:AIR_ACC;
      const cap=p.crouch?RUN_MAX*0.42:RUN_MAX;
      if(dir!==0){
        p.vx+=dir*acc*DT; p.face=dir;
        if(Math.abs(p.vx)>cap) p.vx=cap*Math.sign(p.vx);
      }else if(p.ground){
        const drop=RUN_FRIC*DT;
        p.vx=Math.abs(p.vx)<=drop?0:p.vx-drop*Math.sign(p.vx);
      }

      /* --- jump: coyote time and an input buffer ------------------------ */
      p.coyote=p.ground?COYOTE:Math.max(0,p.coyote-DT);
      const jumpReq=keys.jump&&!p.crouch;
      if(jumpReq&&!p.held) p.buffer=BUFFER; else p.buffer=Math.max(0,p.buffer-DT);
      p.held=jumpReq;
      if(p.buffer>0&&p.coyote>0){ p.vy=-JUMP_V; p.buffer=0; p.coyote=0; p.ground=false; }
      /* releasing early clamps the rise: same g, shorter arc */
      if(!keys.jump&&p.vy<CUT_V) p.vy=CUT_V;

      /* --- integrate: P = P0 + V*dt + 0.5*A*dt^2 ------------------------ */
      p.x+=p.vx*DT;
      p.y+=p.vy*DT+0.5*GRAV*DT*DT;
      p.vy=Math.min(MAX_FALL,p.vy+GRAV*DT);

      if(p.x<0){ p.x=0; p.vx=0; }
      if(p.x+p.w>level.w){ p.x=level.w-p.w; p.vx=0; }
      resolve();

      /* --- aiming: quantise the held direction vector to 45° steps ------- */
      const ax=dir, ay=(keys.up?1:0)-(keys.down&&!p.ground?1:0);
      if(ax||ay){
        /* atan2 already returns the exact 45° multiple for unit-ish inputs */
        aimDeg=Math.round(Math.atan2(ay,ax)*180/Math.PI/45)*45;
      }else if(keys.up){ aimDeg=90; }
      else{ aimDeg=p.face>0?0:180; }
      if(!ax&&!ay&&p.crouch) aimDeg=p.face>0?0:180;
      if(aimDeg===90){ /* straight up keeps the current facing */ }
      else if(Math.cos(aimDeg*Math.PI/180)>0.1) p.face=1;
      else if(Math.cos(aimDeg*Math.PI/180)<-0.1) p.face=-1;

      cool=Math.max(0,cool-DT);
      p.inv=Math.max(0,p.inv-DT);
      if(keys.fire) fire();

      /* --- advance the pool -------------------------------------------- */
      for(const b of pool){
        if(!b.on) continue;
        b.x+=b.vx*DT; b.y+=b.vy*DT;                  /* no gravity on shots */
        b.life-=DT;
        if(b.life<=0||b.x<cam.x-80||b.x>cam.x+VW+80||b.y<-200||b.y>VH+300){ b.on=false; continue; }
        /* damage intersection: bullet point inside an enemy AABB. Point-vs-box
           is honest here because the per-step travel (680/60 = 11.3px) is under
           the smallest enemy dimension (26px), so nothing passes through. */
        let spent=false;
        for(const f of foes){
          if(!f.alive) continue;
          if(b.x>f.x&&b.x<f.x+f.w&&b.y>f.y&&b.y<f.y+f.h){ damage(f,b.dmg); spent=true; break; }
        }
        if(spent){ b.on=false; continue; }
        if(level.solids.some(s=>b.x>s[0]&&b.x<s[0]+s[2]&&b.y>s[1]&&b.y<s[1]+s[3])) b.on=false;
      }
      for(let i=beams.length-1;i>=0;i--){ beams[i].t-=DT; if(beams[i].t<=0) beams.splice(i,1); }
      updateFoes();

      /* --- power-up pickups --------------------------------------------- */
      for(const d of drops){
        if(!d.on) continue;
        if(overlaps(p.x,p.y,p.w,p.h,[d.x,d.y,30,30])){
          d.on=false; weapon=d.kind; ammo=d.kind==="laser"?18:40; sc+=120; sfx("prize");
        }
      }

      /* checkpoints and the safe spot only advance with both feet down */
      if(p.ground){
        safe.x=p.x; safe.y=p.y;
        for(let i=0;i<level.checkpoints.length;i++) if(p.x>level.checkpoints[i]-40) cp=i;
      }
      if(p.x>best){ sc+=Math.round(p.x-best); best=p.x; }
      if(p.y>VH+80) respawn();
      if(p.x+p.w>=level.exit){ over=true; sc+=Math.round(framesLeft/6); endGame(id,sc,true); }

      /* camera: lead the player, clamp to the level, ease vertically */
      const want=p.x+p.w/2-VW*0.38+p.vx*0.22;
      cam.x+=(Math.max(0,Math.min(level.w-VW,want))-cam.x)*0.14;
      /* level 1 fits one stage height, so the vertical camera stays parked;
         Phase 4's taller levels raise this clamp instead of adding a branch */
      const wantY=Math.max(0,Math.min(0,p.y-VH*0.55));
      cam.y+=(wantY-cam.y)*0.12;
      p.anim+=Math.abs(p.vx)*DT;
    }

    /* ---- render ------------------------------------------------------- */
    x.setTransform(cv.width/VW,0,0,cv.height/VH,0,0);
    x.imageSmoothingEnabled=false;
    backdrop();
    x.save(); x.translate(0,-cam.y);
    level.solids.forEach(drawSolid);

    /* power-up crates: a chalk box with the weapon's colour inside */
    drops.forEach(d=>{
      if(!d.on) return;
      const dx=d.x-cam.x; if(dx<-60||dx>VW+60) return;
      const dy=d.y+Math.sin(t*3+d.x)*3;
      x.fillStyle="rgba(0,0,0,.35)"; x.fillRect(dx+3,dy+3,30,30);
      x.fillStyle=WEAPONS[d.kind].col; x.fillRect(dx,dy,30,30);
      x.fillStyle="#181228"; x.fillRect(dx+4,dy+4,22,22);
      x.fillStyle=WEAPONS[d.kind].col; x.font="bold 15px monospace"; x.textAlign="center";
      x.fillText(d.kind==="laser"?"L":"S",dx+15,dy+21); x.textAlign="left";
    });

    /* enemies */
    foes.forEach(f=>{
      if(!f.alive) return;
      const fx=f.x-cam.x; if(fx<-90||fx>VW+90) return;
      const flash=f.flash>0;
      if(f.kind==="monitor"){
        x.fillStyle="rgba(0,0,0,.3)";
        x.beginPath(); x.ellipse(fx+f.w/2,f.y+f.h+3,f.w*0.5,4,0,0,6.283); x.fill();
        x.fillStyle=flash?"#fff":"#3A2A46"; x.fillRect(fx,f.y,f.w,f.h);
        x.fillStyle=flash?"#fff":f.col; x.fillRect(fx,f.y,f.w,12);          /* sash  */
        x.fillStyle="#181228"; x.fillRect(fx+(f.dir>0?f.w-14:6),f.y+20,8,6); /* visor */
        x.fillStyle="rgba(255,255,255,.14)"; x.fillRect(fx,f.y,3,f.h);
        /* legs, stepped off its own x so the walk reads without a sprite */
        const ph=Math.sin(f.x*0.12)*5;
        x.fillStyle="#241A30";
        x.fillRect(fx+7,f.y+f.h-6+ph*0.2,8,6); x.fillRect(fx+f.w-15,f.y+f.h-6-ph*0.2,8,6);
      }else{
        x.fillStyle=flash?"#fff":f.col;
        x.beginPath(); x.ellipse(fx+f.w/2,f.y+f.h/2,f.w/2,f.h/2,0,0,6.283); x.fill();
        x.fillStyle="#181228";
        x.beginPath(); x.arc(fx+f.w/2+(f.dir>0?6:-6),f.y+f.h/2-2,4,0,6.283); x.fill();
        /* rotor blur — a chalk-dust eraser hovering the hallway */
        x.strokeStyle="rgba(255,255,255,.35)"; x.lineWidth=2;
        const sw=Math.abs(Math.cos(t*22))*13+5;
        x.beginPath(); x.moveTo(fx+f.w/2-sw,f.y-3); x.lineTo(fx+f.w/2+sw,f.y-3); x.stroke();
      }
    });

    /* death pops */
    pops.forEach(o=>{
      const k=1-o.t/0.32;
      x.globalAlpha=1-k; x.strokeStyle=o.col; x.lineWidth=3;
      x.beginPath(); x.arc(o.x-cam.x,o.y,6+k*26,0,6.283); x.stroke();
      x.globalAlpha=1;
    });

    /* laser beams */
    beams.forEach(b=>{
      x.globalAlpha=Math.min(1,b.t/0.16);
      x.strokeStyle="#7CE0FF"; x.lineWidth=6; x.globalCompositeOperation="lighter";
      x.beginPath(); x.moveTo(b.x1-cam.x,b.y1); x.lineTo(b.x2-cam.x,b.y2); x.stroke();
      x.strokeStyle="#FFFFFF"; x.lineWidth=2;
      x.beginPath(); x.moveTo(b.x1-cam.x,b.y1); x.lineTo(b.x2-cam.x,b.y2); x.stroke();
      x.globalCompositeOperation="source-over"; x.globalAlpha=1;
    });

    /* bullets: a short trail along -V renders the direction better than a dot */
    pool.forEach(b=>{
      if(!b.on) return;
      const bx=b.x-cam.x;
      x.strokeStyle=b.col; x.lineWidth=3; x.globalAlpha=.55;
      x.beginPath(); x.moveTo(bx,b.y); x.lineTo(bx-b.vx*0.018,b.y-b.vy*0.018); x.stroke();
      x.globalAlpha=1; x.fillStyle=b.col;
      x.beginPath(); x.arc(bx,b.y,b.r,0,6.283); x.fill();
    });

    /* the bell: a lit doorway at the exit */
    const ex=level.exit-cam.x;
    if(ex<VW+60){
      x.fillStyle="rgba(124,224,255,.15)"; x.fillRect(ex-6,300,60,196);
      x.fillStyle="#7CE0FF"; x.fillRect(ex-6,300,60,5);
      x.fillStyle="rgba(255,255,255,.85)"; x.font="bold 15px monospace";
      x.fillText(S.lang==="es"?"CAMPANA":"BELL",ex-2,290);
    }

    /* player */
    const px=p.x-cam.x, py=p.y;
    const moving=Math.abs(p.vx)>18;
    let im=p.ground?(moving?heroRun:heroIdle):heroJump;
    if(!drawable(im)) im=heroIdle;
    x.save();
    /* i-frames blink at 12Hz — fast enough to read as damage, slow enough to
       keep the player legible while it runs */
    if(p.inv>0&&Math.floor(p.inv*12)%2===0) x.globalAlpha=0.35;
    x.translate(px+p.w/2,0);
    if(p.face<0) x.scale(-1,1);
    if(drawable(im)){
      const bob=p.ground&&moving?Math.sin(p.anim*0.055)*2:0;
      const h=p.h*1.34, w=im.naturalWidth/im.naturalHeight*h;
      x.drawImage(im,-w/2,p.y+p.h-h+bob,w,h);
    }else{
      x.fillStyle="#F2B441"; x.fillRect(-p.w/2,p.y,p.w,p.h);
    }
    x.restore();
    x.globalAlpha=1;

    /* aim arm: a short chalk stub along θ so the fire direction is visible
       before anything is fired */
    {
      const r=aimDeg*Math.PI/180;
      const ox=px+p.w/2, oy=p.y+p.h*0.34;
      x.strokeStyle=WEAPONS[weapon].col; x.lineWidth=4; x.lineCap="round";
      x.globalAlpha=.9;
      x.beginPath(); x.moveTo(ox+Math.cos(r)*8,oy-Math.sin(r)*8);
      x.lineTo(ox+Math.cos(r)*24,oy-Math.sin(r)*24); x.stroke();
      x.globalAlpha=1; x.lineCap="butt";
    }
    /* contact shadow reads the distance to the floor, which is most of what
       tells a player where they will land */
    x.fillStyle="rgba(0,0,0,.3)";
    let gy=VH+200;
    for(const s of level.solids)
      if(p.x+p.w>s[0]&&p.x<s[0]+s[2]&&s[1]>=p.y+p.h-2&&s[1]<gy) gy=s[1];
    if(gy<VH+200){
      const k=Math.max(0.25,1-(gy-(p.y+p.h))/260);
      x.beginPath(); x.ellipse(px+p.w/2,gy+2,p.w*0.55*k,5*k,0,0,6.283); x.fill();
    }
    x.restore();

    /* progress rail — how far along the hallway you are */
    x.fillStyle="rgba(0,0,0,.45)"; x.fillRect(24,22,VW-48,8);
    x.fillStyle="#7CE0FF"; x.fillRect(24,22,(VW-48)*Math.min(1,p.x/level.exit),8);

    /* hearts — integer hit points, drawn on the canvas so the game reads at a
       glance without the player's eye leaving the play field */
    for(let i=0;i<3;i++){
      const hx=24+i*30, hy=40, filled=i<hp;
      x.fillStyle=filled?"#FF5C7A":"rgba(255,255,255,.16)";
      x.beginPath();
      x.moveTo(hx+11,hy+20);
      x.bezierCurveTo(hx-4,hy+9,hx+2,hy-2,hx+11,hy+5);
      x.bezierCurveTo(hx+20,hy-2,hx+26,hy+9,hx+11,hy+20);
      x.fill();
    }

    /* weapon readout */
    const w=WEAPONS[weapon];
    x.fillStyle="rgba(0,0,0,.45)"; x.fillRect(VW-186,36,162,26);
    x.fillStyle=w.col; x.fillRect(VW-186,36,4,26);
    x.fillStyle="#fff"; x.font="bold 14px monospace";
    x.fillText(w.name[S.lang==="es"?"es":"en"],VW-172,54);
    if(ammo!==Infinity){
      x.fillStyle="rgba(255,255,255,.6)"; x.textAlign="right";
      x.fillText(String(ammo),VW-34,54); x.textAlign="left";
    }
    x.setTransform(1,0,0,1,0,0);

    setHUD(hp,null,framesLeft,sc);
  });
}

/* ============================================================================
   GAME 4 — SMITH'S QUEST (top-down action survival)
   ========================================================================== */
function gameQuest(cv,id,lvl,zone){
  const x=cv.getContext("2d"),W=cv.width,H=cv.height;
  let f=0,sc=0,over=false,framesLeft=GAMES[3].dur*60,hp=3,tokens=0;
  let p={x:0,y:0,dx:0,dy:0,speed:6+(lvl*0.2),dir:0,swing:0,invuln:0};
  let enemies=[],items=[];
  const enemySpeed=2.5+(lvl*0.3), spawnRate=Math.max(30,90-(lvl*6));
  const back=spriteOf(zone.bg), coin=spriteOf("item_coin");
  const hero=spriteOf("idle"), foes=FOES.map(spriteOf);

  const keys={ArrowUp:false,ArrowDown:false,ArrowLeft:false,ArrowRight:false,Space:false};
  const kd=e=>{ if(keys[e.code]!==undefined){ keys[e.code]=true; e.preventDefault(); } };
  const ku=e=>{ if(keys[e.code]!==undefined){ keys[e.code]=false; e.preventDefault(); } };
  window.addEventListener("keydown",kd); window.addEventListener("keyup",ku);
  let joyX=0,joyY=0,joyDx=0,joyDy=0,touchActive=false;
  const ts=e=>{
    for(const t of e.touches){
      const pt=canvasPoint(cv,t);
      if(pt.x<0.5){ touchActive=true; joyX=t.clientX; joyY=t.clientY; joyDx=0; joyDy=0; }
      else keys.Space=true;
    }
    e.preventDefault(); };
  const tm=e=>{
    for(const t of e.touches){
      if(canvasPoint(cv,t).x<0.5&&touchActive){ joyDx=t.clientX-joyX; joyDy=t.clientY-joyY; }
    }
    e.preventDefault(); };
  const te=e=>{
    keys.Space=false;
    let left=false;
    for(const t of e.touches){ if(canvasPoint(cv,t).x<0.5) left=true; }
    if(!left){ touchActive=false; joyDx=0; joyDy=0; }
    e.preventDefault(); };
  cv.addEventListener("touchstart",ts,{passive:false});
  cv.addEventListener("touchmove",tm,{passive:false});
  cv.addEventListener("touchend",te,{passive:false});
  cleanupInput=()=>{ window.removeEventListener("keydown",kd); window.removeEventListener("keyup",ku);
    cv.removeEventListener("touchstart",ts); cv.removeEventListener("touchmove",tm); cv.removeEventListener("touchend",te); };

  startLoop(function(){
    f++;
    if(!over){
      framesLeft--;
      if(framesLeft<=0){ over=true; endGame(id,sc,true); }
      if(p.invuln>0) p.invuln--;
      if(p.swing>0) p.swing--;
      p.dx=0; p.dy=0;
      if(keys.ArrowUp) p.dy=-1;
      if(keys.ArrowDown) p.dy=1;
      if(keys.ArrowLeft) p.dx=-1;
      if(keys.ArrowRight) p.dx=1;
      if(touchActive){
        const d=Math.sqrt(joyDx*joyDx+joyDy*joyDy);
        if(d>10){ p.dx=joyDx/d; p.dy=joyDy/d; }
      } else if(p.dx!==0&&p.dy!==0){ p.dx*=0.707; p.dy*=0.707; }
      const boost=(p.invuln>60)?2:1;
      p.x+=p.dx*p.speed*boost; p.y+=p.dy*p.speed*boost;
      if(Math.abs(p.dx)>Math.abs(p.dy)) p.dir=(p.dx>0)?3:2;
      else if(p.dy!==0) p.dir=(p.dy>0)?0:1;
      if(keys.Space&&p.swing===0) p.swing=15;
      let hbx=-1e5,hby=-1e5; const hbw=88,hbh=88;
      if(p.swing>0){
        if(p.dir===0){ hbx=p.x-44; hby=p.y+20; }
        if(p.dir===1){ hbx=p.x-44; hby=p.y-108; }
        if(p.dir===2){ hbx=p.x-108; hby=p.y-44; }
        if(p.dir===3){ hbx=p.x+20; hby=p.y-44; }
      }
      if(f%spawnRate===0){
        const ang=Math.random()*Math.PI*2, d=Math.max(W,H)/1.5;
        enemies.push({x:p.x+Math.cos(ang)*d,y:p.y+Math.sin(ang)*d,active:true,
                      k:Math.floor(Math.random()*foes.length)});
      }
      enemies.forEach(e=>{
        if(!e.active) return;
        const exDx=p.x-e.x, exDy=p.y-e.y, mag=Math.sqrt(exDx*exDx+exDy*exDy)||1;
        e.x+=(exDx/mag)*enemySpeed; e.y+=(exDy/mag)*enemySpeed;
        if(p.swing>0&&e.x>hbx&&e.x<hbx+hbw&&e.y>hby&&e.y<hby+hbh){
          e.active=false; sc+=20;
          if(Math.random()>0.5) items.push({x:e.x,y:e.y,active:true});
        } else if(p.invuln<=0&&Math.abs(e.x-p.x)<44&&Math.abs(e.y-p.y)<44){
          hp--; p.invuln=90; p.dx=-exDx/mag; p.dy=-exDy/mag;
          if(hp<=0){ over=true; endGame(id,sc,false); }
        }
      });
      enemies=enemies.filter(e=>e.active);
      items.forEach(i=>{
        if(i.active&&Math.abs(i.x-p.x)<50&&Math.abs(i.y-p.y)<50){ i.active=false; tokens++; sc+=10; }
      });
      items=items.filter(i=>i.active);
    }
    /* draw */
    const camX=p.x-W/2, camY=p.y-H/2;
    drawBack(x,back,zone,W,H,0);
    x.fillStyle="rgba(10,7,22,.62)"; x.fillRect(0,0,W,H);
    x.strokeStyle="rgba(255,255,255,.07)"; x.lineWidth=2;
    for(let r=-(camY%110);r<H;r+=110){ x.beginPath(); x.moveTo(0,r); x.lineTo(W,r); x.stroke(); }
    for(let c=-(camX%110);c<W;c+=110){ x.beginPath(); x.moveTo(c,0); x.lineTo(c,H); x.stroke(); }
    x.save(); x.translate(-camX,-camY);
    items.forEach(i=>{
      if(drawable(coin)) x.drawImage(coin,i.x-16,i.y-16,32,32);
      else { x.fillStyle="#F2B441"; x.beginPath(); x.arc(i.x,i.y,16,0,7); x.fill(); }
    });
    enemies.forEach(e=>{
      const im=foes[e.k], wob=Math.sin((f+e.x)*0.2)*5;
      if(drawable(im)) sprite(x,im,e.x,e.y+22+wob,64);
      else { x.fillStyle="#FF4D9D"; x.beginPath(); x.arc(e.x,e.y+wob,20,0,7); x.fill(); }
    });
    if(p.invuln%10<5){
      if(drawable(hero)) sprite(x,hero,p.x,p.y+44,92);
      else { x.fillStyle="#2F6BD8"; x.fillRect(p.x-20,p.y-40,40,80); }
      if(p.swing>0){
        x.strokeStyle="rgba(255,255,255,.85)"; x.lineWidth=9; x.beginPath();
        if(p.dir===0) x.arc(p.x,p.y+44,46,0,Math.PI);
        if(p.dir===1) x.arc(p.x,p.y-44,46,Math.PI,Math.PI*2);
        if(p.dir===2) x.arc(p.x-44,p.y,46,Math.PI/2,Math.PI*1.5);
        if(p.dir===3) x.arc(p.x+44,p.y,46,-Math.PI/2,Math.PI/2);
        x.stroke();
      }
    }
    x.restore();
    if(touchActive){
      const r=cv.getBoundingClientRect(), sx=(joyX-r.left)/r.width*W, sy=(joyY-r.top)/r.height*H;
      x.fillStyle="rgba(255,255,255,.18)";
      x.beginPath(); x.arc(sx,sy,44,0,7); x.fill();
      x.beginPath(); x.arc(sx+joyDx,sy+joyDy,22,0,7); x.fill();
    }
    setHUD(hp,tokens,framesLeft,sc);
  });
}

/* ============================================================================
   11. TEACHER  —  PIN protected. Students never see this tab.
   ========================================================================== */
function teacherSignIn(){
  if(!S.pin){
    const a=prompt(T_.pinNew); if(!a) return;
    if(a.trim().length<4) return toast(T_.pinShort);
    S.pin=a.trim(); save(); TEACHER_OK=true; hideTitle(); go("teacher"); return toast(T_.pinSet);
  }
  const g=prompt(T_.pinAsk); if(g===null) return;
  if(g.trim()===S.pin){ TEACHER_OK=true; hideTitle(); go("teacher"); }
  else toast(T_.pinBad);
}
function bankAnswerHTML(it){
  if(it.type==="mcq"){
    return "<ol class=\"bankchoices\">"+it.c.en.map((c,i)=>
      `<li class="${i===it.a?"right":""}">${esc(c)}${i===it.a?" ✓":""}</li>`).join("")+"</ol>";
  }
  if(it.type==="multi"){
    const set=new Set(it.a);
    return "<ol class=\"bankchoices\">"+it.c.en.map((c,i)=>
      `<li class="${set.has(i)?"right":""}">${esc(c)}${set.has(i)?" ✓":""}</li>`).join("")+"</ol>";
  }
  if(it.type==="numeric"){
    return `<div class="bankans">${T_.answer}: <b>${it.a}</b>${it.tol?" ± "+it.tol:""}</div>`;
  }
  return `<div class="bankans">${T_.keywords}: ${esc((it.keys||[]).join(", "))}</div>`;
}
function renderBankItem(it){
  const es=it.q.es?`<br><span class="muted">${esc(it.q.es)}</span>`:"";
  const why=it.why&&it.why.en?`<div class="bankwhy">${esc(it.why.en)}</div>`:"";
  const hay=(it.id+" "+it.q.en+" "+(it.q.es||"")).toLowerCase();
  return `<div class="bankitem" data-q="${esc(hay)}">
    <div class="row"><span class="chip">${it.id}</span><span class="chip">${it.type}</span></div>
    <p class="bankq">${esc(it.q.en)}${es}</p>
    ${bankAnswerHTML(it)}${why}
  </div>`;
}
function renderBank(){
  return allPacks().map(p=>`<details class="bankpack">
    <summary>${esc(L(p.name))} · ${p.units.reduce((n,u)=>n+u.items.length,0)} ${T_.items}</summary>
    ${p.units.map(u=>`<details class="bankunit">
      <summary>${esc(L(u.title))} · ${u.items.length}</summary>
      ${u.items.map(renderBankItem).join("")}
    </details>`).join("")}
  </details>`).join("");
}
function filterBank(v){
  const q=(v||"").toLowerCase().trim();
  document.querySelectorAll("#bankList .bankitem").forEach(el=>{
    el.classList.toggle("hidden", q!==""&&el.dataset.q.indexOf(q)===-1);
  });
  document.querySelectorAll("#bankList .bankunit").forEach(u=>{
    const anyShown=[...u.querySelectorAll(".bankitem")].some(el=>!el.classList.contains("hidden"));
    u.classList.toggle("hidden", q!==""&&!anyShown);
    if(q!==""&&anyShown) u.open=true;
  });
}
function teacherLock(){ TEACHER_OK=false; go("home"); toast(T_.locked); }
function bankTotals(){
  const units=allUnits(), items=units.reduce((n,u)=>n+u.items.length,0);
  const need=(S.cfg.classes||3)*(S.cfg.weeks||18)*(S.cfg.perWeek||3)*(S.cfg.perChallenge||15);
  return {units:units.length,items,need,pct:Math.min(100,Math.round(items/need*100)),gap:Math.max(0,need-items)};
}

  <section class="panel raised">
    <div class="eyebrow">${T_.semester}</div>
    <p class="muted" style="margin:4px 0 10px">${T_.semesterHelp}</p>
    <div class="meter"><i style="width:${b.pct}%"></i></div>
    <div class="row" style="margin-top:10px">
      <span class="chip on">${T_.have} ${b.items}</span>
      <span class="chip warn">${T_.need} ${b.need}</span>
      <span class="chip ${b.gap?"bad":"on"}">${b.gap?T_.gap+" "+b.gap:T_.covered}</span></div>
    <div class="grid two" style="margin-top:12px">
      ${[["classes",T_.classes],["weeks",T_.weeks],["perWeek",T_.perWeek],["perChallenge",T_.perChallenge]].map(([k,l])=>
        `<div><label for="c_${k}">${l}</label><input id="c_${k}" type="number" min="1" value="${S.cfg[k]}"

/* Accepts a .json pack OR a raw Python question bank (.py / .txt).
   A Python bank is a list of dicts with "q", "options", and "ans" — that is
   already valid JSON per entry, so each block is lifted out and parsed. */
function pyToPack(text,fname){
  const blocks=[]; let depth=0,start=-1;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(c==="{"){ if(depth===0) start=i; depth++; }
    else if(c==="}"){ depth--; if(depth===0&&start>=0){ blocks.push(text.slice(start,i+1)); start=-1; } }
  }
  const items=[]; let n=0;
  blocks.forEach(b=>{
    let o; try{ o=JSON.parse(b); }catch(e){ return; }
    if(!o||typeof o.q!=="string"||!Array.isArray(o.options)) return;
    const a=typeof o.ans==="number"?o.ans:0;
    if(a<0||a>=o.options.length) return;
    n++;
    const it={id:"py-"+String(n).padStart(3,"0"),type:"mcq",diff:o.diff||2,
      q:{en:o.q},c:{en:o.options.slice()},a:a,
      why:{en:o.why||"See the study notes for this unit."}};
    if(o.q_es) it.q.es=o.q_es;
    if(Array.isArray(o.options_es)&&o.options_es.length===o.options.length) it.c.es=o.options_es.slice();
    if(o.why_es) it.why.es=o.why_es;
    items.push(it);
  });
  if(!items.length) return null;
  const base=(fname||"bank").replace(/\.[^.]+$/,"").replace(/[_-]+/g," ").trim();
  const id="py-"+base.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  return {id:id,color:"#F2B441",name:{en:base||"Uploaded bank"},units:[
    {id:id+"-u1",title:{en:base||"Uploaded bank"},
     brief:{en:"Questions uploaded from a Python bank. Edit the source file and upload again to update them."},
     items:items}]};
}
function loadPack(inp){ const f=inp.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{
    if(/\.(py|txt)$/i.test(f.name)){
      const pk=pyToPack(r.result,f.name);
      if(!pk) return toast(T_.packBad);
      S.extraPacks=S.extraPacks.filter(y=>y.id!==pk.id); S.extraPacks.push(pk);
      save(); toast("✓ "+pk.units[0].items.length); render(); return;
    }
    try{ const pk=JSON.parse(r.result), arr=Array.isArray(pk)?pk:[pk];
      arr.forEach(x=>{ if(!x.id||!x.units) throw new Error("bad");
        S.extraPacks=S.extraPacks.filter(y=>y.id!==x.id); S.extraPacks.push(x); });
      save(); toast("✓ "+arr.length); render();
    }catch(e){ toast(T_.packBad); } };
  r.readAsText(f); inp.value=""; }
function loadSaveFile(inp){ const f=inp.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{ try{ merge(JSON.parse(r.result)); toast("✓"); render(); }catch(e){ toast(T_.saveBad); } };
  r.readAsText(f); inp.value=""; }

/* ============================================================================
   10. JUICE  —  sound, particles, transitions.
   Everything here decorates the app from the outside: it wraps a handful of
   existing functions and watches the DOM, so no screen above had to change.
   Muting is remembered, and anyone who asked their device for less motion
   gets the plain app back.
   ========================================================================== */
const KEY_MUTE="smiths.mute";
const FX={muted:localStorage.getItem(KEY_MUTE)==="1",ctx:null,
  reduce:matchMedia("(prefers-reduced-motion:reduce)").matches};

/* ---- sound: a few short blips, built on the fly, no files ---- */
function fxCtx(){
  if(FX.muted) return null;
  if(!FX.ctx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null;
    try{ FX.ctx=new C(); }catch(e){ return null; } }
  if(FX.ctx.state==="suspended") FX.ctx.resume();
  return FX.ctx;
}
function blip(f,dur,type,vol,slideTo){
  const c=fxCtx(); if(!c) return;
  const o=c.createOscillator(), g=c.createGain(), t=c.currentTime;
  o.type=type||"square"; o.frequency.setValueAtTime(f,t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(40,slideTo),t+dur);
  g.gain.setValueAtTime(.0001,t);
  g.gain.linearRampToValueAtTime(vol||.05,t+.008);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.03);
}
const seq=(notes,step,type,vol,dur)=>notes.forEach((n,i)=>
  setTimeout(()=>blip(n,dur||.14,type||"square",vol||.05),i*(step||90)));
const SFX={
  tap:()=>blip(480,.045,"square",.035),
  move:()=>blip(660,.05,"triangle",.04),
  flip:()=>blip(430,.07,"triangle",.035,620),
  right:()=>seq([659,880,1319],80,"square",.045,.13),
  wrong:()=>blip(220,.24,"sawtooth",.04,80),
  coin:()=>{blip(1046,.06,"square",.05); setTimeout(()=>blip(1568,.12,"square",.04),60);},
  prize:()=>seq([523,659,784,1046],110,"square",.05,.18),
  start:()=>seq([392,523,659,784],70,"square",.055,.16),
  shoot:()=>blip(880,.045,"square",.028,420),
  zap:()=>{blip(1400,.09,"sawtooth",.035,300); setTimeout(()=>blip(700,.1,"square",.025,180),40);},
  hit:()=>blip(160,.18,"sawtooth",.05,70),
  /* game show clock */
  jeoRead:()=>seq([330,392],120,"triangle",.04,.2),
  jeoOpen:()=>seq([523,659,880],90,"square",.06,.18),
  jeoTick:()=>blip(300,.06,"triangle",.03,240),
  jeoTickHot:()=>blip(600,.07,"square",.045,520),
  jeoBuzzIn:()=>{blip(180,.22,"sawtooth",.06,120); setTimeout(()=>blip(240,.2,"square",.045),70);},
  jeoSteal:()=>seq([880,1046,880,1046],110,"square",.05,.14),
  jeoDead:()=>seq([392,330,262,196],150,"sawtooth",.05,.28)
};
function sfx(n){ try{ SFX[n](); }catch(e){} }
function toggleMute(){
  FX.muted=!FX.muted;
  try{ localStorage.setItem(KEY_MUTE,FX.muted?"1":"0"); }catch(e){}
  paintMute();

}
function paintMute(){

/* ---- particle stage ---- */
function fxLayer(){
  let l=document.getElementById("fxlayer");
  if(!l){ l=document.createElement("div"); l.id="fxlayer"; document.body.appendChild(l); }
  return l;
}
function fxBackdrop(){
  if(document.getElementById("fxbg")||FX.reduce) return;
  const d=document.createElement("div"); d.id="fxbg";
  d.innerHTML="<i></i><i></i><i></i>";
  document.body.insertBefore(d,document.body.firstChild);
}
/* Coins arc out of the middle of the screen and land on the counter in the
   marquee, so earning tokens has somewhere to go. */
function coinFly(n){
  const target=document.querySelector(".marquee .coin");
  if(!target||FX.reduce||!Element.prototype.animate){ sfx("coin"); return; }
  const t=target.getBoundingClientRect();
  const sx=window.innerWidth/2, sy=window.innerHeight*.6;
  const dx=t.left+t.width/2-sx, dy=t.top+t.height/2-sy;
  for(let i=0;i<n;i++){
    const c=document.createElement("div"); c.className="fxcoin";
    c.style.left=(sx-12)+"px"; c.style.top=(sy-12)+"px";
    fxLayer().appendChild(c);
    const ax=dx*.3+(Math.random()*150-75), ay=dy*.3-130-Math.random()*80;
    const a=c.animate([
      {transform:"translate(0,0) scale(.35) rotate(0deg)",opacity:0},
      {transform:`translate(${ax}px,${ay}px) scale(1.12) rotate(200deg)`,opacity:1,offset:.45},
      {transform:`translate(${dx}px,${dy}px) scale(.42) rotate(560deg)`,opacity:.85}
    ],{duration:780+i*30,delay:i*95,easing:"cubic-bezier(.32,.06,.24,1)",fill:"forwards"});
    a.onfinish=()=>{
      c.remove();
      target.classList.remove("hit"); void target.offsetWidth; target.classList.add("hit");
      sfx("coin");
    };
  }
}
function sparkle(el,color,count){
  if(FX.reduce||!el||!el.getBoundingClientRect) return;
  const r=el.getBoundingClientRect();
  if(!r.width) return;
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  for(let i=0;i<(count||10);i++){
    const s=document.createElement("div"); s.className="fxspark";
    s.style.left=cx+"px"; s.style.top=cy+"px";
    s.style.background=color||"#4DE0B1";
    fxLayer().appendChild(s);
    const ang=Math.random()*Math.PI*2, dist=50+Math.random()*90;
    const a=s.animate([
      {transform:"translate(-50%,-50%) scale(1) rotate(0deg)",opacity:1},
      {transform:`translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist-20}px) scale(0) rotate(220deg)`,opacity:0}
    ],{duration:520+Math.random()*260,easing:"cubic-bezier(.2,.7,.3,1)",fill:"forwards"});
    a.onfinish=()=>s.remove();
  }
}
function countTo(el,from,to,ms){
  if(FX.reduce||from===to){ el.textContent=to; return; }
  const t0=performance.now();
  (function step(now){
    const p=Math.min(1,(now-t0)/(ms||700));
    el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-p,3)));
    if(p<1) requestAnimationFrame(step); else el.textContent=to;
  })(t0);
}

/* ---- press feel: one ripple and one blip for every tappable thing ---- */
function ripple(el,x,y){
  if(FX.reduce) return;
  const r=el.getBoundingClientRect(), size=Math.max(r.width,r.height)*1.6;
  const s=document.createElement("span"); s.className="rip";
  s.style.width=s.style.height=size+"px";
  s.style.left=(x-r.left)+"px"; s.style.top=(y-r.top)+"px";
  el.appendChild(s);
  const a=s.animate([{transform:"translate(-50%,-50%) scale(0)",opacity:.85},
                     {transform:"translate(-50%,-50%) scale(1)",opacity:0}],
                    {duration:520,easing:"cubic-bezier(.2,.7,.3,1)",fill:"forwards"});
  a.onfinish=()=>s.remove();
}
document.addEventListener("pointerdown",e=>{
  const el=e.target&&e.target.closest&&
    e.target.closest("button,.opt,.mtile,.zone,.jeocell,.buzzer,.flashcard");
  if(!el||el.disabled||el.classList.contains("hidden")) return;
  ripple(el,e.clientX,e.clientY);
  if(el.classList.contains("go")) sfx("start");
  else if(el.classList.contains("opt")||el.classList.contains("mtile")) sfx("move");
  else if(el.classList.contains("flashcard")) sfx("flip");
  else sfx("tap");
  if(navigator.vibrate) try{ navigator.vibrate(8); }catch(err){}
},true);

/* ---- answer feedback: one watcher covers practice, episodes, the boss
        rounds, the timed challenge and the game show ---- */
new MutationObserver(muts=>{
  let good=null,bad=false;
  muts.forEach(m=>{
    const el=m.target;
    if(!el||el.nodeType!==1||!el.classList) return;
    if(el.classList.contains("wrong")&&!el.dataset.fxw){ el.dataset.fxw="1"; bad=true; }
    else if(el.classList.contains("right")&&!el.dataset.fxr){ el.dataset.fxr="1"; good=good||el; }
  });
  if(bad){
    sfx("wrong");
    const v=document.getElementById("view");
    if(v&&!FX.reduce){ v.classList.remove("shake"); void v.offsetWidth; v.classList.add("shake"); }
  } else if(good){
    sfx("right");
    sparkle(good,"#4DE0B1",12);
  }
}).observe(document.body,{subtree:true,attributes:true,attributeFilter:["class"]});

/* ---- token counter: count up, with coins landing on it ---- */
let LAST_TOKENS=null;
const _paintBar=paintBar;
window.paintBar=function(){
  _paintBar();
  const el=document.getElementById("tokenCount");
  if(el){
    if(LAST_TOKENS!==null&&S.tokens>LAST_TOKENS){
      coinFly(Math.min(6,S.tokens-LAST_TOKENS));
      countTo(el,LAST_TOKENS,S.tokens,760);
    }
    LAST_TOKENS=S.tokens;
  }
};

/* ---- screen transitions on every new screen that is not a game ---- */
const _view=document.getElementById("view");
if(_view&&!FX.reduce){
  new MutationObserver(muts=>{
    if(!muts.some(m=>m.type==="childList"&&m.addedNodes.length)) return;
    if(_view.querySelector("canvas")) return;   /* games size and hit-test themselves */
    _view.classList.remove("vin"); void _view.offsetWidth; _view.classList.add("vin");
    /* progress bars sweep up from empty instead of appearing full */
    _view.querySelectorAll(".meter i").forEach(bar=>{
      const w=bar.style.width; if(!w||w==="0%") return;
      bar.style.width="0%";
      requestAnimationFrame(()=>requestAnimationFrame(()=>{ bar.style.width=w; }));
    });
  }).observe(_view,{childList:true});
}

/* ---- title screen: CRT boot, sweeping scanline, parallax ---- */
function titleFx(){
  const t=document.getElementById("title"); if(!t) return;
  paintMute();
  if(!FX.reduce){
    t.querySelectorAll(".crtboot,.crtline,.sweep").forEach(el=>el.remove());
    const boot=document.createElement("div"); boot.className="crtboot";
    const line=document.createElement("div"); line.className="crtline";
    const sweep=document.createElement("div"); sweep.className="sweep";
    t.appendChild(sweep); t.appendChild(boot); t.appendChild(line);
    setTimeout(()=>{ boot.remove(); line.remove(); },1100);
  }
  if(!t.dataset.px&&!FX.reduce){
    t.dataset.px="1";
    const move=(nx,ny)=>{
      const set=(sel,d,f)=>{ const el=t.querySelector(sel);
        if(el) el.style.transform=`translate3d(${nx*d}px,${ny*d*(f||.5)}px,0)`; };
      set("#titleCanvas",10); set("#titleArt",10); set(".top",-9,.7);
    };
    t.addEventListener("pointermove",e=>{
      const r=t.getBoundingClientRect();
      move((e.clientX-r.width/2)/r.width*2,(e.clientY-r.height/2)/r.height*2);
    });
    t.addEventListener("pointerleave",()=>move(0,0));
    window.addEventListener("deviceorientation",e=>{
      if(e.gamma==null) return;
      move(Math.max(-1,Math.min(1,e.gamma/24)),Math.max(-1,Math.min(1,((e.beta||0)-40)/30)));
    });
  }
}

fxBackdrop(); paintMute();

/* Browsers hold audio until the first gesture; warm it up on the way in. */
["pointerdown","keydown"].forEach(ev=>window.addEventListener(ev,function warm(){
