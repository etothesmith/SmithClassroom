/* ----------------------------------------------------------------------------
   SCENARIO CATEGORIES
   Every academic topic gets a companion category: "Supply" and "Supply
   Scenarios" are two separate picks, so a board can run both. A scenario clue
   never asks what a term means. It puts a situation in front of the student and
   asks which idea is at work, which is the harder half of knowing a term.

   Rather than a second hand-written bank, the scenarios are generated from the
   same vocabulary in three forms:
     SPOT    given the term, pick the situation that shows it
     NAME    given a situation, name the idea
     APPLIED the unit's own multiple-choice bank, which is already applied work
   Distractors are drawn from sibling terms in the same topic, so a wrong answer
   is always plausibly close rather than obviously silly.
   -------------------------------------------------------------------------- */
const SCEN = "__sc";
const isScen = t => typeof t === "string" && t.slice(-SCEN.length) === SCEN;
const scenBase = t => isScen(t) ? t.slice(0, -SCEN.length) : t;
/* Situation framings. {d} is the definition, lower-cased at the seam. */
const SCEN_FRAME = [
  {en:"In class you overhear this: “{d}”", es:"En clase escuchas esto: «{d}»"},
  {en:"A shop owner on Main Street describes it this way: “{d}”",
   es:"Un comerciante lo describe así: «{d}»"},
  {en:"The news anchor sums up the story: “{d}”",
   es:"El presentador resume la noticia: «{d}»"},
  {en:"Your cousin explains what happened to her: “{d}”",
   es:"Tu prima explica lo que le pasó: «{d}»"},
  {en:"A group chat argument boils down to this: “{d}”",
   es:"Una discusión del chat se reduce a esto: «{d}»"}
];
function scenSituation(v, i){
  const f = L(SCEN_FRAME[i % SCEN_FRAME.length]);
  const d = String(L(v.d)).trim();
  return f.replace("{d}", d.charAt(0).toLowerCase() + d.slice(1).replace(/\.$/, ""));
}
function scenarioCategory(unit, baseTopic, perCat){
  const es = S.lang === "es";
  const own = vocabByTopic(unit, baseTopic);
  const pool = own.length >= 4 ? own : vocabOf(unit);
  const clues = [], seen = new Set();
  const others = v => shuffled(pool.filter(o => L(o.w) !== L(v.w))).slice(0, 3);

  /* SPOT: the term is given, the four options are situations */
  shuffled(own).forEach((v, i) => {
    if (clues.length >= Math.ceil(perCat * 0.5)) return;
    const d = others(v); if (d.length < 3) return;
    const opts = shuffled([{t:scenSituation(v, i), ok:true}]
      .concat(d.map((o, k) => ({t:scenSituation(o, i + k + 1), ok:false}))));
    const q = (es ? "¿Cuál de estas situaciones muestra “" : "Which situation shows “")
      + L(v.w) + (es ? "”?" : "”?");
    if (seen.has(q)) return; seen.add(q);
    clues.push({q, c:opts.map(o => o.t), a:opts.findIndex(o => o.ok),
      why:L(v.w) + " — " + L(v.d)});
  });

  /* APPLIED: the unit's real bank */
  const u = findUnit(unit);
  shuffled((u && u.items || []).filter(i => i.type === "mcq")).forEach(it => {
    if (clues.length >= Math.ceil(perCat * 0.8)) return;
    const c = jeoClueFromItem(it);
    if (c && !seen.has(c.q)){ seen.add(c.q); clues.push(c); }
  });

  /* NAME: a situation is given, the four options are terms */
  shuffled(own).forEach((v, i) => {
    if (clues.length >= perCat) return;
    const d = others(v); if (d.length < 3) return;
    const opts = shuffled([{t:L(v.w), ok:true}].concat(d.map(o => ({t:L(o.w), ok:false}))));
    const q = scenSituation(v, i + 2) + (es ? " ¿Qué idea está en juego?"
                                            : " Which idea is at work?");
    if (seen.has(q)) return; seen.add(q);
    clues.push({q, c:opts.map(o => o.t), a:opts.findIndex(o => o.ok),
      why:L(v.w) + " — " + L(v.d)});
  });

  return {topic:baseTopic + SCEN, unit, label:topicLabel(baseTopic + SCEN),
          clues:clues.slice(0, perCat)};
}

/* Vocabulary for a unit, including anything a teacher added via a pack. */
function vocabOf(unitId){
  const built = VOCAB[unitId] || [];
  const u = findUnit(unitId);
  const extra = (u && u.vocab) || [];
  return built.concat(extra);
}
/* Distinct topics in a unit, in the order they first appear. */
function topicsOf(unitId){
  const out = [];
  vocabOf(unitId).forEach(v => { if (out.indexOf(v.t) < 0) out.push(v.t); });
  return out;
}
/* Every topic across every unit, for the teacher's Jeopardy picker. */
function allTopics(){
  const out = [];
  allUnits().forEach(u => topicsOf(u.id).forEach(t => {
    if (out.some(x => x.t === t && x.unit === u.id)) return;
    const n = vocabOf(u.id).filter(v => v.t === t).length;
    out.push({t:t, unit:u.id, unitTitle:L(u.title), pack:L(u.pack.name), n:n});
    /* Every academic topic gets its scenario twin. scenarioCategory falls back
       to the whole unit for distractors, so a one-term topic still builds — the
       only unbuildable case is no terms and no applied bank at all. */
    const applied = ((u.items || []).filter(i => i.type === "mcq")).length;
    if (n + applied > 0)
      out.push({t:t + SCEN, unit:u.id, unitTitle:L(u.title), pack:L(u.pack.name),
                n:n, applied:applied, scen:true});
  }));
  /* the fun banks ride along as ordinary topics, so the picker, the board and
     the study list all handle them without special cases */
  if (typeof FUN_BANKS !== "undefined")
    FUN_BANKS.forEach(b => out.push({t:b.id, unit:"fun", unitTitle:L(b.blurb),
                                     pack:L(FUN_PACK_NAME), n:b.rows.length}));
  return out;
}
function vocabByTopic(unitId, topic){
  return vocabOf(unitId).filter(v => v.t === scenBase(topic));
}

/* ============================================================================
   SOLO GAME SHOW  —  the Jeopardy board, one student, no teacher
   ----------------------------------------------------------------------------
   The classroom game show needs the teacher running it. This is the same board
   and the same generated clues, sized for one student revising alone: five
   values in one category column per topic, pick any clue, answer, keep score.
   No buzzers, no wagers, no rounds — just the part that revises.
   ========================================================================== */
let SOLO = null;

function startSolo(unitId){
  const u = findUnit(unitId); if (!u) return go("study");
  const topics = topicsOf(unitId);
  if (!topics.length){ toast(T_.noVocab); return viewReviewHub(unitId); }
  const cats = topics.slice(0,5).map(t => buildCategory({t:t, unit:unitId}, 5));
  cats.forEach(c => c.clues.forEach((cl,i)=>{ cl.value = 100*(i+1); cl.used = false; }));
  SOLO = {unitId, cats, score:0, left:cats.length*5, cur:null, picked:null, revealed:false};
  drawSolo();
}
function drawSolo(){
  const S2 = SOLO;
  if (!S2) return;
  if (S2.cur) return drawSoloClue();
  if (S2.left <= 0) return endSolo();
  V().innerHTML = `
  <div class="eprow">
    <button class="btn ghost" style="padding:8px 12px;min-height:0"
      onclick="SOLO=null;viewReviewHub('${S2.unitId}')">← ${T_.exit}</button>
    <span style="flex:1"></span>
    <span class="chip">${S2.left} ${T_.cluesLeft}</span>
    <span class="chip ${S2.score<0?'bad':'on'}">${T_.yourScore} $${S2.score}</span>
  </div>
  <p class="muted" style="margin:0 0 10px">${T_.pickAClue}</p>
  <div class="jeoboard">
    ${S2.cats.map((c,ci)=>`
      <div class="jeocol">
        <div class="jeocat">${esc(c.label)}</div>
        ${c.clues.map((cl,ri)=>`
          <button class="jeocell ${cl.used?'used':''}" ${cl.used?'disabled':''}
            onclick="soloOpen(${ci},${ri})">${cl.used?"":"$"+cl.value}</button>`).join("")}
      </div>`).join("")}
  </div>`;
  window.scrollTo(0,0);
}
function soloOpen(ci,ri){
  const cl = SOLO.cats[ci].clues[ri];
  if (cl.used) return;
  SOLO.cur = {ci,ri,clue:cl}; SOLO.picked = null; SOLO.revealed = false;
  drawSolo();
}
function drawSoloClue(){
  const S2 = SOLO, cl = S2.cur.clue, cat = S2.cats[S2.cur.ci];
  V().innerHTML = `
  <div class="eprow">
    <span class="chip">${esc(cat.label)}</span>
    <span style="flex:1"></span>
    <span class="chip warn">$${cl.value}</span>
    <span class="chip ${S2.score<0?'bad':'on'}">$${S2.score}</span>
  </div>
  <section class="panel raised jeoclue">
    <p class="jeoq">${esc(cl.q)}</p>
    <div class="jeoopts" id="sopts">
      ${cl.c.map((t,i)=>`<button class="jeoopt ${S2.revealed?(i===cl.a?'right':(S2.picked===i?'wrong':'')):''}"
        ${S2.revealed?'disabled':''} onclick="soloPick(${i})">
        <span class="jeoletter">${"ABCD"[i]}</span>${esc(t)}</button>`).join("")}
    </div>
    ${S2.revealed?`<div class="jeostatus">
      <span class="jeoverdict ${S2.picked===cl.a?'ok':'no'}">
        ${S2.picked===cl.a?"+$"+cl.value:"−$"+cl.value}</span></div>`:""}
  </section>
  ${S2.revealed?`<section class="panel jeowhy">
    <div class="eyebrow">${T_.whyThat}</div>
    <p>${esc(cl.why)}</p>
    <button class="btn primary wide" style="margin-top:12px" onclick="soloBack()">${T_.board}</button>
  </section>`:""}`;
  window.scrollTo(0,0);
}
function soloPick(i){
  const S2 = SOLO;
  if (S2.revealed) return;
  S2.picked = i; S2.revealed = true;
  const cl = S2.cur.clue;
  S2.score += (i === cl.a) ? cl.value : -cl.value;
  cl.used = true; S2.left--;
  drawSolo();
}
function soloBack(){ SOLO.cur = null; drawSolo(); }
function endSolo(){
  const S2 = SOLO, unitId = S2.unitId, score = S2.score;
  revAward(unitId, "solo", Math.max(0, score));
  V().innerHTML = `<section class="panel raised" style="text-align:center;margin-top:20px">
    <div class="eyebrow">${T_.soloDone}</div>
    <h1 class="big" style="color:${score>0?'var(--crt)':'var(--hot)'}">$${score}</h1>
    <button class="btn primary wide" style="margin-top:14px" onclick="startSolo('${unitId}')">${T_.again}</button>
    <button class="btn ghost wide" style="margin-top:8px" onclick="SOLO=null;viewReviewHub('${unitId}')">${T_.back}</button>
  </section>`;
  askReviewCert(unitId, T_.jeoSolo, score);
}

/* ============================================================================
   CERTIFICATE OF REVIEW
   ----------------------------------------------------------------------------
   Offered after any completed review activity rather than issued silently. The
   ask is a prompt because a certificate a student chose to make is worth more
   to them than one that appeared on its own — and because a teacher collecting
   these wants the ones the student meant to submit.
   ========================================================================== */
function askReviewCert(unitId, activity, score){
  const box = document.getElementById("certAsk");
  if (!box) return;
  /* Stash the arguments instead of interpolating them into the onclick. Activity
     labels are display strings — "Smith's Challenge", "Scarcity & Choice" — and
     an apostrophe or a quote in one terminated the attribute early, which left
     the Yes button dead and no certificate reachable. */
  CERT_PENDING = {unitId:unitId, activity:String(activity), score:score|0};
  box.classList.remove("hidden");
  box.innerHTML = `
    <div class="certask">
      <div class="certaskart">${smitTag(spriteSetFor(findUnit(unitId)),"boss_star")}</div>
      <div class="certaskbody">
        <div class="eyebrow">${T_.reviewCert}</div>
        <p style="margin:6px 0 12px">${T_.reviewCertAsk}</p>
        <button class="btn primary wide" onclick="makeReviewCertPending()">
          ${T_.reviewCertYes}</button>
        <button class="btn ghost wide" style="margin-top:8px"
          onclick="document.getElementById('certAsk').classList.add('hidden')">${T_.reviewCertNo}</button>
      </div>
    </div>`;
}
let CERT_PENDING = null;
function makeReviewCertPending(){
  const p = CERT_PENDING;
  if (!p) return document.getElementById("certAsk").classList.add("hidden");
  makeReviewCert(p.unitId, p.activity, p.score);
}
function makeReviewCert(unitId, activity, score){
  const u = findUnit(unitId);
  document.getElementById("certAsk").classList.add("hidden");
  const rec = {
    code: certCode(S.name||"student", unitId+"-review-"+activity, score),
    name: S.name||"Student", unit: L(u.title), course: L(u.pack.name),
    score: Math.max(0,Math.min(100,score)), date: today(), kind:"review", activity: activity
  };
  if (!S.certs.some(c=>c.code===rec.code)){ S.certs.push(rec); save(); certCoin(); }
  else save();
  drawCert(rec, false);
}

/* ============================================================================
   TEST REVIEW ARCADE  —  four ways to revise the same vocabulary
   ----------------------------------------------------------------------------
   Reading a term list once does very little. Recalling it under three different
   demands does a lot, so the same vocabulary is presented as flashcards (free
   recall), a matching grid (recognition under time), and a shooter (recognition
   under pressure). Clearing all three plus the written test earns the
   certificate and five arcade tokens.

   Progress is per unit and per activity, so a student can do one at lunch and
   come back to the rest.
   ========================================================================== */
function revRec(uid){
  const r = studyRec(uid);
  if (!r.rev) r.rev = {cards:false, match:false, laser:false, best:{}};
  if (!r.rev.best) r.rev.best = {};
  return r.rev;
}
function revComplete(uid){
  const r = revRec(uid);
  return r.cards && r.match && r.laser && r.solo;
}
function revAward(uid, which, score){
  const r = revRec(uid);
  const first = !r[which];
  r[which] = true;
  if (score != null) r.best[which] = Math.max(r.best[which]||0, score);
  /* Tokens are paid once per activity per unit, so replaying is for practice
     rather than for farming the arcade. */
  if (first) award(40, 1);
  if (revComplete(uid) && !r.paid){
    r.paid = true;
    award(150, 5);
    toast("★ " + T_.reviewAllDone);
  }
  save();
}

/* ---------- hub ---------- */
function viewReviewHub(unitId){
  const u = findUnit(unitId); if (!u) return go("study");
  const r = revRec(unitId), voc = vocabOf(unitId);

      <button class="btn ghost wide" style="margin-top:8px" onclick="viewBrief('${unitId}')">${T_.back}</button>
    </section>`;

    <button class="panel revcard ${r[key]?'done':''}" onclick="${fn}">

        ${r.best[key]!=null?`<span class="chip">${T_.bestScore} ${r.best[key]}</span>`:""}</span>
      <span class="chip ${r[key]?'on':''}">${r[key]?"✓":"—"}</span>
    </button>`;
  V().innerHTML = `
  <button class="btn ghost" style="margin:14px 0" onclick="viewBrief('${unitId}')">← ${T_.back}</button>
  <section class="panel raised epstage">
    <div class="epart">${smitTag(set,"think")}</div>
    <div class="epbody">
      <div class="eyebrow">${T_.reviewArcade}</div>

      <p class="muted" style="margin:0 0 10px">${T_.reviewHubHelp}</p>
      <div class="row"><span class="chip">${voc.length} ${T_.terms}</span>
        <span class="chip">${topicsOf(unitId).length} ${T_.topics}</span></div>
    </div>
  </section>
  ${card("cards", T_.flashcards, T_.flashcardsDesc, `startCards('${unitId}')`, "▤")}
  ${card("match", T_.matchGame, T_.matchDesc,      `startMatch('${unitId}')`, "◫")}
  ${card("laser", T_.laserGame, T_.laserDesc,      `startLaser('${unitId}')`, "◎")}

  <section class="panel">

/* ---------- 1. flashcards ---------------------------------------------- */
let CARDS = null;
function startCards(unitId){
  const voc = shuffled(vocabOf(unitId));
  CARDS = {unitId, list:voc, i:0, flipped:false, got:0, missed:[]};
  drawCard();
}
function drawCard(){
  const C = CARDS, u = findUnit(C.unitId);
  if (C.i >= C.list.length){
    const cardScore = Math.round(C.got / C.list.length * 100);
    revAward(C.unitId, "cards", cardScore);
    V().innerHTML = `<section class="panel raised" style="text-align:center;margin-top:20px">
      <div class="eyebrow">${T_.flashcards}</div>
      <h1 class="big" style="color:var(--crt)">${C.got}/${C.list.length}</h1>
      <p class="muted">${T_.knewIt}</p>
      ${C.missed.length?`<div class="epworked" style="text-align:left">
        <div class="eyebrow">${T_.reviewThese}</div>
        ${C.missed.map(v=>`<p style="margin:6px 0"><b>${esc(L(v.w))}</b> — ${esc(L(v.d))}</p>`).join("")}
      </div>`:""}
      <button class="btn primary wide" style="margin-top:14px" onclick="startCards('${C.unitId}')">${T_.again}</button>
      <button class="btn ghost wide" style="margin-top:8px" onclick="viewReviewHub('${C.unitId}')">${T_.back}</button>
    </section>`;
    askReviewCert(C.unitId, T_.flashcards, cardScore);
    return;
  }
  const v = C.list[C.i];
  V().innerHTML = `
  <div class="eprow">
    <button class="btn ghost" style="padding:8px 12px;min-height:0" onclick="viewReviewHub('${C.unitId}')">← ${T_.exit}</button>
    <span style="flex:1"></span>
    <span class="chip">${C.i+1}/${C.list.length}</span>
    <span class="chip on">${C.got} ✓</span>
  </div>
  <div class="flashcard ${C.flipped?'flipped':''}" id="fcard" onclick="flipCard()">
    <div class="fcinner">
      <div class="fcface fcfront">
        <span class="eyebrow">${esc(topicLabel(v.t))}</span>
        <h2>${esc(L(v.w))}</h2>
        <small class="muted">${T_.tapToFlip}</small>
      </div>
      <div class="fcface fcback">
        <span class="eyebrow">${T_.definition}</span>
        <p>${esc(L(v.d))}</p>
      </div>
    </div>
  </div>
  <div class="row" id="fcMarks" style="margin-top:14px;gap:10px;${C.flipped?"":"display:none"}">
     <button class="btn wide" style="flex:1;color:var(--hot)" onclick="cardMark(false)">${T_.didntKnow}</button>
     <button class="btn primary" style="flex:1" onclick="cardMark(true)">${T_.knewIt}</button>
  </div>
  <button class="btn primary wide" id="fcFlip" style="margin-top:14px;${C.flipped?"display:none":""}" onclick="flipCard()">${T_.flip}</button>`;
  window.scrollTo(0,0);
}
/* The card used to re-render on every flip, which threw away the 3D transition
   half way through. Now the flip is a class toggle and the two control rows
   just trade places. */
function flipCard(){
  CARDS.flipped = !CARDS.flipped;
  const c = document.getElementById("fcard");
  if (!c) return drawCard();
  c.classList.toggle("flipped", CARDS.flipped);
  const m = document.getElementById("fcMarks"), f = document.getElementById("fcFlip");
  if (m) m.style.display = CARDS.flipped ? "" : "none";
  if (f) f.style.display = CARDS.flipped ? "none" : "";
}
function cardMark(knew){
  if (knew) CARDS.got++; else CARDS.missed.push(CARDS.list[CARDS.i]);
  CARDS.i++; CARDS.flipped = false; drawCard();
}

/* ---------- 2. matching grid ------------------------------------------- */
/* Six pairs at a time. Tap a term, tap its definition. A wrong pair flashes
   and costs time rather than ending the run, because the point is to keep
   trying until the mapping sticks. */
let MATCH = null;
function startMatch(unitId){
  const voc = shuffled(vocabOf(unitId)).slice(0, 6);
  const tiles = [];
  voc.forEach((v,i)=>{
    tiles.push({id:i, kind:"w", text:L(v.w), done:false});
    tiles.push({id:i, kind:"d", text:L(v.d), done:false});
  });
  MATCH = {unitId, voc, tiles:shuffled(tiles), sel:null, pairs:0, misses:0,
           t0:Date.now(), timer:null};
  drawMatch();
  clearInterval(MATCH.timer);
  MATCH.timer = setInterval(()=>{
    const el = document.getElementById("mClock");
    if (!el){ clearInterval(MATCH.timer); return; }
    el.textContent = fmtMin((Date.now()-MATCH.t0)/1000);
  }, 500);
}
function drawMatch(){
  const M = MATCH;
  V().innerHTML = `
  <div class="eprow">
    <button class="btn ghost" style="padding:8px 12px;min-height:0" onclick="endMatch(true)">← ${T_.exit}</button>
    <span style="flex:1"></span>
    <span class="chip">${M.pairs}/${M.voc.length}</span>
    <span class="chip ${M.misses?'bad':''}">${M.misses} ✗</span>
    <span class="chip" id="mClock">0:00</span>
  </div>
  <p class="muted" style="margin:0 0 10px">${T_.matchHelp}</p>
  <div class="matchgrid">
    ${M.tiles.map((t,i)=>`<button class="mtile ${t.done?'done':''} ${M.sel===i?'sel':''} ${t.kind==='w'?'term':''}"
      ${t.done?'disabled':''} onclick="matchTap(${i})">${esc(t.text)}</button>`).join("")}
  </div>`;
  window.scrollTo(0,0);
}
function matchTap(i){
  const M = MATCH, t = M.tiles[i];
  if (t.done) return;
  if (M.sel === null){ M.sel = i; return drawMatch(); }
  if (M.sel === i){ M.sel = null; return drawMatch(); }
  const a = M.tiles[M.sel];
  if (a.id === t.id && a.kind !== t.kind){
    a.done = t.done = true; M.pairs++; M.sel = null;
    if (M.pairs >= M.voc.length) return endMatch(false);
    return drawMatch();
  }
  M.misses++; M.sel = null;
  drawMatch();
  toast("✗");
}
function endMatch(bail){
  clearInterval(MATCH.timer);
  const M = MATCH;
  if (bail) return viewReviewHub(M.unitId);
  const secs = Math.round((Date.now()-M.t0)/1000);
  const score = Math.max(10, 300 - secs*2 - M.misses*15);
  revAward(M.unitId, "match", score);
  V().innerHTML = `<section class="panel raised" style="text-align:center;margin-top:20px">
    <div class="eyebrow">${T_.matchGame}</div>
    <h1 class="big" style="color:var(--crt)">${score}</h1>
    <p class="muted">${fmtMin(secs)} · ${M.misses} ${T_.misses}</p>
    <button class="btn primary wide" style="margin-top:14px" onclick="startMatch('${M.unitId}')">${T_.again}</button>
    <button class="btn ghost wide" style="margin-top:8px" onclick="viewReviewHub('${M.unitId}')">${T_.back}</button>
  </section>`;
  askReviewCert(M.unitId, T_.matchGame, Math.min(100, Math.round(score/3)));
}

/* ---------- 3. vocab laser ---------------------------------------------
   A definition sits at the top of the screen and candidate terms drift down.
   Shoot the right one before it reaches the floor. Wrong shots cost a life,
   so guessing is punished but hesitating is punished too — which is exactly
   the recall pressure a test applies.                                       */
function startLaser(unitId){
  const voc = vocabOf(unitId);
  if (voc.length < 4) { toast(T_.noVocab); return viewReviewHub(unitId); }
  V().innerHTML = `
  <div class="eprow">
    <button class="btn ghost" style="padding:8px 12px;min-height:0" onclick="stopGame();viewReviewHub('${unitId}')">← ${T_.exit}</button>
    <span style="flex:1"></span>
    <span class="chip" id="lHp">♥♥♥</span>
    <span class="chip warn" id="lSc">0</span>
    <span class="chip" id="lRound">1/${Math.min(10,voc.length)}</span>
  </div>
  <div class="stage"><canvas id="lcv" class="game" height="420"></canvas></div>
  <p class="muted" style="text-align:center;margin-top:8px">${T_.laserHelp}</p>`;
  const cv = document.getElementById("lcv");
  const rect = cv.getBoundingClientRect();
  cv.width = Math.min(760, Math.max(320, Math.round((rect.width||600))));
  cv.height = 420;
  runLaser(cv, unitId, voc);
  window.scrollTo(0,0);
}

function runLaser(cv, unitId, voc){
  const x = cv.getContext("2d"), W = cv.width, H = cv.height;
  const rounds = shuffled(voc).slice(0, Math.min(10, voc.length));
  const set = spriteSetFor(findUnit(unitId));
  const ship = spriteOf("idle");
  let ri = 0, hp = 3, score = 0, over = false;
  let targets = [], shots = [], bursts = [], shipX = W/2, msg = null, msgT = 0;

  function spawn(){
    const v = rounds[ri];
    const wrong = shuffled(voc.filter(o => L(o.w) !== L(v.w))).slice(0,3);
    const opts = shuffled([v].concat(wrong));
    targets = opts.map((o,i)=>({
      text:L(o.w), right:L(o.w)===L(v.w),
      x: (W/(opts.length+1))*(i+1), y: -30 - i*26,
      vy: 0.22 + ri*0.028, w: 0, alive:true
    }));
    document.getElementById("lRound").textContent = (ri+1)+"/"+rounds.length;
  }
  spawn();

  function fire(){
    if (over) return;
    shots.push({x:shipX, y:H-58, vy:-7});
  }
  const kd = e => {
    if (e.code==="ArrowLeft"||e.code==="KeyA"){ shipX-=26; e.preventDefault(); }
    if (e.code==="ArrowRight"||e.code==="KeyD"){ shipX+=26; e.preventDefault(); }
    if (e.code==="Space"){ fire(); e.preventDefault(); }
  };
  window.addEventListener("keydown", kd);
  const pt = e => {
    const t = e.touches ? e.touches[0] : e;
    const r = cv.getBoundingClientRect();
    shipX = (t.clientX - r.left) / r.width * W;
    e.preventDefault();
  };
  const tap = e => { pt(e); fire(); };
  cv.addEventListener("touchstart", tap, {passive:false});
  cv.addEventListener("touchmove", pt, {passive:false});
  cv.addEventListener("mousemove", pt);
  cv.addEventListener("click", tap);
  cleanupInput = () => {
    window.removeEventListener("keydown", kd);
    cv.removeEventListener("touchstart", tap);
    cv.removeEventListener("touchmove", pt);
    cv.removeEventListener("mousemove", pt);
    cv.removeEventListener("click", tap);
  };

  function nextRound(){
    ri++;
    if (ri >= rounds.length || hp <= 0){ finish(); return; }
    spawn();
  }
  function finish(){
    if (over) return;
    over = true; stopGame();
    revAward(unitId, "laser", score);
    V().innerHTML = `<section class="panel raised" style="text-align:center;margin-top:20px">
      <div class="eyebrow">${T_.laserGame}</div>
      <h1 class="big" style="color:${hp>0?'var(--crt)':'var(--hot)'}">${score}</h1>
      <p class="muted">${ri}/${rounds.length} ${T_.cleared}</p>
      <button class="btn primary wide" style="margin-top:14px" onclick="startLaser('${unitId}')">${T_.again}</button>
      <button class="btn ghost wide" style="margin-top:8px" onclick="viewReviewHub('${unitId}')">${T_.back}</button>
    </section>`;
    askReviewCert(unitId, T_.laserGame, Math.min(100, Math.round(score/12)));
  }

  startLoop(function(){
    if (over) return;
    shipX = Math.max(24, Math.min(W-24, shipX));
    if (msgT > 0) msgT--;

    targets.forEach(t => { if (t.alive) t.y += t.vy * 2.2; });
    shots.forEach(s => s.y += s.vy);
    shots = shots.filter(s => s.y > -10);
    bursts.forEach(b => b.life--);
    bursts = bursts.filter(b => b.life > 0);

    /* hit detection */
    for (const s of shots){
      for (const t of targets){
        if (!t.alive) continue;
        if (Math.abs(s.x - t.x) < Math.max(46, t.w/2) && Math.abs(s.y - t.y) < 20){
          t.alive = false; s.y = -999;
          bursts.push({x:t.x, y:t.y, life:22, ok:t.right});
          if (t.right){
            score += 100 + Math.max(0, 60 - Math.round(t.y/6));
            msg = T_.hit; msgT = 40;
            nextRound();
          } else {
            hp--; score = Math.max(0, score - 30);
            msg = T_.wrongTerm; msgT = 40;
            if (hp <= 0) return finish();
          }
          break;
        }
      }
    }
    /* the correct term escaping off the bottom costs a life */
    for (const t of targets){
      if (t.alive && t.y > H - 34){
        t.alive = false;
        if (t.right){ hp--; msg = T_.itGotPast; msgT = 40;
          if (hp <= 0) return finish();
          nextRound();
        }
      }
    }

    /* ---- draw ---- */
    const g = x.createLinearGradient(0,0,0,H);
    g.addColorStop(0,"#150F2B"); g.addColorStop(1,"#0B0F1F");
    x.fillStyle = g; x.fillRect(0,0,W,H);
    for (let i=0;i<30;i++){
      const sx = (i*97 % W), sy = ((i*53 + Date.now()/40) % H);
      x.fillStyle = "rgba(255,255,255,"+(0.05+(i%3)*0.04)+")";
      x.fillRect(sx, sy, 2, 2);
    }
    /* the definition banner */
    const v = rounds[Math.min(ri, rounds.length-1)];
    x.fillStyle = "rgba(11,15,31,.82)"; x.fillRect(0,0,W,66);
    x.strokeStyle = "#F2B441"; x.lineWidth = 2;
    x.beginPath(); x.moveTo(0,66); x.lineTo(W,66); x.stroke();
    x.fillStyle = "#F2B441"; x.font = "bold 11px 'Courier New',monospace"; x.textAlign = "center";
    x.fillText(T_.shootTheTerm.toUpperCase(), W/2, 18);
    x.fillStyle = "#EFEAFB"; x.font = "14px system-ui,sans-serif";
    wrapText(x, L(v.d), W/2, 36, W-40, 16);

    /* drifting terms */
    x.font = "bold 14px 'Trebuchet MS',sans-serif";
    for (const t of targets){
      if (!t.alive) continue;
      const m = x.measureText(t.text); t.w = m.width + 26;
      x.fillStyle = "rgba(37,28,68,.94)";
      roundRect(x, t.x - t.w/2, t.y - 15, t.w, 30, 8); x.fill();
      x.strokeStyle = "#4DE0B1"; x.lineWidth = 2; x.stroke();
      x.fillStyle = "#EFEAFB"; x.textAlign = "center";
      x.fillText(t.text, t.x, t.y + 5);
    }
    /* shots */
    x.strokeStyle = "#FF4D9D"; x.lineWidth = 3; x.lineCap = "round";
    for (const s of shots){ x.beginPath(); x.moveTo(s.x, s.y); x.lineTo(s.x, s.y+14); x.stroke(); }
    /* bursts */
    for (const b of bursts){
      x.globalAlpha = b.life/22;
      x.fillStyle = b.ok ? "#4DE0B1" : "#FF4D9D";
      x.beginPath(); x.arc(b.x, b.y, (22-b.life)*2.2, 0, 7); x.fill();
      x.globalAlpha = 1;
    }
    /* the shooter — Coach Smith on a turret */
    x.fillStyle = "#2F6BD8";
    roundRect(x, shipX-26, H-44, 52, 20, 6); x.fill();
    x.fillStyle = "#F2B441"; x.fillRect(shipX-4, H-58, 8, 16);
    if (drawable(ship)){
      const hh = 42, ww = ship.naturalWidth/ship.naturalHeight*hh;
      x.drawImage(ship, shipX-ww/2, H-44-hh, ww, hh);
    }
    if (msgT > 0){
      x.fillStyle = "#F2B441"; x.font = "bold 20px 'Trebuchet MS',sans-serif";
      x.textAlign = "center"; x.globalAlpha = Math.min(1, msgT/16);
      x.fillText(msg, W/2, H*0.62); x.globalAlpha = 1;
    }
    const hpEl = document.getElementById("lHp"), scEl = document.getElementById("lSc");
    if (hpEl) hpEl.textContent = "♥".repeat(Math.max(0,hp)) || "—";
    if (scEl) scEl.textContent = score;
  });
}

function wrapText(x, text, cx, cy, maxW, lh){
  const words = String(text).split(" ");
  let line = "", y = cy;
  for (const w of words){
    const test = line ? line + " " + w : w;
    if (x.measureText(test).width > maxW && line){
      x.fillText(line, cx, y); line = w; y += lh;
      if (y > cy + lh*1.2) break;
    } else line = test;
  }
  x.fillText(line, cx, y);
}
function roundRect(x, px, py, w, h, r){
  x.beginPath();
  x.moveTo(px+r, py); x.lineTo(px+w-r, py); x.quadraticCurveTo(px+w, py, px+w, py+r);
  x.lineTo(px+w, py+h-r); x.quadraticCurveTo(px+w, py+h, px+w-r, py+h);
  x.lineTo(px+r, py+h); x.quadraticCurveTo(px, py+h, px, py+h-r);
  x.lineTo(px, py+r); x.quadraticCurveTo(px, py, px+r, py); x.closePath();
}

/* ============================================================================
   SMITH'S CHALLENGE  —  the classroom game show
   ----------------------------------------------------------------------------
   A teacher-run board game for up to ten tables.

   ON THE QUESTION OF STUDENT LAPTOPS: a page served from GitHub Pages is a
   static file. There is no server, so two browsers cannot talk to each other
   and a phone in the back row genuinely cannot buzz this board. Rather than
   ship something that only works if you later stand up a server, buzz-in runs
   off the teacher's own keyboard: number keys 1-9 and 0 are wired to tables
   1-10, first key down wins the buzz and everything else locks out. A cheap USB
   numpad passed between tables, or ten students stood at the desk, gives you a
   real race with real lockout and nothing to configure. The teacher can also
   run in tap mode and simply click the table that shouted first.

   Structure follows the show: two full rounds with every table in, then a final
   where the top two wager. Values double in round two. Each round hides one
   Smith's Special, which lets the table that finds it wager before seeing the
   clue. Every clue is multiple choice with options shuffled per game, and every
   reveal shows why the answer is what it is — the explanation is the part that
   actually teaches, so it is not skippable.

const JEO_KEYS = ["Digit1","Digit2","Digit3","Digit4","Digit5",
                  "Digit6","Digit7","Digit8","Digit9","Digit0"];

/* ---------- clue generation --------------------------------------------
   Each selected topic becomes a category. Five clues are built per category,
   ramping in difficulty: definition-recognition first, then reverse recall,
   then real questions from the teacher's own bank. Everything is generated
   fresh each game and shuffled, so running the same unit twice is not a
   memory test of last week's board. */
function jeoClueFromVocab(v, pool, reverse){
  const wrong = shuffled(pool.filter(o => L(o.w) !== L(v.w))).slice(0,3);
  if (!reverse){
    const opts = shuffled([{t:L(v.w), ok:true}].concat(wrong.map(o=>({t:L(o.w), ok:false}))));
    return {q:L(v.d), c:opts.map(o=>o.t), a:opts.findIndex(o=>o.ok),
            why:L(v.w) + " — " + L(v.d)};
  }
  const opts = shuffled([{t:L(v.d), ok:true}].concat(wrong.map(o=>({t:L(o.d), ok:false}))));
  return {q:T_.whatDoesMean.replace("{}", L(v.w)), c:opts.map(o=>o.t),
          a:opts.findIndex(o=>o.ok), why:L(v.w) + " — " + L(v.d)};
}
function jeoClueFromItem(it){
  const ch = (it.c && (it.c[S.lang] || it.c.en)) || [];
  if (it.type !== "mcq" || ch.length < 2) return null;
  const tagged = ch.map((t,i)=>({t:t, ok:i===it.a}));
  const opts = shuffled(tagged);
  return {q:L(it.q), c:opts.map(o=>o.t), a:opts.findIndex(o=>o.ok), why:L(it.why)};
}

const funBank = id => FUN_BANKS.find(b => b.id === id);
/* Parse one compact row into the same clue shape buildCategory returns, with
   the options shuffled so the answer is not always A. */
function funClue(row){
  const es = S.lang === "es";
  const pick = s => { const p = String(s).split("|"); return (es && p[1]) ? p[1] : p[0]; };
  const opts = row[1].split(";").map((s,i) => ({t:pick(s), ok:i === row[2]}));
  const sh = shuffled(opts);
  return {q:pick(row[0]), c:sh.map(o=>o.t), a:sh.findIndex(o=>o.ok), why:pick(row[3])};
}
function funCategory(id, perCat){
  const b = funBank(id);
  const clues = shuffled(b.rows).slice(0, perCat).map(funClue);
  while (clues.length && clues.length < perCat) clues.push(funClue(shuffled(b.rows)[0]));
  return {topic:id, unit:"fun", label:topicLabel(id), clues};
}

function buildCategory(topicRef, perCat){
  if (topicRef.unit === "fun") return funCategory(topicRef.t, perCat);
  if (isScen(topicRef.t))
    return scenarioCategory(topicRef.unit, scenBase(topicRef.t), perCat);
  const voc = vocabByTopic(topicRef.unit, topicRef.t);
  const u = findUnit(topicRef.unit);
  const bank = shuffled((u && u.items || []).filter(i => i.type === "mcq"));
  const clues = [];
  const seen = new Set();
  /* definition -> term, easiest */
  for (const v of shuffled(voc)){
    if (clues.length >= Math.ceil(perCat/2)) break;
    const c = jeoClueFromVocab(v, voc.length >= 4 ? voc : vocabOf(topicRef.unit), false);
    if (c && !seen.has(c.q)){ seen.add(c.q); clues.push(c); }
  }
  /* real bank questions, harder */
  for (const it of bank){
    if (clues.length >= perCat) break;
    const c = jeoClueFromItem(it);
    if (c && !seen.has(c.q)){ seen.add(c.q); clues.push(c); }
  }
  /* term -> definition to fill any gap */
  for (const v of shuffled(voc)){
    if (clues.length >= perCat) break;
    const c = jeoClueFromVocab(v, voc.length >= 4 ? voc : vocabOf(topicRef.unit), true);
    if (c && !seen.has(c.q)){ seen.add(c.q); clues.push(c); }
  }
  while (clues.length < perCat && clues.length) clues.push(clues[clues.length % clues.length]);
  return {topic:topicRef.t, unit:topicRef.unit, label:topicLabel(topicRef.t), clues:clues.slice(0,perCat)};
}

/* ============================================================================
   SMARTBOARD MODE  +  WHO'S UP
   ----------------------------------------------------------------------------
   Two additions to the game show, both aimed at the same problem: on a
   smartboard there is one screen and one set of hands, so participation
   collapses onto whoever is loudest.

   BUZZERS ON THE BOARD
     Big touch targets, one per table, laid out across the bottom of the board.
     First tap wins and every other buzzer greys out. On a smartboard a runner
     from each table stands at the board; on a laptop the number keys still
     work, so both input methods are live at once.

   WHO'S UP
     You tell the app how many students sit at each table. When a table buzzes
     in, the app names the specific member who has to answer, chosen at random
     but constrained:
       - never the same person twice in a row at that table
       - nobody answers more than four times in a game
       - the pool refreshes to whoever is furthest below the average
     That last rule is what makes it work: a quiet student and a confident one
     end up with the same number of turns, and the table cannot volunteer its
     strongest member every time.

   Seats are numbered, not named. Typing thirty names into a smartboard before
   a game is a tax nobody pays twice, and "Table 3, seat 2, you're up" carries
   the same information across a classroom.
   ========================================================================== */

const WHOSUP_MAX = 4;     /* nobody answers more than this in one game */

function seatInit(team, size){
  team.size = Math.max(1, Math.min(8, size|0));
  team.turns = new Array(team.size).fill(0);
  team.lastSeat = -1;
}
/* Choose which member of a table has to answer. */
function pickSeat(team){
  if (!team.size) return null;
  const turns = team.turns || (team.turns = new Array(team.size).fill(0));
  let pool = [];
  for (let i = 0; i < team.size; i++){
    if (turns[i] >= WHOSUP_MAX) continue;      /* capped out for the game */
    if (i === team.lastSeat && team.size > 1) continue;  /* no back-to-back */
    pool.push(i);
  }
  /* everyone is capped or blocked: relax the cap before the no-repeat rule,
     because being told "you again" is better than the game refusing to run */
  if (!pool.length){
    for (let i = 0; i < team.size; i++) if (i !== team.lastSeat || team.size === 1) pool.push(i);
  }
  if (!pool.length) pool = [0];
  /* favour whoever has had the fewest turns so far */
  const min = Math.min.apply(null, pool.map(i => turns[i]));
  const fair = pool.filter(i => turns[i] === min);
  const seat = fair[Math.floor(Math.random() * fair.length)];
  return seat;
}
function commitSeat(team, seat){
  if (seat == null) return;
  team.turns[seat] = (team.turns[seat] || 0) + 1;
  team.lastSeat = seat;
}
/* Assign, for every table, the member who answers the next clue. Announced on
   the board so a table can get that student ready instead of being told after
   they buzz. Kept until it is used, then re-rolled for the next clue. */
function jeoAssignSeats(force){
  if (!JEO || !JEO.teams) return;
  JEO.teams.forEach(t => {
    if (!t.size) { t.upNext = null; return; }
    if (force || t.upNext == null) t.upNext = pickSeat(t);
  });
}
function seatBadge(t){
  return (JEO.whosUp && t.size && t.upNext != null)
    ? `<span class="seatbadge">#${t.upNext+1}</span>` : "";
}

/* How evenly has this table shared its turns? Used in the wrap-up. */
function seatSpread(team){
  if (!team.turns || !team.turns.length) return "";
  return team.turns.map((n,i)=>"#"+(i+1)+":"+n).join("  ");
}

/* ============================================================================
   STUDY FOR THE GAME SHOW  ·  open to everyone, no unlocking
   ----------------------------------------------------------------------------
   The teacher writes the category list on the board; students tick the same
   boxes here. Nothing is gated and nothing is posted from one device to
   another, so this works on thirty phones that have never met each other.

   The walkthrough deliberately does not go topic-by-topic. Cards are dealt
   round-robin across everything selected, so a student who studies "supply"
   and "elasticity" together gets them interleaved the way the board will mix
   them. Three card types, one idea each:

     RECALL  the definition first, the term hidden. You try to name it, then
             reveal. Retrieval beats re-reading, and a hint is one tap away
             (first letter and word count — enough to unstick, not enough to
             answer for you).
     CHECK   a real board-style question. The hint strikes out two wrong
             options, which is a genuine narrowing rather than a nudge.
     RECAP   every sixth card, a short list of what has gone by, because the
             reminder is the point of studying a blended set.

let PREP = null;
const prepSel = () => (S.prepSel || []).filter(x => x && x.t);
const prepHas = (unit, t) => prepSel().some(x => x.unit === unit && x.t === t);

  /* Repaint in place instead of re-rendering the view: a full render resets the
     scroll position, and ticking a box halfway down a long list should not send
     you back to the top. */
  const btn = document.getElementById("pt_" + unit + "_" + t);

    btn.classList.toggle("right", !on);

}
function prepPaintFoot(){

function prepSubject(i){

function prepUnitPick(k){ S.prepUnit = k; save(); sfx("tap"); viewShowPrep(); }
function prepSelectAllShown(){

    ? cur.filter(c => !shown.some(x => x.unit === c.unit && x.t === c.t))
    : cur.concat(shown.filter(x => !prepHas(x.unit, x.t)).map(x => ({unit:x.unit, t:x.t})));

/* Two levels, coarse first. Level one is the COURSE — the same four the nav
   uses — which keeps the filter to five buttons instead of one per unit. Unit

   longer ambiguous. */
function prepSubjects(){
  const out = [];

}

/* Deal the cards round-robin: two recalls then a check from each topic in turn,
   with a recap every sixth card. */
function prepStart(){
  const sel = prepSel();
  const lanes = sel.map(x => {
    /* scenario categories are all questions — the terms themselves live in the
       plain topic, so a student who picks both does not read them twice */
    const terms = (x.unit === "fun" || isScen(x.t)) ? [] : shuffled(vocabByTopic(x.unit, x.t));
    const cat = buildCategory({unit:x.unit, t:x.t}, isScen(x.t) ? 6 : 4);
    const q = [];
    let ti = 0, ci = 0;
    while (ti < terms.length || ci < cat.clues.length){
      for (let k = 0; k < 2 && ti < terms.length; k++)
        q.push({type:"recall", unit:x.unit, t:x.t, v:terms[ti++]});
      if (ci < cat.clues.length) q.push({type:"check", unit:x.unit, t:x.t, clue:cat.clues[ci++]});
    }
    return q;
  });
  const deck = [];
  for (let round = 0; lanes.some(l => l.length); round++)
    lanes.forEach(l => { if (l.length) deck.push(l.shift()); });
  const withRecaps = [];
  deck.forEach((c, i) => {
    withRecaps.push(c);
    if ((i + 1) % 6 === 0 && i + 1 < deck.length) withRecaps.push({type:"recap"});
  });
  PREP = {q:withRecaps, i:0, hint:false, shown:false, picked:null, cut:[], right:0, asked:0, seen:[]};
  TAB = "showprep"; drawPrep(); window.scrollTo(0,0);
}
function prepQuit(){ PREP = null; viewShowPrep(); window.scrollTo(0,0); }
function prepNext(){
  const p = PREP;
  p.i++; p.hint = false; p.shown = false; p.picked = null; p.cut = [];
  drawPrep(); window.scrollTo(0,0);
}
function prepReveal(){ PREP.shown = true; sfx("tap"); drawPrep(); }
function prepHint(){
  const p = PREP, c = p.q[p.i];
  p.hint = true;
  if (c.type === "check"){
    /* strike out two options that are not the answer */
    const wrong = shuffled(c.clue.c.map((_, i) => i).filter(i => i !== c.clue.a));
    p.cut = wrong.slice(0, Math.max(0, Math.min(2, c.clue.c.length - 2)));
  }
  sfx("tap"); drawPrep();
}
function prepPick(i){
  const p = PREP, c = p.q[p.i];
  if (p.picked !== null || p.cut.indexOf(i) >= 0) return;
  p.picked = i; p.asked++;
  const ok = i === c.clue.a;
  if (ok) p.right++;
  sfx(ok ? "right" : "wrong");
  drawPrep();
}
/* A recall hint that unsticks without answering: first letter and word count. */
function prepTermHint(w){
  const es = S.lang === "es";
  const words = String(w).trim().split(/\s+/);
  return (es ? "Empieza con " : "Starts with ") + `“${words[0][0]}” · ` +
    words.length + " " + (es ? (words.length === 1 ? "palabra" : "palabras")
                             : (words.length === 1 ? "word" : "words"));
}

function drawPrep(){
  const p = PREP, es = S.lang === "es";
  if (!p) return viewShowPrep();
  const c = p.q[p.i];
  const head = `
  <div class="eprow">
    <button class="btn ghost" style="padding:8px 12px;min-height:0" onclick="prepQuit()">← ${es?"Temas":"Topics"}</button>

function jeoBuildRound(){
  const perCat = 5;
  const cats = shuffled(JEO.topics).slice(0,5).map(t => buildCategory(t, perCat));
  const base = JEO.round === 1 ? 100 : 200;
  cats.forEach(c => c.clues.forEach((cl,i)=>{ cl.value = base*(i+1); cl.used = false; }));
  /* one hidden Smith's Special per round, never in the top row */
  /* A thin topic can yield fewer than perCat clues, so aim the special at a
     column that actually has a second row rather than trusting the grid. */
  const wide = cats.filter(c => c.clues.length > 1);
  if (wide.length){
    const col = wide[Math.floor(Math.random()*wide.length)];
    col.clues[1 + Math.floor(Math.random()*(col.clues.length-1))].special = true;
  }
  JEO.cats = cats;
  JEO.remaining = cats.reduce((n,c)=>n+c.clues.length, 0);
}

/* ---------- a clue ------------------------------------------------------ */
/* ----------------------------------------------------------------------------
   THE CLOCK
   A clue runs on four timed windows, and the clock is the drama:
     READ    3s  the clue is on screen, buzzers dead — long enough to read it,
                 short enough that nobody starts conferring
     BUZZ   20s  first table to buzz takes it
     ANSWER  3s  the table that buzzed answers. Buzz in and you had better know
                 it — three seconds is the whole point of the format
     STEAL  10s  anyone else can take it; after that the clue is gone
   One interval drives all four. Ticks get louder in the last five seconds and
   the phase transition sounds are how the room knows what changed without
   anyone having to say it.
   -------------------------------------------------------------------------- */
const JEO_T = {read:3, buzz:20, answer:3, steal:10};
function jeoStopClock(){ if (JEO && JEO.clock){ clearInterval(JEO.clock); JEO.clock = null; } }
function jeoSetPhase(name, secs){
  const C = JEO.cur; if (!C) return;
  jeoStopClock();
  C.phase = name; C.tLeft = secs; C.tMax = secs;
  sfx(name === "read" ? "jeoRead" : name === "buzz" ? "jeoOpen"
      : name === "steal" ? "jeoSteal" : "jeoBuzzIn");
  jeoPaintClock();
  JEO.clock = setInterval(() => {
    const c = JEO.cur;
    if (!c || JEO.stage !== "clue"){ jeoStopClock(); return; }
    c.tLeft--;
    if (c.tLeft > 0 && c.tLeft <= 5) sfx(c.tLeft <= 3 ? "jeoTickHot" : "jeoTick");
    jeoPaintClock();
    if (c.tLeft <= 0){ jeoStopClock(); jeoPhaseEnd(); }
  }, 1000);
}
function jeoPhaseLabel(){
  const C = JEO.cur, es = S.lang === "es";
  if (!C || !C.phase) return "";
  if (C.phase === "read")   return es ? "Lean la pregunta" : "Read the question";
  if (C.phase === "buzz")   return es ? "¡Buzzers abiertos!" : "Buzzers open!";
  if (C.phase === "steal")  return es ? "Robo abierto — cualquier otra mesa" : "Steal open — any other table";
  const t = C.buzzed != null && JEO.teams[C.buzzed];
  return (es ? "Responde " : "Answering: ") + (t ? t.name : "");
}
function jeoPaintClock(){
  const C = JEO.cur; if (!C) return;
  const n = document.getElementById("jclockN");
  const bar = document.getElementById("jclockBar");
  const lbl = document.getElementById("jclockLbl");
  const wrap = document.getElementById("jclock");
  if (n) n.textContent = Math.max(0, C.tLeft);
  if (lbl) lbl.textContent = jeoPhaseLabel();
  if (bar) bar.style.width = Math.max(0, (C.tLeft / (C.tMax || 1)) * 100) + "%";
  const hot = C.tLeft <= 5;
  const col = C.phase === "steal" ? "var(--hot)" : hot ? "#FF5C7A" : "var(--gold)";
  if (bar) bar.style.background = col;
  if (n){ n.style.color = col; n.style.transform = hot ? "scale(1.12)" : "none"; }
  if (wrap) wrap.style.borderColor = hot ? col : "var(--line)";
}
function jeoPhaseEnd(){
  const C = JEO.cur; if (!C || C.revealed) return;
  if (C.phase === "read"){ jeoSetPhase("buzz", JEO_T.buzz); return viewGameShow(); }
  if (C.phase === "buzz") return jeoOutTheWindow(true);
  if (C.phase === "answer"){
    /* ran the clock out: the buzzing table drops the value and the clue
       stays live for one steal */
    const team = JEO.teams[C.buzzed];
    if (team){ team.score -= (C.wager != null ? C.wager : C.clue.value); }
    toast("⏱ " + (S.lang === "es" ? "Se acabó el tiempo" : "Out of time"));
    return jeoOpenSteal();
  }
  if (C.phase === "steal") return jeoOutTheWindow(false);
}
/* Hand the clue to the rest of the room for one 10-second window. */
function jeoOpenSteal(){
  const C = JEO.cur; if (!C || C.dead) return;
  if (C.buzzed != null) JEO.teams[C.buzzed].lock = true;
  C.stolen = true; C.buzzed = null; C.picked = null; C.counting = false; C.seat = null;
  if (!JEO.teams.some(t => !t.lock)) return jeoOutTheWindow(false);
  jeoSetPhase("steal", JEO_T.steal);
  viewGameShow();
}
/* Nobody got it. Show the answer, score nothing, move the pick along. */
function jeoOutTheWindow(noBuzz){
  const C = JEO.cur; if (!C || C.dead) return;
  jeoStopClock();
  C.dead = true; C.noBuzz = !!noBuzz; C.revealed = true; C.counting = false; C.picked = null;
  C.clue.used = true; JEO.remaining--;
  JEO.teams.forEach(t => t.lock = false);
  const from = (C.lastTeam != null) ? C.lastTeam : JEO.control;
  jeoSetControl((from + 1) % JEO.teams.length, "passed");
  sfx("jeoDead");
  jeoUnbind();
  viewGameShow();
}
function jeoSkipRead(){
  const C = JEO.cur; if (!C || C.phase !== "read") return;
  jeoSetPhase("buzz", JEO_T.buzz); viewGameShow();
}
function jeoAddTime(n){
  const C = JEO.cur; if (!C || C.revealed || !C.phase) return;
  C.tLeft += n; C.tMax = Math.max(C.tMax, C.tLeft); jeoPaintClock();
}
function jeoClockHTML(){
  const C = JEO.cur;
  if (!C || C.revealed || !C.phase) return "";
  return `
  <div id="jclock" style="display:flex;align-items:center;gap:14px;border:2px solid var(--line);
    border-radius:14px;padding:10px 14px;margin:12px 0 0;background:rgba(0,0,0,.28)">
    <span id="jclockN" style="font-family:var(--mono);font-size:34px;font-weight:800;
      min-width:56px;text-align:center;color:var(--gold);transition:transform .15s ease">${C.tLeft}</span>
    <span style="flex:1">
      <span id="jclockLbl" style="display:block;font-size:13px;letter-spacing:.06em;
        text-transform:uppercase;color:var(--dim);margin-bottom:6px">${esc(jeoPhaseLabel())}</span>
      <span style="display:block;height:8px;border-radius:99px;background:rgba(255,255,255,.09)">
        <i id="jclockBar" style="display:block;height:100%;border-radius:99px;background:var(--gold);
          width:${(C.tLeft/(C.tMax||1))*100}%;transition:width .9s linear"></i></span>
    </span>
    <span style="display:flex;gap:6px">
      ${C.phase==="read"?`<button class="btn ghost" style="padding:6px 10px;min-height:0"
        onclick="jeoSkipRead()">${S.lang==="es"?"Abrir":"Open"}</button>`:""}
      <button class="btn ghost" style="padding:6px 10px;min-height:0" onclick="jeoAddTime(10)">+10s</button>
    </span>
  </div>`;
}

function jeoOpen(ci, ri){
  const cl = JEO.cats[ci].clues[ri];
  if (cl.used) return;
  jeoAssignSeats();
  JEO.cur = {ci, ri, clue:cl, buzzed:null, revealed:false, picked:null,
             wager:null, counting:false, wrongPicks:[], stolen:false,
             dead:false, lastTeam:null, phase:null, tLeft:0, tMax:1};
  JEO.stage = "clue";
  if (cl.special && !cl.wagerDone){ JEO.cur.needWager = true; }
  else jeoSetPhase("read", JEO_T.read);
  viewGameShow();
}
function jeoClue(){
  const C = JEO.cur, cl = C.clue, cat = JEO.cats[C.ci];

  /* Smith's Special: pick who found it, then let them wager first. */
  if (C.needWager && C.wager === null){
    V().innerHTML = `
    <section class="panel raised jeospecial">
      <div class="eyebrow">${T_.smithsSpecial}</div>

        ${JEO.teams.map(t=>`<button class="topicbtn" onclick="jeoSpecialTeam(${t.i})">
          <b>${esc(t.name)}</b><small>$${t.score}</small></button>`).join("")}
      </div>
    </section>`;
    return;
  }
  if (C.needWager && C.wager === null) return;

  const canWager = C.needWager && C.wagerTeam != null && C.wager === undefined;
  V().innerHTML = `
  <div class="eprow">
    <button class="btn ghost" style="padding:8px 12px;min-height:0" onclick="jeoBackToBoard()">← ${T_.board}</button>
    <span style="flex:1"></span>
    <span class="chip">${esc(cat.label)}</span>
    <span class="chip warn">$${C.wager != null ? C.wager : cl.value}</span>
  </div>
  <section class="panel raised jeoclue">
    ${cl.special?`<div class="eyebrow" style="color:var(--gold)">★ ${T_.smithsSpecial}</div>`:""}
    <p class="jeoq">${esc(cl.q)}</p>
    <div class="jeoopts" id="jopts">
      ${cl.c.map((t,i)=>`<button class="jeoopt ${C.revealed
          ?(i===cl.a?'right':((C.picked===i||C.wrongPicks.indexOf(i)>=0)?'wrong':''))
          :(C.wrongPicks.indexOf(i)>=0?'wrong':'')}"
        ${C.phase==="answer"&&!C.revealed&&C.wrongPicks.indexOf(i)<0?'':'disabled'} onclick="jeoPick(${i})">
        <span class="jeoletter">${"ABCD"[i]}</span>${esc(t)}</button>`).join("")}
    </div>
    <div id="jstatus" class="jeostatus">${jeoStatusHTML()}</div>
    ${jeoClockHTML()}
  </section>
  ${jeoWhosUpCard()}
  ${C.revealed?`<section class="panel jeowhy">
    ${C.dead?`<div class="eyebrow" style="color:var(--hot)">${S.lang==="es"
        ?(C.noBuzz?"Nadie pulso — se fue por la ventana":"Nadie la acerto — se fue por la ventana")
        :(C.noBuzz?"No buzz — out the window":"Nobody got it — out the window")}</div>`:""}
    <div class="eyebrow">${T_.whyThat}</div>
    <p>${esc(cl.why)}</p>
    <button class="btn primary wide" style="margin-top:12px" onclick="jeoBackToBoard()">${T_.board}</button>
  </section>`:`
  <section class="panel">
    <div class="eyebrow">${C.phase==="read"?(S.lang==="es"?"Buzzers bloqueados":"Buzzers locked")
      :C.buzzed===null?T_.tapYourBuzzer:T_.buzzedIn}</div>
    ${jeoBuzzerBar()}
    ${C.buzzed!==null?`<button class="btn ghost wide" style="margin-top:10px" onclick="jeoNoAnswer()">${T_.passIt}</button>`:""}
  </section>`}`;
  if ((JEO.buzz === "keys" || JEO.buzz === "board") && !C.revealed) jeoBind();
  jeoPaintClock();
  window.scrollTo(0,0);
}
function jeoStatusHTML(){
  const C = JEO.cur;
  const es = S.lang === "es";
  if (C.counting) return `<span class="jeocount" id="jcount">${T_.locking}</span>`;
  if (C.revealed){
    if (C.dead) return `<span class="jeoverdict no">${es?"Por la ventana":"Out the window"}</span>`;
    const ok = C.picked === C.clue.a;
    return `<span class="jeoverdict ${ok?'ok':'no'}">${ok?T_.correctMsg:T_.wrongMsg}</span>`;
  }
  if (C.phase === "read")
    return `<span class="muted">${es?"Lean. Los buzzers se abren cuando llegue a cero."
                                  :"Read it. Buzzers open when the clock hits zero."}</span>`;
  if (C.phase === "steal" && C.buzzed === null)
    return `<span class="jeobuzzed">${es?"Robo abierto — pulsa para quitarsela":"Steal open — buzz to take it"}</span>`;
  if (C.buzzed !== null)
    return `<span class="jeobuzzed">${esc(JEO.teams[C.buzzed].name)} — ${T_.yourAnswer}</span>`;
  return `<span class="muted">${JEO.buzz==='keys'?T_.pressYourKey:T_.tapWhoBuzzed}</span>`;
}
function jeoSpecialTeam(i){
  const C = JEO.cur;
  C.wagerTeam = i;
  const t = JEO.teams[i];
  const max = Math.max(1000, t.score);
  const raw = prompt(T_.wagerPrompt.replace("{}", t.name).replace("{max}", max), String(Math.min(500,max)));
  if (raw === null){ C.needWager = false; C.wager = null; return viewGameShow(); }
  let w = Math.abs(parseInt(raw,10) || 0);
  w = Math.max(0, Math.min(max, w));
  C.wager = w;
  C.buzzed = i;                       /* the finder answers it alone */
  C.lastTeam = i;
  JEO.teams.forEach(x => x.lock = x.i !== i);
  jeoSetPhase("answer", JEO_T.answer);
  viewGameShow();
}
function jeoBind(){
  jeoUnbind();
  JEO.keyHandler = e => {
    const C = JEO.cur;
    if (!C || C.revealed || C.buzzed !== null || C.counting) return;
    if (C.phase === "read") return;
    const idx = JEO_KEYS.indexOf(e.code);
    if (idx < 0 || idx >= JEO.teams.length) return;
    if (JEO.teams[idx].lock) return;
    e.preventDefault();
    jeoBuzz(idx);
  };
  window.addEventListener("keydown", JEO.keyHandler);
}
function jeoUnbind(){
  if (JEO && JEO.keyHandler){ window.removeEventListener("keydown", JEO.keyHandler); JEO.keyHandler = null; }
}
function jeoBuzz(i){
  const C = JEO.cur;
  if (!C || C.buzzed !== null || C.revealed) return;
  if (C.phase === "read") return;
  if (JEO.teams[i].lock) return;
  C.buzzed = i; C.lastTeam = i;
  /* name the specific student who has to answer */
  if (JEO.whosUp && JEO.teams[i].size > 0){
    const t = JEO.teams[i];
    C.seat = (t.upNext != null) ? t.upNext : pickSeat(t);
    commitSeat(t, C.seat);
    t.upNext = null;
  } else C.seat = null;
  jeoUnbind();
  jeoSetPhase("answer", JEO_T.answer);
  toast("🔔 " + JEO.teams[i].name + (C.seat!=null ? " · " + T_.seat + " " + (C.seat+1) : ""));
  viewGameShow();
}
/* Who picks the next clue. Right answer keeps the board, a miss moves it on. */
function jeoSetControl(i, why, from){
  JEO.control = i;
  jeoAssignSeats();
  const es = S.lang === "es";
  const name = JEO.teams[i] ? JEO.teams[i].name : "";
  if (why === "kept") toast("✓ " + (es ? name + " sigue eligiendo" : name + " picks again"));
  else toast("→ " + (es ? "Le toca a " + name : name + " picks next"));
}

/* The dramatic pause. Four seconds of the board holding its breath before the
   answer lights up, because the wait is most of the fun. */
function jeoPick(i){
  const C = JEO.cur;
  if (!C || C.revealed || C.counting) return;
  if (C.phase !== "answer") return;
  if (C.buzzed === null) return;
  jeoStopClock();
  C.picked = i;
  C.counting = true;
  /* lock the options visually and run the countdown */
  const opts = document.getElementById("jopts");
  if (opts) [...opts.children].forEach((el,j)=>{
    el.disabled = true;
    el.classList.toggle("sel", j === i);
  });
  let n = 4;
  const st = document.getElementById("jstatus");
  const tick = () => {
    if (st) st.innerHTML = `<span class="jeocount">${n}</span>`;
    if (n <= 0){ clearInterval(JEO.countTimer); jeoReveal(); return; }
    n--;
  };
  tick();
  clearInterval(JEO.countTimer);
  JEO.countTimer = setInterval(tick, 1000);
}
function jeoReveal(){
  const C = JEO.cur, cl = C.clue;
  jeoStopClock();
  const ok = C.picked === cl.a;
  const amount = C.wager != null ? C.wager : cl.value;
  const team = JEO.teams[C.buzzed];
  C.counting = false;
  if (team) team.score += ok ? amount : -amount;

  if (ok){
    C.revealed = true; cl.used = true; JEO.remaining--;
    JEO.teams.forEach(t => t.lock = false);
    /* Control of the board is the reward for being right: the table that
       answers correctly picks the next clue. */
    if (team) jeoSetControl(team.i, "kept", team);
    sfx("right"); jeoUnbind();
    return viewGameShow();
  }

  /* A miss does not end the clue. The wrong option stays struck out, the
     correct one stays hidden, and the rest of the room gets one steal. */
  sfx("wrong");
  C.wrongPicks.push(C.picked);
  const others = JEO.teams.filter(t => !t.lock && (!team || t.i !== team.i)).length;
  if (!C.stolen && C.wager == null && others > 0){
    C.picked = null;
    toast("✗ " + (S.lang === "es" ? "Fallo — robo abierto" : "Miss — steal is open"));
    return jeoOpenSteal();
  }
  /* the steal has already been spent, or there is nobody left to take it */
  jeoOutTheWindow(false);
}
function jeoNoAnswer(){
  const C = JEO.cur;
  if (!C || C.revealed) return;
  /* the buzzing table drops the value and the clue goes up for a steal */
  const team = JEO.teams[C.buzzed];
  if (team) team.score -= (C.wager != null ? C.wager : C.clue.value);
  if (C.stolen || C.wager != null) return jeoOutTheWindow(false);
  jeoOpenSteal();
}
function jeoBackToBoard(){
  const C = JEO.cur;
  if (C && !C.revealed && C.clue){ /* abandoned without answering: leave it open */ }
  clearInterval(JEO.countTimer);
  jeoStopClock();
  jeoUnbind();
  JEO.teams.forEach(t => t.lock = false);
  JEO.stage = "board"; JEO.cur = null;
  /* new clue, new runners: re-draw the names and lock the board until the room
     is back in position */
  JEO.runnersSet = false; jeoAssignSeats(true);
  viewGameShow();
}

/* ---------- the final --------------------------------------------------- */
function jeoBuildFinal(){
  const ranked = JEO.teams.slice().sort((a,b)=>b.score-a.score);
  JEO.finalists = ranked.slice(0,2).map(t=>t.i);
  const cat = buildCategory(shuffled(JEO.topics)[0], 3);

  JEO.wagers = {};

}

    </section>`;

      <p class="jeoq">${esc(cl.q)}</p>

      </div>

    </section>
    <section class="panel">

        <div class="eyebrow" style="margin-top:10px">${esc(t.name)} · ${T_.wagered} $${JEO.wagers[t.i]}</div>
        <div class="row" style="margin-top:6px">
          ${cl.c.map((_,i)=>`<button class="btn ${JEO.finalAnswers[t.i]===i?'primary':'ghost'}"
            onclick="JEO.finalAnswers[${t.i}]=${i};viewGameShow()">${"ABCD"[i]}</button>`).join("")}

function jeoLockWagers(){
  JEO.finalists.forEach(i=>{
    const t = JEO.teams[i];

function jeoRevealFinal(){
  const cl = JEO.finalClue;

/* ============================================================================
   STUDY RPG  —  "Smitty's Grill" (Economics) / "Smitty's Civil Grill" (Gov)
   ----------------------------------------------------------------------------
   Study mode used to be: here is a wall of notes, scroll to the end, wait out a
   clock. Nobody learns that way and nobody wants to. This replaces it with a
   playable episode per unit.

   An episode is a list of scenes. Scenes alternate deliberately:

       story  ->  read  ->  check  ->  interact  ->  decide  ->  boss

   so a student is never asked to read more than a short beat before doing
   something with it. Every reading beat is followed by a real question from the
   teacher's own bank, and every question the student misses inserts a reteach
   scene and re-asks the idea in a different form before moving on. The episode
   cannot be completed by clicking through: the boss round at the end pulls
   fresh questions and needs 3 of 4.

   Understanding is tracked as a live 0-100 number. It drives three things:
     - which questions come next (weakest ideas resurface)
     - whether a stretch scene appears (high understanding) or an extra
       reteach does (low)
     - the grade Smitty's boss gives at the end

   Everything is data-driven from the existing PACKS, so all 16 units work
   without anyone authoring 16 scripts. Units matching known topics also get a
   hand-built interactive widget (tradeoff, market, allocator).
   ========================================================================== */

/* Which sprite set an episode uses. Government units get the statesman art,
   everything else gets the chef art — the two sheets share a layout. */
function spriteSetFor(u){
  return (u.pack && u.pack.id === "us-gov") ? "gov" : "econ";
}
function smit(set, name){
  return (SMITTY_ART[set] && SMITTY_ART[set][name]) || "";
}
function smitTag(set, name, cls, style){
  const src = smit(set, name);
  if (!src) return "";
  return `<img src="${src}" alt="" class="${cls||"smit"}" ${style?`style="${style}"`:""}>`;
}

/* ---------------------------------------------------------------------------
   Episode framing. The narrative wrapper is per-course, not per-unit, so a new
   unit dropped in by the teacher still lands inside a story.
   ------------------------------------------------------------------------- */
const EPISODE_FRAME = {
  econ: {
    place:  {en:"Smitty's Grill",              es:"La parrilla de Smitty"},
    role:   {en:"You're running the shift.",   es:"Tú manejas el turno."},
    bossIn: {en:"The owner is on the floor and he wants answers.",
             es:"El dueño está en el local y quiere respuestas."},
    bossName:{en:"The Owner",                  es:"El dueño"},
    heroName:{en:"Smitty",                     es:"Smitty"}
  },
  gov: {
    place:  {en:"Town Hall",                   es:"El ayuntamiento"},
    role:   {en:"You're chairing the session.",es:"Tú presides la sesión."},
    bossIn: {en:"The commissioner wants this settled before the vote.",
             es:"El comisionado quiere resolverlo antes de la votación."},
    bossName:{en:"The Commissioner",           es:"El comisionado"},
    heroName:{en:"Smitty",                     es:"Smitty"}
