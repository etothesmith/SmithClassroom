};

/* ---------------------------------------------------------------------------
   Widget selection. A unit's title and notes decide which hands-on tool it
   gets. Keyword matching is crude but it is honest about what it knows: a unit
   that matches nothing gets the universal "Smitty's Call" decision scene rather
   than a widget that would misrepresent its content.
   ------------------------------------------------------------------------- */
/* Widget selection. A unit's title and notes decide which hands-on tool it
   gets. Order matters: the most specific topic wins, and a government unit is
   never handed a supply-and-demand simulator just because its notes happen to
   contain the word "market". Anything that does not match a tool honestly gets
   the decision scene instead, which is built from the unit's own hardest
   question and so always fits. A wrong widget teaches the wrong thing. */
const WIDGET_RULES = [
  {kind:"tradeoff", econOnly:true, any:["opportunity cost","production possibilities",
      "scarcity","comparative advantage","tradeoff","trade-off","specialization",
      "specialisation","ppc","costo de oportunidad","escasez","ventaja comparativa"]},
  {kind:"allocate", any:["fiscal","monetary","budget","taxes","tax ","spending",
      "federal reserve","financial literacy","appropriation","deficit","interest rate",
      "money supply","presupuesto","impuesto","gasto","politica fiscal","politica monetaria"]},
  {kind:"market",   econOnly:true, any:["supply","demand","elasticity","equilibrium",
      "monopoly","competition","market power","surplus","shortage",
      "oferta","demanda","elasticidad","equilibrio","competencia"]}
];
/* Scored rather than first-match. First-match let whichever rule happened to
   be listed earliest claim a unit: "Supply, Demand, Elasticity" was getting a
   tradeoff slider because its notes mention opportunity cost in passing. A hit
   in the title counts triple, since that is what the unit is actually about,
   and a unit that scores below the threshold gets the decision scene rather
   than a tool that would misrepresent it. */
function widgetFor(u){
  const isGov = (u.pack && u.pack.id === "us-gov");
  const title = (L2(u.title,"en") + " " + L2(u.title,"es")).toLowerCase();
  const body  = (L2(u.brief,"en") + " " + L2(u.brief,"es")).toLowerCase();
  let best = null, bestScore = 0;
  for (const r of WIDGET_RULES){
    if (r.econOnly && isGov) continue;
    let score = 0;
    for (const k of r.any){
      if (title.indexOf(k) >= 0) score += 3;
      if (body.indexOf(k)  >= 0) score += 1;
    }
    if (score > bestScore){ bestScore = score; best = r.kind; }
  }
  return bestScore >= 2 ? best : "call";
}

/* ---------------------------------------------------------------------------
   Episode builder. Produces the scene list for a unit.
   ------------------------------------------------------------------------- */
function buildEpisode(u, topic){
  const set   = spriteSetFor(u);
  const frame = EPISODE_FRAME[set];
  /* A topic episode reads one beat and drills one idea; a whole-unit episode
     still walks the full notes. Chunking is about how much is in play at once,
     not about showing less material overall. */
  const allParts = briefParts(u);
  const parts = topic ? allParts.slice(0, 1) : allParts;
  const scenes = [];

  const chunkName = topic ? topicLabel(topic) : L2(u.title,"en").replace(/^.*·\s*/,"");
  const rt0 = routeFor(u);
  scenes.push({t:"story", art:"hero", who:"hero",
    title:(u.pack&&u.pack.id==="us-gov")?frame.place:rt0.label,
    text:{en:frame.role.en+" Today's job: "+chunkName+
             ". Read it, use it, then answer to the boss.",
          es:frame.role.es+" El trabajo de hoy: "+chunkName+
             ". Léelo, aplícalo y responde al jefe."}});

  scenes.push({t:"story", art:"boss_order", who:"boss",
    title:frame.bossName,
    text:{en:frame.bossIn.en+" I don't want the textbook back at me. I want you to show me you can use it.",
          es:frame.bossIn.es+" No quiero que me repitas el libro. Quiero que demuestres que sabes usarlo."}});

  /* Sort the bank so the questions a student has never seen, or has missed,
     come up first. The same weighting the challenge uses. */
  const scoped = topic ? itemsForTopic(u.id, topic) : u.items;
  const pool = pickItems({items:scoped, id:u.id}, scoped.length).slice();
  let qi = 0;
  /* A topic opens on its own terms, so the vocabulary is in front of the
     student before the questions that use it. */
  if (topic){
    const terms = vocabByTopic(u.id, topic);
    if (terms.length) scenes.push({t:"terms", topic:topic, terms:terms, art:"think"});
  }
  const nextQ = () => pool.length ? pool[(qi++) % pool.length] : null;

  parts.forEach((txt, i) => {
    scenes.push({t:"read", idx:i, title:{en:"Shift notes "+(i+1)+"/"+parts.length,
                                         es:"Apuntes "+(i+1)+"/"+parts.length},
                 body:txt, art:(i%2)?"cook":"think"});
    const a = nextQ(), b = nextQ();
    if (a) scenes.push({t:"check", item:a, tag:"beat"+i});
    if (b && parts.length <= 2) scenes.push({t:"check", item:b, tag:"beat"+i+"b"});
  });

  scenes.push({t:"widget", kind:widgetFor(u), unitId:u.id, art:"solution"});
  if (topic) scenes.forEach(sc => sc.topic = topic);

  /* A decision scene built from a real question: the stem becomes the
     situation, the options become choices, and picking the distractor costs
     you standing with the boss rather than just showing a red X. */
  const dq = pool.find(it => it.type === "mcq") || null;
  if (dq) scenes.push({t:"decide", item:dq, art:"serve"});

  const bossQs = [];
  for (let i = 0; i < 4; i++){ const q = nextQ(); if (q) bossQs.push(q); }
  scenes.push({t:"boss", items:bossQs, art:"boss_inspect"});
  scenes.push({t:"wrap"});

  return {unitId:u.id, set:set, frame:frame, scenes:scenes};
}

/* ---------------------------------------------------------------------------
   Runtime state for one episode run.
   ------------------------------------------------------------------------- */
let EP = null;
function epRec(uid){
  const r = studyRec(uid);
  if (r.scene == null) r.scene = 0;
  if (r.und   == null) r.und   = 50;   /* understanding, 0-100 */
  if (r.rep   == null) r.rep   = 50;   /* standing with the boss */
  return r;
}
function epUnderstanding(){ return EP ? EP.und : 50; }

function startEpisode(unitId, restart, topic){
  const u = findUnit(unitId); if (!u) return go("study");
  /* first time through, let the student choose the world the examples live in */
  if (!S.route && !(u.pack && u.pack.id === "us-gov"))
    return viewRoutePicker(unitId, topic);
  const rec = epRec(unitId);
  const ep  = buildEpisode(u, topic);
  const tr  = topic ? topicRec(unitId, topic) : null;
  EP = {
    unit:u, set:ep.set, frame:ep.frame, scenes:ep.scenes, topic:topic||null,
    i: restart ? 0 : Math.min((tr ? tr.scene : rec.scene) || 0, ep.scenes.length - 1),
    und: tr ? tr.und : rec.und, rep: rec.rep,
    picked:null, checked:false, retry:false, streak:0,
    bossIdx:0, bossRight:0, widgetDone:false
  };
  if (restart){ if (tr) tr.scene = 0; else rec.scene = 0; save(); }
  studyStart(unitId, () => paintEpClock());
  drawScene();
}
function epSave(){
  if (!EP) return;
  const rec = epRec(EP.unit.id);
  rec.rep = EP.rep;
  if (EP.topic){
    const tr = topicRec(EP.unit.id, EP.topic);
    tr.scene = Math.max(tr.scene || 0, EP.i);
    tr.und = EP.und;
    if (EP.i >= EP.scenes.length - 1) tr.done = true;
    /* the unit's own flag follows its chunks */
    if (unitChunksComplete(EP.unit.id)) rec.done = true;
    /* unit understanding is the mean of the chunks actually attempted */
    const ts = topicsOf(EP.unit.id).map(t => topicRec(EP.unit.id, t))
                 .filter(r => r.scene > 0);
    if (ts.length) rec.und = ts.reduce((a,b)=>a+b.und,0)/ts.length;
  } else {
    rec.scene = Math.max(rec.scene || 0, EP.i);
    rec.und = EP.und;
    if (EP.i >= EP.scenes.length - 1) rec.done = true;
  }
  save();
}
function epAdvance(){
  EP.i++; EP.picked = null; EP.checked = false; EP.retry = false;
  /* Hard ceiling on episode length. Reteach scenes are inserted at runtime, so
     a bug in that logic could in principle grow the list forever. If the list
     ever gets implausibly long, jump to the wrap rather than trap the student
     in a lesson with no exit. */
  const cap = 60;
  if (EP.scenes.length > cap){
    EP.scenes = EP.scenes.slice(0, cap - 1).concat([{t:"wrap"}]);
    if (EP.i >= EP.scenes.length) EP.i = EP.scenes.length - 1;
  }
  epSave(); drawScene();
}

/* Understanding moves on evidence, not on clicks. A first-try correct answer
   is worth more than one after a reteach, and a miss costs more than a retry
   recovers — otherwise the number drifts upward no matter what happens. */
function epScore(correct, firstTry){
  if (correct){ EP.und = Math.min(100, EP.und + (firstTry ? 9 : 4)); EP.streak++; }
  else        { EP.und = Math.max(0,   EP.und - 11); EP.streak = 0; }
}

/* ---------------------------------------------------------------------------
   Shell: meters + sprite stage shared by every scene.
   ------------------------------------------------------------------------- */
function epShell(inner, art, opts){
  opts = opts || {};
  const u = EP.unit, pct = Math.round((EP.i / (EP.scenes.length - 1)) * 100);
  const rec = studyRec(u.id);
  const band = EP.und >= 75 ? "on" : EP.und >= 45 ? "warn" : "bad";
  return `
  <div class="eprow">
    <button class="btn ghost" style="padding:8px 12px;min-height:0" onclick="leaveEpisode()">← ${T_.exit}</button>
    <span style="flex:1"></span>
    <span class="chip ${band}">${T_.understanding} ${Math.round(EP.und)}%</span>
    <span class="chip" id="epClock">${fmtMin(rec.sec||0)}</span>
  </div>
  <div class="meter" style="margin-bottom:12px"><i style="width:${pct}%"></i></div>
  <section class="panel raised epstage">
    ${art ? `<div class="epart">${smitTag(EP.set, art)}</div>` : ""}
    <div class="epbody">${inner}</div>
  </section>`;
}
function paintEpClock(){
  const el = document.getElementById("epClock");
  if (el && EP) el.textContent = fmtMin(studyRec(EP.unit.id).sec || 0);
}
function leaveEpisode(){ epSave(); studyStop(); EP = null; go("study"); }

/* ---------------------------------------------------------------------------
   Scene renderers.
   ------------------------------------------------------------------------- */
function drawScene(){
  if (!EP) return go("study");
  const sc = EP.scenes[EP.i];
  if (!sc) return drawWrap();
  const fn = {story:drawStory, read:drawRead, check:drawCheck, reteach:drawReteach,
              widget:drawWidget, decide:drawDecide, boss:drawBoss, stretch:drawStretch,
              terms:drawTerms, wrap:drawWrap}[sc.t];
  (fn || drawWrap)(sc);
  window.scrollTo(0,0);
}

/* The vocabulary of a chunk, up front. Reading the terms before meeting them
   in a question is the difference between recall and a guess. */
function drawTerms(sc){
  V().innerHTML = epShell(`
    <div class="eyebrow">${T_.theTerms} · ${esc(topicLabel(sc.topic))}</div>
    <p class="muted" style="margin:6px 0 12px">${T_.termsHelp}</p>
    ${sc.terms.map(v=>`<div class="termrow">
      <b>${esc(L(v.w))}</b><span>${esc(L(v.d))}</span></div>`).join("")}
    <button class="btn primary wide" style="margin-top:14px" onclick="epAdvance()">${T_.gotIt} →</button>`,
    sc.art);
}

function drawStory(sc){
  V().innerHTML = epShell(`
    <div class="eyebrow">${esc(L(sc.title))}</div>
    <p class="epsay">${esc(L(sc.text))}</p>
    <button class="btn primary wide" style="margin-top:14px" onclick="epAdvance()">${T_.next} →</button>`,
    sc.art);
}

function drawRead(sc){
  V().innerHTML = epShell(`
    <div class="eyebrow">${esc(L(sc.title))}</div>
    <div class="epread" id="epRead">${esc(L(sc.body))}</div>
    <p class="muted" style="font-size:13px;margin:10px 0 0" id="epReadNote">${T_.scrollToEnd}</p>
    <button class="btn primary wide" style="margin-top:10px" id="epReadGo" disabled>${T_.gotIt}</button>`,
    sc.art);
  const box = document.getElementById("epRead"), btn = document.getElementById("epReadGo");
  const note = document.getElementById("epReadNote");
  const check = () => {
    const atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 12;
    const fits  = box.scrollHeight <= box.clientHeight + 12;
    if (atEnd || fits){ btn.disabled = false; note.textContent = T_.readyToApply; }
  };
  box.addEventListener("scroll", check); check();
  btn.onclick = () => epAdvance();
}

/* A check is a real bank item rendered inside the episode. Miss it and the
   next scene is a reteach, not the next topic. */
function drawCheck(sc){
  const it = sc.item;
  const body = questionBody(it);
  const isRetry = !!sc.retry;          /* carried by the scene, not the run */
  V().innerHTML = epShell(`
    <div class="eyebrow">${isRetry ? T_.tryAgainNow : T_.quickCheck}</div>
    <p class="qtext">${esc(L(it.q))}</p>
    ${body}
    <div id="fb"></div>
    <button class="btn primary wide" style="margin-top:14px" id="epGo">${T_.check}</button>`,
    isRetry ? "think" : (sc.art || "cook"));
  wireQuestion(it, ok => {
    /* score a scene once, however many times it gets drawn */
    const first = !sc.answered; sc.answered = true;
    if (first) epScore(ok, !isRetry);
    if (ok){
      document.getElementById("epGo").textContent = T_.next;
      document.getElementById("epGo").onclick = () => epAdvance();
    } else if (!isRetry){
      /* one reteach per idea, and only ever one */
      document.getElementById("epGo").textContent = T_.showMe;
      document.getElementById("epGo").onclick = () => {
        EP.scenes.splice(EP.i + 1, 0, {t:"reteach", item:it, src:sc});
        epAdvance();
      };
    } else {
      /* already had the reteach: explain and move on, never loop */
      document.getElementById("epGo").textContent = T_.moveOn;
      document.getElementById("epGo").onclick = () => epAdvance();
    }
  });
}

/* Reteach: name the idea, show the worked answer, then re-ask a variant. */
function drawReteach(sc){
  const it = sc.item;
  const alt = pickVariant(EP.unit, it);
  const rem = remFor(it, EP.unit);
  V().innerHTML = epShell(`
    <div class="eyebrow" style="color:var(--gold)">${T_.letsFix}</div>
    <div class="remstack">
      <div class="rembox r1"><span class="remlabel">${T_.remWrong}</span>
        <p>${esc(rem.whatWrong)}</p></div>
      <div class="rembox r2"><span class="remlabel">${T_.remPlain}</span>
        <p>${esc(rem.plain)}</p></div>
      <div class="rembox r3"><span class="remlabel">${T_.remCase}</span>
        <p>${esc(rem.example)}</p></div>
      <div class="rembox r4"><span class="remlabel">${T_.remAnswer}</span>
        <p>${rem.answer}</p></div>
    </div>
    <button class="btn primary wide" style="margin-top:14px" id="epGo">${alt ? T_.tryVariant : T_.moveOn}</button>`,
    "think");
  document.getElementById("epGo").onclick = () => {
    /* The retry flag lives on the scene we are about to insert. Putting it on
       EP was the bug: epAdvance() clears EP.retry, so the retry always looked
       like a first attempt and spawned another reteach. */
    if (alt && !sc.spent){
      sc.spent = true;
      EP.scenes.splice(EP.i + 1, 0, {t:"check", item:alt, tag:"retry", retry:true});
    }
    epAdvance();
  };
}
/* A variant is any other unseen item of the same type in the unit; failing
   that, the same item asked again after the explanation. */
function pickVariant(u, it){
  /* prefer a different question of the same type; fall back to the same one
     rather than skipping the retry entirely */
  const same = u.items.filter(x => x.id !== it.id && x.type === it.type);
  if (same.length) return same[Math.floor(Math.random() * same.length)];
  const any = u.items.filter(x => x.id !== it.id);
  if (any.length) return any[Math.floor(Math.random() * any.length)];
  return it;
}

/* Decision scene: the same content as an MCQ, framed as a call Smitty has to
   make on the floor, with the boss reacting to it. */
function drawDecide(sc){
  const it = sc.item;
  const ch = (it.c && (it.c[S.lang] || it.c.en)) || [];
  V().innerHTML = epShell(`
    <div class="eyebrow">${T_.smittysCall}</div>
    <p class="epsay">${esc(L(it.q))}</p>
    <p class="muted" style="font-size:13px;margin:0 0 10px">${T_.decideHelp}</p>
    <div id="opts">${ch.map((t,i)=>`<button class="opt" data-i="${i}">${esc(t)}</button>`).join("")}</div>
    <div id="fb"></div>
    <button class="btn primary wide" style="margin-top:14px" id="epGo" disabled>${T_.makeCall}</button>`,
    sc.art);
  const wrap = document.getElementById("opts"), go = document.getElementById("epGo");
  EP.checked = false;                 /* see wireQuestion: never inherit it */
  wrap.onclick = e => {
    const b = e.target.closest(".opt"); if (!b || EP.checked) return;
    EP.picked = +b.dataset.i;
    [...wrap.children].forEach(el => el.classList.toggle("sel", el === b));
    go.disabled = false;
  };
  go.onclick = () => {
    if (!EP.checked){
      EP.checked = true;
      const ok = EP.picked === it.a;
      epScore(ok, true);
      EP.rep = Math.max(0, Math.min(100, EP.rep + (ok ? 12 : -10)));
      [...wrap.children].forEach((el,i) => {
        el.disabled = true; el.classList.remove("sel");
        if (i === it.a) el.classList.add("right");
        else if (i === EP.picked) el.classList.add("wrong");
      });
      document.getElementById("fb").innerHTML = `
        <div class="why" style="border-color:${ok?'var(--crt)':'var(--hot)'}">
          <b>${ok ? T_.bossApproves : T_.bossNotSold}</b> ${esc(L(it.why))}</div>
        <div class="epreact">${smitTag(EP.set, ok ? "boss_star" : "boss_bad", "smitsm")}
          <span class="chip ${ok?'on':'bad'}">${T_.standing} ${Math.round(EP.rep)}%</span></div>`;
      go.textContent = T_.next;
      return;
    }
    epAdvance();
  };
}

/* ---------------------------------------------------------------------------
   Boss round: four fresh questions, no reteach, 3 of 4 to pass. This is the
   gate on finishing the episode.
   ------------------------------------------------------------------------- */
function drawBoss(sc){
  if (!sc.items.length) return epAdvance();
  if (EP.bossIdx >= sc.items.length){
    const need = Math.ceil(sc.items.length * 0.75);
    const passed = EP.bossRight >= need;
    EP.bossTries = EP.bossTries || 0;
    if (!passed) EP.bossTries++;
    const stuck = EP.bossTries >= 3;
    /* what did they actually miss? Retrying with fresh questions and no review
       teaches nothing — this is the part that has to change between attempts. */
    const missed = (EP.bossMiss || []);
    V().innerHTML = epShell(`
      <div class="eyebrow">${T_.bossVerdict}</div>
      <h2 class="big" style="color:${passed?'var(--crt)':'var(--hot)'};margin:6px 0">
        ${passed ? T_.bossPass : T_.bossFail}</h2>
      <p class="epsay">${EP.bossRight}/${sc.items.length} ${T_.correct}. ${
        passed ? T_.bossPassLine : T_.bossFailLine}</p>
      ${(!passed && missed.length) ? `<div class="epworked" style="text-align:left">
        <div class="eyebrow">${T_.bossMissed}</div>
        ${missed.map(m=>`<p style="margin:8px 0 0"><b>${esc(L(m.q))}</b><br>
          <span style="color:var(--crt)">${correctText(m)}</span><br>
          <span class="muted" style="font-size:13px">${esc(L(m.why))}</span></p>`).join("")}
      </div>` : ""}
      ${passed
        ? `<button class="btn primary wide" style="margin-top:14px" onclick="epAdvance()">${T_.next}</button>`
        : `<button class="btn primary wide" style="margin-top:14px" onclick="retryBoss()">${T_.retry}</button>
           ${stuck ? `<button class="btn ghost wide" style="margin-top:8px" onclick="bossGiveUp()">${T_.bossFinishAnyway}</button>
             <p class="muted" style="font-size:12px;margin-top:8px">${T_.bossFinishNote}</p>` : ""}`}`,
      passed ? "boss_star" : "boss_yell");
    return;
  }
  const it = sc.items[EP.bossIdx];
  V().innerHTML = epShell(`
    <div class="eyebrow">${T_.bossRound} ${EP.bossIdx+1}/${sc.items.length} · ${EP.bossRight} ✓</div>
    <p class="qtext">${esc(L(it.q))}</p>
    ${questionBody(it)}
    <div id="fb"></div>
    <button class="btn primary wide" style="margin-top:14px" id="epGo">${T_.check}</button>`,
    sc.art);
  wireQuestion(it, ok => {
    epScore(ok, true);
    if (ok) EP.bossRight++;
    else { EP.bossMiss = EP.bossMiss || []; if (!EP.bossMiss.some(m=>m.id===it.id)) EP.bossMiss.push(it); }
    document.getElementById("epGo").textContent = T_.next;
    document.getElementById("epGo").onclick = () => { EP.bossIdx++; epSave(); drawScene(); };
  });
}
function bossGiveUp(){
  /* Finish the topic without passing. Understanding is capped so the record
     shows this was not a clean pass, and the review arcade is where they go
     next — but the student is not trapped. */
  EP.und = Math.min(EP.und, 45);
  epAdvance();
}
function retryBoss(){
  const sc = EP.scenes[EP.i];
  EP.bossIdx = 0; EP.bossRight = 0; EP.bossMiss = [];
  /* fresh questions on a retry, so a second run is not a memory test */
  const pool = pickItems(EP.unit, EP.unit.items.length);
  sc.items = pool.slice(0, sc.items.length);
  drawScene();
}

function drawStretch(sc){ return epAdvance(); }

function drawWrap(){
  const u = EP.unit, rec = epRec(u.id);
  if (EP.topic){ topicRec(u.id, EP.topic).done = true;
                 if (unitChunksComplete(u.id)) rec.done = true; }
  else rec.done = true;
  save();
  if (EP.topic){
    const prog = unitTopicProgress(u.id);
    const ts = topicsOf(u.id);
    const nextT = ts.find(t => !topicDone(u.id, t));
    V().innerHTML = epShell(`
      <div class="eyebrow">${T_.chunkDone}</div>
      <h2 class="big" style="color:var(--crt);margin:6px 0 4px">${esc(topicLabel(EP.topic))}</h2>
      <p class="epsay">${EP.und>=80?T_.gradeA:EP.und>=60?T_.gradeB:T_.gradeC}</p>
      <div class="meter" style="margin:12px 0"><i style="width:${prog.pct}%"></i></div>
      <div class="row" style="margin-bottom:12px">
        <span class="chip on">${T_.understanding} ${Math.round(EP.und)}%</span>
        <span class="chip">${prog.done}/${prog.total} ${T_.topicsDone}</span>
      </div>
      ${nextT?`<button class="btn primary wide" onclick="startEpisode('${u.id}',true,'${nextT}')">
        ${T_.nextTopic}: ${esc(topicLabel(nextT))} →</button>`
        :`<button class="btn primary wide" onclick="viewReviewHub('${u.id}')">${T_.reviewArcade}</button>`}
      <button class="btn ghost wide" style="margin-top:8px" onclick="viewTopics('${u.id}')">${T_.allTopics}</button>`,
      "boss_star");
    setTimeout(()=>askReviewCert(u.id, topicLabel(EP.topic), Math.round(EP.und)), 400);
    return;
  }
  const grade = EP.und >= 80 ? T_.gradeA : EP.und >= 60 ? T_.gradeB : T_.gradeC;
  V().innerHTML = epShell(`
    <div class="eyebrow">${T_.shiftOver}</div>
    <h2 class="big" style="color:var(--crt);margin:6px 0 4px">${esc(L(u.title))}</h2>
    <p class="epsay">${grade}</p>
    <div class="row" style="margin:12px 0">
      <span class="chip on">${T_.understanding} ${Math.round(EP.und)}%</span>
      <span class="chip warn">${T_.standing} ${Math.round(EP.rep)}%</span>
      <span class="chip">${fmtMin(rec.sec||0)} ${T_.studyTime.toLowerCase()}</span>
    </div>
    ${studyUnlocked(u)
      ? `<button class="btn primary wide" onclick="viewReviewHub('${u.id}')">${T_.reviewArcade}</button>
         <button class="btn wide" style="margin-top:8px" onclick="startChallenge('${u.id}')">${T_.startChallenge}</button>`
      : `<p class="muted">${fmtMin(Math.max(0,studyNeed()-(rec.sec||0)))} ${T_.timeToGo}</p>`}
    <button class="btn ghost wide" style="margin-top:8px" onclick="startEpisode('${u.id}',true)">${T_.runAgain}</button>
    <button class="btn ghost wide" style="margin-top:8px" onclick="leaveEpisode()">${T_.back}</button>`,
    "boss_star");
}

/* ---------------------------------------------------------------------------
   Shared question rendering, so a check, a boss round and the old quiz all
   look and behave the same.
   ------------------------------------------------------------------------- */
function questionBody(it){
  if (it.type === "mcq" || it.type === "multi"){
    const ch = (it.c && (it.c[S.lang] || it.c.en)) || [];
    const b = ch.map((t,i)=>`<button class="opt" data-i="${i}">${esc(t)}</button>`).join("");
    /* the "select all" note sits OUTSIDE #opts: it used to be the first child,
       which put every later index one out of step when the answer was marked */
    return (it.type === "multi"
      ? `<div class="eyebrow" style="margin-bottom:6px">${T_.selectAll}</div>` : "")
      + `<div id="opts">${b}</div>`;
  }
  if (it.type === "numeric")
    return `<input id="ans" type="number" inputmode="decimal" step="any" placeholder="${T_.typeAnswer}">`;
  return `<textarea id="ans" style="min-height:90px;font-family:var(--body);font-size:15px" placeholder="${T_.typeAnswer}"></textarea>`;
}

/* Wires the answer controls and calls back with the verdict. Reuses the same
   grader the rest of the app uses, so typed answers get idea-level marking
   here too. */
function wireQuestion(it, onDone){
  const go = document.getElementById("epGo");
  if (!go) return;
  /* A question is only unanswerable because it has been answered. Anything that
     redraws an unanswered question (a language switch, a re-render, a scene
     replayed after a reteach) used to inherit a stale checked flag and the
     options went dead — the question looked frozen. Drawing clears it. */
  EP.checked = false;
  let picked = (it.type === "multi") ? [] : null;
  const wrap = document.getElementById("opts");
  if (wrap){
    wrap.onclick = e => {
      const b = e.target.closest(".opt"); if (!b || EP.checked) return;
      const i = +b.dataset.i;
      if (it.type === "multi"){
        const k = picked.indexOf(i);
        if (k < 0) picked.push(i); else picked.splice(k,1);
        b.classList.toggle("sel", k < 0);
      } else {
        picked = i;
        [...wrap.children].forEach(el => el.classList.toggle("sel", el === b));
      }
    };
  }
  go.onclick = () => {
    if (EP.checked) return;
    EP.checked = true;
    let ok = false, extra = "";
    if (it.type === "mcq") ok = picked === it.a;
    else if (it.type === "multi")
      ok = [...(picked||[])].sort().join(",") === [...it.a].sort().join(",");
    else if (it.type === "numeric"){
      const v = parseFloat((document.getElementById("ans")||{}).value);
      ok = isFinite(v) && Math.abs(v - it.a) <= (it.tol || 0);
    } else {
      const txt = ((document.getElementById("ans")||{}).value || "");
      const spec = specFor(it);
      if (!(spec.ideas||[]).length && !spec.number) ok = txt.trim().length > 0;
      else {
        const g = gradeText(txt, spec);
        ok = g.pass;
        extra = `<p style="margin:8px 0 0;font-size:14px">${esc(gradeFeedback(g, spec))}</p>`;
        if (g.found.length || g.missing.length)
          extra += `<div class="row" style="margin-top:8px">
            ${g.found.map(t=>`<span class="chip on">✓ ${esc(t)}</span>`).join("")}
            ${g.missing.map(t=>`<span class="chip bad">✗ ${esc(t)}</span>`).join("")}</div>`;
      }
    }
    /* record real progress, but never for a reteach retry of the same id */
    if (!it.synth){
      const p = S.prog[it.id] || {seen:0, right:0};
      p.seen++; if (ok) p.right = 1; p.last = today(); S.prog[it.id] = p;
      save();
    }
    if (wrap){
      const arr = (it.type === "multi") ? it.a : [it.a];
      [...wrap.querySelectorAll(".opt")].forEach((el,i)=>{
        el.disabled = true; el.classList.remove("sel");
        if (arr.includes(i)) el.classList.add("right");
        else if ((it.type==="multi" ? (picked||[]) : [picked]).includes(i)) el.classList.add("wrong");
      });
    }
    const ta = document.getElementById("ans"); if (ta) ta.disabled = true;
    document.getElementById("fb").innerHTML = `
      <div class="why" style="border-color:${ok?'var(--crt)':'var(--hot)'}">
        <b>${ok ? T_.correctMsg : T_.wrongMsg}.</b> ${esc(L(it.why))}${extra}</div>`;
    onDone(ok);
  };
}

/* ============================================================================
   STUDY WIDGETS  —  the "do something with it" scene
   ----------------------------------------------------------------------------
   Each widget is a small live model the student manipulates, with the number
   that matters recomputed as they move it. They are deliberately not graded on
   fiddling: the widget teaches, then asks one question that can only be
   answered by having actually used it.
   ========================================================================== */
/* ----------------------------------------------------------------------------
   Widget escape hatch.
   Each widget reveals its one question when the student has explored far enough
   to have seen the lesson. That gating was a trap: the question carries the
   scene's only Continue button, so a student who did not push the slider to the
   far end had no way out of the episode but Exit. Every widget now registers
   its reveal here, and a permanent "I'm ready" button plus a 25-second timer
   can always fire it. Exploration is still encouraged; it is no longer a lock.
   -------------------------------------------------------------------------- */
let W_ASK = null, W_TIMER = null;
function wRegisterAsk(fn){
  clearTimeout(W_TIMER);
  W_ASK = fn;
  W_TIMER = setTimeout(() => { if (W_ASK) wAskNow(); }, 25000);
}
function wAskNow(){
  const fn = W_ASK;
  W_ASK = null; clearTimeout(W_TIMER);
  const b = document.getElementById("wReady"); if (b) b.remove();
  if (fn) fn();
}
/* The always-available way forward, rendered under every widget. */
function wReadyBtn(){
  return `<button class="btn ghost wide" id="wReady" style="margin-top:12px"
    onclick="wAskNow()">${S.lang==="es"?"Listo — dame la pregunta":"I'm ready — give me the question"}</button>`;
}

function drawWidget(sc){
  W_ASK = null; clearTimeout(W_TIMER);
  const fn = {tradeoff:wTradeoff, market:wMarket, allocate:wAllocate, call:wCall}[sc.kind];
  (fn || wCall)(sc);
}

/* --- 1. Tradeoff / opportunity cost -------------------------------------
   Two goods, one set of resources. Drag the slider and watch what each unit
   of one good actually costs in the other. The bowed frontier is drawn live so
   the student can see the cost rising as they specialise — which is the whole
   point of a curved PPC and the thing a static picture never lands.        */
function wTradeoff(sc){
  const rt = routeFor(EP.unit);
  const goods = {a:rt.a, b:rt.b, unit:{en:"units",es:"unidades"}};
  const MAXA = 40, MAXB = 20;
  V().innerHTML = epShell(`
    <div class="eyebrow">${T_.handsOn}</div>
    <h3 style="margin:4px 0 8px">${T_.tradeoffTitle}</h3>
    <p class="muted" style="margin:0 0 12px">${T_.tradeoffHelp}</p>
    <canvas id="wCv" class="wcanvas" width="560" height="300"></canvas>
    <label for="wSl">${esc(L(goods.a))}: <b id="wA">20</b></label>
    <input id="wSl" type="range" min="0" max="${MAXA}" value="20" class="wslider">
    <div class="wreadout">
      <div><span class="eyebrow">${esc(L(goods.b))}</span><b id="wB">—</b></div>
      <div><span class="eyebrow">${T_.oppCostNext}</span><b id="wC" style="color:var(--gold)">—</b></div>
    </div>
    <div id="wQ" class="wquiz"></div>
    ${wReadyBtn()}`, sc.art);

  const cv = document.getElementById("wCv"), x = cv.getContext("2d");
  const sl = document.getElementById("wSl");
  /* bowed-out frontier: b = MAXB * sqrt(1 - (a/MAXA)^2) */
  const bOf = a => MAXB * Math.sqrt(Math.max(0, 1 - (a/MAXA)*(a/MAXA)));
  let asked = false;
  function ask(){
    if (asked) return;
    asked = true;
    const cheap = (bOf(1) - bOf(2)).toFixed(2), dear = (bOf(MAXA-1) - bOf(MAXA)).toFixed(2);
    document.getElementById("wQ").innerHTML = `
      <div class="eyebrow">${T_.oneQuestion}</div>
      <p class="qtext" style="font-size:16px">${T_.tradeoffQ}</p>
      <div id="opts">
        <button class="opt" data-i="0">${T_.tradeoffA0}</button>
        <button class="opt" data-i="1">${T_.tradeoffA1}</button>
        <button class="opt" data-i="2">${T_.tradeoffA2}</button>
      </div>
      <div id="fb"></div>
      <button class="btn primary wide" style="margin-top:12px" id="epGo">${T_.check}</button>`;
    wireSimple(1, `${T_.tradeoffWhy} ${cheap} → ${dear}.`);
  }
  wRegisterAsk(ask);

  function paint(){
    const a = +sl.value, b = bOf(a), bNext = bOf(Math.min(MAXA, a+1));
    const cost = b - bNext;
    document.getElementById("wA").textContent = a;
    document.getElementById("wB").textContent = b.toFixed(1);
    document.getElementById("wC").textContent = cost.toFixed(2) + " " + L(goods.b).toLowerCase();

    const W = cv.width, H = cv.height, P = 42;
    x.clearRect(0,0,W,H);
    x.fillStyle = "#0D0920"; x.fillRect(0,0,W,H);
    /* axes */
    x.strokeStyle = "rgba(255,255,255,.25)"; x.lineWidth = 2;
    x.beginPath(); x.moveTo(P,10); x.lineTo(P,H-P); x.lineTo(W-14,H-P); x.stroke();
    /* frontier */
    x.strokeStyle = "#4DE0B1"; x.lineWidth = 3; x.beginPath();
    for (let i=0;i<=MAXA;i++){
      const px = P + (i/MAXA)*(W-P-20), py = (H-P) - (bOf(i)/MAXB)*(H-P-20);
      i ? x.lineTo(px,py) : x.moveTo(px,py);
    }
    x.stroke();
    /* shade the attainable region */
    x.lineTo(P, H-P); x.closePath();
    x.fillStyle = "rgba(77,224,177,.10)"; x.fill();
    /* the chosen point */
    const px = P + (a/MAXA)*(W-P-20), py = (H-P) - (b/MAXB)*(H-P-20);
    x.strokeStyle = "rgba(242,180,65,.5)"; x.setLineDash([4,4]); x.lineWidth = 1;
    x.beginPath(); x.moveTo(P,py); x.lineTo(px,py); x.lineTo(px,H-P); x.stroke();
    x.setLineDash([]);
    x.fillStyle = "#F2B441"; x.beginPath(); x.arc(px,py,7,0,7); x.fill();
    /* the cost of the next unit, drawn as the drop it causes */
    const pyN = (H-P) - (bNext/MAXB)*(H-P-20);
    const pxN = P + (Math.min(MAXA,a+1)/MAXA)*(W-P-20);
    x.strokeStyle = "#FF4D9D"; x.lineWidth = 3;
    x.beginPath(); x.moveTo(px,py); x.lineTo(pxN,pyN); x.stroke();
    /* labels */
    x.fillStyle = "#9B92BE"; x.font = "12px 'Courier New',monospace";
    x.save(); x.translate(14,H/2); x.rotate(-Math.PI/2);
    x.textAlign="center"; x.fillText(L(goods.b).toUpperCase(),0,0); x.restore();
    x.textAlign="center"; x.fillText(L(goods.a).toUpperCase(), W/2, H-14);

    /* Once they've pushed near the specialised end, the lesson is visible and
       the question is worth asking. */
    if (!asked && a >= MAXA - 6) wAskNow();
  }
  sl.addEventListener("input", paint);
  paint();
}

/* --- 2. Market: price, surplus, shortage --------------------------------
   Move the price and watch quantity supplied and demanded separate. The gap is
   drawn as a bar so surplus and shortage are physical, not vocabulary.     */
function wMarket(sc){
  V().innerHTML = epShell(`
    <div class="eyebrow">${T_.handsOn}</div>
    <h3 style="margin:4px 0 8px">${T_.marketTitle}</h3>
    <p class="muted" style="margin:0 0 12px">${T_.marketHelp}</p>
    <canvas id="wCv" class="wcanvas" width="560" height="300"></canvas>
    <label for="wSl">${T_.price}: <b id="wP">$5</b></label>
    <input id="wSl" type="range" min="1" max="10" step="1" value="5" class="wslider">
    <div class="wreadout">
      <div><span class="eyebrow">${T_.qDemand}</span><b id="wD">—</b></div>
      <div><span class="eyebrow">${T_.qSupply}</span><b id="wS">—</b></div>
      <div><span class="eyebrow">${T_.state}</span><b id="wSt" style="color:var(--gold)">—</b></div>
    </div>
    <div id="wQ" class="wquiz"></div>
    ${wReadyBtn()}`, sc.art);

  const cv = document.getElementById("wCv"), x = cv.getContext("2d");
  const sl = document.getElementById("wSl");
  const dOf = p => Math.max(0, 60 - p*5);     /* demand falls with price */
  const sOf = p => Math.max(0, p*5 + 5);      /* supply rises with price */
  let sawSurplus = false, sawShortage = false, asked = false;
  function ask(){
    if (asked) return;
    asked = true;
    document.getElementById("wQ").innerHTML = `
      <div class="eyebrow">${T_.oneQuestion}</div>
      <p class="qtext" style="font-size:16px">${T_.marketQ}</p>
      <div id="opts">
        <button class="opt" data-i="0">${T_.marketA0}</button>
        <button class="opt" data-i="1">${T_.marketA1}</button>
        <button class="opt" data-i="2">${T_.marketA2}</button>
      </div>
      <div id="fb"></div>
      <button class="btn primary wide" style="margin-top:12px" id="epGo">${T_.check}</button>`;
    wireSimple(0, T_.marketWhy);
  }
  wRegisterAsk(ask);

  function paint(){
    const p = +sl.value, d = dOf(p), s = sOf(p), gap = s - d;
    document.getElementById("wP").textContent = "$" + p;
    document.getElementById("wD").textContent = d;
    document.getElementById("wS").textContent = s;
    const st = document.getElementById("wSt");
    if (Math.abs(gap) < 3){ st.textContent = T_.equilibrium; st.style.color = "var(--crt)"; }
    else if (gap > 0){ st.textContent = T_.surplus + " " + gap; st.style.color = "var(--gold)"; sawSurplus = true; }
    else { st.textContent = T_.shortage + " " + (-gap); st.style.color = "var(--hot)"; sawShortage = true; }

    const W = cv.width, H = cv.height, P = 44;
    x.fillStyle = "#0D0920"; x.fillRect(0,0,W,H);
    x.strokeStyle = "rgba(255,255,255,.25)"; x.lineWidth = 2;
    x.beginPath(); x.moveTo(P,10); x.lineTo(P,H-P); x.lineTo(W-14,H-P); x.stroke();
    const qx = q => P + (q/60)*(W-P-20);
    const py = pr => (H-P) - ((pr-1)/9)*(H-P-20);
    /* demand */
    x.strokeStyle = "#4DE0B1"; x.lineWidth = 3; x.beginPath();
    x.moveTo(qx(dOf(1)), py(1)); x.lineTo(qx(dOf(10)), py(10)); x.stroke();
    /* supply */
    x.strokeStyle = "#FF4D9D"; x.beginPath();
    x.moveTo(qx(sOf(1)), py(1)); x.lineTo(qx(sOf(10)), py(10)); x.stroke();
    /* the price line and the gap between the curves at that price */
    x.strokeStyle = "#F2B441"; x.setLineDash([5,5]); x.lineWidth = 2;
    x.beginPath(); x.moveTo(P, py(p)); x.lineTo(W-14, py(p)); x.stroke(); x.setLineDash([]);
    x.strokeStyle = gap>0 ? "#F2B441" : "#FF4D9D"; x.lineWidth = 9;
    x.beginPath(); x.moveTo(qx(d), py(p)); x.lineTo(qx(s), py(p)); x.stroke();
    x.fillStyle = "#EFEAFB"; x.font = "bold 12px 'Courier New',monospace"; x.textAlign="center";
    if (Math.abs(gap) >= 3)
      x.fillText((gap>0?T_.surplus:T_.shortage).toUpperCase(), (qx(d)+qx(s))/2, py(p)-14);
    x.fillStyle = "#9B92BE"; x.font = "12px 'Courier New',monospace";
    x.fillText(T_.quantity.toUpperCase(), W/2, H-14);
    x.save(); x.translate(14,H/2); x.rotate(-Math.PI/2);
    x.fillText(T_.price.toUpperCase(),0,0); x.restore();

    if (!asked && sawSurplus && sawShortage) wAskNow();
  }
  sl.addEventListener("input", paint);
  paint();
}

/* --- 3. Allocator: you only have 100 -------------------------------------
   Spend a fixed budget across competing priorities and watch the outcome bars
   respond. Every dial you raise takes from something else, which is the
   scarcity lesson applied to policy rather than to burgers.                */
function wAllocate(sc){
  const rt = routeFor(EP.unit);
  const cols = ["#FF4D9D","#4DE0B1","#F2B441","#9B7BE0"];
  const cats = rt.spend.map((n,i)=>({k:"c"+i, n:n, c:cols[i%cols.length]}));
  const vals = {}; cats.forEach(c => vals[c.k] = 25);

  V().innerHTML = epShell(`
    <div class="eyebrow">${T_.handsOn}</div>
    <h3 style="margin:4px 0 8px">${T_.allocTitle}</h3>
    <p class="muted" style="margin:0 0 12px">${T_.allocHelp}</p>
    <div class="wbudget"><span class="eyebrow">${T_.remaining}</span>
      <b id="wLeft" style="font-size:22px">0</b></div>
    ${cats.map(c=>`
      <label for="s_${c.k}" style="margin-top:10px">${esc(L(c.n))}: <b id="v_${c.k}">25</b></label>
      <input id="s_${c.k}" type="range" min="0" max="100" value="25" class="wslider" data-k="${c.k}">
      <div class="wbar"><i id="b_${c.k}" style="width:25%;background:${c.c}"></i></div>`).join("")}
    <div id="wOut" class="epworked" style="margin-top:14px"></div>
    <div id="wQ" class="wquiz"></div>
    ${wReadyBtn()}`, sc.art);

  let asked = false, everOver = false;
  function ask(){
    if (asked) return;
    asked = true;
    document.getElementById("wQ").innerHTML = `
      <div class="eyebrow">${T_.oneQuestion}</div>
      <p class="qtext" style="font-size:16px">${T_.allocQ}</p>
      <div id="opts">
        <button class="opt" data-i="0">${T_.allocA0}</button>
        <button class="opt" data-i="1">${T_.allocA1}</button>
        <button class="opt" data-i="2">${T_.allocA2}</button>
      </div>
      <div id="fb"></div>
      <button class="btn primary wide" style="margin-top:12px" id="epGo">${T_.check}</button>`;
    wireSimple(1, T_.allocWhy);
  }
  wRegisterAsk(ask);
  function paint(){
    let total = 0;
    cats.forEach(c => total += vals[c.k]);
    const left = 100 - total;
    const le = document.getElementById("wLeft");
    le.textContent = left;
    le.style.color = left === 0 ? "var(--crt)" : left < 0 ? "var(--hot)" : "var(--gold)";
    if (left < 0) everOver = true;
    cats.forEach(c => {
      document.getElementById("v_"+c.k).textContent = vals[c.k];
      document.getElementById("b_"+c.k).style.width = Math.min(100, vals[c.k]) + "%";
    });
    /* outcome text driven by the shape of the allocation, not a lookup table */
    const top = cats.slice().sort((a,b)=>vals[b.k]-vals[a.k])[0];
    const bot = cats.slice().sort((a,b)=>vals[a.k]-vals[b.k])[0];
    document.getElementById("wOut").innerHTML = `
      <div class="eyebrow">${T_.consequence}</div>
      <p style="margin:6px 0 0">${T_.allocTop} <b>${esc(L(top.n))}</b>.
      ${T_.allocBot} <b>${esc(L(bot.n))}</b>${vals[bot.k] < 10 ? " — " + T_.allocStarved : ""}.</p>`;

    if (!asked && left === 0 && everOver) wAskNow();
  }
  cats.forEach(c => {
    document.getElementById("s_"+c.k).addEventListener("input", e => {
      vals[e.target.dataset.k] = +e.target.value; paint();
    });
  });
  paint();
}

/* --- 4. Fallback: Smitty's call ------------------------------------------
   For units where no widget honestly fits, the interactive beat is a judgment
   call built from the unit's own hardest question. */
function wCall(sc){
  const u = EP.unit;
  const it = pickItems(u, u.items.length).find(q => (q.diff||1) >= 2) || u.items[0];
  if (!it) return epAdvance();
  EP.scenes[EP.i] = {t:"decide", item:it, art:"solution"};
  drawScene();
}

/* Wires a three-option widget question with a fixed key. */
function wireSimple(correct, why){
  const wrap = document.getElementById("opts"), go = document.getElementById("epGo");
  let picked = null, done = false;
  wrap.onclick = e => {
    const b = e.target.closest(".opt"); if (!b || done) return;
    picked = +b.dataset.i;
    [...wrap.children].forEach(el => el.classList.toggle("sel", el === b));
  };
  go.onclick = () => {
    if (!done){
      if (picked == null) return;
      done = true;
      const ok = picked === correct;
      epScore(ok, true);
      [...wrap.children].forEach((el,i)=>{
        el.disabled = true; el.classList.remove("sel");
        if (i === correct) el.classList.add("right");
        else if (i === picked) el.classList.add("wrong");
      });
      document.getElementById("fb").innerHTML =
        `<div class="why" style="border-color:${ok?'var(--crt)':'var(--hot)'}">
          <b>${ok?T_.correctMsg:T_.wrongMsg}.</b> ${esc(why)}</div>`;
      go.textContent = T_.next;
      return;
    }
    epAdvance();
  };
}

/* ============================================================================
   THEME SONG  —  "Where the Knowledge Flows"
   ----------------------------------------------------------------------------
   The track lives next to index.html as a normal file rather than being
   base64'd into it: a 3.5MB inline string would be re-parsed on every page load
   and would push the file past what GitHub's editor will open. As a sibling
   file the browser streams and caches it instead.

   Pressing the theme button opens a dance stage: Coach Smith cycles his poses
   in time with the music while an equaliser runs off a real WebAudio
   AnalyserNode, so the bars follow the actual track rather than a fake loop.
   If the file is missing or audio is blocked, the button reports it and
   nothing else breaks.
   ========================================================================== */
/* Three tracks now, so the stage is a jukebox rather than one button. Each
   lives beside index.html as a normal file the browser streams and caches. */
const TRACKS = [
  {file:"Where_the_Knowledge_Flows.mp3", title:"Where the Knowledge Flows", tag:"Theme"},
  {file:"Choose_Your_Own_Hero.mp3",      title:"Choose Your Own Hero",      tag:"Hero theme"},
  {file:"The_Final_Frame.mp3",           title:"The Final Frame",           tag:"Game show"}
];
const THEME_FILE = TRACKS[0].file;   /* kept: older code still reads this */
let THEME = {audio:null, ctx:null, analyser:null, data:null, raf:0, playing:false,
             i:0, onEnd:null, loop:true};

/* The troupe. Coach Smith has a singing set now, so the stage is a group
   number instead of one sprite cycling four poses. */
const DANCE_TROUPE = [
  ["sing_walk_side","sing_crowd","joy_emote","sing_idle"],
  ["sing_idle","sing_hype","sing_climax","sing_crowd"],
  ["hype_triumph","sing_hype","sing_walk_front","joy_emote"]
];

function themeAvailable(){ return true; }   /* resolved at play time */

function trackButtons(){
  return TRACKS.map((t,i)=>`<button class="trackbtn ${THEME.i===i?'on':''}"
    onclick="pickTrack(${i})"><b>${esc(t.title)}</b><small>${esc(t.tag)}</small></button>`).join("");
}
function openTheme(){
  const el = document.getElementById("dance");
  el.classList.remove("hidden");
  THEME.loop = true; THEME.onEnd = null;
  el.innerHTML = `
    <div class="dancewrap">
      <canvas id="danceCv" width="640" height="360"></canvas>
      <div class="tracklist">${trackButtons()}</div>
      <div class="dancebar">
        <button class="btn primary" id="dPlay">▶ ${T_.play}</button>
        <button class="btn ghost" id="dClose">${T_.close}</button>
      </div>
      <p class="muted" id="dNote" style="font-size:12px;margin:8px 0 0">${T_.themeNote}</p>
    </div>`;
  document.getElementById("dClose").onclick = closeTheme;
  document.getElementById("dPlay").onclick = toggleTheme;
  startDanceLoop();
}
/* Switching tracks mid-song tears down the old element so the analyser can be
   rewired to the new one. */
function pickTrack(i){
  if (THEME.i === i && THEME.audio){ toggleTheme(); return; }
  const wasPlaying = THEME.playing;
  themeTeardown();
  THEME.i = i;
  const list = document.querySelector(".tracklist");
  if (list) list.innerHTML = trackButtons();
  const btn = document.getElementById("dPlay");
  if (btn) btn.textContent = "▶ " + T_.play;
  if (wasPlaying) toggleTheme();
}
function closeTheme(){
  stopTheme();
  cancelAnimationFrame(THEME.raf); THEME.raf = 0;
  document.getElementById("dance").classList.add("hidden");
  const cb = THEME.onEnd; THEME.onEnd = null;
  if (cb) cb();
}
function stopTheme(){
  if (THEME.audio){ THEME.audio.pause(); THEME.audio.currentTime = 0; }
  THEME.playing = false;
}
/* Drop the live audio element and its analyser so the next play builds one for
   the track actually being asked for. */
function themeTeardown(){
  if (THEME.audio){ THEME.audio.pause(); THEME.audio.onended = null; THEME.audio = null; }
  if (THEME.ctx){ try{ THEME.ctx.close(); }catch(e){} }
  THEME.ctx = null; THEME.analyser = null; THEME.data = null;
  THEME.playing = false;
}
/* True when the element on hand cannot serve this request. */
function themeStale(track){
  if (!THEME.audio) return false;
  const want = new URL(track.file, location.href).href;
  return THEME.audio.src !== want || THEME.audio.loop !== THEME.loop;
}
function toggleTheme(){
  const btn = document.getElementById("dPlay"), note = document.getElementById("dNote");
  const track = TRACKS[THEME.i] || TRACKS[0];
  if (THEME.playing){ THEME.audio.pause(); THEME.playing = false;
    if (btn) btn.textContent = "▶ " + T_.play; return; }
  if (themeStale(track)) themeTeardown();
  if (!THEME.audio){
    THEME.audio = new Audio(track.file);
    THEME.audio.loop = THEME.loop;
    THEME.audio.crossOrigin = "anonymous";
    THEME.audio.onerror = () => {
      if (note) note.textContent = (S.lang==="es"?"No se encuentra ":"Can't find ") + track.file;
      if (btn) btn.disabled = true;
    };
    THEME.audio.onplaying = () => {
      if (note) note.textContent = (S.lang==="es"?"Sonando — ":"Now playing — ") + track.title; };
    THEME.audio.onended = () => {
      THEME.playing = false;
      if (btn) btn.textContent = "▶ " + T_.play;
      if (THEME.onEnd) closeTheme();   /* closeTheme fires the callback */
    };
  }
  /* AnalyserNode has to be created after a user gesture or the context stays
     suspended. Wiring it here rather than at load is what keeps autoplay
     policies happy across Chrome, Safari and the school-managed browsers. */
  try {
    if (!THEME.ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC){
        THEME.ctx = new AC();
        const src = THEME.ctx.createMediaElementSource(THEME.audio);
        THEME.analyser = THEME.ctx.createAnalyser();
        THEME.analyser.fftSize = 64;
        src.connect(THEME.analyser);
        THEME.analyser.connect(THEME.ctx.destination);
        THEME.data = new Uint8Array(THEME.analyser.frequencyBinCount);
      }
    }
    if (THEME.ctx && THEME.ctx.state === "suspended") THEME.ctx.resume();
  } catch(e){ /* no analyser: the stage still animates on a timer */ }

  THEME.audio.play().then(()=>{
    THEME.playing = true;
    if (btn) btn.textContent = "❚❚ " + T_.pause;
  }).catch(()=>{
    if (note) note.textContent = (S.lang==="es"
      ? "Toca reproducir otra vez para permitir el audio."
      : "Tap play once more to allow audio.");
  });
}

/* The stage: a lit floor, an equaliser, the troupe switching poses on the beat,
   and an optional credit roll drifting up. Pose changes follow bass energy
   when the analyser is available and a steady timer when it is not. */
function startDanceLoop(opts){
  const cv = document.getElementById("danceCv");
  if (!cv) return;
  opts = opts || {};
  const x = cv.getContext("2d");
  const W = cv.width, H = cv.height;
  const troupe = DANCE_TROUPE.map(list => list.map(p => spriteOf(p)));
  let t = 0, poseI = [0,0,0], lastKick = 0, kickHold = 0;
  const credits = opts.credits || null;
  let cards = [], nextCard = 0, ci = 0;
  cancelAnimationFrame(THEME.raf);

  (function frame(){
    THEME.raf = requestAnimationFrame(frame);
    t += 1/60;

    /* audio energy, or a synthetic pulse when there's no analyser */
    let bass = 0, bins = [];
    if (THEME.analyser && THEME.playing){
      THEME.analyser.getByteFrequencyData(THEME.data);
      bins = Array.from(THEME.data);
      for (let i=0;i<4;i++) bass += THEME.data[i];
      bass /= (4*255);
    } else {
      bass = THEME.playing ? (Math.sin(t*6)*0.5+0.5)*0.7 : 0.12+Math.sin(t*2)*0.06;
      bins = Array.from({length:16},(_,i)=>60+Math.sin(t*4+i*0.6)*50*(THEME.playing?1:0.25)+40);
    }

    /* backdrop: dance-floor gradient with a sweeping spotlight */
    const g = x.createLinearGradient(0,0,0,H);
    g.addColorStop(0,"#180E3A"); g.addColorStop(0.55,"#2E1A63"); g.addColorStop(1,"#120A2E");
    x.fillStyle = g; x.fillRect(0,0,W,H);
    const sweep = W/2 + Math.sin(t*0.8)*W*0.32;
    const spot = x.createRadialGradient(sweep,H*0.15,10,sweep,H*0.9,W*0.55);
    spot.addColorStop(0,"rgba(255,46,134,"+(0.18+bass*0.30)+")");
    spot.addColorStop(1,"rgba(255,46,134,0)");
    x.fillStyle = spot; x.fillRect(0,0,W,H);
    const spot2 = x.createRadialGradient(W-sweep,H*0.12,10,W-sweep,H*0.9,W*0.5);
    spot2.addColorStop(0,"rgba(34,216,240,"+(0.14+bass*0.24)+")");
    spot2.addColorStop(1,"rgba(34,216,240,0)");
    x.fillStyle = spot2; x.fillRect(0,0,W,H);

    /* checker floor, receding */
    for (let r=0;r<8;r++){
      const y = H*0.62 + r*r*2.2;
      const hgt = 4 + r*1.6;
      for (let c=0;c<14;c++){
        if ((r+c)%2) continue;
        const wdt = W/14;
        x.fillStyle = "rgba(255,255,255,"+(0.05+r*0.012)+")";
        x.fillRect(c*wdt, y, wdt, hgt);
      }
    }

    /* the credit roll, drifting up behind the troupe */
    if (credits){
      if (t > nextCard){
        cards.push({txt:credits[ci % credits.length], y:H+20,
                    x:W*0.5 + (Math.random()-0.5)*W*0.34, big:ci%credits.length===0});
        ci++; nextCard = t + 2.3;
      }
      x.textAlign = "center";
      cards.forEach(c2 => {
        c2.y -= 0.55 + bass*0.7;
        const a = Math.max(0, Math.min(1, (c2.y-20)/90)) * Math.min(1,(H+20-c2.y)/50);
        x.globalAlpha = a * 0.85;
        x.fillStyle = c2.big ? "#FFD60A" : "#F1ECFF";
        x.font = (c2.big?"800 20px 'Trebuchet MS',sans-serif":"600 14px 'Trebuchet MS',sans-serif");
        x.fillText(c2.txt, c2.x, c2.y);
        x.globalAlpha = 1;
      });
      cards = cards.filter(c2 => c2.y > 10);
    }

    /* equaliser */
    const n = Math.min(16, bins.length), bw = W/(n*1.6);
    for (let i=0;i<n;i++){
      const v = (bins[i]||0)/255;
      const hh2 = 12 + v*H*0.42;
      const bx = W*0.06 + i*(bw*1.6);
      const bg = x.createLinearGradient(0,H-40-hh2,0,H-40);
      bg.addColorStop(0,"#22D8F0"); bg.addColorStop(1,"#FF2E86");
      x.fillStyle = bg;
      x.fillRect(bx, H-40-hh2, bw, hh2);
      x.fillStyle = "rgba(255,255,255,.25)";
      x.fillRect(bx, H-40-hh2, bw, 3);
    }

    /* pose change on a kick, with a hold so it can't strobe */
    if (kickHold > 0) kickHold--;
    if (bass > 0.55 && kickHold === 0){
      poseI = poseI.map((p,i2)=> (p + 1 + i2) % troupe[i2].length); kickHold = 12;
    } else if (!THEME.playing && t - lastKick > 1.1){
      poseI = poseI.map((p,i2)=> (p+1) % troupe[i2].length); lastKick = t;
    }

    /* the troupe: centre dancer front and largest, two flanking and smaller */
    const slots = [
      {cx:W*0.20, sc:0.74, ph:1.7},
      {cx:W*0.50, sc:1.00, ph:0.0},
      {cx:W*0.80, sc:0.74, ph:3.1}
    ];
    slots.forEach((s,i2)=>{
      const im = troupe[i2][poseI[i2]] || troupe[i2][0];
      if (!drawable(im)) return;
      const beat = Math.sin(t*(THEME.playing?7:2) + s.ph);
      const bounce = Math.abs(beat)*(8+bass*22)*s.sc;
      const hh2 = H*0.44*s.sc + bass*18*s.sc;
      const ww = im.naturalWidth/im.naturalHeight*hh2;
      x.save();
      x.globalAlpha = 0.22;
      x.fillStyle = "#000";
      x.beginPath();
      x.ellipse(s.cx, H-48, ww*0.34, 7, 0, 0, 7);
      x.fill();
      x.globalAlpha = 1;
      x.translate(s.cx, H-52-bounce);
      x.rotate(beat*0.07);
      x.drawImage(im,-ww/2,-hh2,ww,hh2);
      x.restore();
    });

    /* title card */
    const track = TRACKS[THEME.i] || TRACKS[0];
    x.textAlign = "center";
    x.fillStyle = "#FFD60A";
    x.font = "800 21px 'Trebuchet MS',sans-serif";
    x.fillText(track.title.toUpperCase(), W/2, 34);
    x.fillStyle = "#A79CD0"; x.font = "11px 'Courier New',monospace";
    x.fillText("SMITH'S CLASSROOM", W/2, 52);
  })();
}

/* ============================================================================
   7. QUESTION ENGINE — one renderer for practice, challenge and test review
   ========================================================================== */
let Q={list:[],idx:0,answers:[],mode:"practice",unit:null,endsAt:0,picked:null,checked:false};

/* weakest-first selection so a 15-question set is never 15 easy repeats */
function pickItems(u,n){
  const scored=u.items.map(i=>{const p=S.prog[i.id]||{seen:0,right:0};
    return {i,w:(p.seen?0:100)+(p.seen&&!p.right?60:0)+(i.diff||1)*3+Math.random()*10};});
  scored.sort((a,b)=>b.w-a.w);
  const out=scored.slice(0,n).map(x=>x.i);
  while(out.length<n && u.items.length) out.push(u.items[out.length%u.items.length]); // bank too small: repeat
  return out;
}
function startPractice(id){ const u=findUnit(id); studyStop();
  Q={list:pickItems(u,Math.min(10,u.items.length)),idx:0,answers:[],picks:[],mode:"practice",unit:u,endsAt:0,picked:null,checked:false}; drawQ(); }

/* ============================================================================
   7b. TEST REVIEW  —  a full unit test, untimed, 25 questions by default,
   70% to earn the certificate.
   ----------------------------------------------------------------------------
   Most units carry ten written questions, and a twenty-five question test has
   to come from somewhere. Rather than repeating the same ten items two and a
   half times, the shortfall is filled with true/false statements built out of
   the teacher's own multiple-choice items: the stem is joined to one of its
   options, and the answer is whether that pairing is the right one. A
   distractor the teacher already wrote is a claim they already judged false,
   so nothing here invents content — it re-asks what is already on file, in a
   second format, which is the point of a review.

   Generation is round-robin across source questions, so a test never opens
   with four true/false items torn from the same question. The teacher tab
   reports exactly how many items in each unit are written versus auto-built.
   ========================================================================== */
function L2(o,lang){ if(o==null) return ""; if(typeof o==="string") return o;
  return o[lang]||o.en||Object.values(o)[0]||""; }

function tfItem(it,ci,isTrue,tag){
  const line=lang=>{
    const ch=(it.c&&(it.c[lang]||it.c.en))||[];
    const stem=String(L2(it.q,lang)).trim().replace(/\s*[:：]\s*$/,"");
    return (T[lang]||T.en).tfPrompt+" "+stem+" — "+(ch[ci]||"");
  };
  const keyText=lang=>{
    const ch=(it.c&&(it.c[lang]||it.c.en))||[];
    const rights=Array.isArray(it.a)?it.a:[it.a];
    return rights.map(r=>ch[r]||"").filter(Boolean).join("; ");
  };
  const why=lang=>{
    const P=T[lang]||T.en, base=L2(it.why,lang);
    return isTrue ? (P.tfWhyTrue+" "+base)
                  : (P.tfWhyFalse+" “"+keyText(lang)+"”. "+base);
  };
  return {id:it.id+"~"+tag, synth:true, type:"mcq", diff:1,
    q:{en:line("en"),es:line("es")},
    c:{en:[T.en.tfTrue,T.en.tfFalse],es:[T.es.tfTrue,T.es.tfFalse]},
    a:isTrue?0:1,
    why:{en:why("en"),es:why("es")}};
}

/* One bucket of candidate true/false items per source question. */
function tfBuckets(u){
  const buckets=[];
  u.items.forEach(it=>{
    if(it.type!=="mcq"&&it.type!=="multi") return;
    const ch=(it.c&&it.c.en)||[];
    if(ch.length<2) return;
    const rights=Array.isArray(it.a)?it.a:[it.a];
    const b=[];
    rights.forEach(r=>{ if(ch[r]) b.push(tfItem(it,r,true,"t"+r)); });
    ch.forEach((_,ci)=>{ if(rights.indexOf(ci)<0) b.push(tfItem(it,ci,false,"f"+ci)); });
    for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=b[i]; b[i]=b[j]; b[j]=t; }
    if(b.length) buckets.push(b);
  });
  return buckets;
}
function shuffled(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function buildExam(u,n){
  const out=pickItems(u,Math.min(n,u.items.length)).slice();
  if(out.length<n){
    const buckets=shuffled(tfBuckets(u));
    let pass=0;
    while(out.length<n){
      let took=0;
      for(const b of buckets){ if(out.length>=n) break;
        if(b.length>pass){ out.push(b[pass]); took++; } }
      if(!took) break;
      pass++;
    }
  }
  while(out.length<n&&u.items.length) out.push(u.items[out.length%u.items.length]);
  return shuffled(out);
}
function examSize(){ return Math.max(5,S.cfg.examQs||25); }
function examPass(){ return Math.max(1,Math.min(100,S.cfg.examPass||70)); }
function examMix(u){
  const n=examSize(), written=Math.min(n,u.items.length);
  const pool=tfBuckets(u).reduce((a,b)=>a+b.length,0);
  const gen=Math.min(Math.max(0,n-written),pool);
  return {n,written,gen,repeat:Math.max(0,n-written-gen),pool};
}

function lockedScreen(u){
  const rec=studyRec(u.id), parts=briefParts(u);
  const unread=parts.filter((_,i)=>!rec.read[i]).length;
  const short=Math.max(0,studyNeed()-rec.sec);
  V().innerHTML=`<section class="panel raised" style="text-align:center;margin-top:22px">
    <div class="eyebrow">${T_.lockedTitle}</div>
    <h1 class="big" style="margin:6px 0 10px">${esc(L(u.title))}</h1>
    <p class="muted" style="max-width:420px;margin:0 auto 8px">${T_.lockedBody}</p>
    <p class="muted" style="margin:0 0 16px">
      ${unread?unread+" · "+T_.stillToRead:""}${unread&&short?" · ":""}${short?fmtMin(short)+" "+T_.timeToGo:""}</p>
    <button class="btn primary wide" onclick="viewTopics('${u.id}')">${T_.goStudy}</button>
  </section>`;
  window.scrollTo(0,0);
}

function startExam(id){
  const u=findUnit(id); if(!u) return go("study");

function beginExam(id){
  const u=findUnit(id);
  Q={list:buildExam(u,examSize()),idx:0,answers:[],picks:[],mode:"exam",unit:u,
     endsAt:Infinity,picked:null,checked:false};
  drawQ();
}

function startChallenge(id){
  const u=findUnit(id); if(!u) return go("study");
  if(!studyUnlocked(u)) return lockedScreen(u);
  studyStop();
  const n=S.cfg.perChallenge||15;
  const untimed=TEACHER_OK;
  Q={list:pickItems(u,n),idx:0,answers:[],picks:[],mode:"timed",unit:u,endsAt:untimed?Infinity:Date.now()+25*60000,picked:null,checked:false,streak:0,points:0};
  if(!untimed){ S.session={unit:u.id,ids:Q.list.map(i=>i.id),endsAt:Q.endsAt,answers:[],idx:0}; save(); }
  drawQ();
}
function resumeSession(){
  const s=S.session,u=findUnit(s.unit); if(!u){S.session=null;save();return render();}
  const map={}; allUnits().forEach(x=>x.items.forEach(i=>map[i.id]=i));
  Q={list:s.ids.map(i=>map[i]).filter(Boolean),idx:s.idx||0,answers:s.answers||[],picks:[],mode:"timed",unit:u,endsAt:s.endsAt,picked:null,checked:false};
  drawQ();
}
function fmt(ms){const t=Math.max(0,Math.round(ms/1000));return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0");}
let tick=null;
function drawQ(){
  /* The timed challenge runs the game-show presentation. Practice, the test
     review and the boss rounds keep the plain renderer. */
  if (Q.mode === "timed") return chDraw();
  clearInterval(tick);
  const it=Q.list[Q.idx]; if(!it) return finishSet();
  const timed=Q.mode==="timed" && Q.endsAt!==Infinity;
  const missing=S.lang==="es"&&!(it.q&&it.q.es);
  let body="";
  if(it.type==="mcq"||it.type==="multi"){
    const ch=(it.c&&(it.c[S.lang]||it.c.en))||[];
    body=ch.map((t,i)=>`<button class="opt" id="o${i}" onclick="pick(${i})">${esc(t)}</button>`).join("");
    if(it.type==="multi") body=`<div class="eyebrow" style="margin-bottom:6px">${T_.selectAll}</div>`+body;
  } else if(it.type==="numeric"){
    body=`<input id="ans" type="number" inputmode="decimal" step="any" placeholder="${T_.typeAnswer}">`;
  } else {
    body=`<textarea id="ans" style="min-height:90px;font-family:var(--body);font-size:15px" placeholder="${T_.typeAnswer}"></textarea>`;
  }
  V().innerHTML=`
  <div class="row" style="margin:14px 0 6px">
    <button class="btn ghost" style="padding:8px 12px;min-height:0" onclick="leaveSet()">${T_.exit}</button>
    <span class="spacer" style="flex:1"></span>
    ${timed?`<span class="timer" id="clk">${fmt(Q.endsAt-Date.now())}</span>`:""}
    ${Q.mode==="exam"?`<span class="chip warn">${T_.testReview}</span>`:""}
    <span class="chip">${T_.question} ${Q.idx+1} ${T_.of} ${Q.list.length}</span>
  </div>
  <div class="meter"><i style="width:${Q.idx/Q.list.length*100}%"></i></div>
  <section class="panel raised">
    <div class="eyebrow">${esc(L(Q.unit.title))} · ${[T_.beginner,T_.core,T_.stretch][(it.diff||1)-1]||T_.core}</div>
    ${missing?`<div class="chip bad" style="margin-top:6px">${T_.langNote}</div>`:""}
    <p class="qtext">${esc(L(it.q))}</p>
    ${body}
    <div id="fb"></div>
    <button class="btn primary wide" id="go" style="margin-top:14px" onclick="checkQ()">${T_.check}</button>
  </section>`;
  Q.picked=(it.type==="multi")?[]:null; Q.checked=false; Q.grade=null; Q.gradeSpec=null;
  if(timed){ tick=setInterval(()=>{const el=document.getElementById("clk"); if(!el)return clearInterval(tick);
    const left=Q.endsAt-Date.now(); el.textContent=fmt(left); el.classList.toggle("low",left<120000);
    if(left<=0){clearInterval(tick); finishSet(true);} },500); }
  window.scrollTo(0,0);
}
function pick(i){
  const it=Q.list[Q.idx]; if(Q.checked) return;
  if(it.type==="multi"){ const k=Q.picked.indexOf(i); k<0?Q.picked.push(i):Q.picked.splice(k,1);
    document.getElementById("o"+i).classList.toggle("sel",k<0); }
  else { Q.picked=i; Q.list[Q.idx].c[S.lang in it.c?S.lang:"en"].forEach((_,j)=>document.getElementById("o"+j).classList.toggle("sel",j===i)); }

function capturePick(it){
  if(it.type==="mcq") return Q.picked;
  if(it.type==="multi") return (Q.picked||[]).slice();
  const el=document.getElementById("ans");
  return el?el.value:"";
}
function judge(it){
  if(it.type==="mcq") return Q.picked===it.a;
  if(it.type==="multi"){ const a=[...it.a].sort().join(","); return [...(Q.picked||[])].sort().join(",")===a; }
  if(it.type==="numeric"){ const v=parseFloat((document.getElementById("ans")||{}).value); return isFinite(v)&&Math.abs(v-it.a)<=(it.tol||0); }
  const txt=((document.getElementById("ans")||{}).value||"");
  const spec=specFor(it);
  if(!(spec.ideas||[]).length&&!spec.number) return txt.trim().length>0;
  Q.grade=gradeText(txt,spec); Q.gradeSpec=spec;
  return Q.grade.pass;
}
function checkQ(){
  const it=Q.list[Q.idx];
  if(!Q.checked){
    const ok=judge(it); Q.checked=true; Q.answers[Q.idx]=ok;
    Q.picks=Q.picks||[]; Q.picks[Q.idx]=capturePick(it);
    /* Auto-built review items carry a synthetic id. They must not write to the
       mastery record or they would inflate it against questions nobody wrote. */
    if(!it.synth){ const p=S.prog[it.id]||{seen:0,right:0};
      p.seen++; if(ok)p.right=1; p.last=today(); S.prog[it.id]=p; }
    if(S.session){S.session.answers=Q.answers;S.session.idx=Q.idx;} save();
    if(it.type==="mcq"||it.type==="multi"){
      const arr=(it.type==="multi")?it.a:[it.a];
      document.querySelectorAll(".opt").forEach((el,j)=>{ el.classList.remove("sel");
        if(arr.includes(j)) el.classList.add("right");
        else if((it.type==="multi"?(Q.picked||[]):[Q.picked]).includes(j)) el.classList.add("wrong"); });
    }
    let extra="";
    if(it.type==="short"&&Q.grade){
      const g=Q.grade;
      extra=`<p style="margin:8px 0 0;font-size:14px">${esc(gradeFeedback(g,Q.gradeSpec))}</p>`;
      if(g.found.length||g.missing.length)
        extra+=`<div class="row" style="margin-top:8px">
          ${g.found.map(t2=>`<span class="chip on">✓ ${esc(t2)}</span>`).join("")}
          ${g.missing.map(t2=>`<span class="chip bad">✗ ${esc(t2)}</span>`).join("")}</div>`;
    }
    document.getElementById("fb").innerHTML=
      `<div class="why" style="border-color:${ok?'var(--crt)':'var(--hot)'}"><b>${ok?T_.correctMsg:T_.wrongMsg}.</b> ${esc(L(it.why))}${extra}</div>
       <div class="coach" style="margin-top:10px">${artTag(ok?"cheer":"hmm")}
       <div class="bubble">${ok?T_.coachRight:T_.coachWrong}</div></div>`;
    if(ok&&Q.mode==="practice") award(10,0);
    document.getElementById("go").textContent=(Q.idx===Q.list.length-1)?T_.finish:T_.next;
  } else { Q.idx++; drawQ(); }
}

function answerText(it,pick){
  const ch=(it.c&&(it.c[S.lang]||it.c.en))||[];
  if(it.type==="mcq") return (pick==null)?T_.notAnswered:esc(String(ch[pick]||""));
  if(it.type==="multi"){ const a=pick||[];
    return a.length?a.map(i=>esc(String(ch[i]||""))).join(", "):T_.notAnswered; }
  const v=String(pick==null?"":pick).trim();
  return v?esc(v):T_.notAnswered;
}
function correctText(it){
  const ch=(it.c&&(it.c[S.lang]||it.c.en))||[];
  if(it.type==="mcq") return esc(String(ch[it.a]||""));
  if(it.type==="multi") return (Array.isArray(it.a)?it.a:[it.a]).map(i=>esc(String(ch[i]||""))).join(", ");
  if(it.type==="numeric") return esc(String(it.a));
  return esc((it.keys||[]).join(" · "))||"—";
}

function certCode(name,unit,score){ const s=name+"|"+unit+"|"+score+"|"+today();
  let h=0; for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0;}
  return "SC-"+h.toString(36).toUpperCase().padStart(7,"0").slice(0,7); }
function certFromRecord(code){ const c=S.certs.find(x=>x.code===code); if(c) drawCert(c); }
function makeCert(unitId,score,print,kind){
  const u=findUnit(unitId);
  let rec=S.certs.slice().reverse().find(c=>c.unit===L(u.title)&&(kind?c.kind===kind:true));
  if(!rec){
    rec={code:certCode(S.name||"student",unitId+(kind==="exam"?"-test":""),score),
         name:S.name||"Student",unit:L(u.title),course:L(u.pack.name),score,date:today(),kind:kind||"challenge"};
    /* Bank it and pay the coin. This record used to be transient, so a
       certificate reached through this button existed on paper but never in the
       student's record and never paid out. */
    if(!S.certs.some(c=>c.code===rec.code)){ S.certs.push(rec); save(); certCoin(); }
  }
  drawCert(rec,print);
}
function drawCert(c,print){
  const u=art("cheer")||art("idle");
  if(u){ const im=new Image(); im.onload=()=>paintCert(c,print,im); im.onerror=()=>paintCert(c,print,null); im.src=u; }
  else paintCert(c,print,null);
}
function paintCert(c,print,mascot){
  const W=1600,H=1100,cv=document.createElement("canvas");cv.width=W;cv.height=H;
  const x=cv.getContext("2d");
  x.fillStyle="#F5F1E6";x.fillRect(0,0,W,H);
  x.strokeStyle="#1A1430";x.lineWidth=10;x.strokeRect(34,34,W-68,H-68);
  x.strokeStyle="#F2B441";x.lineWidth=3;x.strokeRect(54,54,W-108,H-108);
  x.fillStyle="#1A1430";x.textAlign="center";
  x.font="700 26px 'Trebuchet MS',sans-serif";x.fillText("SMITH'S CLASSROOM",W/2,140);
  x.font="800 62px 'Trebuchet MS',sans-serif";x.fillText(T_.certTitle.toUpperCase(),W/2,225);
  x.strokeStyle="#F2B441";x.lineWidth=4;x.beginPath();x.moveTo(W/2-160,255);x.lineTo(W/2+160,255);x.stroke();
  x.font="400 28px system-ui,sans-serif";x.fillStyle="#4A4166";x.fillText(T_.certLine.toUpperCase(),W/2,340);
  x.fillStyle="#1A1430";x.font="800 72px 'Trebuchet MS',sans-serif";x.fillText(c.name||"Student",W/2,430);
  x.font="600 38px system-ui,sans-serif";x.fillStyle="#2E2550";
  x.fillText(c.course+" — "+c.unit,W/2,530);
  x.font="400 26px system-ui,sans-serif";x.fillStyle="#4A4166";
  x.fillText((c.kind==="exam"?T_.testReview+" · ":c.kind==="review"?T_.reviewCert+" · ":"")
    +T_.certOn+" "+c.date,W/2,585);
  /* score token — the arcade motif carried onto paper */
  x.beginPath();x.arc(W/2,730,92,0,7);x.fillStyle="#F2B441";x.fill();
  x.lineWidth=8;x.strokeStyle="#8A6512";x.stroke();
  x.fillStyle="#3A2A00";x.font="800 56px 'Trebuchet MS',sans-serif";x.fillText(c.score+"%",W/2,748);
  x.font="400 22px 'Courier New',monospace";x.fillStyle="#4A4166";
  x.fillText(T_.verify+": "+c.code,W*0.34,900);
  const sx=W*0.34;
  x.strokeStyle="#1A1430";x.lineWidth=2;x.beginPath();x.moveTo(sx-230,965);x.lineTo(sx+230,965);x.stroke();
  x.font="400 22px system-ui,sans-serif";x.fillText("Coach Smith",sx,1000);
  if(mascot){ try{ const h=430,w=mascot.naturalWidth/mascot.naturalHeight*h;
      x.drawImage(mascot,W-w-95,H-h-115,w,h); }catch(e){} }
  try{ cv.toDataURL(); }catch(e){ if(mascot) return paintCert(c,print,null); } /* file:// blocks reading art back */
  if(print){ const w=window.open(""); if(!w){toast("Allow pop-ups to print");return;}
    w.document.write(`<img src="${cv.toDataURL("image/png")}" style="width:100%" onload="window.print()">`); w.document.close(); }
  else cv.toBlob(b=>download(`certificate-${c.code}.png`,b,"image/png"));
}

let RAF=null, cleanupInput=null, GAME_OVER=false;

/* --------------------------------------------------------------------------
   Every game used to advance one step per animation frame. That ties the
   speed of the game to the refresh rate of the screen: the same run is 2.4x
   faster on a 144Hz monitor than on a 60Hz school Chromebook, and any late
   frame shows up as a stutter. startLoop keeps a time accumulator instead and
   runs the step function at a fixed 60Hz on every machine.

   dt within 10% of one step is snapped to exactly one step, so a normal 60Hz
   display runs one step per frame with no beat-frequency judder. A long gap
   (switching tabs, a slow page) is clamped rather than simulated, so nobody
   comes back to find themselves teleported into a hazard.
   -------------------------------------------------------------------------- */
const LOOP_STEP=1000/60;
let LOOP={acc:0,last:0,vis:null};
function startLoop(step){
  LOOP.acc=0; LOOP.last=performance.now();
  if(LOOP.vis) document.removeEventListener("visibilitychange",LOOP.vis);
  LOOP.vis=()=>{ LOOP.last=performance.now(); LOOP.acc=0; };
  document.addEventListener("visibilitychange",LOOP.vis);
  (function frame(now){
    RAF=requestAnimationFrame(frame);
    if(document.hidden){ LOOP.last=now; LOOP.acc=0; return; }
    let dt=now-LOOP.last; LOOP.last=now;
    if(!isFinite(dt)||dt<0) dt=0;
    if(dt>250) dt=250;                                  /* clamp a frame spike */
    if(dt>LOOP_STEP*0.9&&dt<LOOP_STEP*1.1) dt=LOOP_STEP; /* snap plain 60Hz    */
    LOOP.acc+=dt;
    let n=0;
    while(LOOP.acc>=LOOP_STEP&&n<4){ step(); LOOP.acc-=LOOP_STEP; n++; }
    if(n>=4) LOOP.acc=0;                                /* fell behind: drop it */
  })(performance.now());
}
function stopGame(){
  document.body.classList.remove("playing");
  if(RAF) cancelAnimationFrame(RAF); RAF=null;
  if(LOOP.vis){ document.removeEventListener("visibilitychange",LOOP.vis); LOOP.vis=null; }
  if(cleanupInput){ try{ cleanupInput(); }catch(e){} cleanupInput=null; }
}
function zoneOf(g){ return ZONES.find(z=>z.k===(S.zone&&S.zone[g]))||ZONES[0]; }
function setZone(g,k){ S.zone=S.zone||{}; S.zone[g]=k; save(); render(); }
function lvlOf(id){ return Math.max(1,(S.arcade&&S.arcade[id])||1); }
function formatTime(frames){
  const t=Math.max(0,Math.ceil(frames/60));
  return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0");
}

function playGame(id){
  if(!TEACHER_OK){ if(S.tokens<1) return toast(T_.noTokens); S.tokens--; save(); paintBar(); }
  const g=GAMES.find(x=>x.id===id);
  GAME_OVER=false;
  document.body.classList.add("playing");
  V().innerHTML=`<div class="row" style="margin:14px 0">
      <button class="btn ghost" style="padding:8px 12px;min-height:0" onclick="go('arcade')">${T_.exit}</button>
      <span style="flex:1"></span>
      <span class="chip" id="hp">♥♥♥</span>
      <span class="chip" id="tokCount">T: 0</span>
      <span class="chip" id="timer">--:--</span>
      <span class="chip warn" id="sc">0</span></div>
    <canvas id="cv" class="game" height="460"></canvas>
    <p class="muted" style="text-align:center;margin-top:8px" id="hint">${
      id==="kart"?esc(T_.kartControls):esc(L(g.touch))}</p>`;
  const cv=document.getElementById("cv");
  /* Mode 7 sampling cost scales with canvas area, so cap the render buffer
     at a stable ~640x460 and let CSS stretch it up. On a Chromebook that's
     the difference between 30fps and 60fps. */
  const rect=cv.getBoundingClientRect();
  const rw=rect.width||cv.clientWidth||600;
  const scale=(id==="kart")?1:2;
  cv.width=Math.min(id==="kart"?640:900, Math.max(320, Math.round(rw*scale)));
  cv.height=Math.round(Math.min(id==="kart"?460:760, Math.max(id==="kart"?360:520, cv.width*(id==="kart"?0.72:0.92))));
  const lvl=lvlOf(id), zone=zoneOf(id);
  /* the platformer authors its levels against a fixed 960x576 stage, so it asks
     for a 5:3 buffer and scales the context rather than the layout */
  if(id==="gunner"){
    cv.width=Math.min(960,Math.max(360,Math.round(rw*2)));
    cv.height=Math.round(cv.width*0.6);
  }
  ({sprint:gameSprint,shuttle:gameShuttle,kart:gameKart,quest:gameQuest,gunner:gameGunner}[id])(cv,id,lvl,zone);
}
