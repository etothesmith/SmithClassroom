<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smithtopia Smackdown</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<!--
=====================================================================================
 SMITHTOPIA SMACKDOWN: a classroom platform fighter for Smith's Classroom 2.0
 One file. Open it in a browser. No build step.

 STATE MACHINE
   QUIZ_GATE  →  CHARACTER_SELECT  →  ARENA_BATTLE  →  PODIUM_RESULTS
       ↑                                                     │
       └─────────────── rematch (review again) ──────────────┘
   QUIZ_GATE        pick a subject and how many students are playing; each student
                    answers CFG.QUIZ_LEN questions and needs CFG.PASS_SCORE right to
                    unlock the match. Best streak → Focus Buff (knockback resistance).
   CHARACTER_SELECT 4 slots: Human (keyboard or gamepad), Bot (Easy/Normal/Hard) or Off.
                    Customize hair, skin, shirt and accessory. 2–4 fighters.
   ARENA_BATTLE     fixed 60 Hz simulation: physics, attacks, items, KOs, camera.
   PODIUM_RESULTS   1st/2nd/3rd podium with KOs, falls and damage dealt.

 KNOCKBACK (no health bars: damage % goes up, launches get bigger)
   p  = victim's damage % after the hit
   v  = (BKB + KBG × (p / 100) × (1 + p / 150)) × √charge × (1 − Focus)
   launch = v at the move's angle; hitstun = 1.5 × v frames; KO past the blast zones.
   The (1 + p/150) term makes knockback grow faster than linearly as % rises.

 CONTROLS (also shown in the game)
   Keyboard 1  WASD move (W also jumps) · Q jump · E light · R smash (hold) · F item · Left Shift dash
   Keyboard 2  IJKL move · U jump · O light · P smash · ; item · Y dash
   Keyboard 3  Arrows move · / jump · . light · , smash · M item · Right Shift dash
   Keyboard 4  Numpad 8 4 5 6 move · 7 jump · 9 light · 3 smash · 1 item · 0 dash
   Gamepad     Stick/D-pad move · A jump · X light · Y smash · B item · LB/RB dash · Start pause
   Up-smash / down-smash: hold smash, then point up or down, release.
   Esc pauses.

 YOUR QUESTIONS
   Edit QUESTION_BANK below. When this file sits in the Smith's Classroom repo
   (smackdown/index.html) it also loads the full hub bank (../content.js, ../bank_plus*.js).

 SPRITE SHEETS
   See SPRITE_AVATARS: any sheet on a #FF00FF background is keyed to transparent.
=====================================================================================
-->
<style>
  :root{--char:#2B2B2B;--cream:#FFF8EC;--red:#C8102E;--gold:#FFD23F;--sky:#7EC8F2;--ink:#1D1B2E}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#1D1B2E;color:var(--ink);font-family:Nunito,system-ui,sans-serif;overflow:hidden}
  #wrap{position:fixed;inset:0;display:grid;place-items:center}
  canvas{display:block;width:100%;height:100%;image-rendering:auto}
  #ui{position:fixed;inset:0;pointer-events:none}
  #ui .screen{position:absolute;inset:0;pointer-events:auto;overflow:auto;padding:18px;display:flex;flex-direction:column;align-items:center;
    background:linear-gradient(170deg,#9AD8FA 0%,#CFEFFF 45%,#FFE9B8 100%)}
  #ui .screen.clear{background:transparent;pointer-events:none}
  .panel{background:var(--cream);border:3px solid var(--char);border-radius:22px;box-shadow:0 6px 0 var(--char);padding:18px 20px;width:min(980px,100%);margin:8px 0}
  h1,h2,h3{font-family:Fredoka,Nunito,system-ui,sans-serif;margin:0}
  .logo{font:700 clamp(34px,6vw,64px)/.95 Fredoka,system-ui;color:#fff;-webkit-text-stroke:3px var(--char);text-shadow:0 6px 0 var(--char);letter-spacing:.01em;text-align:center;margin:6px 0 2px}
  .logo span{color:var(--gold)}
  .tag{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--red)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .btn{font:800 16px Nunito,system-ui;border:3px solid var(--char);border-radius:14px;background:#fff;padding:10px 16px;cursor:pointer;box-shadow:0 4px 0 var(--char);color:var(--ink)}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--char)}
  .btn.on,.btn.primary{background:var(--gold)}
  .btn.go{background:#E63946;color:#fff;font-size:22px;padding:12px 28px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  .choice{text-align:left;font-size:17px;padding:14px 16px;min-height:62px}
  .choice b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--char);color:#fff;margin-right:8px;font-size:14px}
  .choice:disabled{opacity:1;cursor:default}.choice.right{background:#B7F0C4}.choice.wrong{background:#FFC2C2}
  .q{font:700 24px/1.25 Fredoka,system-ui;margin-top:8px}
  .why{margin-top:12px;padding:12px 14px;border-radius:14px;background:#fff;border:2px dashed var(--char);font-size:15px}
  .meter{display:flex;gap:6px;margin-top:6px}.meter i{width:26px;height:10px;border-radius:5px;background:#0002;border:2px solid var(--char)}.meter i.ok{background:#2ECC71}.meter i.no{background:#E63946}
  .slots{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:min(1200px,100%)}
  .slot{background:var(--cream);border:3px solid var(--char);border-radius:20px;box-shadow:0 5px 0 var(--char);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
  .slot.off{opacity:.55}
  .slot h3{font-size:20px;display:flex;justify-content:space-between;align-items:center}
  .slot canvas{width:100%;height:150px;background:linear-gradient(#CFEFFF,#FFF3D6);border:2px solid var(--char);border-radius:14px}
  .slot select,.slot input{font:700 14px Nunito;border:2px solid var(--char);border-radius:10px;padding:6px 8px;width:100%;background:#fff}
  .sw{display:flex;gap:5px;flex-wrap:wrap}.sw button{width:24px;height:24px;border-radius:50%;border:2px solid var(--char);cursor:pointer;padding:0}
  .sw button.on{outline:3px solid var(--red);outline-offset:1px}
  .mini{font:800 13px Nunito;padding:6px 10px;border-radius:10px;box-shadow:0 3px 0 var(--char)}
  .hint{font-size:12px;color:#5B5670;font-weight:700;line-height:1.35}
  .badge{display:inline-block;background:#E8F7EE;border:2px solid var(--char);border-radius:999px;padding:2px 10px;font:800 12px Nunito}
  .podium{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin-top:10px}
  .pod{display:flex;flex-direction:column;align-items:center;gap:6px;width:190px}
  .pod canvas{width:150px;height:150px}
  .pod .blk{width:100%;border:3px solid var(--char);border-radius:14px 14px 0 0;display:grid;place-items:center;font:700 40px Fredoka;color:#fff;-webkit-text-stroke:2px var(--char)}
  table{border-collapse:collapse;width:100%;margin-top:12px;font-weight:700}td,th{border-bottom:2px solid #0001;padding:8px;text-align:left}
  .keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:8px}
  .keys div{background:#fff;border:2px solid var(--char);border-radius:12px;padding:8px 10px;font-size:13px;font-weight:700}
  .center{text-align:center}
  @media (max-width:900px){.slots{grid-template-columns:1fr 1fr}.choices{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="ui"></div>
<script>
(() => {
"use strict";

/* =====================================================================================
   1. CONFIG: tweak freely
   ===================================================================================== */
const CFG = {
  QUIZ_LEN: 5,            // questions per student before a match
  PASS_SCORE: 3,          // right answers needed to enter
  FOCUS_PER_STREAK: 0.10, // +10% knockback resistance for each answer in your best streak…
  FOCUS_CAP: 0.30,        // …capped so the buff stays fair
  STOCKS: 3,
  TIME_SEC: 180,          // 0 = no timer
  ITEMS: true,
  TAP_JUMP: true,         // pressing up also jumps (hold smash + up = up-smash)
  VOLUME: 0.35
};

/* =====================================================================================
   2. QUESTION_BANK: swap in your own unit questions
   Each: {subject:'econ'|'macro'|'gov', unit, q, choices:[4], answer:index, why}
   ===================================================================================== */
const QUESTION_BANK = [
  // ---- High School Economics
  {subject:"econ", unit:"Markets", q:"If the price of a good is above equilibrium, there will be a…", choices:["Surplus","Shortage","Black market","Price ceiling"], answer:0, why:"At a high price, quantity supplied is greater than quantity demanded."},
  {subject:"econ", unit:"Markets", q:"Coffee and creamer are complements. If coffee prices rise, demand for creamer…", choices:["Decreases","Increases","Stays the same","Becomes perfectly elastic"], answer:0, why:"Less coffee bought means less creamer needed."},
  {subject:"econ", unit:"Markets", q:"A factory pollutes a river and doesn't pay for the damage. This is a…", choices:["Negative externality","Positive externality","Public good","Perfect competition"], answer:0, why:"A cost falls on third parties outside the market."},
  {subject:"econ", unit:"Systems", q:"In a market economy, what to produce is decided mainly by…", choices:["Consumers and producers through prices","A central government plan","Tradition","The military"], answer:0, why:"Prices signal what people want; firms produce what earns profit."},
  {subject:"econ", unit:"Money", q:"Gross pay minus taxes and deductions equals…", choices:["Net pay","Gross income","A raise","Adjusted income"], answer:0, why:"Net pay is your take-home pay."},
  {subject:"econ", unit:"Money", q:"Which action raises a credit score the most over time?", choices:["Paying every bill on time","Opening many cards at once","Maxing out your limit","Closing your oldest account"], answer:0, why:"Payment history is the biggest part of a credit score."},
  {subject:"econ", unit:"Global", q:"A tariff is…", choices:["A tax on imported goods","A limit on the number of imports","A payment to exporters","A free-trade agreement"], answer:0, why:"Tariffs raise import prices to protect domestic producers."},
  {subject:"econ", unit:"Global", q:"If $1 buys 20 pesos instead of 17, the dollar has…", choices:["Appreciated","Depreciated","Been devalued by the Fed","Stayed the same"], answer:0, why:"One dollar now buys more pesos."},
  {subject:"econ", unit:"Policy", q:"Which agency carries out U.S. monetary policy?", choices:["The Federal Reserve","The Treasury","Congress","The IRS"], answer:0, why:"The Fed sets interest-rate policy."},
  {subject:"econ", unit:"Money", q:"$1,000 earns 5% compounded yearly. After 2 years you have about…", choices:["$1,102.50","$1,100.00","$1,050.00","$1,200.00"], answer:0, why:"1,000 × 1.05 × 1.05 = 1,102.50."},
  // ---- AP Macroeconomics
  {subject:"macro", unit:"Unit 1", q:"Which would shift a country's PPC outward?", choices:["New technology that raises productivity","A fall in one good's price","Moving from unemployment to full employment","More demand for exports"], answer:0, why:"More resources or better technology raise maximum output."},
  {subject:"macro", unit:"Unit 2", q:"Nominal GDP rose 6% and prices rose 4%. Real GDP rose about…", choices:["2%","10%","4%","6%"], answer:0, why:"Real ≈ nominal − inflation."},
  {subject:"macro", unit:"Unit 2", q:"A worker replaced by robots is…", choices:["Structurally unemployed","Frictionally unemployed","Cyclically unemployed","Not in the labor force"], answer:0, why:"A skills mismatch is structural unemployment."},
  {subject:"macro", unit:"Unit 3", q:"If the MPC is 0.75, the spending multiplier is…", choices:["4","0.25","1.33","7.5"], answer:0, why:"1 ÷ (1 − 0.75) = 4."},
  {subject:"macro", unit:"Unit 3", q:"A sharp rise in oil prices most likely causes…", choices:["Stagflation","Higher output and lower prices","Demand-pull inflation","A rightward shift of LRAS"], answer:0, why:"SRAS shifts left: prices up, output down."},
  {subject:"macro", unit:"Unit 4", q:"Reserve requirement 20%; $500 of new excess reserves can grow the money supply by up to…", choices:["$2,500","$500","$100","$10,000"], answer:0, why:"Money multiplier 1 ÷ 0.2 = 5."},
  {subject:"macro", unit:"Unit 4", q:"When the Fed buys bonds, interest rates…", choices:["Fall, and investment rises","Rise, and investment falls","Fall, and investment falls","Don't change"], answer:0, why:"More reserves → lower rates → more investment."},
  {subject:"macro", unit:"Unit 5", q:"The long-run Phillips curve is vertical at…", choices:["The natural rate of unemployment","Zero unemployment","The inflation target","Today's unemployment rate"], answer:0, why:"No long-run tradeoff between inflation and unemployment."},
  {subject:"macro", unit:"Unit 6", q:"If the dollar appreciates against the euro, U.S. exports to Europe…", choices:["Fall","Rise","Don't change","Rise because imports fall"], answer:0, why:"U.S. goods get more expensive for Europeans."},
  {subject:"macro", unit:"Unit 6", q:"U.S. interest rates rise relative to Japan's. The dollar…", choices:["Appreciates","Depreciates","Is unaffected","Is fixed by law"], answer:0, why:"Foreign capital flows in and buys dollars."},
  // ---- U.S. Government
  {subject:"gov", unit:"Founding", q:"Montesquieu's biggest influence on the Constitution is…", choices:["Separation of powers","Natural rights","The social contract","Popular sovereignty"], answer:0, why:"Dividing power among branches protects liberty."},
  {subject:"gov", unit:"Founding", q:"\"Government gets its power from the people\" describes…", choices:["Popular sovereignty","Federalism","Judicial review","Checks and balances"], answer:0, why:"The people are the source of authority."},
  {subject:"gov", unit:"Branches", q:"How does the legislative branch check the judicial branch?", choices:["The Senate confirms federal judges","Congress overturns rulings by majority vote","Congress appoints the Chief Justice","Congress votes on every case"], answer:0, why:"Confirmation, impeachment and setting court structure."},
  {subject:"gov", unit:"Branches", q:"Marbury v. Madison (1803) established…", choices:["Judicial review","The right to an attorney","Separate but equal","The power to tax"], answer:0, why:"Courts can strike down unconstitutional laws."},
  {subject:"gov", unit:"Branches", q:"Which power belongs only to the House?", choices:["Impeaching officials","Approving treaties","Confirming cabinet members","Trying impeachments"], answer:0, why:"The House charges; the Senate holds the trial."},
  {subject:"gov", unit:"Federalism", q:"Both national and state governments can collect taxes. This is a…", choices:["Concurrent power","Reserved power","Implied power","Delegated power only"], answer:0, why:"Concurrent powers are shared."},
  {subject:"gov", unit:"Rights", q:"Police search a car without a warrant or probable cause. Which amendment is at issue?", choices:["4th","5th","6th","8th"], answer:0, why:"Protection against unreasonable searches and seizures."},
  {subject:"gov", unit:"Rights", q:"Tinker v. Des Moines ruled that students…", choices:["Keep free speech at school unless it seriously disrupts","Have no rights at school","Must salute the flag","Can be searched for no reason"], answer:0, why:"Black armbands were protected symbolic speech."},
  {subject:"gov", unit:"Citizenship", q:"Which amendment lowered the voting age to 18?", choices:["26th","19th","15th","24th"], answer:0, why:"Ratified in 1971."},
  {subject:"gov", unit:"Citizenship", q:"Which is a legal duty of U.S. citizens?", choices:["Serving on a jury when called","Voting in every election","Volunteering","Joining a party"], answer:0, why:"Jury duty is required; voting is a responsibility."}
];
const SUBJECTS = {econ:"Economics", macro:"AP Macroeconomics", gov:"U.S. Government", mix:"Mix of all"};

/* =====================================================================================
   3. SPRITE_AVATARS (optional): map a slot's avatar to an external sheet.
   Example: {url:"hero.png", frameW:96, frameH:96, anims:{idle:{row:0,frames:4,fps:6}, run:{row:1,frames:6,fps:12}, ...}}
   Missing anims fall back to idle. Magenta (#FF00FF) becomes transparent automatically.
   ===================================================================================== */
const SPRITE_AVATARS = {};

/* =====================================================================================
   4. Small helpers, sound
   ===================================================================================== */
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shade(hex, amt){ const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = v => clamp(Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt), 0, 255); return "#" + ((1 << 24) + (f(r) << 16) + (f(g) << 8) + f(b)).toString(16).slice(1); }

let AC = null, muted = false;
function audio(){ if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} } return AC; }
function sfx(kind){ const ac = audio(); if (!ac || muted) return; const t = ac.currentTime, g = ac.createGain(); g.connect(ac.destination);
  const tone = (type, f0, f1, dur, vol) => { const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    const gg = ac.createGain(); gg.gain.setValueAtTime(vol * CFG.VOLUME, t); gg.gain.exponentialRampToValueAtTime(0.001, t + dur); o.connect(gg); gg.connect(ac.destination); o.start(t); o.stop(t + dur); };
  const noise = (dur, vol, freq) => { const len = ac.sampleRate * dur, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = ac.createBufferSource(); s.buffer = buf; const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = freq; const gg = ac.createGain(); gg.gain.value = vol * CFG.VOLUME; s.connect(bp); bp.connect(gg); gg.connect(ac.destination); s.start(t); };
  ({jump:() => tone("square", 330, 620, .12, .25), djump:() => tone("square", 440, 880, .14, .25), dash:() => noise(.12, .5, 1800),
    hit:() => { noise(.08, .9, 900); tone("triangle", 220, 110, .1, .4); }, heavy:() => { noise(.18, 1.2, 500); tone("sawtooth", 160, 50, .25, .45); },
    thwack:() => { noise(.06, 1.4, 2600); tone("square", 900, 300, .07, .3); }, ko:() => { noise(.6, 1.4, 300); tone("sawtooth", 400, 40, .7, .5); },
    pick:() => { tone("triangle", 660, 990, .1, .3); setTimeout(() => sfx("pick2"), 70); }, pick2:() => tone("triangle", 990, 1320, .12, .3),
    throw:() => noise(.1, .6, 1200), bounce:() => tone("sine", 300, 200, .08, .3), right:() => { tone("triangle", 523, 523, .1, .3); setTimeout(() => tone("triangle", 784, 784, .18, .3), 90); },
    wrong:() => tone("sawtooth", 220, 140, .25, .25), go:() => { tone("square", 523, 523, .15, .3); setTimeout(() => tone("square", 1046, 1046, .3, .3), 150); },
    charge:() => tone("sine", 200, 600, .3, .12), select:() => tone("triangle", 600, 700, .06, .2)}[kind] || (() => {}))(); }

/* =====================================================================================
   5. Hub question bank loader (works when this file lives in the repo next to content.js)
   ===================================================================================== */
let BANK = QUESTION_BANK.slice(), HUB_BANK = false;
function loadHubBank(done){
  if (location.protocol === "file:") return done();
  const files = ["../content.js", "../bank_plus.js", "../bank_plus2.js"]; let i = 0;
  const next = () => { if (i >= files.length) return convert(); const s = document.createElement("script"); s.src = files[i++]; s.onload = next; s.onerror = () => (i === 1 ? done() : convert()); document.head.appendChild(s); };
  const convert = () => { try { if (typeof PACKS === "undefined") return done(); const out = [];
      PACKS.forEach(p => p.units.forEach(u => { const id = u.id || "", subj = id.startsWith("ap-m") ? "macro" : id.startsWith("eh-") ? "econ" : (id.startsWith("gov-") || id.startsWith("apg-")) ? "gov" : null; if (!subj) return;
        u.items.forEach(it => { if (it.type !== "mcq" || !it.c || !it.c.en || it.c.en.length < 2 || typeof it.a !== "number") return;
          out.push({subject:subj, unit:(u.title && u.title.en) || id, q:(it.q && it.q.en) || "", choices:it.c.en, answer:it.a, why:(it.why && it.why.en) || ""}); }); }));
      if (out.length > 50) { BANK = out; HUB_BANK = true; } } catch(e){ console.warn(e); } done(); };
  next();
}

/* =====================================================================================
   6. Avatars: modular procedural student renderer (+ optional magenta-keyed sprite sheets)
   ===================================================================================== */
const OUT = "#2B2B2B";
const SKINS = ["#FFDFC4","#F1C27D","#E0AC69","#C68642","#8D5524","#5C3A21"];
const HAIRC = ["#2B1B12","#5A3825","#A0522D","#E8C26A","#D4542C","#1E1E1E","#7B4FD8","#3BAFDA"];
const SHIRTS = ["#E63946","#F4A261","#2A9D8F","#457B9D","#8E44AD","#F1C40F","#2ECC71","#FF6FB5","#1D3557","#FFFFFF"];
const PANTS = ["#34495E","#2C3E50","#5D6D7E","#1B4F72","#6E2C00"];
const HAIRS = ["short","curly","ponytail","buns","spiky","long","afro","buzz"];
const ACCS = ["none","glasses","cap","headphones","backpack","bow","sweatband"];
const NAMES = ["Maya","Leo","Zoe","Eli","Nia","Marcus","Rosa","Tyler","Kai","Dee","Ivy","Omar"];
function randomAvatar(){ return {skin:pick(SKINS), hair:pick(HAIRS), hairC:pick(HAIRC), shirt:pick(SHIRTS), pants:pick(PANTS), acc:pick(ACCS)}; }

const sprites = {};
function keyMagenta(img){ const c = document.createElement("canvas"); c.width = img.width; c.height = img.height; const x = c.getContext("2d"); x.drawImage(img, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height), a = d.data; for (let i = 0; i < a.length; i += 4) { const r = a[i], g = a[i + 1], b = a[i + 2];
    if (r > 180 && b > 180 && g < 90) a[i + 3] = 0; else if (r > 150 && b > 150 && g < 120) { a[i + 3] = 120; a[i] = (r + g) / 2; a[i + 2] = (b + g) / 2; } }
  x.putImageData(d, 0, 0); return c; }
function loadSprite(key){ const cfg = SPRITE_AVATARS[key]; if (!cfg || sprites[key]) return; sprites[key] = {cfg, sheet:null};
  const im = new Image(); im.crossOrigin = "anonymous"; im.onload = () => { sprites[key].sheet = keyMagenta(im); }; im.src = cfg.url; }

function line(ctx, x1, y1, x2, y2, w, col){ ctx.lineCap = "round"; ctx.strokeStyle = OUT; ctx.lineWidth = w + 5; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function circ(ctx, x, y, r, col, lw = 3){ ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = lw; ctx.strokeStyle = OUT; ctx.stroke(); }
function rrect(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

/* limb angles per pose (0 = straight down, + = toward facing) */
function poseOf(pose, t){ const s = Math.sin(t * 0.38);
  switch (pose) {

    case "fall":   return {aF:-2.0, aB:2.4, lF:0.3, lB:-0.4, tilt:0, bob:0};
    case "wall":   return {aF:-2.6, aB:-2.2, lF:0.5, lB:0.2, tilt:-0.1, bob:0};
    case "ledge":  return {aF:-3.0, aB:-2.9, lF:0.2, lB:-0.1, tilt:0, bob:0};
    case "dash":   return {aF:1.6, aB:-1.4, lF:1.1, lB:-0.9, tilt:0.35, bob:0};
    case "jab":    return {aF:1.57, aB:-0.6, lF:0.3, lB:-0.3, tilt:0.1, bob:0};
    case "charge": return {aF:-1.2, aB:-1.6, lF:0.4, lB:-0.5, tilt:-0.2, bob:Math.sin(t * 1.5) * 1.2};
    case "fsmash": return {aF:1.45, aB:1.2, lF:0.6, lB:-0.6, tilt:0.3, bob:0};
    case "usmash": return {aF:3.0, aB:-3.0, lF:0.2, lB:-0.2, tilt:0, bob:-3};
    case "dsmash": return {aF:2.0, aB:-2.0, lF:0.9, lB:-0.9, tilt:0, bob:4};
    case "airkick":return {aF:-1.0, aB:0.8, lF:1.55, lB:-0.4, tilt:-0.15, bob:0};
    case "spike":  return {aF:-2.6, aB:2.6, lF:0.1, lB:-0.1, tilt:0.2, bob:0};
    case "slam":   return {aF:2.2, aB:1.8, lF:0.5, lB:-0.5, tilt:0.35, bob:0};
    case "throw":  return {aF:1.8, aB:-1.2, lF:0.5, lB:-0.3, tilt:0.15, bob:0};

    for (let s = 0; s < CFG.STOCKS; s++) circ(ctx, 102 + s * 16, 78, 5.5, s < p.stocks ? p.color : "#ddd", 2);
    let bx = cw - 22; ctx.font = "16px sans-serif"; ctx.textAlign = "center";
    if (p.focus > 0) { ctx.fillText("🧠", bx, 24); ctx.font = "800 10px Nunito"; ctx.fillStyle = "#7B4FD8"; ctx.fillText("+" + Math.round(p.focus * 100) + "%", bx, 38); bx -= 26; ctx.font = "16px sans-serif"; }
    if (p.item) { ctx.fillText(p.item.type === "ball" ? "🔴" : "📘", bx, 24); bx -= 22; }
    if (p.buffs.ruler > 0) { ctx.fillText("📏", bx, 24); bx -= 22; } if (p.buffs.speed > 0) { ctx.fillText("⚡", bx, 24); }
    ctx.restore(); });
  // timer
  if (CFG.TIME_SEC) { const s = Math.max(0, Math.ceil(G.timeLeft / 60)); const tx = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; ctx.font = "700 30px Fredoka, sans-serif"; ctx.textAlign = "center"; ctx.lineWidth = 6; ctx.strokeStyle = OUT; ctx.strokeText(tx, VW / 2, 42); ctx.fillStyle = s <= 10 ? "#FF6B6B" : "#fff"; ctx.fillText(tx, VW / 2, 42); }
  // countdown / big messages
  const msg = G.countdown > 0 ? (G.countdown > 110 ? "3" : G.countdown > 70 ? "2" : G.countdown > 30 ? "1" : "GO!") : bigMsg ? bigMsg.txt : null;
  if (msg) { ctx.font = `700 ${msg.length > 4 ? 64 : 110}px Fredoka, sans-serif`; ctx.textAlign = "center"; ctx.lineWidth = 12; ctx.strokeStyle = OUT; ctx.strokeText(msg, VW / 2, VH * 0.42); ctx.fillStyle = msg === "GO!" || msg === "GAME!" ? "#FFD23F" : "#fff"; ctx.fillText(msg, VW / 2, VH * 0.42); }
}
function offscreenBubbles(){ const z = G.cam.z, ox = VW / 2 - G.cam.x * z, oy = VH / 2 - G.cam.y * z;
  for (const p of G.players) { if (p.dead || p.out || p.respawnT > 0) continue; const sx = p.x * z + ox, sy = (p.y - 38) * z + oy;
    if (sx > 0 && sx < VW && sy > 0 && sy < VH - 110) continue; const bx = clamp(sx, 50, VW - 50), by = clamp(sy, 50, VH - 160);
    ctx.save(); ctx.translate(bx, by); circ(ctx, 0, 0, 34, "#FFF8EC", 4); ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2); ctx.clip(); ctx.drawImage(portraitOf(p), -30, -36, 60, 60); ctx.restore();
    ctx.save(); ctx.translate(bx, by); ctx.rotate(Math.atan2(sy - by, sx - bx)); ctx.fillStyle = p.color; ctx.strokeStyle = OUT; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(48, 0); ctx.lineTo(36, -10); ctx.lineTo(36, 10); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); } }
function render(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (STATE !== "ARENA_BATTLE") { drawBackground(G.frame); if (STATE === "CHARACTER_SELECT") drawSelectPreviews(); return; }
  drawBackground(G.frame);
  const z = G.cam.z, shx = G.shake ? rnd(-G.shake, G.shake) : 0, shy = G.shake ? rnd(-G.shake, G.shake) : 0;
  ctx.save(); ctx.translate(VW / 2 + shx, VH / 2 + shy); ctx.scale(z, z); ctx.translate(-G.cam.x, -G.cam.y);
  drawStage(); G.items.forEach(drawItem); G.proj.forEach(drawProj);
  G.players.slice().sort((a, b) => (a.hitstun > 0) - (b.hitstun > 0)).forEach(drawPlayer); drawFX();
  ctx.restore();
  offscreenBubbles(); drawHUD();
  if (G.paused) { ctx.fillStyle = "#1D1B2Eaa"; ctx.fillRect(0, 0, VW, VH); }
}

/* =====================================================================================
   18. UI screens (DOM): QUIZ_GATE, CHARACTER_SELECT, PODIUM_RESULTS, pause
   ===================================================================================== */
const ui = $("#ui");
const SAVE_KEY = "smackdown.v1";
function loadSave(){ try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch(e){ return {}; } }
function save(o){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(Object.assign(loadSave(), o))); } catch(e){} }
const params = new URLSearchParams(location.search);
G.subject = params.get("subject") || loadSave().subject || "mix";

function defaultSlots(){ const sv = loadSave().slots;
  return [0, 1, 2, 3].map(i => Object.assign({type:i === 0 ? "human" : i === 1 ? "bot" : "off", ctrl:["kb1","kb2","kb3","kb4"][i], diff:"normal", name:i === 0 ? (params.get("name") || "Player 1") : "Bot " + NAMES[(i * 3) % NAMES.length], av:randomAvatar(), focus:0}, sv && sv[i] ? {av:sv[i].av, name:sv[i].name, ctrl:sv[i].ctrl, diff:sv[i].diff} : {})); }
G.slotsCfg = defaultSlots();

function renderUI(){
  if (STATE === "QUIZ_GATE") return renderQuiz();
  if (STATE === "CHARACTER_SELECT") return renderSelect();
  if (STATE === "PODIUM_RESULTS") return renderPodium();
  if (STATE === "ARENA_BATTLE") { ui.innerHTML = G.paused ? `<div class="screen clear" style="pointer-events:auto;justify-content:center;background:transparent"><div class="panel center" style="width:min(560px,100%)">
      <h2>Paused</h2><div class="keys" style="text-align:left">${Object.values(KEYMAPS).map(m => `<div><b>${m.label}</b><br>${m.hint}</div>`).join("")}<div><b>Gamepad</b><br>Stick move · A jump · X light · Y smash · B item · LB/RB dash</div></div>
      <div class="row" style="justify-content:center;margin-top:14px"><button class="btn primary" data-a="resume">Resume</button><button class="btn" data-a="quit">Quit match</button><button class="btn" data-a="mute">${muted ? "🔇 Sound off" : "🔊 Sound on"}</button></div></div></div>` : ""; }
}
ui.addEventListener("click", e => { const b = e.target.closest("[data-a]"); if (!b) return; audio(); const a = b.dataset.a, v = b.dataset.v;
  const actions = {
    subject:() => { G.subject = v; save({subject:v}); sfx("select"); renderQuiz(); },
    humans:() => { G.humans = +v; sfx("select"); renderQuiz(); },
    startQuiz:() => beginQuiz(),
    answer:() => answerQuiz(+v),
    next:() => nextQuestion(),
    retry:() => { G.quiz.players[G.quiz.cur] = newQuizFor(); renderQuiz(); },
    toSelect:() => goSelect(),
    demo:() => { G.demo = true; G.slotsCfg.forEach((s, i) => { s.type = "bot"; s.diff = ["hard","normal","normal","easy"][i]; s.name = "Bot " + NAMES[i * 2]; s.focus = 0; }); STATE = "CHARACTER_SELECT"; renderUI(); },
    slotType:() => { const s = G.slotsCfg[+v]; s.type = b.value || s.type; renderSelect(); },
    rand:() => { G.slotsCfg[+v].av = randomAvatar(); sfx("select"); renderSelect(); },
    sw:() => { const [i, k, val] = v.split("|"); G.slotsCfg[+i].av[k] = val; sfx("select"); renderSelect(); },
    cyc:() => { const [i, k] = v.split("|"), arr = k === "hair" ? HAIRS : ACCS, av = G.slotsCfg[+i].av; av[k] = arr[(arr.indexOf(av[k]) + 1) % arr.length]; sfx("select"); renderSelect(); },
    fight:() => { const n = G.slotsCfg.filter(s => s.type !== "off").length; if (n < 2) return; save({slots:G.slotsCfg.map(s => ({av:s.av, name:s.name, ctrl:s.ctrl, diff:s.diff}))}); startMatch(G.slotsCfg); },
    rematch:() => { G.quiz = null; STATE = "QUIZ_GATE"; if (G.demo) { startMatch(G.slotsCfg); return; } renderUI(); },
    menu:() => { G.quiz = null; G.demo = false; G.slotsCfg = defaultSlots(); STATE = "QUIZ_GATE"; renderUI(); },
    resume:() => togglePause(),
    quit:() => { G.paused = false; endMatch(); },
    mute:() => { muted = !muted; renderUI(); },
    settings:() => { const k = v; if (k === "stocks") CFG.STOCKS = CFG.STOCKS % 5 + 1; if (k === "time") CFG.TIME_SEC = [180, 300, 0, 120][([180, 300, 0, 120].indexOf(CFG.TIME_SEC) + 1) % 4]; if (k === "items") CFG.ITEMS = !CFG.ITEMS; renderSelect(); }
  }; (actions[a] || (() => {}))(); });
ui.addEventListener("change", e => { const el = e.target; const [kind, i] = (el.dataset.f || "").split("|"); if (!kind) return; const s = G.slotsCfg[+i];
  if (kind === "type") { s.type = el.value; if (s.type === "bot" && !/^Bot /.test(s.name)) s.name = "Bot " + pick(NAMES); } if (kind === "ctrl") s.ctrl = el.value; if (kind === "diff") s.diff = el.value; if (kind === "name") s.name = el.value.slice(0, 14) || s.name; renderSelect(); });
function onUIKey(e){ if (STATE === "QUIZ_GATE" && G.quiz) { const q = G.quiz.players[G.quiz.cur]; if (!q) return;
    if (!q.answered && /^Digit[1-4]$/.test(e.code)) answerQuiz(+e.code.slice(5) - 1); else if (q.answered && (e.code === "Enter" || e.code === "Space")) nextQuestion(); } }

/* ---------- QUIZ_GATE */
function bankFor(subject){ const b = subject === "mix" ? BANK : BANK.filter(q => q.subject === subject); return b.length >= CFG.QUIZ_LEN ? b : BANK; }
function newQuizFor(){ const qs = shuffle(bankFor(G.subject)).slice(0, CFG.QUIZ_LEN).map(q => { const order = shuffle(q.choices.map((c, i) => i)); return {q, order}; });
  return {qs, i:0, right:0, streak:0, best:0, answered:false, pick:-1, log:[], done:false}; }
function beginQuiz(){ audio(); G.quiz = {cur:0, players:Array.from({length:G.humans}, newQuizFor)}; renderQuiz(); }
function answerQuiz(k){ const Q = G.quiz.players[G.quiz.cur], item = Q.qs[Q.i]; if (Q.answered) return; Q.answered = true; Q.pick = k;
  const ok = item.order[k] === item.q.answer; Q.log.push(ok); if (ok) { Q.right++; Q.streak++; Q.best = Math.max(Q.best, Q.streak); sfx("right"); } else { Q.streak = 0; sfx("wrong"); } renderQuiz(); }
function nextQuestion(){ const Q = G.quiz.players[G.quiz.cur]; if (!Q.answered) return; Q.i++; Q.answered = false; Q.pick = -1; if (Q.i >= Q.qs.length) Q.done = true; renderQuiz(); }
const focusOf = Q => Math.min(CFG.FOCUS_CAP, CFG.FOCUS_PER_STREAK * Q.best);
function goSelect(){ const Qz = G.quiz; if (!Qz) return; const Q = Qz.players[Qz.cur]; if (!Q.done || Q.right < CFG.PASS_SCORE) return;
  if (Qz.cur < Qz.players.length - 1) { Qz.cur++; renderQuiz(); return; }
  // passed: map humans onto the first slots, keep their looks
  Qz.players.forEach((P, i) => { const s = G.slotsCfg[i]; s.type = "human"; s.focus = focusOf(P); if (/^Bot /.test(s.name)) s.name = "Player " + (i + 1); s.ctrl = s.ctrl && s.ctrl.startsWith("pad") ? s.ctrl : ["kb1","kb2","kb3","kb4"][i]; });
  for (let i = Qz.players.length; i < 4; i++) { const s = G.slotsCfg[i]; if (s.type === "human") s.type = "off"; s.focus = 0; }
  if (Qz.players.length === 1 && G.slotsCfg[1].type === "off") G.slotsCfg[1].type = "bot";
  G.slotsCfg.forEach(s => { if (s.type === "bot" && !/^Bot /.test(s.name)) s.name = "Bot " + pick(NAMES); });
  STATE = "CHARACTER_SELECT"; renderUI(); }
function renderQuiz(){
  const head = `<div class="logo">Smithtopia <span>Smackdown</span></div><div class="tag" style="margin-bottom:6px">Review first. Then battle.</div>`;
  if (!G.quiz) { ui.innerHTML = `<div class="screen">${head}
    <div class="panel"><div class="tag">Step 1 · Subject</div><div class="row" style="margin-top:8px">${Object.entries(SUBJECTS).map(([k, l]) => `<button class="btn ${G.subject === k ? "on" : ""}" data-a="subject" data-v="${k}">${l}</button>`).join("")}</div>
      <div class="tag" style="margin-top:16px">Step 2 · How many students are playing on this computer?</div><div class="row" style="margin-top:8px">${[1, 2, 3, 4].map(n => `<button class="btn ${G.humans === n ? "on" : ""}" data-a="humans" data-v="${n}">${n} ${n === 1 ? "student (vs bots)" : "students"}</button>`).join("")}</div>
      <p class="hint" style="margin-top:12px">Each student answers ${CFG.QUIZ_LEN} questions and needs ${CFG.PASS_SCORE} right to unlock the match. Your best answer streak becomes a <b>Focus Buff</b>: +${Math.round(CFG.FOCUS_PER_STREAK * 100)}% knockback resistance per streak answer (max ${Math.round(CFG.FOCUS_CAP * 100)}%).

    <div class="panel"><div class="tag">Controls</div><div class="keys">${Object.values(KEYMAPS).map(m => `<div><b>${m.label}</b><br>${m.hint}</div>`).join("")}<div><b>Gamepad</b><br>Stick move · A jump · X light · Y smash · B item · LB/RB dash · Start pause</div></div>
      <p class="hint">Hold smash to charge. Point up or down while charging for an up- or down-smash. Press down on a lunch table or the bleachers to drop through. Push into a wall while falling to wall-slide, then jump to kick off.</p></div></div>`; return; }
  const Qz = G.quiz, Q = Qz.players[Qz.cur], pl = `Player ${Qz.cur + 1}${Qz.players.length > 1 ? ` of ${Qz.players.length}` : ""}`;
  const meter = `<div class="meter">${Q.qs.map((_, i) => `<i class="${i < Q.log.length ? (Q.log[i] ? "ok" : "no") : ""}"></i>`).join("")}</div>`;
  if (Q.done) { const pass = Q.right >= CFG.PASS_SCORE, f = focusOf(Q), last = Qz.cur === Qz.players.length - 1;
    ui.innerHTML = `<div class="screen">${head}<div class="panel center"><div class="tag">${pl} · Review results</div><h2 style="font-size:46px;margin-top:6px">${Q.right} / ${Q.qs.length}</h2>${meter.replace('class="meter"', 'class="meter" style="justify-content:center"')}
      ${pass ? `<p style="font-size:20px;font-weight:800">✅ Match unlocked!</p><p><span class="badge">🧠 Focus Buff +${Math.round(f * 100)}% knockback resistance</span> <span class="badge">🔥 Best streak ${Q.best}</span></p>
        <button class="btn go" data-a="toSelect">${last ? "Choose your fighter →" : `Next: Player ${Qz.cur + 2} →`}</button>`
      : `<p style="font-size:20px;font-weight:800">Not yet. You need ${CFG.PASS_SCORE} right to enter the arena.</p><p class="hint">Read the explanations, then try a fresh set of questions.</p><button class="btn go" data-a="retry">Try a new set →</button>`}</div></div>`; return; }
  const item = Q.qs[Q.i], q = item.q;
  ui.innerHTML = `<div class="screen">${head}<div class="panel"><div class="row" style="justify-content:space-between"><div class="tag">${pl} · ${esc(SUBJECTS[q.subject] || "")} · ${esc(q.unit || "")}</div><div class="badge">Question ${Q.i + 1} of ${Q.qs.length} · 🔥 ${Q.streak}</div></div>${meter}
    <div class="q">${esc(q.q)}</div>

    ${Q.answered ? `<div class="why">${item.order[Q.pick] === q.answer ? "✅ <b>Right!</b> " : "❌ <b>Not quite.</b> "}${esc(q.why || "")}</div><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn primary" data-a="next">${Q.i === Q.qs.length - 1 ? "See results" : "Next question"} (Enter) →</button></div>` : `<p class="hint" style="margin-top:10px">Tip: press 1–4 to answer.</p>`}</div></div>`;

window.SMACK = {G, CFG, BANK:() => BANK, get state(){ return STATE; }, startMatch, step:n => { for (let i = 0; i < (n || 1); i++) step(); }, slots:() => G.slotsCfg,
  quiz:() => G.quiz, answerRight:() => { const Q = G.quiz.players[G.quiz.cur], it = Q.qs[Q.i]; answerQuiz(it.order.indexOf(it.q.answer)); }, nextQuestion, goSelect, beginQuiz,
  setHumans:n => { G.humans = n; }, demo:() => { G.slotsCfg.forEach((s, i) => { s.type = "bot"; s.diff = ["hard","normal","hard","normal"][i]; s.name = "Bot " + NAMES[i]; s.focus = 0; }); startMatch(G.slotsCfg); }};
G.humans = +(params.get("players") || 1);
loadHubBank(() => { renderUI(); if (params.get("demo")) SMACK.demo(); });
renderUI();
requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
