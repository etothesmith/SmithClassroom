<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Classroom Arena — Mastery-based review for every classroom</title>
<meta name="description" content="Standards-aligned review games, primary-source gallery walks and live mastery data for Florida U.S. History classrooms.">
<style id="arenaCss">/* =====================================================================
   CLASSROOM ARENA — design system (light, modern, official)
   Legacy variable names are kept so every game mode re-themes at once.
   ===================================================================== */
:root{
  --navy:#0B1F4B; --primary:#1D4ED8; --primary-600:#1E40AF; --primary-50:#EFF4FF; --primary-100:#DBE6FF;
  --gold:#1D4ED8; --emerald:#059669; --crimson:#DC2626; --sky:#0284C7; --amber:#F59E0B;
  --parch:#0F172A; --ink:#0F172A; --muted:#64748B; --line:#E2E8F0; --line2:#CBD5E1;
  --midnight:#F5F7FB; --cabinet:#FFFFFF; --cab2:#F1F5F9; --surface:#FFFFFF;
  --ok-50:#ECFDF5; --bad-50:#FEF2F2; --warn-50:#FFFBEB;
  --r:14px; --r-sm:10px;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.06);
  --shadow-lg:0 20px 50px rgba(15,23,42,.18);
  --fd:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --fb:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--midnight);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
input,select,textarea{font-family:inherit;font-size:1rem;color:var(--ink);background:#fff;border:1px solid var(--line2);border-radius:var(--r-sm);padding:.6rem .75rem;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-100)}
textarea{width:100%;min-height:140px;resize:vertical}
a{color:var(--primary);text-decoration:none} a:hover{text-decoration:underline}
h1,h2,h3{font-family:var(--fd);letter-spacing:-.02em;margin:.2em 0 .5em;color:var(--ink)}
h1{font-size:1.75rem;font-weight:800} h2{font-size:1.25rem;font-weight:700} h3{font-size:1.02rem;font-weight:700}
.small{font-size:.86rem;color:var(--muted)} .muted{color:var(--muted)} .hide{display:none!important}
.ok{color:var(--emerald)} .bad{color:var(--crimson)} .gold{color:var(--primary)}

/* ------------------------------ top bar ------------------------------ */
#topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.5) blur(10px);border-bottom:1px solid var(--line)}
.tb-row{display:flex;align-items:center;gap:.75rem;padding:.6rem 1.25rem;flex-wrap:wrap;max-width:1320px;margin:0 auto}
.logo{display:flex;align-items:center;gap:.6rem;font-weight:800;font-size:1.05rem;color:var(--navy);white-space:nowrap;letter-spacing:-.02em;cursor:pointer;background:none;border:none;padding:0;text-align:left}
.logo .mark{width:34px;height:34px;flex:none}
.logo small{display:block;font-weight:500;font-size:.75rem;color:var(--muted);letter-spacing:0}
.logo .av{width:34px;height:34px;border-radius:9px;overflow:hidden;flex:none}
.logo .av img,.logo .av svg{width:100%;height:100%;object-fit:cover;display:block}
.roles{display:flex;gap:.2rem;flex-wrap:wrap;margin-left:1rem}
.role{background:transparent;border:none;border-radius:8px;padding:.5rem .8rem;font-size:.92rem;font-weight:600;color:var(--muted)}
.role:hover{background:var(--cab2);color:var(--ink)}
.role.on{background:var(--primary-50);color:var(--primary)}
.tools{display:flex;gap:.35rem;align-items:center;margin-left:auto}
.iconbtn{background:#fff;border:1px solid var(--line);border-radius:9px;padding:.4rem .6rem;min-width:38px;font-size:.88rem;font-weight:600}
.iconbtn:hover{border-color:var(--line2);background:var(--cab2)}
.iconbtn.on{border-color:var(--primary);color:var(--primary);background:var(--primary-50)}
.userbtn{display:flex;align-items:center;gap:.5rem;background:#fff;border:1px solid var(--line);border-radius:999px;padding:.25rem .7rem .25rem .25rem;font-weight:600;font-size:.88rem}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.8rem;flex:none}
.sync{width:9px;height:9px;border-radius:50%;background:var(--line2);display:inline-block}
.sync.saved{background:var(--emerald)} .sync.saving{background:var(--amber)} .sync.error{background:var(--crimson)}
.hud{display:flex;gap:.45rem;padding:.5rem 1.25rem .65rem;flex-wrap:wrap;align-items:center;max-width:1320px;margin:0 auto}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:.28rem .75rem;font-size:.84rem;display:flex;align-items:center;gap:.4rem;white-space:nowrap;color:var(--ink)}
.chip b{color:var(--primary)}
.meter{width:90px;height:8px;background:var(--cab2);border-radius:99px;overflow:hidden;display:inline-block}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#38BDF8);border-radius:99px}
.coin{display:inline-block;width:18px;height:18px;vertical-align:-3px}
.coin img,.coin svg{width:100%;height:100%}
.demo-banner{background:var(--warn-50);color:#92400E;border-bottom:1px solid #FDE68A;font-size:.84rem;text-align:center;padding:.35rem 1rem}

main{max-width:1320px;margin:0 auto;padding:1.5rem 1.25rem 4rem}
main.flush{max-width:none;padding:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.25rem;box-shadow:var(--shadow)}
.grid{display:grid;gap:1rem}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:.75rem;flex-wrap:wrap}

/* ------------------------------ buttons ------------------------------ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;background:#fff;border:1px solid var(--line2);border-radius:var(--r-sm);padding:.6rem 1rem;font-weight:600;font-size:.94rem;color:var(--ink);transition:background .15s,border-color .15s,box-shadow .15s,transform .05s;text-decoration:none!important}
.btn:hover:not(:disabled){background:var(--cab2)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.gold{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 1px 2px rgba(29,78,216,.3)}
.btn.gold:hover:not(:disabled){background:var(--primary-600)}
.btn.em{background:var(--emerald);border-color:var(--emerald);color:#fff}
.btn.em:hover:not(:disabled){background:#047857}
.btn.cr{background:#fff;border-color:#FCA5A5;color:var(--crimson)}
.btn.cr:hover:not(:disabled){background:var(--bad-50)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover:not(:disabled){background:var(--cab2);color:var(--ink)}
.btn.big{font-size:1.02rem;padding:.8rem 1.3rem}
.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.back{background:none;border:none;color:var(--muted);padding:.2rem 0;margin-bottom:.5rem;font-weight:600}
.back:hover{color:var(--primary)}
.tag{display:inline-block;font-size:.72rem;letter-spacing:.02em;padding:.18rem .55rem;border-radius:6px;background:var(--cab2);border:1px solid var(--line);color:var(--muted);font-weight:700}
.tag.gold{color:var(--primary);background:var(--primary-50);border-color:var(--primary-100)}
.tag.em{color:var(--emerald);background:var(--ok-50);border-color:#A7F3D0}
.tag.cr{color:var(--crimson);background:var(--bad-50);border-color:#FECACA}

/* ------------------------- unit & mode cards ------------------------- */
.unit{cursor:pointer;text-align:left;border:1px solid var(--line);transition:.15s;font:inherit;color:var(--ink)}
.unit:hover{border-color:var(--primary-100);box-shadow:0 8px 24px rgba(29,78,216,.12);transform:translateY(-2px)}
.unit.on{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-100),var(--shadow)}
.unit .ico{font-size:1.6rem}
.mode{cursor:pointer;text-align:left;border:1px solid var(--line);display:flex;flex-direction:column;gap:.35rem;min-height:150px;transition:.15s;font:inherit;color:var(--ink)}
.mode:hover{border-color:var(--primary-100);box-shadow:0 10px 28px rgba(29,78,216,.14);transform:translateY(-2px)}
.mode .ico{width:44px;height:44px;border-radius:12px;background:var(--primary-50);display:grid;place-items:center;font-size:1.4rem}
.mode h3{margin:.3rem 0 0}
.mode.locked{opacity:.55}
.timeline{display:flex;gap:.6rem;overflow-x:auto;padding:.3rem 0 .7rem}
.tl{flex:none;width:180px;background:#fff;border:1px solid var(--line);border-top:3px solid var(--primary);border-radius:10px;padding:.55rem .7rem;font-size:.84rem}
.tl b{color:var(--primary)}
.bmbar{display:grid;grid-template-columns:130px 1fr 48px;gap:.6rem;align-items:center;font-size:.84rem;margin:.3rem 0}
.bmbar .meter{width:100%}

/* --------------------------- question engine -------------------------- */
.qwrap{max-width:880px;margin:0 auto}
.stim{background:#FFFBEB;color:#3F2D0A;border-radius:10px;padding:.95rem 1.1rem;font-family:Georgia,'Times New Roman',serif;font-size:1.02rem;border-left:4px solid #D97706;margin-bottom:.9rem}
.stem{font-size:1.2rem;font-weight:700;margin:.4rem 0 1rem;line-height:1.4}
.opts{display:grid;gap:.6rem}
.opt{display:flex;gap:.75rem;align-items:flex-start;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:.85rem 1rem;font-size:1rem;transition:.12s;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--primary);background:var(--primary-50)}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--cab2);font-weight:800;font-size:.85rem;color:var(--primary)}
.opt.right{border-color:var(--emerald);background:var(--ok-50)} .opt.right .k{background:var(--emerald);color:#fff}
.opt.wrong{border-color:var(--crimson);background:var(--bad-50)} .opt.wrong .k{background:var(--crimson);color:#fff}
.opt.gone{opacity:.3;text-decoration:line-through}
.pubar{display:flex;gap:.45rem;flex-wrap:wrap;margin:.7rem 0}
.pu{display:flex;align-items:center;gap:.4rem;background:#fff;border:1px solid var(--line);border-radius:10px;padding:.35rem .65rem;font-size:.84rem;font-weight:600}
.pu .pi{width:22px;height:22px} .pu .pi img,.pu .pi svg{width:100%;height:100%}
.pu.armed{border-color:var(--emerald);box-shadow:0 0 0 3px #A7F3D0}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.5rem}
.timer{height:6px;background:var(--cab2);border-radius:99px;overflow:hidden;margin:.3rem 0 .8rem}
.timer i{display:block;height:100%;background:var(--sky);transition:width 1s linear}
.diag{border:1px solid #FECACA;border-radius:14px;padding:1.1rem;background:var(--bad-50);margin-top:.9rem}
.diag h3{color:var(--crimson)}
.reteach{background:var(--primary-50);border:1px solid var(--primary-100);border-radius:12px;padding:1rem;margin-top:.8rem}
.reteach h3{color:var(--primary-600)}
.lockbar{position:relative;height:32px;background:#fff;border-radius:10px;overflow:hidden;margin-top:.9rem;border:1px solid var(--line)}
.lockbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#FCA5A5,#FDE68A);transition:width .1s linear}
.lockbar span{position:relative;display:block;text-align:center;line-height:32px;font-weight:700;font-size:.88rem}
.good{border:1px solid #A7F3D0;border-radius:14px;padding:1rem;background:var(--ok-50);margin-top:.9rem}
.good h3{color:var(--emerald)}
.note{background:var(--warn-50);color:#3F2D0A;border-left:4px solid var(--amber);padding:.65rem .85rem;margin-top:.6rem;border-radius:8px}
.progress{height:10px;background:var(--cab2);border-radius:99px;position:relative;margin:.35rem 0 1.1rem}
.progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--primary),#38BDF8)}
.progress .thr{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:var(--crimson)}
.steps{display:flex;gap:.45rem;margin-bottom:.8rem}
.step{flex:1;text-align:center;font-size:.8rem;font-weight:600;padding:.45rem;border-radius:9px;background:#fff;border:1px solid var(--line);color:var(--muted)}
.step.on{border-color:var(--primary);color:var(--primary);background:var(--primary-50)} .step.ok{border-color:#A7F3D0;color:var(--emerald);background:var(--ok-50)}

/* ------------------------------- modal -------------------------------- */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(2px);z-index:100;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal{background:#fff;border:1px solid var(--line);border-radius:18px;max-width:900px;width:100%;max-height:92vh;overflow:auto;padding:1.5rem;box-shadow:var(--shadow-lg);position:relative}
.modal.full{max-width:none;height:94vh;max-height:none}
.modal .x{position:absolute;top:.75rem;right:.75rem}

/* ----------------------------- flashcards ----------------------------- */
.flip{perspective:1000px;height:250px;cursor:pointer;max-width:580px;margin:0 auto}
.flip .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:1.3rem;text-align:center;box-shadow:var(--shadow)}
.flip .f{background:linear-gradient(135deg,var(--primary),#3B82F6);color:#fff;font-weight:800;font-size:1.6rem}
.flip .b{background:#fff;border:1px solid var(--line);transform:rotateY(180deg)}
.flip .b .small{color:var(--muted)!important}

/* --------------------- Jeopardy (classic board look) ------------------- */
.jboard{display:grid;grid-template-columns:repeat(5,1fr);gap:.5rem}
.jcat{background:var(--navy);border-radius:10px;padding:.7rem .4rem;text-align:center;font-weight:800;font-size:.85rem;min-height:68px;display:grid;place-items:center;color:#fff;text-transform:uppercase;letter-spacing:.02em}
.jtile{background:linear-gradient(180deg,#1D4ED8,#1E3A8A);border:none;border-radius:10px;font-weight:900;font-size:1.7rem;color:#FCD34D;min-height:78px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.jtile:hover:not(:disabled){filter:brightness(1.12)}
.jtile.used{background:#E2E8F0;color:transparent;box-shadow:none}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem;margin-top:1rem}
.team{background:#fff;border:1px solid var(--line);border-radius:12px;padding:.6rem;text-align:center;color:var(--ink)}
.team .sc{font-weight:900;font-size:1.5rem;color:var(--primary)}
.team .sc.neg{color:var(--crimson)}
.team.lead{border-color:var(--amber);box-shadow:0 0 0 3px #FDE68A}
.clue{font-weight:800;font-size:clamp(1.4rem,3.2vw,2.6rem);line-height:1.3;text-align:center;color:#fff;padding:1.2rem .5rem}
.jblue{background:linear-gradient(180deg,#1E3A8A,#0B1F4B)!important;border-color:#1D4ED8!important;color:#fff}
.jblue .tag{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff}
.jblue .chip{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff} .jblue .chip b{color:#FCD34D}
.jblue .reteach{background:rgba(255,255,255,.96);color:var(--ink)}
.jblue p,.jblue label{color:#E2E8F0}
.jblue .reteach p,.jblue .reteach{color:var(--ink)}
.jblue .x{color:var(--ink)}
.jblue .team p{color:var(--ink)}

/* ------------------------------ gallery ------------------------------- */
.hall{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);min-height:170px;box-shadow:var(--shadow)}
.hall .bg{position:absolute;inset:0} .hall .bg img,.hall .bg svg{width:100%;height:100%;object-fit:cover}
.doors{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.7rem;padding:1.1rem}
.door{background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:12px;padding:.9rem .6rem;text-align:center;min-height:120px;display:flex;flex-direction:column;justify-content:center;gap:.3rem;color:var(--ink);font:inherit}
.door.open{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-100)} .door.done{border-color:var(--emerald)}
.exhibit{background:#3B2A14;border:10px solid #C8A15A;outline:2px solid #8A6A2E;border-radius:6px;padding:1.1rem;box-shadow:0 18px 40px rgba(15,23,42,.25)}
.exhibit .paper{background:#F7F0DC;color:#2A1D0C;padding:1rem 1.1rem;border-radius:4px;font-family:Georgia,serif;font-size:1.05rem}
.plaque{background:#1A1208;color:#EAD7A7;border:1px solid #6E4C18;padding:.5rem .75rem;margin-top:.7rem;font-size:.85rem;border-radius:4px}
.plaque a{color:#FCD34D}
.hs{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.75rem}
.hsb{background:#fff;color:var(--ink);border:1.5px solid var(--line2);border-radius:999px;padding:.4rem .8rem;font-weight:700;font-size:.9rem}
.hsb.seen{background:var(--ok-50);border-color:var(--emerald);color:#065F46}
.hsb.sel{box-shadow:0 0 0 3px var(--primary-100);border-color:var(--primary)}

/* ------------------------------ summit -------------------------------- */
.mtn{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/7;background:#DCEBFF;box-shadow:var(--shadow)}
.mtn svg.trail,.mtn .bg{position:absolute;inset:0;width:100%;height:100%}
.mtn .bg img,.mtn .bg svg{width:100%;height:100%;object-fit:cover}
.mtn .tag{background:#fff}
.climber{position:absolute;width:44px;height:44px;transform:translate(-50%,-90%);transition:left .8s ease,top .8s ease;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.climber img,.climber svg{width:100%;height:100%}
.rock{position:absolute;font-size:2rem;transform:translate(-50%,-120%)}

/* ------------------------------ arcade -------------------------------- */
.cab{border:1px solid var(--line);background:linear-gradient(180deg,#fff,#F5F3FF);text-align:center}
.cab h3{color:#6D28D9}
canvas.game{width:100%;max-width:900px;display:block;margin:0 auto;border-radius:12px;border:1px solid var(--line);background:#0B1020;touch-action:manipulation}

/* -------------------------- tables & studio --------------------------- */
table{border-collapse:separate;border-spacing:0;width:100%;font-size:.88rem;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{border-bottom:1px solid var(--line);padding:.55rem .65rem;text-align:left;vertical-align:top}
tr:last-child td{border-bottom:none}
th{background:#F8FAFC;color:var(--muted);font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.03em}
.heat td{text-align:center;font-weight:700;font-size:.78rem;padding:.35rem .2rem;color:#0F172A}
.heat th{text-transform:none}
.drop{border:2px dashed var(--line2);border-radius:14px;padding:1.5rem;text-align:center;background:#F8FAFC}
.drop.over{border-color:var(--primary);background:var(--primary-50)}
.field{display:flex;flex-direction:column;gap:.3rem;font-size:.9rem}
.field label{color:var(--ink);font-weight:600;font-size:.86rem}
.kw{display:inline-block;margin:.15rem;padding:.2rem .6rem;border-radius:999px;border:1px solid var(--line);font-size:.8rem;color:var(--muted);background:#fff}
.kw.hit{border-color:#A7F3D0;color:var(--emerald);background:var(--ok-50)}
.asset{display:flex;flex-direction:column;gap:.45rem}
.asset .pv{height:120px;border-radius:10px;background:#F8FAFC;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.asset .pv img,.asset .pv svg{max-width:100%;max-height:100%}
details{background:#fff;border:1px solid var(--line);border-radius:10px;padding:.6rem .9rem;margin:.45rem 0}
summary{cursor:pointer;font-weight:700}
.toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;font-weight:600;padding:.7rem 1.1rem;border-radius:12px;z-index:400;box-shadow:var(--shadow-lg);animation:pop .25s}
@keyframes pop{from{transform:translate(-50%,20px);opacity:0}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s 2}
.report{background:#fff;color:#111;border:1px solid var(--line);border-radius:10px;padding:1.5rem;font-family:Georgia,serif}
.report h1{font-family:Georgia,serif;font-weight:700;color:#111;font-size:1.4rem;margin:0}
.report .hash{font-family:ui-monospace,monospace;font-size:1.05rem;background:#F1F5F9;padding:.2rem .5rem;border-radius:4px}

/* ------------------------- portal / marketing ------------------------- */
.pub-nav{display:flex;align-items:center;gap:1rem;max-width:1200px;margin:0 auto;padding:.9rem 1.25rem}
.pub-nav .links{display:flex;gap:.25rem;margin-left:auto;align-items:center;flex-wrap:wrap}
.pub-nav .links .lnk{color:var(--ink);font-weight:600;font-size:.93rem;padding:.45rem .75rem;border-radius:8px;background:none;border:none}
.pub-nav .links .lnk:hover{background:var(--cab2)}
.hero{background:radial-gradient(1000px 500px at 85% -10%,#DBE6FF 0,transparent 60%),radial-gradient(800px 400px at -10% 10%,#E0F2FE 0,transparent 60%),#fff;border-bottom:1px solid var(--line)}
.hero-in{max-width:1200px;margin:0 auto;padding:3.5rem 1.25rem 4rem;display:grid;grid-template-columns:1.1fr .9fr;gap:2.5rem;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:.4rem;background:var(--primary-50);color:var(--primary);border:1px solid var(--primary-100);border-radius:999px;padding:.3rem .8rem;font-weight:700;font-size:.8rem}
.hero h1{font-size:clamp(2.1rem,4.5vw,3.4rem);line-height:1.08;margin:.8rem 0;letter-spacing:-.035em}
.hero h1 span{background:linear-gradient(90deg,var(--primary),#0EA5E9);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{font-size:1.15rem;color:#334155;max-width:560px}
.paths{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;max-width:1200px;margin:-2.2rem auto 0;padding:0 1.25rem;position:relative}
.path{background:#fff;border:1px solid var(--line);border-radius:16px;padding:1.4rem;box-shadow:var(--shadow);text-align:left;font:inherit;color:var(--ink);transition:.15s;display:flex;flex-direction:column;gap:.5rem}
.path:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(29,78,216,.16);border-color:var(--primary-100)}
.path .pi{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:1.5rem}
.path h3{font-size:1.15rem;margin:.2rem 0 0}
.path .go{margin-top:auto;color:var(--primary);font-weight:700}
.section{max-width:1200px;margin:0 auto;padding:4rem 1.25rem}
.section h2.big{font-size:clamp(1.6rem,3vw,2.2rem);font-weight:800;text-align:center;margin-bottom:.4rem}
.section p.sub{text-align:center;color:var(--muted);max-width:660px;margin:0 auto 2rem}
.feat{display:flex;gap:.9rem;align-items:flex-start}
.feat .fi{width:42px;height:42px;border-radius:11px;background:var(--primary-50);display:grid;place-items:center;font-size:1.2rem;flex:none}
.feat h3{margin:.1rem 0 .2rem}
.feat p{margin:0;color:var(--muted);font-size:.93rem}
.strip{background:var(--navy);color:#fff}
.strip .section{padding:2.5rem 1.25rem}
.strip .small{color:#C7D2FE}
.stat{font-size:2.2rem;font-weight:900;letter-spacing:-.03em}
.mock{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden}
.mock .bar{display:flex;gap:6px;padding:.6rem .8rem;border-bottom:1px solid var(--line);background:#F8FAFC}
.mock .bar i{width:10px;height:10px;border-radius:50%;background:#E2E8F0;display:block}
.footer{border-top:1px solid var(--line);background:#fff}
.footer .section{padding:2rem 1.25rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;color:var(--muted);font-size:.88rem}
.authwrap{min-height:calc(100vh - 70px);display:grid;place-items:center;padding:2rem 1rem;background:radial-gradient(900px 500px at 50% -20%,#DBE6FF 0,transparent 60%),var(--midnight)}
.authcard{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);padding:2rem}
.authcard h1{font-size:1.5rem;margin:.6rem 0 .2rem}
.tabs{display:flex;background:var(--cab2);border-radius:10px;padding:4px;margin:1rem 0}
.tabs button{flex:1;border:none;background:none;padding:.5rem;border-radius:8px;font-weight:700;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.codein{font-size:1.9rem;font-weight:800;letter-spacing:.35em;text-align:center;text-transform:uppercase;padding:.6rem;width:100%}
.bigcode{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:2.2rem;font-weight:800;letter-spacing:.18em;color:var(--navy)}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:1rem}
.tile .v{font-size:1.7rem;font-weight:800;letter-spacing:-.02em}
.tile .l{font-size:.82rem;color:var(--muted);font-weight:600}
.clsbtn{text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:.7rem .8rem;font:inherit;color:var(--ink)}
.clsbtn:hover{border-color:var(--primary-100)}
.clsbtn.on{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-100)}
.menu{position:fixed;right:1.25rem;top:58px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);min-width:240px;padding:.4rem;z-index:60}
.menu .who{padding:.55rem .7rem;border-bottom:1px solid var(--line);margin-bottom:.3rem}
.menu button{display:block;width:100%;text-align:left;background:none;border:none;padding:.55rem .7rem;border-radius:8px;font-weight:600}
.menu button:hover{background:var(--cab2)}
.err{color:var(--crimson);font-size:.88rem;min-height:1.2em;margin:.4rem 0}

/* -------------------------------- tour -------------------------------- */
.tour-shield{position:fixed;inset:0;z-index:298}
.tour-hole{position:fixed;z-index:299;border-radius:14px;border:3px solid var(--primary);box-shadow:0 0 0 9999px rgba(15,23,42,.6);pointer-events:none;transition:all .25s}
.tour-tip{position:fixed;z-index:300;width:min(380px,calc(100vw - 24px));background:#fff;border:1px solid var(--line);border-radius:16px;padding:1.1rem;box-shadow:var(--shadow-lg)}

@media (max-width:900px){
  .hero-in{grid-template-columns:1fr;padding-top:2.5rem} .paths{grid-template-columns:1fr;margin-top:1rem}
}
@media (max-width:700px){
  #topbar{position:static} .roles{margin-left:0;width:100%;overflow-x:auto;flex-wrap:nowrap} .role{white-space:nowrap}
  .jcat{font-size:.6rem;min-height:52px}.jtile{font-size:1rem;min-height:54px}
  .bmbar{grid-template-columns:96px 1fr 40px} h1{font-size:1.35rem}
  .pub-nav .links .hide-sm{display:none}
}
@media print{
  body{background:#fff} #topbar,.noprint,.modal-bg>.modal>.x{display:none!important}
  .modal-bg{position:static;background:none;padding:0}.modal{border:none;box-shadow:none;max-height:none}
  main{display:none}
}

  { t:'The Eighteenth Amendment', src:'U.S. Constitution, Amendment XVIII, Section 1 (ratified 1919)', kind:'Document', verbatim:true, q:2,

  { t:'"Mr. Dry"', src:'Rollin Kirby, New York World, 1920s', kind:'Political Cartoon', verbatim:false, q:2,

    hs:[['The black suit and hat','Kirby drew Prohibition supporters as joyless puritans — a clear "wet" point of view.'],['Recurring character','Like Uncle Sam, a repeating symbol lets readers recognize the argument instantly.'],['Cultural conflict','Prohibition split the country: rural, Protestant "drys" vs. urban, immigrant "wets" (SS.912.A.5.6).']],
    hp:['Point of view: Did Kirby support or oppose Prohibition?','He opposed it, mocking "dry" crusaders as joyless hypocrites','He strongly supported it','He was neutral'],

  { t:'Two Paths: Washington and Du Bois', src:'Booker T. Washington, Atlanta, 1895 · W.E.B. Du Bois, The Souls of Black Folk, 1903', kind:'Document', verbatim:true, q:8,

    gem:`Dignified illustration of two paths diverging at a crossroads in early-1900s America: one labeled "INDUSTRIAL EDUCATION" leading to a workshop, one labeled "FULL CIVIL RIGHTS" leading to a courthouse, a third labeled "BLACK PRIDE" leading to a harbor; sepia engraving style, 4:3, no real person's likeness.` },
  { t:'Rugged Individualism', src:'Herbert Hoover, campaign speech, New York, October 1928', kind:'Document', verbatim:true, q:5,

  { t:'Nothing to Fear', src:'Franklin D. Roosevelt, First Inaugural Address, March 4, 1933', kind:'Document', verbatim:true, q:6,

  { t:'Signing the Social Security Act', src:'Franklin D. Roosevelt, statement on signing, August 14, 1935', kind:'Document', verbatim:true, q:6,
    ex:'"We can never insure one hundred percent of the population against one hundred percent of the hazards and vicissitudes of life, but we have tried to frame a law which will give some measure of protection to the average citizen and to his family against the loss of a job and against poverty-ridden old age."',

/* =====================================================================
   GEMINI PROMPTS v2 — era-matched art styles + benchmark-specific scenes.
   Each prompt makes an ORIGINAL teaching illustration (never a copy of a
   historical cartoon/poster/photo, never a real person's likeness).
   ===================================================================== */
const ERA = {
  wood1860: 'Black-and-white wood-engraving style of an 1860s–1870s American illustrated weekly: fine parallel-line hatching, dramatic light and shadow, detailed full-page composition.',
  puck1890: 'Full-color chromolithograph style of an 1880s–1900s American humor magazine: bold black outlines, flat pastel colors, crowded allegorical scene, ornate title banner across the top.',
  ink1915:  '1910s–1920s American newspaper editorial cartoon: loose black-ink brushwork with soft crayon shading on textured newsprint, symbolic figures with block-letter labels.',
  poster1917:'1917 American lithograph poster style: rich saturated reds, blues and creams, strong central figure, bold hand-lettered headline.',
  crayon1935:'1930s–1940s American newspaper editorial cartoon: heavy ink outlines, grease-crayon shading, labels lettered directly on figures and objects.',
  poster1942:'1940s U.S. homefront poster style: flat bold colors, silkscreen texture, strong diagonal composition, large blocky headline.',
  wpa1936:  '1930s WPA silkscreen poster style: flat earthy colors, simplified geometric shapes, bold sans-serif lettering.',
  wash1960: '1950s–1960s American editorial cartoon: expressive brush line with gray ink-wash tones, sparse background, labels on key figures.',
  doc:      'Muted watercolor-and-ink textbook illustration, historically accurate clothing, setting and architecture for the date given.'
};
const RULES = 'Original artwork — do not copy any existing cartoon, poster or photograph, and do not show the likeness of any real person. Spell every label exactly as written in quotation marks. No other text and no watermark. 4:3 landscape unless stated.';
const P = (era, scene) => `${ERA[era]} ${scene} ${RULES}`;

const DEFAULT_STATE = () => ({

  student:{ name:'', period:'' }, tokens:3, streak:0, best:0, xp:0, lastBm:'',

const activeClass = () => (S.classrooms||[]).find(c=>c.id===S.activeClass) || null;
let S = DEFAULT_STATE();
function load(){
  try{ const raw = localStorage.getItem(SAVE_KEY); if(raw){ const d = JSON.parse(raw); const base = DEFAULT_STATE();
    S = Object.assign(base, d); S.settings = Object.assign(base.settings, d.settings||{}); S.student = Object.assign(base.student, d.student||{}); } }catch(e){}
  linkClass();
}
/* The active classroom owns settings, custom sets and art; S.settings/S.custom/S.assets point at it. */
function linkClass(){
  EDIT_V++; const c=activeClass(); const base=DEFAULT_STATE();
  if(c){ c.settings=Object.assign(base.settings, c.settings||{}); c.custom=c.custom||[]; c.assets=c.assets||{}; S.settings=c.settings; S.custom=c.custom; S.assets=c.assets; }
  Object.keys(GEMINI_ASSETS).forEach(k=>GEMINI_ASSETS[k]='');
  Object.assign(GEMINI_ASSETS, Object.fromEntries(Object.entries(S.assets||{}).filter(([k,v])=>v && k in GEMINI_ASSETS)));
}
function save(){
  const c=activeClass(); if(c){ c.settings=S.settings; c.custom=S.custom; c.assets=S.assets; }
  const out=Object.assign({}, S); if(c){ delete out.settings; delete out.custom; delete out.assets; }
  if(typeof queueSync==='function') queueSync();
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(out)); return true; }catch(e){ return false; }
}

function hash(str){ let h1=0xdeadbeef, h2=0x41c6ce57; for(let i=0;i<str.length;i++){ const c=str.charCodeAt(i); h1=Math.imul(h1^c,2654435761); h2=Math.imul(h2^c,1597334677);} h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909); h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909); return ((h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0')).toUpperCase(); }
function copyText(txt){
  const done = () => toast('📋 '+t('copied'));
  try{ navigator.clipboard.writeText(txt).then(done, fallback); }catch(e){ fallback(); }
  function fallback(){ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); done();}catch(e){ toast(t('copyFail')); } ta.remove(); }
}

async function download(name, content, type='text/plain'){
  if(DLCAP){ try{ await DLCAP.save({filename:name, data:content}); toast('⬇️ '+t('downloadStarted')); return; }catch(e){ if(e&&e.code==='declined') return; } }
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([content],{type})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 500); toast('⬇️ '+t('downloadStarted')); }catch(e){ toast(t('downloadBlocked')); }
}

      const c=this.ctx, o=c.createOscillator(), g=c.createGain(), t0=c.currentTime+when;

function itemScore(id){ const s=S.qstat[id]; return s==='first'||s==='mastered' ? 1 : s==='remediated' ? .5 : 0; }
function bmPct(unit, bm){ const qs=unit.qs.filter(q=>q.bm===bm); if(!qs.length) return null; return Math.round(100*qs.reduce((a,q)=>a+itemScore(q.id),0)/qs.length); }
function unitPct(unit){ if(!unit.qs.length) return 0; return Math.round(100*unit.qs.reduce((a,q)=>a+itemScore(q.id),0)/unit.qs.length); }
function award(n, why){ if(n<=0) return; S.tokens+=n; SFX.coin(); toast(`${coin()} +${n} ${t('tokens')} — ${esc(why)}`); save(); renderHUD(); }
function onCorrect(first, mult=1){
  if(first){ S.streak++; S.best=Math.max(S.best,S.streak); S.xp+=100*mult; if(S.streak%3===0) award(1*mult, `${S.streak}× ${t('streak')}`); else if(mult>1) award(1, 'Bounty'); }
  save(); renderHUD();
}
function onMiss(shielded){ if(!shielded) S.streak=0; save(); renderHUD(); }

const LETTERS='ABCDE';
function generic(q,i){ return (q.w && q.w[i-1]) || 'Re-read the stem and compare this choice to the benchmark — it does not match the evidence.'; }

/* Renders one multiple-choice step. Resolves with original option index, 'timeout', or 'skip'. */
function mcStep(host, item, ctx={}){
  return new Promise(resolve=>{
    const order = S.settings.shuffle ? shuffle(item.o.map((_,i)=>i)) : item.o.map((_,i)=>i);
    const timed = typeof S.settings.timer==='number' && ctx.timed!==false;
    let left = timed ? S.settings.timer : 0, iv=null, doneFlag=false;
    const inv = ctx.inv;
    host.innerHTML=`
      <div class="qtop"><div class="row">${ctx.tags||''}</div><div class="row">${ctx.right||''}</div></div>
      ${timed?`<div class="timer"><i style="width:100%"></i></div>`:''}
      ${item.st?`<div class="stim">${esc(item.st)}</div>`:''}
      <div class="stem">${esc(item.s)}</div>
      <div class="opts">${order.map((oi,k)=>`<button class="opt" data-i="${oi}"><span class="k">${LETTERS[k]}</span><span>${esc(item.o[oi])}</span></button>`).join('')}</div>
      ${inv?`<div class="pubar" id="pubar"></div>`:''}
      <div class="row" style="margin-top:.7rem">
        ${ctx.allowSkip?`<button class="btn ghost" id="bmk">${t('bookmark')}</button>`:''}
        ${ctx.unit?`<button class="btn ghost" id="cns">${t('consult')}</button>`:''}
      </div><div id="hint"></div>`;
    const finish = v => { if(doneFlag) return; doneFlag=true; clearInterval(iv); resolve(v); };
    $$('.opt',host).forEach(b=>b.onclick=()=>{ if(b.classList.contains('gone')) return; SFX.click(); finish(+b.dataset.i); });
    if(ctx.allowSkip) $('#bmk',host).onclick=()=>finish('skip');
    if(ctx.unit) $('#cns',host).onclick=()=>consultModal(ctx.unit, item);
    if(timed){ const bar=$('.timer i',host); iv=setInterval(()=>{ left--; bar.style.width=(100*left/S.settings.timer)+'%'; if(left<=5&&left>0) SFX.tick(); if(left<=0) finish('timeout'); },1000); }
    if(inv) drawPU();
    function drawPU(){
      const pb=$('#pubar',host); if(!pb) return;
      const P=[['lens','powerup_primary_lens','Primary Source Lens'],['shield','powerup_historian_shield','Historian\'s Shield'],['bounty','powerup_bounty','Double Bounty']];
      pb.innerHTML=P.map(([k,a,l])=>`<button class="pu ${inv.armed&&inv.armed[k]?'armed':''}" data-pu="${k}" ${inv[k]>0?'':'disabled'}><span class="pi">${asset(a)}</span>${l} ×${inv[k]||0}</button>`).join('');
      $$('[data-pu]',pb).forEach(b=>b.onclick=()=>{
        const k=b.dataset.pu; if(inv[k]<=0) return; inv.armed=inv.armed||{};
        if(k==='lens'){
          const live=$$('.opt',host).filter(o=>+o.dataset.i!==0 && !o.classList.contains('gone'));
          if(live.length<=1) return; inv.lens--; pick(live).classList.add('gone');
          const clue=(item.r?item.r[1]:'').split(/[.:;]/)[0]; $('#hint',host).innerHTML=clue?`<div class="note">🔍 <b>Clue:</b> ${esc(clue)}…</div>`:''; SFX.coin();
        } else { if(inv.armed[k]) return; inv[k]--; inv.armed[k]=true; SFX.coin(); toast(k==='shield'?'🛡️ Shield armed — your streak is protected on a miss.':'⚡ Bounty armed — double XP & tokens on a first-try correct.'); }
        drawPU();
      });
    }
  });
}

function markOpts(host, chosen){
  $$('.opt',host).forEach(b=>{ b.disabled=true; const i=+b.dataset.i; if(i===0) b.classList.add('right'); else if(i===chosen) b.classList.add('wrong'); });
}

/* The 5-second (configurable) Read-Lock diagnostic card. */
function diagnostic(host, item, chosen, opts={}){
  return new Promise(resolve=>{
    const secs = S.settings.god ? 0 : (opts.lock ?? S.settings.lock);
    const why = chosen==='timeout' ? t('timeUp') : generic(item, chosen);
    const d=document.createElement('div'); d.className='diag';
    d.innerHTML=`<h3>❌ ${t('whyWrong')}</h3>
      ${chosen!=='timeout'?`<p><b>${t('youChose')}:</b> ${esc(item.o[chosen])}</p>`:''}
      <p>${esc(why)}</p>
      <p class="ok"><b>${t('correctAns')}:</b> ${esc(item.o[0])}</p>
      ${item.r?`<div class="reteach"><h3>📘 Reteach Micro-Lesson: ${esc(item.r[0])}</h3><p>${esc(item.r[1])}</p>${opts.bm?`<p class="small"><span class="tag gold">${esc(opts.bm)}</span> ${esc((typeof BENCHMARK_TEXT!=='undefined'&&BENCHMARK_TEXT[opts.bm])||'')}</p>`:''}</div>`:''}
      <div class="lockbar"><i style="width:100%"></i><span>${t('readLock')}: ${secs}s…</span></div>
      <button class="btn gold big" style="margin-top:.7rem;width:100%" disabled>${opts.btn||t('toRemed')}</button>`;
    host.appendChild(d); d.scrollIntoView({behavior:'smooth',block:'start'});
    const bar=$('.lockbar i',d), lab=$('.lockbar span',d), btn=$('button',d);
    const t0=performance.now();
    const step=()=>{ const el=(performance.now()-t0)/1000, rem=Math.max(0,secs-el);
      bar.style.width=(secs?100*rem/secs:0)+'%'; lab.textContent= rem>0 ? `${t('readLock')}: ${Math.ceil(rem)}s…` : '✔ '+t('cont');
      if(rem>0) requestAnimationFrame(step); else { btn.disabled=false; } };
    step();
    btn.onclick=()=>{ SFX.click(); resolve(); };
  });
}

/* Full mastery item: primary → (claim+evidence) → diagnostic → parallel loop.
   Resolves {correct, firstTry, loops, skipped}. */
async function runItem(host, q, ctx={}){
  const unit = ctx.unit; let loops=0;
  S.lastBm = q.bm || S.lastBm; renderHUD();
  const tags = `<span class="tag gold" title="${esc((typeof BENCHMARK_TEXT!=='undefined'&&BENCHMARK_TEXT[q.bm])||'')}">${esc(q.bm||'')}</span>${q.dok?`<span class="tag">DOK ${q.dok}</span>`:''}${ctx.label?`<span class="tag em">${esc(ctx.label)}</span>`:''}`;
  const chosen = await mcStep(host, q, {...ctx, tags});
  if(chosen==='skip') return {skipped:true};
  let ok = chosen===0, evMiss=false;
  if(ok && q.ev && S.settings.claimEvidence){
    markOpts(host, chosen);
    const box=document.createElement('div'); box.className='good'; box.innerHTML=`<h3>🔒 ${t('claimOk')}</h3><div id="evh"></div>`; host.appendChild(box);
    const evItem={ s:q.ev[0], o:q.ev.slice(1), w:['That detail does not connect to the claim — it is from a different topic or era.','That detail is true but irrelevant to the claim.'] };
    const evHost=$('#evh',box);
    const e = await mcStep(evHost, evItem, {timed:false, tags:`<span class="tag em">${t('evidenceQ')}</span>`});
    if(e!==0){ ok=false; evMiss=true; markOpts(evHost, e); SFX.wrong(); onMiss(ctx.inv&&ctx.inv.armed&&ctx.inv.armed.shield);
      await diagnostic(evHost, {...evItem, r:q.r}, e, {bm:q.bm}); }
    else markOpts(evHost, 0);
  }
  if(ok){
    if(!q.ev || !S.settings.claimEvidence) markOpts(host, 0);
    SFX.right();
    const mult = ctx.inv&&ctx.inv.armed&&ctx.inv.armed.bounty ? 2 : 1;
    if(ctx.inv&&ctx.inv.armed){ ctx.inv.armed.bounty=false; ctx.inv.armed.shield=false; }
    onCorrect(true, mult);
    const g=document.createElement('div'); g.className='good';
    g.innerHTML=`<h3>✅ ${t('nice')} ${mult>1?'⚡×2':''}</h3>${q.r?`<p class="small"><b>${esc(q.r[0])}:</b> ${esc(q.r[1].slice(0,220))}${q.r[1].length>220?'…':''}</p>`:''}<button class="btn em big" style="width:100%">${t('next')} →</button>`;
    host.appendChild(g); g.scrollIntoView({behavior:'smooth',block:'nearest'});
    await new Promise(r=>$('button',g).onclick=r);
    return {correct:true, firstTry:true, loops:0};
  }
  if(!evMiss){
    markOpts(host, chosen); SFX.wrong(); $('.qwrap')?.classList.add('shake');
    const shield = ctx.inv&&ctx.inv.armed&&ctx.inv.armed.shield;
    onMiss(shield); if(shield) toast('🛡️ Historian\'s Shield saved your streak!');
    await diagnostic(host, q, chosen, {bm:q.bm});
  }
  if(ctx.inv&&ctx.inv.armed){ ctx.inv.armed.bounty=false; ctx.inv.armed.shield=false; }
  // Parallel remediation until passed
  const par = q.p || makeParallel(q);
  while(true){
    loops++; S.loops++; save();
    const wrap=document.createElement('div'); host.innerHTML=''; host.appendChild(wrap);
    const pr = await mcStep(wrap, par, {timed:false, unit, tags:`<span class="tag cr">🔁 ${t('remedTitle')}</span><span class="tag gold">${esc(q.bm||'')}</span>`, right:`<span class="small">${t('remedSub')}</span>`});
    if(pr===0){ markOpts(wrap,0); SFX.right();
      const g=document.createElement('div'); g.className='good'; g.innerHTML=`<h3>✅ ${t('remedPassed')}</h3><button class="btn em big" style="width:100%">${t('next')} →</button>`;
      wrap.appendChild(g); await new Promise(r=>$('button',g).onclick=r);
      return {correct:false, firstTry:false, loops};
    }
    markOpts(wrap, pr); SFX.wrong();
    await diagnostic(wrap, {...par, r:q.r}, pr, {bm:q.bm, btn:'🔁 Try the remediation check again (reshuffled)'});
  }
}
function makeParallel(q){
  const ds=q.o.slice(1);
  return { s:'Which statement is historically accurate?', o:[`${q.s} → ${q.o[0]}`, ...ds.map(d=>`${q.s} → ${d}`)], w:ds.map(()=> 'That pairing repeats a trap from the original question.') };
}

  const g=(unit.gallery||[]).find(s=>unit.qs[s.q]===item) || null;
  modal(`<h2>📜 Primary Source & Context</h2>

    ${g?`<div class="exhibit"><div class="paper">${esc(g.ex)}</div><div class="plaque"><b>${esc(g.t)}</b> — ${esc(g.src)}</div></div>`:''}

        <button class="card mode" data-go="summit"><span class="ico">🏔️</span><h3>${t('summit')}</h3><span class="small">${t('summitD')}</span></button>
        <button class="card mode cab" data-go="arcade"><span class="ico">🕹️</span><h3>${t('arcade')}</h3><span class="small">${t('arcadeD')}</span><span>${coin()} <b>${S.tokens}</b></span></button>
      </div>
      <h3 style="margin-top:1rem">📊 ${t('mastery')} by ${t('benchmark')}</h3>
      ${[...new Set(u.qs.map(q=>q.bm))].map(bm=>{ const p=bmPct(u,bm)||0; return `<div class="bmbar"><span>${esc(bm)}</span><span class="meter"><i style="width:${p}%"></i></span><b class="${p>=S.settings.threshold?'ok':''}">${p}%</b></div>`; }).join('')}
    </div>`;

    if(v==='arcade') return go('arcade');
    needProfile(()=>go(v)); });
}
function go(view, extra){ S.view=view; S._extra=extra||null; save(); render(); window.scrollTo(0,0); }
const backBtn = () => `<button class="back" data-back>${t('back')}</button>`;
function bindBack(m){ $$('[data-back]',m).forEach(b=>b.onclick=()=>{ SFX.click(); go('hub'); }); }

/* ===================== MODE D: INDEPENDENT GAUNTLET ================= */
function renderGauntlet(m, preset){
  const u = preset ? preset.unit : curUnit();
  const run = { u, t0:Date.now(), loops:0, results:{}, deck:shuffle((u.vocab||[]).map((v,i)=>({v,i,tries:0}))), phase:(u.vocab&&u.vocab.length&&!(preset&&preset.skipDeck))?'deck':'q', response:'' };
  const host = () => $('#gz',m);
  m.innerHTML = `${backBtn()}<div class="qwrap">
    <div class="spread"><h1>🧭 ${t('gauntlet')}</h1><span class="tag gold">${esc(u.title)}</span></div>
    <div class="steps"><div class="step" data-ph="deck">1 · ${t('deck')}</div><div class="step" data-ph="q">2 · ${t('qGauntlet')}</div><div class="step" data-ph="sr">3 · ${t('response')}</div><div class="step" data-ph="rep">4 · ${t('report')}</div></div>
    <div id="gz" class="card"></div></div>`;
  bindBack(m);
  const setStep = ph => { const order=['deck','q','sr','rep']; $$('.step',m).forEach(s=>{ const i=order.indexOf(s.dataset.ph), c=order.indexOf(ph); s.className='step '+(i<c?'ok':i===c?'on':''); }); };
  next();
  function next(){ setStep(run.phase); if(run.phase==='deck') deck(); else if(run.phase==='q') questions(); else if(run.phase==='sr') response(); else report(); }

  function deck(){
    const total=run.deck.length; let seen=0;
    show();
    function show(){
      if(!run.deck.length){ run.phase='q'; return next(); }
      const c=run.deck[0];
      host().innerHTML=`<div class="spread"><h2>📇 ${t('deck')}</h2><span class="small">${Math.min(seen+1,total)} / ${total}${c.tries?' · 🔁 review':''}</span></div>
        <p class="small">${t('flipHint')}</p>
        <div class="flip" id="fc"><div class="in"><div class="f">${esc(c.v[0])}</div><div class="b"><p style="font-size:1.1rem"><b>${esc(c.v[1])}</b></p>${c.v[2]?`<p class="small" style="color:#cfe">⭐ ${esc(c.v[2])}</p>`:''}</div></div></div>
        <div class="row" style="justify-content:center;margin-top:1rem"><button class="btn cr" id="nr" disabled>${t('needReteach')}</button><button class="btn em" id="gi" disabled>${t('gotIt')}</button></div>
        ${S.settings.god?'<p style="text-align:center"><button class="btn ghost" id="skipDeck">⚡ Skip deck (God Mode)</button></p>':''}`;
      const fc=$('#fc',host()); fc.onclick=()=>{ fc.classList.toggle('on'); SFX.click(); $('#nr',host()).disabled=false; $('#gi',host()).disabled=false; };
      $('#gi',host()).onclick=()=>{ run.deck.shift(); seen++; show(); };
      $('#nr',host()).onclick=()=>{ const c2=run.deck.shift(); c2.tries++; if(c2.tries<3) run.deck.push(c2); else seen++; show(); };
      const sk=$('#skipDeck',host()); if(sk) sk.onclick=()=>{ run.deck=[]; show(); };
    }
  }

  async function questions(){
    const thr=S.settings.threshold; const items = preset&&preset.items ? preset.items : u.qs;
    let queue = (S.settings.shuffle?shuffle(items):items.slice()).map(q=>({q, pass:0}));
    const status={}; let attemptedAll=false, firstPass=queue.length, served=0;
    const pct=()=> Math.round(100*items.reduce((a,q)=>a+(status[q.id]==='first'||status[q.id]==='mastered'?1:status[q.id]==='remediated'?.5:0),0)/items.length);
    while(queue.length){
      const cur=queue.shift(); served++; if(served>=firstPass) attemptedAll=true;
      host().innerHTML=`<div class="spread"><b>${t('qGauntlet')}</b><span class="small">${t('mastery')} ${pct()}% · goal ${thr}%</span></div>
        <div class="progress"><i style="width:${pct()}%"></i><span class="thr" style="left:${thr}%"></span></div><div id="qh"></div>`;
      const res = await runItem($('#qh',host()), cur.q, {unit:u, allowSkip:cur.pass===0, label: cur.pass? '🔁 Return visit' : ''});
      if(res.skipped){ queue.push({...cur, pass:cur.pass}); cur.q._bm=true; if(served<=firstPass) firstPass++; continue; }
      if(res.firstTry){ status[cur.q.id] = cur.pass ? 'mastered' : 'first'; }
      else { status[cur.q.id]='remediated'; run.loops+=res.loops; queue.push({q:cur.q, pass:cur.pass+1}); }
      S.qstat[cur.q.id] = (S.qstat[cur.q.id]==='first'||S.qstat[cur.q.id]==='mastered') && status[cur.q.id]==='remediated' ? 'remediated' : status[cur.q.id]; save(); renderHUD();
      if(attemptedAll && pct()>=thr) break;
    }
    run.status=status; run.pct=pct(); run.items=items; run.phase='sr'; award(1,'Gauntlet threshold reached'); next();
  }

  function response(){
    const sr=u.sr||{p:`Explain the most important ideas from ${u.title}. Use specific evidence.`,k:[]};
    host().innerHTML=`<h2>✍️ ${t('response')}</h2><div class="stim">${esc(sr.p)}</div>
      <p class="small">${t('minWords')} · Benchmark keyword checklist:</p><div id="kws">${sr.k.map(k=>`<span class="kw" data-k="${esc(k)}">${esc(k)}</span>`).join('')}</div>
      <textarea id="resp" placeholder="Claim → Evidence → Explanation…">${esc(run.response)}</textarea>
      <div class="spread"><span id="wc" class="small">0 words</span><button class="btn gold" id="sub" disabled>${t('submit')}</button></div>`;
    const ta=$('#resp',host());
    const upd=()=>{ run.response=ta.value; const n=words(ta.value); $('#wc',host()).innerHTML=`<b class="${n>=40?'ok':'bad'}">${n}</b> / 40 words · ${sr.k.filter(k=>ta.value.toLowerCase().includes(k.toLowerCase())).length} keywords`;
      $$('.kw',host()).forEach(s=>s.classList.toggle('hit', ta.value.toLowerCase().includes(s.dataset.k.toLowerCase()))); $('#sub',host()).disabled=n<40; };
    ta.oninput=upd; upd();
    $('#sub',host()).onclick=()=>{ run.phase='rep'; run.t1=Date.now(); award(1,'Historian response submitted'); SFX.fanfare(); next(); };
  }

  function report(){
    const mins=Math.max(1,Math.round((run.t1-run.t0)/60000)), sr=u.sr||{p:'',k:[]};
    const bms=[...new Set(run.items.map(q=>q.bm))];
    const rows=bms.map(bm=>{ const qs=run.items.filter(q=>q.bm===bm); const f=qs.filter(q=>run.status[q.id]==='first').length, ms=qs.filter(q=>run.status[q.id]==='mastered').length;
      const p=Math.round(100*qs.reduce((a,q)=>a+(['first','mastered'].includes(run.status[q.id])?1:run.status[q.id]==='remediated'?.5:0),0)/qs.length);
      return {bm,n:qs.length,f,ms,p}; });
    const code=hash([S.student.name,S.student.period,u.id,run.pct,run.loops,run.t1,run.response.length].join('|')).match(/.{4}/g).join('-');
    const kwHit=sr.k.filter(k=>run.response.toLowerCase().includes(k.toLowerCase()));
    const html=`<div class="report" id="rep">
      <div class="spread"><h1>Classroom Arena — Mastery Report</h1><span class="hash">${code}</span></div>
      ${activeClass()?`<p><b>Classroom:</b> ${esc(activeClass().name)}${activeClass().teacher?' &nbsp; <b>Teacher:</b> '+esc(activeClass().teacher):''}</p>`:''}<p><b>Student:</b> ${esc(S.student.name)} &nbsp; <b>Period:</b> ${esc(S.student.period)} &nbsp; <b>Date:</b> ${new Date(run.t1).toLocaleString()}</p>
      <p><b>Unit:</b> ${esc(u.title)} &nbsp; <b>Time spent:</b> ${mins} min &nbsp; <b>Reteach loops completed:</b> ${run.loops} &nbsp; <b>Final mastery:</b> ${run.pct}% (goal ${S.settings.threshold}%)</p>
      <table><tr><th>Benchmark</th><th>Items</th><th>First-try</th><th>Mastered after reteach</th><th>Mastery</th></tr>
      ${rows.map(r=>`<tr><td>${esc(r.bm)}</td><td>${r.n}</td><td>${r.f}</td><td>${r.ms}</td><td><b>${r.p}%</b></td></tr>`).join('')}</table>
      <h3 style="font-family:Georgia,serif;color:#111;margin-top:1rem">Historian Synthesis Response (${words(run.response)} words · keywords: ${esc(kwHit.join(', ')||'none')})</h3>
      <p style="font-style:italic">${esc(sr.p)}</p><p style="white-space:pre-wrap">${esc(run.response)}</p>
      <p style="font-size:.8rem;color:#555">Verification code ${code} is generated from this student's results. Teachers can compare codes to spot copied reports.</p></div>`;
    const text=`CLASSROOM ARENA — MASTERY REPORT\nVerification: ${code}\n${activeClass()?'Classroom: '+activeClass().name+(activeClass().teacher?'  Teacher: '+activeClass().teacher:'')+'\n':''}Student: ${S.student.name}  Period: ${S.student.period}\nUnit: ${u.title}\nDate: ${new Date(run.t1).toLocaleString()}\nTime spent: ${mins} min  Reteach loops: ${run.loops}  Final mastery: ${run.pct}%\n\n`+rows.map(r=>`${r.bm}: ${r.p}% (${r.f} first-try, ${r.ms} after reteach, ${r.n} items)`).join('\n')+`\n\nPrompt: ${sr.p}\n\nResponse (${words(run.response)} words):\n${run.response}\n`;
    if(typeof SESSION!=='undefined' && SESSION.type==='student' && S.join && !run.sent){ run.sent=true; API.submitReport(S.join.classId,{name:S.join.name, period:S.join.period, unit:u.title, unitId:u.id, pct:run.pct, loops:run.loops, mins, code, rows, prompt:sr.p, response:run.response, words:words(run.response)}).then(()=>toast('📤 Report sent to your teacher')).catch(()=>toast('⚠️ Report not sent — copy it instead')); }
    host().innerHTML=`<h2>📄 ${t('report')}</h2>${html}
      <div class="row noprint" style="margin-top:1rem"><button class="btn gold" id="pp">${t('printPdf')}</button><button class="btn" id="cp">${t('copyReport')}</button><button class="btn" id="dl">${t('downloadHtml')}</button><button class="btn ghost" data-back>${t('back')}</button></div>
      <p class="small noprint">Submit to Canvas: Print → "Save as PDF", or Copy and paste into the Canvas text box. (If printing is blocked in this preview, use Copy or open the app from your class website.)</p>`;
    bindBack(host());
    $('#pp',host()).onclick=()=>{ const mm=modal(html+'<p class="noprint small">Use your browser\'s print dialog → Save as PDF.</p>'); try{ window.print(); }catch(e){ toast(t('downloadBlocked')); } };
    $('#cp',host()).onclick=()=>copyText(text);
    $('#dl',host()).onclick=()=>download(`mastery_report_${(S.student.name||'student').replace(/\W+/g,'_')}_${u.id}.html`, `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Mastery Report</title><style>body{font-family:Georgia,serif;max-width:800px;margin:2rem auto;color:#111}table{border-collapse:collapse;width:100%}td,th{border:1px solid #bbb;padding:6px;text-align:left}th{background:#eee}.hash{font-family:monospace;background:#f3f3f3;padding:2px 6px}</style></head><body>${html}</body></html>`,'text/html');
  }
}

/* ======================= MODE B: GALLERY WALK ======================= */
function renderGallery(m){
  const u=curUnit(), st=u.gallery||[];
  const prog = S.galleryDone[u.id] = S.galleryDone[u.id] || [];
  const unlocked = i => S.settings.god || i===0 || prog.includes(i-1);
  m.innerHTML=`${backBtn()}<div class="spread"><h1>🏛️ ${t('gallery')}</h1><span class="tag gold">${esc(u.title)}</span></div>
    <div class="hall"><div class="bg">${asset('gallery_walk_hall')}</div><div class="doors">${st.map((s,i)=>`
      <button class="door ${prog.includes(i)?'done':unlocked(i)?'open':''}" data-st="${i}" ${unlocked(i)?'':'disabled'}>
        <span style="font-size:1.6rem">${prog.includes(i)?'✅':unlocked(i)?'🚪':'🔒'}</span><b>Station ${i+1}</b><span class="small">${unlocked(i)?esc(s.t):t('locked')}</span></button>`).join('')}</div></div>
    <p class="small">Complete each station's 3-step Field Log to unlock the next gallery door. ${prog.length}/${st.length} complete.</p>`;
  bindBack(m);
  $$('[data-st]',m).forEach(b=>b.onclick=()=>{ SFX.click(); station(+b.dataset.st); });

  function station(i){
    const s=st[i], seen=new Set(); let step=0, sel=-1;
    m.innerHTML=`<button class="back" id="toHall">← Gallery Hall</button>
      <div class="grid g2">
        <div><div class="exhibit">${stationImg(u,i)?`<img src="${stationImg(u,i)}" alt="${esc(s.t)}" style="width:100%;display:block;border-radius:4px;margin-bottom:.6rem;cursor:zoom-in" id="exImg">${stationImgKind(u,i)==='original'?'':'<p class="small" style="color:#e8d3a2;margin:.2rem 0 .6rem">⚠️ Teaching illustration created for this class — not a historical artifact.</p>'}`:''}
          <div class="paper" style="white-space:pre-line">${s.kind==='Political Cartoon'&&!s.verbatim?'<b>What the cartoon shows:</b> ':''}${esc(s.ex)}</div>
          <div class="plaque"><b>${esc(s.t)}</b><br>${esc(s.src)} · <i>${esc(s.kind)}</i>${s.verbatim?' · verbatim text':' · description'}${s.link?` · <a href="${esc(s.link)}" target="_blank" rel="noopener" style="color:#F2B441">View the original ↗</a>`:''}</div></div>
          ${isTeacherView()?`<div class="row" style="margin-top:.5rem"><button class="btn" id="tUp">⬆️ Upload original scan</button>${s.gem?'<button class="btn" id="tUpG">⬆️ Upload Gemini art</button><button class="btn ghost" id="tGem">📋 Gemini prompt</button>':''}</div>`:''}
          <div class="hs">${s.hs.map((h,k)=>`<button class="hsb" data-h="${k}">🔍 ${esc(h[0])}</button>`).join('')}</div><div id="nt"></div></div>
        <div class="card"><h2>📝 ${t('fieldLog')}</h2><div class="steps"><div class="step on">${t('s1')}</div><div class="step">${t('s2')}</div><div class="step">${t('s3')}</div></div><div id="log"><p>${t('inspectAll')}</p><p class="small" id="cnt">0 / 3</p></div></div>
      </div>`;
    $('#toHall',m).onclick=()=>renderGallery(m);
    const ei=$('#exImg',m); if(ei) ei.onclick=()=>modal(`<img src="${stationImg(u,i)}" style="width:100%"><p class="small">${esc(s.t)} — ${esc(s.src)}</p>`);
    if($('#tUp',m)) $('#tUp',m).onclick=()=>uploadStationImg(u,i,'original',()=>station(i));
    if($('#tUpG',m)) $('#tUpG',m).onclick=()=>uploadStationImg(u,i,'gemini',()=>station(i));
    if($('#tGem',m)) $('#tGem',m).onclick=()=>{ const mm=modal(`<h2>🎨 Gemini prompt — ${esc(s.t)}</h2><textarea style="min-height:180px">${esc(s.gem)}</textarea><button class="btn gold" id="cpg">📋 Copy</button>`); $('#cpg',mm).onclick=()=>copyText(s.gem); };
    $$('[data-h]',m).forEach(b=>b.onclick=()=>{ SFX.click(); const k=+b.dataset.h; seen.add(k); b.classList.add('seen'); $$('.hsb',m).forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); sel=k;
      $('#nt',m).innerHTML=`<div class="note"><b>🔍 ${esc(s.hs[k][0])}</b><br>${esc(s.hs[k][1])}${step===1?`<br><button class="btn gold" id="citeBtn" style="margin-top:.5rem">📌 ${t('cite')}</button>`:''}</div>`;
      if(step===1) $('#citeBtn',m).onclick=cite;
      if(step===0){ $('#cnt',m).textContent=`${seen.size} / 3`; if(seen.size===3) hipp(); } });
    const steps=()=>$$('.step',m);
    const setStep=n=>{ step=n; steps().forEach((e,k)=>e.className='step '+(k<n?'ok':k===n?'on':'')); };
    async function hipp(){
      const log=$('#log',m);
      const item={ s:s.hp[0], o:s.hp.slice(1), w:['Re-read the source citation and date — this choice does not fit the historical situation.','This choice ignores who created the source and why.'] };
      while(true){ const a=await mcStep(log, item, {timed:false, tags:'<span class="tag em">HIPP</span>'}); if(a===0){ markOpts(log,0); SFX.right(); break; }
        markOpts(log,a); SFX.wrong(); await diagnostic(log, item, a, {lock:3, btn:'Try again'}); }
      setStep(1); log.innerHTML=`<div class="note"><b>Step 2 — Evidence Extraction</b><br>${esc(s.ev[0])}<br><span class="small">Select a hotspot on the exhibit, then press "${t('cite')}".</span></div>`;
      $('#nt',m).innerHTML='';
    }
    async function cite(){
      if(sel===s.ev[1]){ SFX.right(); setStep(2); $('#nt',m).innerHTML='';
        const log=$('#log',m); log.innerHTML='<div class="good"><h3>📌 Evidence cited!</h3></div><div id="syn"></div>';
        const q=u.qs[s.q]; await runItem($('#syn',m), q, {unit:u, label:'Benchmark Synthesis'});
        if(!prog.includes(i)) prog.push(i); if(!S.qstat[q.id]) S.qstat[q.id]='remediated'; save();
        SFX.fanfare(); if(prog.length===st.length){ award(2,'Gallery Walk complete'); } else toast('🚪 '+t('nextDoor'));
        renderGallery(m);
      } else { SFX.wrong(); const nb=$('#citeBtn',m); nb.disabled=true; nb.textContent='Not quite — re-read the prompt (3s)…'; await sleep(S.settings.god?0:3000); if(nb.isConnected){ nb.disabled=false; nb.textContent='📌 '+t('cite'); } }
    }
  }
}

/* ======================= MODE C: SUMMIT OF MASTERY ================== */
function renderSummit(m, squadMode){
  const u=curUnit();
  if(!squadMode) return start(['']);
  m.innerHTML=`${backBtn()}<h1>🏔️ ${t('squad')}</h1><div class="card"><p>${t('squadD')}</p>

    <button class="btn gold big" id="go">${t('start')}</button></div>`;
  bindBack(m);
  $('#go',m).onclick=()=>{ const names=$('#sq',m).value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,6); start(names.length?names:['Squad']); };

  async function start(names){
    const items=S.settings.shuffle?shuffle(u.qs):u.qs.slice(), N=items.length;
    const camps=[1,2,3,4,5].map(k=>Math.ceil(k*N/5));
    const inv={ lens:S.settings.powerups?1:0, shield:S.settings.powerups?1:0, bounty:S.settings.powerups?1:0, medkit:S.settings.powerups&&squadMode?1:0, armed:{} };
    let pos=0, turn=-1, rock=false, queue=items.map(q=>({q,ret:false})), campHit=new Set(), xp=0;
    // trail points (percent coords)
    const pts=[]; for(let i=0;i<=N;i++){ const f=i/N; pts.push([8+f*84 + Math.sin(f*9)*4, 92 - f*80 + Math.cos(f*7)*3]); }
    m.innerHTML=`${backBtn()}<div class="spread"><h1>🏔️ ${squadMode?t('squad'):t('summit')}</h1><span class="tag gold">${esc(u.title)}</span></div>
      <div class="mtn" id="mtn"><div class="bg">${asset('summit_mountain_bg')}</div>
        <svg class="trail" viewBox="0 0 100 100" preserveAspectRatio="none"><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#F2B441" stroke-width=".7" stroke-dasharray="1.6 1.2"/>
        ${camps.map((c,k)=>`<g><circle cx="${pts[c][0]}" cy="${pts[c][1]}" r="2.2" fill="${k===4?'#FF4D9D':'#4DE0B1'}" stroke="#0B0F1F" stroke-width=".5"/></g>`).join('')}</svg>
        ${camps.map((c,k)=>`<span class="tag" style="position:absolute;left:${pts[c][0]}%;top:${pts[c][1]}%;transform:translate(-50%,40%)">${k===4?'🏁 Summit':'⛺ Camp '+(k+1)}</span>`).join('')}
        <div class="climber" id="cl" style="left:${pts[0][0]}%;top:${pts[0][1]}%">${asset('student_avatar')}</div><div class="rock hide" id="rk">🪨</div></div>
      <div class="row" style="margin:.6rem 0" id="sbar"></div><div class="card qwrap" id="sq"></div>`;
    bindBack(m);
    const bar=()=>{ $('#sbar',m).innerHTML=`<span class="chip">📍 Step <b>${pos}</b>/${N}</span><span class="chip">⭐ XP <b>${xp}</b></span>
        ${squadMode?`<span class="chip">🎯 Up now: <b>${esc(names[turn%names.length])}</b></span>`:''}
        ${rock?'<span class="chip" style="border-color:var(--crimson)">🪨 Rockslide! Next correct answer clears it instead of climbing.</span>':''}
        ${squadMode&&S.settings.powerups?`<span class="pu"><span class="pi">${asset('powerup_squad_medkit')}</span>🤝 Squad Medkit ×${inv.medkit}</span>`:''}`; };
    const move=()=>{ const p=pts[pos], c=$('#cl',m); if(!c) return; c.style.left=p[0]+'%'; c.style.top=p[1]+'%'; const r=$('#rk',m); r.classList.toggle('hide',!rock); if(rock){ const q=pts[Math.min(pos+1,N)]; r.style.left=q[0]+'%'; r.style.top=q[1]+'%'; } };
    async function medkitCheck(host){
      const vs=u.vocab||[]; const v=pick(vs); if(!v||vs.length<4){ rock=false; return; }

  }
}

function buildJeopardy(u){
  const pool=[...(u.vocab||[]).map(v=>[v[1],v[0]]), ...u.qs.map(q=>[q.s,q.o[0]])];
  const cats=(u.heads&&u.heads.length>=5?u.heads.slice(0,5):['Set A','Set B','Set C','Set D','Set E']);
  const c=[0,1,2,3,4].map(ci=>[0,1,2,3,4].map(r=>pool[(ci*5+r)%Math.max(1,pool.length)]||['(add more content)','—']));
  const last=pool[pool.length-1]||['Final clue','—'];
  return {cats, c, fj:['Final', last[0], last[1]]};
}

    obs.forEach(o=>o.x-=spd*dt); scrolls.forEach(s=>s.x-=spd*dt);

    obs.forEach(o=>{ if(!o.hit && inv<=0 && P.x+22>o.x && P.x-22<o.x+o.w && P.y>GY-o.h){ o.hit=true; score=Math.max(0,score-15); flash=.4; inv=.8; SFX.wrong(); } else if(!o.passed && o.x+o.w<P.x-22){ o.passed=true; score+=5; } });
    scrolls.forEach(s=>{ if(Math.abs(s.x-P.x)<30 && Math.abs(s.y-(P.y-30))<40){ s.got=true; score+=10; SFX.coin(); } });
    // draw
    const gr=ctx.createLinearGradient(0,0,0,H); gr.addColorStop(0,'#1b1f5e'); gr.addColorStop(1,'#3a2a6e'); ctx.fillStyle=gr; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#2c2b55'; for(let i=0;i<6;i++){ const bx=((i*200 - (60-time)*40)%1200+1200)%1200-150; ctx.beginPath(); ctx.moveTo(bx,GY); ctx.lineTo(bx+90,140); ctx.lineTo(bx+180,GY); ctx.fill(); }
    ctx.fillStyle='#1c3a3a'; ctx.fillRect(0,GY,W,H-GY); ctx.fillStyle='#4DE0B1'; ctx.fillRect(0,GY,W,4);
    obs.forEach(o=>{ ctx.fillStyle=o.hit?'#555':'#FF4D9D'; ctx.fillRect(o.x,GY-o.h,o.w,o.h); ctx.fillStyle='#0B0F1F'; ctx.font='bold 12px sans-serif'; ctx.textAlign='center'; ctx.fillText('MYTH',o.x+o.w/2,GY-o.h/2+4); });
    scrolls.forEach(s=>{ ctx.font='28px serif'; ctx.textAlign='center'; ctx.fillText('📜',s.x,s.y); });
    if(sprite.complete && sprite.naturalWidth){ ctx.globalAlpha=inv>0?.5:1; ctx.drawImage(sprite,P.x-26,P.y-56,52,56); ctx.globalAlpha=1; }
    else { ctx.globalAlpha=inv>0?.5:1; ctx.fillStyle='#4DE0B1'; ctx.fillRect(P.x-14,P.y-40,28,30); ctx.fillStyle='#e8b98a'; ctx.beginPath(); ctx.arc(P.x,P.y-50,11,0,7); ctx.fill(); ctx.fillStyle='#F2B441'; ctx.fillRect(P.x-12,P.y-62,24,6); ctx.strokeStyle='#111'; ctx.lineWidth=5; const leg=Math.sin(time*18)*8; ctx.beginPath(); ctx.moveTo(P.x-6,P.y-10); ctx.lineTo(P.x-6-leg,P.y); ctx.moveTo(P.x+6,P.y-10); ctx.lineTo(P.x+6+leg,P.y); ctx.stroke(); ctx.globalAlpha=1; }
    if(bt>0){ ctx.fillStyle='rgba(11,15,31,.8)'; ctx.fillRect(0,0,W,46); ctx.fillStyle='#FF4D9D'; ctx.font='bold 16px sans-serif'; ctx.textAlign='center'; ctx.fillText('JUMP THE MYTH: "'+banner+'"',W/2,28); }
    if(flash>0){ ctx.fillStyle=`rgba(255,77,157,${flash})`; ctx.fillRect(0,0,W,H); }
    $('#gt',g.mm).textContent=Math.ceil(time); $('#gs',g.mm).textContent=Math.round(score);
  });
}
function whack(){
  const g=gameShell('🔨 Whack-a-Fallacy',900,540), {ctx,cv}=g; const W=900,H=540, cols=3, rows=3, cw=W/cols, ch=H/rows;
  let holes=Array.from({length:9},()=>null), time=60, score=0, spawn=.4, fx=[];
  cv.addEventListener('pointerdown',e=>{ e.preventDefault(); const [x,y]=g.pos(e); const i=Math.floor(y/ch)*cols+Math.floor(x/cw); const h=holes[i]; if(!h||h.hit) return; h.hit=true; h.ttl=.45;
    if(h.fact){ score-=15; SFX.wrong(); fx.push({x:(i%cols+.5)*cw,y:(Math.floor(i/cols)+.5)*ch,txt:'✋ That was a FACT! −15',c:'#FF4D9D',t:1.1}); }
    else { score+=10; SFX.right(); fx.push({x:(i%cols+.5)*cw,y:(Math.floor(i/cols)+.5)*ch,txt:'💥 Myth busted! +10',c:'#4DE0B1',t:1}); } });
  g.loop(dt=>{
    time-=dt; if(time<=0) return g.end(Math.max(0,score),'whack');
    spawn-=dt; if(spawn<=0){ const free=holes.map((h,i)=>h?null:i).filter(i=>i!==null); if(free.length){ const c=pick(HISTORY_CLAIMS); holes[pick(free)]={txt:c[0],fact:c[1],ttl:2.6+Math.max(0,time/60)*1.4,max:0}; } spawn=.55+Math.random()*.6; }
    holes=holes.map(h=>{ if(!h) return null; h.ttl-=dt; return h.ttl>0?h:null; });
    fx.forEach(f=>{ f.t-=dt; f.y-=30*dt; }); fx=fx.filter(f=>f.t>0);
    ctx.fillStyle='#120e24'; ctx.fillRect(0,0,W,H);
    for(let i=0;i<9;i++){ const x=(i%cols)*cw, y=Math.floor(i/cols)*ch; ctx.fillStyle='#1A1430'; ctx.fillRect(x+6,y+6,cw-12,ch-12); ctx.fillStyle='#0B0F1F'; ctx.beginPath(); ctx.ellipse(x+cw/2,y+ch-26,cw/2-30,16,0,0,7); ctx.fill();
      const h=holes[i]; if(h){ ctx.fillStyle=h.hit?(h.fact?'#5a1838':'#155a48'):'#EFEAFB'; ctx.strokeStyle='#F2B441'; ctx.lineWidth=3; ctx.beginPath(); ctx.roundRect? ctx.roundRect(x+16,y+14,cw-32,ch-44,10) : ctx.rect(x+16,y+14,cw-32,ch-44); ctx.fill(); ctx.stroke();
        ctx.fillStyle=h.hit?'#fff':'#1A1430'; ctx.font='bold 17px system-ui, sans-serif'; ctx.textAlign='center'; wrapText(ctx,h.txt,x+cw/2,y+14+(ch-44)/2+5,cw-56,21); } }
    fx.forEach(f=>{ ctx.globalAlpha=Math.min(1,f.t*1.5); ctx.fillStyle=f.c; ctx.font='bold 20px sans-serif'; ctx.textAlign='center'; ctx.fillText(f.txt,f.x,f.y); ctx.globalAlpha=1; });
    $('#gt',g.mm).textContent=Math.ceil(time); $('#gs',g.mm).textContent=score;
  });
}

function uploadStationImg(u,i,kind,done){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; if(f.size>2.5e6) toast('Large image — compressing…');
    const r=new FileReader(); r.onload=()=>shrinkImage(r.result, 1100, url=>{ S.assets[stationKey(u,i)]=url; S.assets[stationKey(u,i)+'_k']=kind; if(typeof persistAsset==='function'){ persistAsset(stationKey(u,i),url); persistAsset(stationKey(u,i)+'_k',kind); } if(!save()) toast('⚠️ Browser storage is full — remove some images.'); done&&done(); }); r.readAsDataURL(f); };
  inp.click();
}
function shrinkImage(src, max, cb){
  const img=new Image(); img.onload=()=>{ const k=Math.min(1, max/Math.max(img.width,img.height)); if(k===1 && src.length<900000) return cb(src);
    const cv=document.createElement('canvas'); cv.width=Math.round(img.width*k); cv.height=Math.round(img.height*k); cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); cb(cv.toDataURL('image/jpeg',.85)); };
  img.onerror=()=>cb(src); img.src=src;
}

function applyEdits(u, c){
  const e = c && c.edits && c.edits[u.id];
  const baseGal = (u.gallery||[]).map((g,i)=>({...g, id:g.id||(u.id+'_'+i), qid:g.qid||(u.qs[g.q]||{}).id}));
  if(!e) return baseGal.every((g,i)=>u.gallery[i].id) ? u : {...u, gallery:baseGal};
  const hideQ=new Set(e.hideQ||[]), hideV=new Set(e.hideV||[]), hideG=new Set(e.hideG||[]);
  const qs=u.qs.filter(q=>!hideQ.has(q.id)).concat(e.addQ||[]);
  const vocab=(u.vocab||[]).filter(v=>!hideV.has(v[0])).concat(e.addV||[]);
  const gallery=baseGal.concat(e.addG||[]).filter(g=>!hideG.has(g.id)).map(g=>{
    let qi=qs.findIndex(q=>q.id===g.qid);
    if(qi<0){ const orig=u.qs.find(x=>x.id===g.qid); qi=orig?qs.findIndex(q=>q.bm===orig.bm):-1; }
    return {...g, q:Math.max(0,qi)}; }).filter(()=>qs.length);
  let jp=u.jp;
  if(u.jp && (e.jp||e.jpCats||e.fj)) jp={ cats:u.jp.cats.map((x,i)=>(e.jpCats||{})[i]||x), c:u.jp.c.map((col,ci)=>col.map((cl,ri)=>(e.jp||{})[ci+'-'+ri]||cl)), fj:e.fj||u.jp.fj };
  return {...u, qs, vocab, gallery, jp, bms:[...new Set(qs.map(q=>q.bm))]};
}

/* =====================================================================
   TEACHER EDITION SIGN-IN + FIRST-RUN TOUR
   A Teacher Edition file carries the classroom plus ONE teacher account
   (email + salted SHA-256 hash — never the plain password). There is no
   server: the sign-in locks this copy of the app; a changed password is
   saved in this browser on this device.
   ===================================================================== */
function sha256Hex(str){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const bytes=new TextEncoder().encode(str), l=bytes.length, n=((l+9+63)>>6)<<6, m=new Uint8Array(n); m.set(bytes); m[l]=0x80;
  const dv=new DataView(m.buffer); dv.setUint32(n-4, l*8>>>0); dv.setUint32(n-8, Math.floor(l/0x20000000));
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]; const W=new Uint32Array(64);
  const r=(x,k)=>(x>>>k)|(x<<(32-k));
  for(let o=0;o<n;o+=64){
    for(let i=0;i<16;i++) W[i]=dv.getUint32(o+i*4);
    for(let i=16;i<64;i++){ const s0=r(W[i-15],7)^r(W[i-15],18)^(W[i-15]>>>3), s1=r(W[i-2],17)^r(W[i-2],19)^(W[i-2]>>>10); W[i]=(W[i-16]+s0+W[i-7]+s1)>>>0; }
    let [a,b,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){ const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+W[i])>>>0, t2=((r(a,2)^r(a,13)^r(a,22))+((a&b)^(a&c)^(b&c)))>>>0;
      h=g; g=f; f=e; e=(d+t1)>>>0; d=c; c=b; b=a; a=(t1+t2)>>>0; }
    H=H.map((x,i)=>(x+[a,b,c,d,e,f,g,h][i])>>>0);
  }
  return H.map(x=>x.toString(16).padStart(8,'0')).join('');
}
const pwHash=(salt,pw)=>sha256Hex(salt+':'+pw);
let ACCOUNT=null, AUTHED=false;
const authKey=()=>'arena_auth_'+(S.activeClass||'x');

  const mm=modal(`<h2>🔑 ${forced?'Welcome! Please create your own password':'Change password'}</h2>
    ${forced?'<p>You signed in with a temporary password. Choose a new one to continue.</p>':''}

  $('#cp',mm).onsubmit=ev=>{ ev.preventDefault(); const n=$('#cN',mm).value, n2=$('#cN2',mm).value, err=$('#cErr',mm);
    if(!forced && pwHash(ACCOUNT.salt,$('#cO',mm).value)!==ACCOUNT.hash) return err.textContent='Current password is incorrect.';

/* Export a Teacher Edition: classroom + one login (temporary password must be changed on first sign-in). */
function exportTeacherEdition(c, email, tempPw){
  const salt=Math.random().toString(36).slice(2)+Date.now().toString(36);
  const account={ email:email.trim().toLowerCase(), salt, hash:pwHash(salt,tempPw), mustChange:true, tourDone:false };
  save();
  const css=($('#arenaCss')||{}).textContent||'', app=($('#arenaApp')||{}).textContent||'';
  const pack=JSON.stringify({arenaPack:1, classroom:c, account}).replace(/</g,'\\u003c');
  const html=`<!DOCTYPE html>\n<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(c.name)} · Classroom Arena</title>`+
    `<style id="arenaCss">${css}</style></head>`+
    `<body><header id="topbar"></header><main id="main"></main><script id="arenaPack" type="application/json">${pack}${SCRIPT_CLOSE}<script id="arenaApp">${app}${SCRIPT_CLOSE}</body></html>`;
  download(`${slug(c.name)}_teacher_edition.html`, html, 'text/html');
}
function teacherEditionModal(c){
  const mm=modal(`<h2>👤 Create a Teacher Edition with sign-in</h2>
    <p>Gives a colleague their own copy of <b>${esc(c.name)}</b> with a sign-in screen, a required password change on first sign-in, and a guided tour.</p>
    <div class="field"><label>Teacher's school email (their login)</label><input id="teE" type="email" placeholder="name@ocps.net"></div>
    <div class="field" style="margin-top:.5rem"><label>Temporary password (they must change it)</label><input id="teP" type="text"></div>
    <p class="small">Only a salted hash of the password is stored in the file. Because there's no server, the sign-in protects that copy of the app on that device — it isn't a district account.</p>
    <button class="btn gold big" id="teGo">⬇️ Download Teacher Edition</button>`);
  $('#teGo',mm).onclick=()=>{ const em=$('#teE',mm).value.trim(), pw=$('#teP',mm).value; if(!/^\S+@\S+\.\S+$/.test(em)) return toast('Enter a valid email.'); if(pw.length<6) return toast('Temporary password must be at least 6 characters.'); exportTeacherEdition(c, em, pw); mm.close(); };
}

function startTour(){
  let i=0; const shield=document.createElement('div'), hole=document.createElement('div'), tip=document.createElement('div');
  shield.className='tour-shield'; hole.className='tour-hole'; tip.className='tour-tip';
  document.body.append(shield, hole, tip);
  const end=()=>{ shield.remove(); hole.remove(); tip.remove(); window.removeEventListener('resize',place); S.tourDone=true; if(SESSION.type==='teacher'){ SESSION.teacher.tourDone=true; API.saveTeacher(SESSION.user.uid,{tourDone:true}).catch(()=>{}); } save(); };
  let target=null;
  function place(){
    if(target && document.body.contains(target)){ const r=target.getBoundingClientRect(), p=8;
      Object.assign(hole.style,{display:'block',left:(r.left-p)+'px',top:(r.top-p)+'px',width:(r.width+2*p)+'px',height:(r.height+2*p)+'px'});
      const th=tip.offsetHeight, narrow=innerWidth<700, below=r.bottom+16+th<innerHeight, above=r.top-16-th>0;
      tip.style.transform= narrow?'translateX(-50%)':'none';
      if(below||above){ tip.style.left= narrow?'50%':clamp(r.left,12,innerWidth-tip.offsetWidth-12)+'px'; tip.style.top= below?(r.bottom+16)+'px':(r.top-16-th)+'px'; }
      else { tip.style.left= narrow?'50%':(innerWidth-tip.offsetWidth-24)+'px'; tip.style.top=(innerHeight-th-24)+'px'; }
    } else { hole.style.display='none'; Object.assign(tip.style,{left:'50%',top:'50%',transform:'translate(-50%,-50%)'}); }
  }
  async function show(){
    const st=TOUR[i];
    if(st.go){ st.go(); save(); renderTop(); render(); await sleep(60); }
    target = st.sel ? $(st.sel) : null; if(target && st.card) target = target.closest('.card') || target;
    if(target){ if(target.offsetHeight>innerHeight*.6){ const hb=($('#topbar')||{}).offsetHeight||0; window.scrollTo({top:target.getBoundingClientRect().top+scrollY-hb-16, behavior:'instant'}); } else target.scrollIntoView({block:'center',behavior:'instant'}); await sleep(80); }
    tip.innerHTML=`<div class="spread"><span class="tag gold">${i+1} / ${TOUR.length}</span><button class="iconbtn" id="tX" title="Skip tour">✕</button></div>
      <h3 style="margin:.5rem 0 .3rem">${st.title}</h3><p style="margin:0 0 .8rem">${typeof st.body==='function'?st.body():st.body}</p>
      <div class="spread"><button class="btn ghost" id="tB" ${i?'':'disabled'}>← Back</button><button class="btn gold" id="tN">${i===TOUR.length-1?'Finish ✓':'Next →'}</button></div>`;
    place(); SFX.click();
    $('#tX',tip).onclick=end; $('#tB',tip).onclick=()=>{ i--; show(); }; $('#tN',tip).onclick=()=>{ if(i===TOUR.length-1){ end(); SFX.fanfare(); toast('🎉 Tour complete!'); } else { i++; show(); } };
  }
  window.addEventListener('resize',place); show();
}
