/* ----------------------------- PARSERS ------------------------------ */
function parseCSV(text){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=c; }
    else if(c==='"') q=true; else if(c===','){ row.push(cell); cell=''; } else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; } else cell+=c; }
  if(cell||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()));
}
/* Minimal dependency-free XLSX reader (zip + DecompressionStream). */
async function readXlsx(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf);
  let eocd=-1; for(let i=u8.length-22;i>=Math.max(0,u8.length-66000);i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; } }
  if(eocd<0) throw new Error('Not a valid .xlsx file');
  const n=dv.getUint16(eocd+10,true); let p=dv.getUint32(eocd+16,true); const files={};
  for(let k=0;k<n;k++){ const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), lho=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u8.slice(p+46,p+46+nl)); files[name]={method,csize,lho}; p+=46+nl+el+cl; }
  const get=async name=>{ const f=files[name]; if(!f) return null; const lnl=dv.getUint16(f.lho+26,true), lel=dv.getUint16(f.lho+28,true); const data=u8.slice(f.lho+30+lnl+lel, f.lho+30+lnl+lel+f.csize);
    if(f.method===0) return new TextDecoder().decode(data);
    if(typeof DecompressionStream==='undefined') throw new Error('This browser cannot unzip .xlsx — save as .csv instead.');
    const ds=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw')); return await new Response(ds).text(); };
  const dp=new DOMParser(); const ss=[]; const sst=await get('xl/sharedStrings.xml');
  if(sst){ dp.parseFromString(sst,'application/xml').querySelectorAll('si').forEach(si=>ss.push([...si.querySelectorAll('t')].map(x=>x.textContent).join(''))); }
  const wb=dp.parseFromString(await get('xl/workbook.xml')||'<x/>','application/xml'); const names=[...wb.querySelectorAll('sheet')].map(s=>s.getAttribute('name'));
  const sheetFiles=Object.keys(files).filter(f=>/^xl\/worksheets\/sheet\d+\.xml$/.test(f)).sort((a,b)=>parseInt(a.match(/\d+/))-parseInt(b.match(/\d+/)));
  const out=[];
  for(let si=0;si<sheetFiles.length;si++){ const doc=dp.parseFromString(await get(sheetFiles[si]),'application/xml'); const rows=[];
    doc.querySelectorAll('sheetData row').forEach(r=>{ const row=[]; r.querySelectorAll('c').forEach(c=>{ const ref=c.getAttribute('r')||''; const col=ref.replace(/\d+/g,'').split('').reduce((a,ch)=>a*26+ch.charCodeAt(0)-64,0)-1; const tp=c.getAttribute('t'); let v='';
      if(tp==='s') v=ss[+(c.querySelector('v')?.textContent||0)]||''; else if(tp==='inlineStr') v=[...c.querySelectorAll('t')].map(x=>x.textContent).join(''); else v=c.querySelector('v')?.textContent||'';
      row[col>=0?col:row.length]=v; }); rows.push(Array.from(row,x=>x??'')); });
    out.push({name:names[si]||('Sheet'+(si+1)), rows:rows.filter(r=>r.some(c=>String(c).trim()))}); }
  return out;
}
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function newUnit(title, source){ return { id:'c'+Date.now().toString(36), custom:true, icon:'🗂️', title, short:title.slice(0,18), era:'Custom', source, bms:[], timeline:[], vocab:[], gallery:[], qs:[], heads:[] }; }
function fromSheets(sheets, base){
  // 1) Quizizz / Wayground template
  for(const sh of sheets){ const hi=sh.rows.findIndex(r=>r.some(c=>norm(c)==='question text')); if(hi<0) continue;
    const H=sh.rows[hi].map(norm), col=n=>H.indexOf(n); const ci={q:col('question text'),type:col('question type'),opt:[1,2,3,4,5].map(k=>col('option '+k)),ans:col('correct answer'),exp:col('answer explanation')};
    const u=newUnit(base,'Quizizz/Wayground spreadsheet'); const openEnded=[]; let skipped=0, conv=0;
    const allAns=[];
    sh.rows.slice(hi+1).forEach(r=>{ const opts=ci.opt.map(k=>k>=0?String(r[k]||'').trim():'').filter(Boolean); if(opts[0]) allAns.push(opts[0]); });
    sh.rows.slice(hi+1).forEach((r,k)=>{
      const qt=String(r[ci.q]||'').trim(); if(!qt) return; const type=norm(r[ci.type]||'multiple choice');
      const opts=ci.opt.map(k2=>k2>=0?String(r[k2]||'').trim():''); const exp=ci.exp>=0?String(r[ci.exp]||'').trim():'';
      const ansRaw=String(r[ci.ans]||'').trim();
      if(type.includes('open')||type.includes('poll')||type.includes('draw')){ openEnded.push(qt); return; }
      let correct='';
      if(type.includes('fill')){ correct=opts.find(Boolean)||ansRaw; const ds=shuffle(allAns.filter(a=>a!==correct)).slice(0,3); if(!correct||ds.length<2){ skipped++; return; } conv++; return u.qs.push(mkQ(u,k,qt,correct,ds,exp)); }
      const nums=ansRaw.split(/[,;]/).map(s=>parseInt(s)).filter(n=>n>=1&&n<=5);
      correct = nums.length ? opts[nums[0]-1] : opts.find(o=>norm(o)===norm(ansRaw));
      if(!correct){ skipped++; return; }
      if(nums.length>1) conv++;
      const ds=opts.filter((o,i)=>o && o!==correct && !nums.includes(i+1)); if(!ds.length){ skipped++; return; }
      u.qs.push(mkQ(u,k,qt,correct,ds,exp));
    });
    if(!u.qs.length) return {error:'Found the Quizizz header row but no usable multiple-choice rows.'};
    u.bms=[u.qs[0].bm]; u.vocab=u.qs.slice(0,12).map(q=>[q.o[0], q.s, q.r[1]]);
    u.sr={p: openEnded[0] || `Explain the most important ideas from "${base}" using specific evidence.`, k: u.qs.slice(0,8).map(q=>q.o[0].split(' ').slice(0,3).join(' '))};
    return {unit:u, msg:`Imported ${u.qs.length} questions from "${base}".`, detail:`<p class="small">${conv?conv+' checkbox/fill-in items converted to multiple choice. ':''}${skipped?skipped+' rows skipped (no answer key). ':''}${openEnded.length?openEnded.length+' open-ended prompts saved as the Historian Response prompt.':''} Jeopardy board and flashcards were auto-built.</p>`};
  }
  // 2) Session results export (find question + accuracy columns on any sheet)
  for(const sh of sheets){ for(let hi=0;hi<Math.min(10,sh.rows.length);hi++){ const H=sh.rows[hi].map(norm);
    const qc=H.findIndex(h=>h.startsWith('question')&&!h.includes('type')&&!h.includes('no')&&!h.includes('number')), ac=H.findIndex(h=>/accuracy|correct|score/.test(h));
    if(qc<0||ac<0) continue;
    const data=sh.rows.slice(hi+1).map(r=>({q:String(r[qc]||'').trim(), acc:parseFloat(String(r[ac]).replace('%',''))})).filter(x=>x.q && !isNaN(x.acc)).map(x=>({...x, acc:x.acc<=1?x.acc*100:x.acc}));
    if(!data.length) continue;
    data.sort((a,b)=>a.acc-b.acc); const worst=data.slice(0,10);
    const known=allUnits().flatMap(u=>u.qs.map(q=>({q,u})));
    const sim=(a,b)=>{ const A=new Set(norm(a).split(' ')), B=new Set(norm(b).split(' ')); const i=[...A].filter(x=>B.has(x)).length; return i/Math.max(1,Math.min(A.size,B.size)); };
    const matched=[], unmatched=[];
    worst.forEach(w=>{ let best=null,bs=0; known.forEach(k=>{ const s=sim(w.q,k.q.s); if(s>bs){bs=s;best=k;} }); if(best&&bs>=.55) matched.push({...w,item:best.q}); else unmatched.push(w); });
    const u=newUnit('Targeted Reteach: '+base,'Session results'); u.icon='🎯';
    u.qs=matched.map(x=>({...x.item, id:x.item.id+'_r'+u.id}));
    const detail=`<table><tr><th>Most-missed question</th><th>Class accuracy</th><th>Matched?</th></tr>${worst.map(w=>`<tr><td>${esc(w.q)}</td><td>${Math.round(w.acc)}%</td><td>${matched.find(x=>x.q===w.q)?'✅':'—'}</td></tr>`).join('')}</table>`;
    if(!u.qs.length) return {msg:`Read ${data.length} result rows. None matched questions in the Arena library yet.`, detail:detail+'<p class="small">Import the original quiz spreadsheet first, then re-import these results to auto-build the reteach game.</p>'};
    u.bms=[...new Set(u.qs.map(q=>q.bm))]; u.vocab=u.qs.map(q=>[q.o[0],q.s,q.r?q.r[1]:'']);
    return {unit:u, msg:`Built a Targeted Reteach Game from the ${u.qs.length} most-missed questions.`, detail};
  } }
  // 3) Two-column term/definition sheet
  const rows=sheets[0]?.rows||[]; if(rows.length&&rows[0].length>=2){ return parseNotes(rows.map(r=>`${r[0]}: ${r[1]}`).join('\n'), base); }
  return {error:'Could not recognize this spreadsheet. Use the Quizizz template headers, a results export, or two columns (Term, Definition).'};
}
function mkQ(u,k,stem,correct,ds,exp){
  const bm=(stem.match(/SS\.\d+\.[A-Z]+\.\d+\.\d+/)||[])[0] || ('Custom · '+u.title.slice(0,24));
  const d=ds.slice(0,3);
  return { id:u.id+'q'+k, bm, dok:2, s:stem, o:[correct,...d], w:d.map(x=>`"${x}" does not match the evidence. ${exp?'Key idea: '+exp:'Compare it carefully to the correct answer.'}`),
    r:['Review', exp || `The correct answer is "${correct}".`],
    p:{ s:'Parallel check — which statement is accurate?', o:[`${stem} → ${correct}`, ...d.map(x=>`${stem} → ${x}`)], w:d.map(()=> 'That pairing repeats a trap from the original question.') } };
}
function fromJSON(j, base){
  if(j && j.qs && j.title){ const u=Object.assign(newUnit(j.title,'JSON set'), j, {id:'c'+Date.now().toString(36), custom:true}); return {unit:u, msg:`Imported "${u.title}" (${u.qs.length} items).`}; }
  const arr=Array.isArray(j)?j:(j.questions||[]); if(!arr.length) return {error:'JSON must be a Classroom Arena set or an array of {question, options, answer}.'};
  const u=newUnit(base,'JSON questions');
  arr.forEach((x,k)=>{ const opts=x.options||x.choices||[]; let a=x.answer; if(typeof a==='number') a=opts[a]; if(typeof a==='string'&&/^[A-E]$/i.test(a)&&opts.length) a=opts['ABCDE'.indexOf(a.toUpperCase())]; if(!a||opts.length<2) return; u.qs.push(mkQ(u,k,x.question||x.q,a,opts.filter(o=>o!==a),x.explanation||'')); });
  u.vocab=u.qs.slice(0,12).map(q=>[q.o[0],q.s,'']); u.bms=[...new Set(u.qs.map(q=>q.bm))];
  return u.qs.length?{unit:u,msg:`Imported ${u.qs.length} questions.`}:{error:'No usable questions in that JSON.'};
}
function parseNotes(text, title){
  const u=newUnit(title,'Study guide / notes'); const lines=text.split(/\r?\n/); let cur=null; const mcs=[], open=[];
  const codes=[...new Set(text.match(/SS\.\d+\.[A-Z]+\.\d+\.\d+/g)||[])];
  for(const raw of lines){ const L=raw.trim(); if(!L) continue;
    let mm;
    if((mm=L.match(/^#{1,6}\s*(.+)/)) || (L.length<60 && L===L.toUpperCase() && /[A-Z]{3}/.test(L) && !/[?:]/.test(L))){ u.heads.push((mm?mm[1]:L).replace(/[:#]/g,'').trim()); cur=null; continue; }
    if((mm=L.match(/^(\d+)[.)]\s+(.+)/))){ cur={s:mm[2],o:[],a:-1}; mcs.push(cur); continue; }
    if(cur && (mm=L.match(/^(\*)?\s*([A-Ea-e])[.)]\s+(.+?)(\s*\*)?$/))){ if(mm[1]||mm[4]) cur.a=cur.o.length; cur.o.push(mm[3].replace(/\*$/,'').trim()); continue; }
    if(cur && (mm=L.match(/^(answer|ans|key)\s*[:\-]\s*([A-Ea-e])\b/i))){ cur.a='ABCDE'.indexOf(mm[2].toUpperCase()); continue; }
    if((mm=L.match(/^[-*•]?\s*([^:–—]{2,70}?)\s*(?::|\s[–—-]\s)\s*(.{6,})$/)) && !/^https?/.test(L)){ u.vocab.push([mm[1].trim(), mm[2].trim(), '']); cur=null; continue; }
  }
  mcs.forEach((q,k)=>{ if(q.o.length>=2 && q.a>=0){ u.qs.push(mkQ(u,'m'+k,q.s,q.o[q.a],q.o.filter((_,i)=>i!==q.a),'')); } else if(!q.o.length) open.push(q.s); });
  // Auto-generate vocab questions so every set is playable
  const V=u.vocab;
  if(V.length>=4){ V.forEach((v,k)=>{ if(u.qs.length>=40) return; const ds=shuffle(V.filter(x=>x!==v)).slice(0,3);
    u.qs.push({ id:u.id+'v'+k, bm:codes[k%Math.max(1,codes.length)]||('Custom · '+title.slice(0,24)), dok:1, s:`Which term matches this description? "${v[1]}"`, o:[v[0],...ds.map(x=>x[0])],
      w:ds.map(x=>`"${x[0]}" means: ${x[1]}`), r:[v[0], v[1]],
      p:{ s:`Which description matches "${v[0]}"?`, o:[v[1],...ds.map(x=>x[1])], w:ds.map(x=>`That describes "${x[0]}".`) } }); }); }
  if(!u.qs.length) return {error:'No vocabulary ("Term: definition") or multiple-choice questions (numbered, with A–D choices and a * or "Answer: B") were found.'};
  u.bms=codes.length?codes:[u.qs[0].bm];
  u.sr={ p: open[0] || `Using the key terms from "${title}", explain how these ideas connect. Use at least three terms as evidence.`, k: V.slice(0,10).map(v=>v[0]) };
  return {unit:u, msg:`Built "${title}": ${u.qs.length} quiz items, ${V.length} flashcards, and a 25-clue Jeopardy board.`, detail:`<p class="small">${mcs.length} numbered questions, ${V.length} terms, ${u.heads.length} headings (used as Jeopardy categories)${open.length?', '+open.length+' open review questions (first one used as the written-response prompt)':''}.</p>`};
}

  function sim(){

    $('#run',z).onclick=()=>runSim($('#scope',z).value);
  }
  function runSim(scope){
    const units= scope==='all' ? FLORIDA_US_HISTORY_DB : [u];
    const qs=units.flatMap(x=>x.qs.map(q=>({...q,_u:x})));
    const bms=[...new Set(qs.map(q=>q.bm))];
    const first=['Aaliyah','Mateo','Jayden','Sofia','Elijah','Camila','Noah','Isabella','Liam','Valentina','Josiah','Ava','Gabriel','Mia','Xavier','Zoe','Adrian','Layla','Carlos','Nia','Dylan','Ariana','Jamal','Emily','Diego'];
    const bmDiff=Object.fromEntries(bms.map(b=>[b, Math.random()*.35]));
    const traps={}; const studs=first.map(n=>{ const ab=.45+Math.random()*.5; const rec={n, bm:{}};
      qs.forEach(q=>{ const p=clamp(ab - bmDiff[q.bm] - (q.dok||2)*.06 + .12, .05, .97); const ok=Math.random()<p;
        const r=rec.bm[q.bm]=rec.bm[q.bm]||[0,0]; r[1]++; if(ok) r[0]++; else { const d=1+Math.floor(Math.random()*Math.random()*3); const k=q.id+'|'+d; traps[k]=(traps[k]||0)+1; } });
      return rec; });
    const bmAvg=bms.map(b=>({b, p:Math.round(100*studs.reduce((a,s)=>a+s.bm[b][0]/s.bm[b][1],0)/studs.length)})).sort((a,b)=>a.p-b.p);
    const col=p=>p>=80?'#4DE0B1':p>=60?'#F2B441':'#FF4D9D';
    const topTraps=Object.entries(traps).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,c])=>{ const [id,d]=k.split('|'); const q=qs.find(x=>x.id===id); return {q, d:+d, c}; });
    const shown=bms.slice(0,12);
    $('#simOut',m).innerHTML=`<h2 style="margin-top:1rem">📊 Benchmark Heatmap</h2><p class="small">🟩 ≥80% · 🟨 60–79% · 🟥 &lt;60% ${bms.length>shown.length?`(showing first ${shown.length} of ${bms.length} benchmarks)`:''}</p>
      <div style="overflow-x:auto"><table class="heat"><tr><th>Student</th>${shown.map(b=>`<th style="font-size:.65rem">${esc(b.replace('SS.912.',''))}</th>`).join('')}<th>Avg</th></tr>
      ${studs.map(s=>{ const ps=shown.map(b=>Math.round(100*s.bm[b][0]/s.bm[b][1])); const av=Math.round(ps.reduce((a,b)=>a+b,0)/ps.length); return `<tr><th>${esc(s.n)}</th>${ps.map(p=>`<td style="background:${col(p)}">${p}</td>`).join('')}<td style="background:${col(av)}">${av}</td></tr>`; }).join('')}</table></div>

function render(){

  renderHUD();
  if(!S.welcomed && !S.classrooms.length && !S.locked) return renderWelcome(m);
  const v=S.view;
  if(v==='gauntlet') return renderGauntlet(m);
  if(v==='gallery') return renderGallery(m);
  if(v==='summit') return renderSummit(m,false);
  if(v==='squad') return renderSummit(m,true);
  if(v==='arcade') return renderArcade(m);
  if(v==='jeopardy') return renderJeopardy(m);
  if(v==='live') return renderLive(m);
  if(S.role==='host') return renderHostHub(m);
  if(S.role==='studio') return renderStudio(m);
  if(S.role==='demo') return renderDemo(m);

function init(){
  const pack=document.getElementById('arenaPack');

        if(!S.account || S.account.issued!==d.account.salt) S.account={...d.account, issued:d.account.salt, tourDone:!!(S.account&&S.account.tourDone)};

const CODE_ABC = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const genCode = () => Array.from({length:6},()=>CODE_ABC[Math.floor(Math.random()*CODE_ABC.length)]).join('');
const studentId = (name, period) => 's_'+sha256Hex((name||'').trim().toLowerCase()+'|'+(period||'').trim().toLowerCase()).slice(0,20);

function friendlyAuthError(e){
  const c=(e&&e.code)||''; const map={ 'auth/invalid-credential':'That email and password don\'t match.', 'auth/wrong-password':'That email and password don\'t match.', 'auth/user-not-found':'No account uses that email.',
    'auth/email-already-in-use':'An account already uses that email — try signing in.', 'auth/weak-password':'Use at least 8 characters.', 'auth/invalid-email':'That email address doesn\'t look right.',
    'auth/too-many-requests':'Too many attempts. Wait a minute and try again.', 'auth/network-request-failed':'Can\'t reach the server. Check your internet connection.', 'auth/requires-recent-login':'Please sign out and back in, then try again.' };
  return map[c] || (e&&e.message) || 'Something went wrong.';

/* --------------------------- FIREBASE API ---------------------------- */
function FirebaseAPI(cfg){
  const F=window.FBSDK, app=F.initializeApp(cfg), auth=F.getAuth(app), db=F.getFirestore(app);
  const d=(...p)=>F.doc(db,...p), col=(...p)=>F.collection(db,...p);
  return {
    mode:'live',
    onAuth(cb){ return F.onAuthStateChanged(auth, u=>cb(u?{uid:u.uid, email:u.email, name:u.displayName, anon:u.isAnonymous}:null)); },
    async signUp({name,school,email,password}){ const r=await F.createUserWithEmailAndPassword(auth,email,password); await F.updateProfile(r.user,{displayName:name});
      await F.setDoc(d('teachers',r.user.uid),{name,school,email,createdAt:F.serverTimestamp()}); return {uid:r.user.uid,email,name}; },
    async signIn(email,password){ const r=await F.signInWithEmailAndPassword(auth,email,password); return {uid:r.user.uid,email:r.user.email,name:r.user.displayName}; },
    async signOut(){ await F.signOut(auth); },
    async reset(email){ await F.sendPasswordResetEmail(auth,email); },
    async changePassword(oldPw,newPw){ const u=auth.currentUser; await F.reauthenticateWithCredential(u, F.EmailAuthProvider.credential(u.email,oldPw)); await F.updatePassword(u,newPw); },
    async getTeacher(uid){ const s=await F.getDoc(d('teachers',uid)); return s.exists()?s.data():null; },
    async saveTeacher(uid,data){ await F.setDoc(d('teachers',uid),clean(data),{merge:true}); },
    async listClasses(uid){ const s=await F.getDocs(F.query(col('classrooms'),F.where('ownerUid','==',uid))); return s.docs.map(x=>x.data()); },
    async saveClass(c){ await F.setDoc(d('classrooms',c.id), {...classForCloud(c), updatedAt:Date.now()}); },
    async deleteClass(c){ await F.deleteDoc(d('classrooms',c.id)); if(c.code) await F.deleteDoc(d('codes',c.code)).catch(()=>{}); },
    async newCode(c){ for(let i=0;i<8;i++){ const k=genCode(); const s=await F.getDoc(d('codes',k)); if(!s.exists()){ await F.setDoc(d('codes',k),{classId:c.id, ownerUid:c.ownerUid}); return k; } } throw new Error('Could not create a class code.'); },
    async studentAuth(){ if(!auth.currentUser) await F.signInAnonymously(auth); else if(!auth.currentUser.isAnonymous){ await F.signOut(auth); await F.signInAnonymously(auth); } },
    async findClass(code){ const s=await F.getDoc(d('codes',code.toUpperCase())); if(!s.exists()) return null; const c=await F.getDoc(d('classrooms',s.data().classId)); return c.exists()?c.data():null; },
    async getClass(id){ const c=await F.getDoc(d('classrooms',id)); return c.exists()?c.data():null; },
    async getStudent(cid,sid){ const s=await F.getDoc(d('classrooms',cid,'students',sid)); return s.exists()?s.data():null; },
    async saveStudent(cid,sid,data){ await F.setDoc(d('classrooms',cid,'students',sid), clean({...data, uid:auth.currentUser&&auth.currentUser.uid, lastSeen:Date.now()}), {merge:true}); },
    async listStudents(cid){ const s=await F.getDocs(col('classrooms',cid,'students')); return s.docs.map(x=>({id:x.id,...x.data()})); },
    async deleteStudent(cid,sid){ await F.deleteDoc(d('classrooms',cid,'students',sid)); },
    async submitReport(cid,r){ await F.addDoc(col('classrooms',cid,'reports'), clean({...r, at:Date.now()})); },
    async listReports(cid){ const s=await F.getDocs(col('classrooms',cid,'reports')); return s.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>b.at-a.at); },
    async saveAsset(cid,key,url){ if(url) await F.setDoc(d('classrooms',cid,'assets',key),{url}); else await F.deleteDoc(d('classrooms',cid,'assets',key)).catch(()=>{}); },
    async getAssets(cid){ const s=await F.getDocs(col('classrooms',cid,'assets')); const o={}; s.docs.forEach(x=>o[x.id]=x.data().url); return o; },
    async submitLead(l){ await F.addDoc(col('leads'), clean({...l, at:Date.now()})); }
  };
}

/* ---------------------------- DEMO API ------------------------------- */
function LocalAPI(){
  const K='classroom_arena_demo_db';
  const read=()=>{ try{ return JSON.parse(localStorage.getItem(K))||{}; }catch(e){ return {}; } };
  const db=Object.assign({users:{},teachers:{},classrooms:{},codes:{},students:{},reports:{},assets:{},leads:[]}, read());
  const write=()=>{ try{ localStorage.setItem(K, JSON.stringify(db)); }catch(e){} };
  let session=null; try{ session=JSON.parse(localStorage.getItem(K+'_session')); }catch(e){}
  const setSession=s=>{ session=s; try{ s?localStorage.setItem(K+'_session',JSON.stringify(s)):localStorage.removeItem(K+'_session'); }catch(e){} listeners.forEach(f=>f(s)); };
  const listeners=[]; const err=code=>{ const e=new Error(code); e.code=code; return e; };
  const wait=()=>new Promise(r=>setTimeout(r,120));
  return {
    mode:'demo',
    onAuth(cb){ listeners.push(cb); setTimeout(()=>cb(session),0); },
    async signUp({name,school,email,password}){ await wait(); email=email.trim().toLowerCase(); if(db.users[email]) throw err('auth/email-already-in-use'); if(password.length<8) throw err('auth/weak-password');
      const uid='t_'+Date.now().toString(36), salt=Math.random().toString(36).slice(2); db.users[email]={uid,salt,hash:pwHash(salt,password),name}; db.teachers[uid]={name,school,email,createdAt:Date.now()}; write();
      setSession({uid,email,name}); return session; },
    async signIn(email,password){ await wait(); email=email.trim().toLowerCase(); const u=db.users[email]; if(!u||pwHash(u.salt,password)!==u.hash) throw err('auth/invalid-credential'); setSession({uid:u.uid,email,name:u.name}); return session; },
    async signOut(){ setSession(null); },
    async reset(email){ await wait(); if(!db.users[(email||'').trim().toLowerCase()]) throw err('auth/user-not-found'); throw Object.assign(new Error('Demo mode can\'t send email. In the live version, a reset link is emailed.'),{code:'demo'}); },
    async changePassword(oldPw,newPw){ const u=db.users[session.email]; if(pwHash(u.salt,oldPw)!==u.hash) throw err('auth/invalid-credential'); u.hash=pwHash(u.salt,newPw); write(); },
    async getTeacher(uid){ return db.teachers[uid]||null; },
    async saveTeacher(uid,data){ db.teachers[uid]=Object.assign(db.teachers[uid]||{},clean(data)); write(); },
    async listClasses(uid){ return Object.values(db.classrooms).filter(c=>c.ownerUid===uid).map(clean); },
    async saveClass(c){ db.classrooms[c.id]={...classForCloud(c), updatedAt:Date.now()}; write(); },
    async deleteClass(c){ delete db.classrooms[c.id]; delete db.codes[c.code]; write(); },
    async newCode(c){ let k; do{ k=genCode(); }while(db.codes[k]); db.codes[k]={classId:c.id}; write(); return k; },
    async studentAuth(){ if(session && !session.anon) setSession(null); if(!session) setSession({uid:'anon_'+Date.now().toString(36), anon:true}); },
    async findClass(code){ await wait(); const x=db.codes[(code||'').toUpperCase()]; return x&&db.classrooms[x.classId]?clean(db.classrooms[x.classId]):null; },
    async getClass(id){ return db.classrooms[id]?clean(db.classrooms[id]):null; },
    async getStudent(cid,sid){ return ((db.students[cid]||{})[sid])||null; },
    async saveStudent(cid,sid,data){ db.students[cid]=db.students[cid]||{}; db.students[cid][sid]=Object.assign(db.students[cid][sid]||{}, clean(data), {lastSeen:Date.now()}); write(); },
    async listStudents(cid){ return Object.entries(db.students[cid]||{}).map(([id,v])=>({id,...v})); },
    async deleteStudent(cid,sid){ if(db.students[cid]) delete db.students[cid][sid]; write(); },
    async submitReport(cid,r){ (db.reports[cid]=db.reports[cid]||[]).push(clean({...r, id:'r'+Date.now().toString(36), at:Date.now()})); write(); },
    async listReports(cid){ return (db.reports[cid]||[]).slice().sort((a,b)=>b.at-a.at); },
    async saveAsset(cid,key,url){ db.assets[cid]=db.assets[cid]||{}; if(url) db.assets[cid][key]=url; else delete db.assets[cid][key]; write(); },
    async getAssets(cid){ return Object.assign({}, db.assets[cid]||{}); },
    async submitLead(l){ db.leads.push(clean({...l, at:Date.now()})); write(); },
    /* Demo-only: a populated sample classroom for showing the product */
    async seedDemo(){
      const email='demo@classroomarena.app', pw='demo-teacher';
      if(!db.users[email]){ const uid='t_demo', salt='demo'; db.users[email]={uid,salt,hash:pwHash(salt,pw),name:'Demo Teacher'}; db.teachers[uid]={name:'Demo Teacher',school:'Demo High School',email}; }
      const uid=db.users[email].uid;
      if(!Object.values(db.classrooms).some(c=>c.ownerUid===uid)){
        const c=newClassroom({name:'U.S. History — Period 3', teacher:'Demo Teacher', school:'Demo High School', course:'2100310', periods:'3, 5'}); c.ownerUid=uid; c.code='DEMO42'; db.codes.DEMO42={classId:c.id}; db.classrooms[c.id]=classForCloud(c);
        const first=['Aaliyah','Mateo','Jayden','Sofia','Elijah','Camila','Noah','Isabella','Liam','Valentina','Josiah','Ava','Gabriel','Mia','Xavier','Zoe','Adrian','Layla','Carlos','Nia','Dylan','Ariana'];
        const qs=FLORIDA_US_HISTORY_DB.slice(0,3).flatMap(u=>u.qs); db.students[c.id]={}; db.reports[c.id]=[];
        first.forEach((n,i)=>{ const name=n+' '+'ABCDEFGHJKLMNPRSTW'[i%18]+'.', period=i%3?'3':'5', ab=.35+Math.random()*.6, qstat={};
          qs.forEach((q,k)=>{ if(k>qs.length*(.4+ab*.6)) return; const r=Math.random(); qstat[q.id]= r<ab?'first':r<ab+.25?'mastered':'remediated'; });
          db.students[c.id][studentId(name,period)]={name,period,qstat,tokens:Math.floor(ab*12),streak:Math.floor(ab*6),xp:Math.floor(ab*4000),loops:Math.floor((1-ab)*14),lastSeen:Date.now()-Math.floor(Math.random()*4*86400000)};
          if(i%5===0) db.reports[c.id].push({id:'r'+i, at:Date.now()-i*3600000, name, period, unit:FLORIDA_US_HISTORY_DB[0].title, pct:Math.round(70+ab*30), loops:Math.floor((1-ab)*6), mins:12+i, code:hash(name).slice(0,16).match(/.{4}/g).join('-'), words:52+i, response:'Reconstruction was only partly successful. The 13th, 14th and 15th Amendments granted freedom, citizenship and voting rights, but after the Compromise of 1877 Southern states passed Jim Crow laws and Black Codes that limited those rights through poll taxes and sharecropping debt.'}); });
      }
      write(); return {email,pw};
    }
  };
}

    <h1 style="font-size:2rem">Welcome${n?', '+esc(n.split(' ')[0]):''}! Let's build your first classroom.</h1>
    <p class="lead muted">Choose your units and periods. You'll get a class code to share with students right away.</p>
    <div class="row" style="justify-content:center;margin-top:1.5rem"><button class="btn gold big" id="obNew">🏫 Create my classroom</button><label class="btn big">📦 Import a classroom pack<input type="file" id="obImp" accept=".json" hidden></label></div></div>`;
  $('#obNew',m).onclick=()=>classroomWizard();
  $('#obImp',m).onchange=async e=>{ const f=e.target.files[0]; if(!f) return; try{ const d=JSON.parse(await f.text()); const c=d.classroom||d; const nc={...newClassroom({name:c.name}), ...c, id:'cls'+Date.now().toString(36)}; delete nc.code; S.classrooms.push(nc); switchClass(nc.id); onClassCreated(nc); }catch(ex){ toast('⚠️ Not a classroom pack'); } };
}

/* ----------------------------- DASHBOARD ----------------------------- */
let DASH={cid:null, students:[], reports:[], at:0, tab:'roster', unit:null, loading:false};
const pctColor=p=>p>=80?'#BBF7D0':p>=60?'#FEF08A':p>0?'#FECACA':'#F1F5F9';
function qstatUnitPct(qstat,u){ if(!u.qs.length) return 0; return Math.round(100*u.qs.reduce((a,q)=>{ const s=qstat[q.id]; return a+(s==='first'||s==='mastered'?1:s==='remediated'?.5:0); },0)/u.qs.length); }
function qstatAttempted(qstat,u){ return u.qs.some(q=>qstat[q.id]); }
function overallPct(st){ const us=allUnits().filter(u=>qstatAttempted(st.qstat||{},u)); if(!us.length) return 0; return Math.round(us.reduce((a,u)=>a+qstatUnitPct(st.qstat||{},u),0)/us.length); }
const ago=ts=>{ if(!ts) return '—'; const s=(Date.now()-ts)/1000; return s<90?'just now':s<3600?Math.round(s/60)+' min ago':s<86400?Math.round(s/3600)+' hr ago':Math.round(s/86400)+' days ago'; };
async function loadDash(force){
  const c=activeClass(); if(!c) return; if(!force && DASH.cid===c.id && Date.now()-DASH.at<20000) return;
  DASH.loading=true; try{ const [s,r]=await Promise.all([API.listStudents(c.id), API.listReports(c.id)]); Object.assign(DASH,{cid:c.id, students:s.sort((a,b)=>(a.name||'').localeCompare(b.name||'')), reports:r, at:Date.now()}); }
  catch(e){ toast('⚠️ Could not load student data: '+esc(e.message)); } DASH.loading=false;
}
function joinLink(c){ return location.origin+location.pathname+'#join-'+c.code; }
async function renderDashboard(m){
  const c=activeClass(); if(!c) return renderOnboard(m);
  if(DASH.cid!==c.id){ DASH={...DASH, cid:null, students:[], reports:[]}; }
  m.innerHTML=dashHTML(c); bindDash(m,c);
  if(DASH.cid!==c.id || Date.now()-DASH.at>20000){ await loadDash(); if(S.role==='dash'&&S.view==='hub'&&SESSION.type==='teacher'){ m.innerHTML=dashHTML(c); bindDash(m,c); } }
}
function dashHTML(c){
  const st=DASH.students, units=allUnits(), tname=(SESSION.teacher&&SESSION.teacher.name)||'';
  const avg=st.length?Math.round(st.reduce((a,s)=>a+overallPct(s),0)/st.length):0, loops=st.reduce((a,s)=>a+(s.loops||0),0);
  const hr=new Date().getHours(), greet=hr<12?'Good morning':hr<17?'Good afternoon':'Good evening';
  const tab=DASH.tab, hu=getUnit(DASH.unit||S.unit);
  let body='';
  if(DASH.loading && !st.length) body='<p class="muted">Loading students…</p>';
  else if(!st.length) body=`<div style="text-align:center;padding:2rem"><p style="font-size:2rem;margin:0">🎓</p><h3>No students yet</h3><p class="muted">Share your class code <b>${esc(c.code||'')}</b>. Students appear here as soon as they join.</p></div>`;
  else if(tab==='roster') body=`<div style="overflow-x:auto"><table><tr><th>Student</th><th>Period</th>${units.slice(0,6).map(u=>`<th title="${esc(u.title)}">${u.icon||''} ${esc(u.short||u.title).slice(0,14)}</th>`).join('')}<th>Overall</th><th>Reteach loops</th><th>Last active</th><th></th></tr>
    ${st.map(s=>{ const q=s.qstat||{}; return `<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.period||'—')}</td>${units.slice(0,6).map(u=>{ const p=qstatUnitPct(q,u), a=qstatAttempted(q,u); return `<td>${a?`<span class="pill" style="background:${pctColor(p)}">${p}%</span>`:'<span class="muted">—</span>'}</td>`; }).join('')}
      <td><b>${overallPct(s)}%</b></td><td>${s.loops||0}</td><td class="small">${ago(s.lastSeen)}</td><td><button class="btn ghost" data-sv="${esc(s.id)}">View</button></td></tr>`; }).join('')}</table></div>`;
  else if(tab==='heat'){ const bms=[...new Set(hu.qs.map(q=>q.bm))];
    body=`<div class="row" style="margin-bottom:.6rem"><select id="huSel">${units.map(u=>`<option value="${u.id}" ${u.id===hu.id?'selected':''}>${esc(u.title)}</option>`).join('')}</select><span class="small">🟩 80%+ · 🟨 60–79% · 🟥 below 60% · ⬜ not attempted</span></div>
    <div style="overflow-x:auto"><table class="heat"><tr><th style="text-align:left">Student</th>${bms.map(b=>`<th title="${esc(BENCHMARK_TEXT[b]||b)}">${esc(b.replace('SS.912.',''))}</th>`).join('')}</tr>
    ${st.map(s=>{ const q=s.qstat||{}; return `<tr><td style="text-align:left;font-weight:600">${esc(s.name)}</td>${bms.map(b=>{ const items=hu.qs.filter(x=>x.bm===b), att=items.filter(x=>q[x.id]); if(!att.length) return `<td style="background:#F8FAFC">·</td>`;
      const p=Math.round(100*items.reduce((a,x)=>a+(q[x.id]==='first'||q[x.id]==='mastered'?1:q[x.id]==='remediated'?.5:0),0)/items.length); return `<td style="background:${pctColor(p)}">${p}</td>`; }).join('')}</tr>`; }).join('')}</table></div>`; }
  else if(tab==='missed'){ const counts={}; st.forEach(s=>Object.entries(s.qstat||{}).forEach(([id,v])=>{ if(v==='remediated'||v==='mastered') counts[id]=(counts[id]||0)+1; }));
    const all=units.flatMap(u=>u.qs.map(q=>({q,u}))); const top=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([id,n])=>({...all.find(x=>x.q.id===id),n})).filter(x=>x.q);
    body= top.length?`<table><tr><th>Question</th><th>Benchmark</th><th>Students who missed it first</th></tr>${top.map(x=>`<tr><td>${esc(x.q.s)}<div class="small">${esc(x.u.title)}</div></td><td><span class="tag gold">${esc(x.q.bm)}</span></td><td><b>${x.n}</b> of ${st.length}</td></tr>`).join('')}</table>
      <div class="row" style="margin-top:.8rem"><button class="btn gold" id="mkRet">🚀 Assign a reteach set from these questions</button><span class="small">Adds a set to your class that students see in their unit list.</span></div>`:'<p class="muted">No missed questions yet.</p>'; }
  else if(tab==='reports') body= DASH.reports.length?`<table><tr><th>Student</th><th>Unit</th><th>Mastery</th><th>Reteach loops</th><th>Verification</th><th>Submitted</th><th></th></tr>${DASH.reports.map((r,i)=>`<tr><td><b>${esc(r.name)}</b> <span class="small">P${esc(r.period||'')}</span></td><td class="small">${esc(r.unit)}</td><td><span class="pill" style="background:${pctColor(r.pct)}">${r.pct}%</span></td><td>${r.loops}</td><td><code>${esc(r.code)}</code></td><td class="small">${ago(r.at)}</td><td><button class="btn ghost" data-rv="${i}">Open</button></td></tr>`).join('')}</table>`:'<p class="muted">Reports appear here when students finish an Independent Mastery Gauntlet.</p>';
  return `<div class="spread" style="margin-bottom:1rem"><div><div class="small">${greet}${tname?', '+esc(tname.split(' ')[0]):''}</div><h1 style="margin:.1rem 0">${esc(c.name)}</h1>
      <div class="small">${esc((COURSES.find(x=>x[0]===c.course)||['',''])[1])}${c.periods&&c.periods.length?' · Periods '+esc(c.periods.join(', ')):''}</div></div>
    <div class="row"><button class="btn" id="dEdit">✏️ Edit classroom</button><button class="btn gold" id="dPresent">🖥️ Present</button></div></div>
  <div class="grid" style="grid-template-columns:minmax(260px,330px) 1fr;gap:1rem;align-items:start">
    <div class="grid" style="gap:1rem">
      <div class="card" id="joinCard"><div class="small" style="font-weight:700;text-transform:uppercase;letter-spacing:.05em">Class code</div><div class="bigcode">${esc(c.code||'——')}</div>
        <p class="small" style="margin:.3rem 0 .7rem">Students go to this site → <b>Join a class</b> → enter the code.</p>
        <div class="row"><button class="btn" id="cpLink">🔗 Copy join link</button><button class="btn" id="projJoin">📽️ Show on board</button></div></div>
      <div class="card"><div class="spread"><b>My classrooms</b><button class="btn ghost" id="dNew">＋ New</button></div>
        <div class="grid" style="gap:.4rem;margin-top:.5rem">${S.classrooms.map(x=>`<button class="clsbtn ${x.id===c.id?'on':''}" data-cl="${x.id}"><b>${esc(x.name)}</b><div class="small">Code ${esc(x.code||'—')}</div></button>`).join('')}</div></div>
    </div>
    <div class="grid" style="gap:1rem">
      <div class="grid g4" style="gap:.7rem">${[['Students',st.length,''],['Average mastery',avg+'%','var(--primary)'],['Reteach loops',loops,'var(--emerald)'],['Reports submitted',DASH.reports.length,'']].map(([l,v,col])=>`<div class="tile"><div class="v" style="color:${col||'var(--ink)'}">${v}</div><div class="l">${l}</div></div>`).join('')}</div>
      <div class="card" id="dashTabs"><div class="spread"><div class="tabs" style="margin:0;flex:1;max-width:560px">${[['roster','Roster'],['heat','Benchmark heatmap'],['missed','Most-missed'],['reports','Reports']].map(([k,l])=>`<button data-dt="${k}" class="${tab===k?'on':''}">${l}</button>`).join('')}</div>
        <button class="btn ghost" id="dRef">↻ Refresh</button></div><div style="margin-top:1rem">${body}</div></div>
    </div></div>`;
}
function bindDash(m,c){
  $('#dEdit',m).onclick=()=>classroomWizard(c);
  $('#dPresent',m).onclick=()=>{ S.role='host'; S.view='hub'; save(); renderTop(); render(); };
  $('#dNew',m).onclick=()=>classroomWizard();
  $$('[data-cl]',m).forEach(b=>b.onclick=()=>{ switchClass(b.dataset.cl); DASH.cid=null; loadAssets(); });
  $('#cpLink',m).onclick=()=>copyText(joinLink(c));
  $('#projJoin',m).onclick=()=>{ const mm=modal(`<div style="text-align:center;padding:2rem 1rem">${LOGO_SVG.replace('class="mark"','class="mark" style="width:64px;height:64px"')}<h1 style="font-size:2.2rem">Join ${esc(c.name)}</h1>
      <p style="font-size:1.3rem">Go to <b>${esc(location.host+location.pathname)}</b> → <b>Join a class</b></p><div class="bigcode" style="font-size:5rem;margin:1rem 0">${esc(c.code)}</div><p class="muted">Enter your first name and last initial.</p></div>`,{full:true}); };
  $$('[data-dt]',m).forEach(b=>b.onclick=()=>{ DASH.tab=b.dataset.dt; m.innerHTML=dashHTML(c); bindDash(m,c); });
  $('#dRef',m).onclick=async()=>{ await loadDash(true); m.innerHTML=dashHTML(c); bindDash(m,c); toast('Updated'); };
  const hs=$('#huSel',m); if(hs) hs.onchange=e=>{ DASH.unit=e.target.value; m.innerHTML=dashHTML(c); bindDash(m,c); };
  $$('[data-sv]',m).forEach(b=>b.onclick=()=>studentDetail(c, DASH.students.find(s=>s.id===b.dataset.sv)));
  $$('[data-rv]',m).forEach(b=>b.onclick=()=>reportDetail(DASH.reports[+b.dataset.rv]));
  const mr=$('#mkRet',m); if(mr) mr.onclick=()=>{ const counts={}; DASH.students.forEach(s=>Object.entries(s.qstat||{}).forEach(([id,v])=>{ if(v==='remediated'||v==='mastered') counts[id]=(counts[id]||0)+1; }));
    const all=allUnits().flatMap(u=>u.qs); const items=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([id])=>all.find(q=>q.id===id)).filter(Boolean).map(q=>({...q, id:q.id+'_rt'+Date.now().toString(36)}));
    const ru=newUnit('Reteach: most-missed ('+new Date().toLocaleDateString()+')','Teacher dashboard'); ru.icon='🔁'; ru.qs=items; ru.bms=[...new Set(items.map(q=>q.bm))]; ru.vocab=[]; S.custom.push(ru); save(); toast('🚀 Reteach set added for your students'); };
}
function studentDetail(c,s){
  const q=s.qstat||{};
  modal(`<h2>${esc(s.name)} <span class="small">Period ${esc(s.period||'—')}</span></h2><div class="row small" style="margin-bottom:1rem"><span>Overall mastery <b>${overallPct(s)}%</b></span>·<span>Reteach loops <b>${s.loops||0}</b></span>·<span>Tokens <b>${s.tokens||0}</b></span>·<span>Last active ${ago(s.lastSeen)}</span></div>
    ${allUnits().map(u=>{ const bms=[...new Set(u.qs.map(x=>x.bm))]; if(!qstatAttempted(q,u)) return `<details><summary>${u.icon||''} ${esc(u.title)} — <span class="muted">not started</span></summary></details>`;
      return `<details open><summary>${u.icon||''} ${esc(u.title)} — ${qstatUnitPct(q,u)}%</summary>${bms.map(b=>{ const it=u.qs.filter(x=>x.bm===b); const p=Math.round(100*it.reduce((a,x)=>a+(q[x.id]==='first'||q[x.id]==='mastered'?1:q[x.id]==='remediated'?.5:0),0)/it.length);
        return `<div class="bmbar"><span title="${esc(BENCHMARK_TEXT[b]||'')}">${esc(b)}</span><span class="meter"><i style="width:${p}%"></i></span><b>${p}%</b></div>`; }).join('')}</details>`; }).join('')}
    <div class="row" style="margin-top:1rem"><button class="btn cr" id="rmStu">Remove student from class</button></div>`).querySelector('#rmStu').onclick=async function(){ if(!confirmInline(this,'Click again to remove')) return; await API.deleteStudent(c.id,s.id); this.closest('.modal-bg').remove(); await loadDash(true); render(); toast('Student removed'); };
}
function confirmInline(btn,msg){ if(btn.dataset.armed) return true; btn.dataset.armed='1'; btn.textContent=msg; setTimeout(()=>{ delete btn.dataset.armed; btn.textContent='Remove student from class'; },3000); return false; }
function reportDetail(r){
  modal(`<div class="report"><div class="spread"><h1>Mastery Report</h1><span class="hash">${esc(r.code)}</span></div>
    <p><b>Student:</b> ${esc(r.name)} &nbsp; <b>Period:</b> ${esc(r.period||'')} &nbsp; <b>Submitted:</b> ${new Date(r.at).toLocaleString()}</p>
    <p><b>Unit:</b> ${esc(r.unit)} &nbsp; <b>Final mastery:</b> ${r.pct}% &nbsp; <b>Reteach loops:</b> ${r.loops} &nbsp; <b>Time:</b> ${r.mins||'—'} min</p>
    ${r.rows?`<table><tr><th>Benchmark</th><th>Items</th><th>First-try</th><th>After reteach</th><th>Mastery</th></tr>${r.rows.map(x=>`<tr><td>${esc(x.bm)}</td><td>${x.n}</td><td>${x.f}</td><td>${x.ms}</td><td>${x.p}%</td></tr>`).join('')}</table>`:''}
    ${r.prompt?`<p style="font-style:italic;margin-top:1rem">${esc(r.prompt)}</p>`:''}<p style="white-space:pre-wrap">${esc(r.response||'')}</p></div>`);
}

/* ------------------------------ ROUTER ------------------------------- */
function render(){
  const m=$('#main'); m.className=''; document.querySelectorAll('.menu').forEach(x=>x.remove());
  if(!SESSION.ready){ m.innerHTML=`<div style="display:grid;place-items:center;height:60vh">${LOGO_SVG.replace('class="mark"','class="mark" style="width:56px;height:56px;opacity:.8"')}<p class="muted">Loading Classroom Arena…</p></div>`; return; }
  if(!SESSION.type) return renderPublic(m);
  renderHUD();
  const v=S.view;
  if(SESSION.type==='teacher' && !S.classrooms.length) return renderOnboard(m);
  if(v==='gauntlet') return renderGauntlet(m);
  if(v==='gallery') return renderGallery(m);
  if(v==='summit') return renderSummit(m,false);
  if(v==='squad') return renderSummit(m,true);
  if(v==='arcade') return renderArcade(m);
  if(v==='jeopardy') return renderJeopardy(m);
  if(v==='live') return renderLive(m);
  if(SESSION.type==='student') return renderStudentHub(m);
  if(S.role==='host') return renderHostHub(m);
  if(S.role==='studio') return renderStudio(m);
  if(S.role==='demo') return renderDemo(m);
  if(S.role==='student') return renderStudentHub(m);
  return renderDashboard(m);
}
function go(view, extra){ S.view=view; S._extra=extra||null; save(); renderTop(); render(); window.scrollTo(0,0); }

/* ------------------------------- AUTH -------------------------------- */
let AUTH_BUSY=false;
async function handleAuth(force){
  if(AUTH_BUSY && !force) return; AUTH_BUSY=true;
  const before=SESSION.type;
  try{
    const u=CURRENT_USER;
    if(u && !u.anon){
      const tch=await API.getTeacher(u.uid)||{name:u.name, email:u.email};
      SESSION={type:'teacher', user:u, teacher:{...tch, email:tch.email||u.email}, ready:true};
      S.join=null; DASH.at=0; DASH.cid=null; DASH.tab='roster'; await loadTeacherClasses();
      if(!['dash','student','host','studio','demo'].includes(S.role)) S.role='dash';
      if(NEW_SIGNUP||before!=='teacher'){ S.role='dash'; S.view='hub'; }
      NEW_SIGNUP=false; S.settings.god=false; setHash('');
    } else if(S.join && !JOINING){
      if(!u) await API.studentAuth();
      const c=await API.getClass(S.join.classId);
      if(c){ const base=DEFAULT_STATE(); S.classrooms=[{...c, settings:Object.assign(base.settings,c.settings||{}), custom:c.custom||[], assets:{}}]; S.activeClass=c.id; linkClass(); await loadAssets(); SESSION={type:'student', ready:true}; S.role='student'; }
      else { S.join=null; SESSION={type:null, ready:true}; toast('That class is no longer available.'); }
    } else {
      if(before==='teacher'){ S.classrooms=[]; S.activeClass=null; linkClass(); }
      SESSION={type:null, ready:true};
    }
  }catch(e){ console.error(e); SESSION={type:null, ready:true}; toast('⚠️ '+esc(friendlyAuthError(e))); }
  AUTH_BUSY=false;
  if(!['hub','arcade'].includes(S.view)) S.view='hub';
  if(!(JOINING && !SESSION.type)) { renderTop(); render(); }
}
let CURRENT_USER=null;
function init(){
  load(); routeFromHash();
  window.addEventListener('hashchange',()=>{ if(!SESSION.type){ routeFromHash(); renderTop(); render(); } });
  renderTop(); render();
  let first=true;
  API.onAuth(u=>{ CURRENT_USER=u; if(JOINING) return; if(first && SANDBOX && !u){ first=false; startDemo(); return; } first=false; handleAuth(); });
}

</script></body></html>
