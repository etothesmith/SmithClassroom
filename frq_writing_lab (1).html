@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0f0a1e;color:#e8e0f0;min-height:100vh}
.glass{background:rgba(255,255,255,0.06);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1);border-radius:16px}
.glass-strong{background:rgba(255,255,255,0.1);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.15);border-radius:16px}
.glow-blue{box-shadow:0 0 30px rgba(59,130,246,0.3)}
.glow-green{box-shadow:0 0 30px rgba(34,197,94,0.3)}
.glow-pink{box-shadow:0 0 30px rgba(236,72,153,0.3)}
.glow-purple{box-shadow:0 0 30px rgba(139,92,246,0.3)}
.btn{padding:12px 28px;border-radius:12px;font-weight:700;cursor:pointer;transition:all 0.3s;border:none;font-size:1rem}
.btn-primary{background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(59,130,246,0.4)}
.btn-success{background:linear-gradient(135deg,#22c55e,#10b981);color:#fff}
.btn-success:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(34,197,94,0.4)}
.btn-danger{background:linear-gradient(135deg,#ef4444,#ec4899);color:#fff}
.btn-danger:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(239,68,68,0.4)}
.btn-outline{background:transparent;border:2px solid rgba(255,255,255,0.3);color:#e8e0f0}
.btn-outline:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.5)}
textarea{background:rgba(0,0,0,0.3);border:2px solid rgba(255,255,255,0.15);border-radius:12px;color:#e8e0f0;padding:16px;font-size:1rem;font-family:'Inter',sans-serif;resize:vertical;transition:border-color 0.3s}
textarea:focus{outline:none;border-color:#8b5cf6}
.score-ring{width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.5rem;font-weight:900}
.topic-card{cursor:pointer;transition:all 0.3s}
.topic-card:hover{transform:translateY(-4px);border-color:rgba(139,92,246,0.5)}
.topic-card.selected{border-color:#8b5cf6;background:rgba(139,92,246,0.15)}
.fade-in{animation:fadeIn 0.5s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.progress-bar{height:8px;border-radius:4px;background:rgba(255,255,255,0.1);overflow:hidden}
.progress-fill{height:100%;border-radius:4px;transition:width 0.5s ease}
.rubric-item{transition:all 0.3s}
.rubric-item.earned{border-color:#22c55e;background:rgba(34,197,94,0.1)}
.rubric-item.missed{border-color:#ef4444;background:rgba(239,68,68,0.1)}
.example-good{border-left:4px solid #22c55e;background:rgba(34,197,94,0.08);padding:16px;border-radius:0 12px 12px 0}
.example-bad{border-left:4px solid #ef4444;background:rgba(239,68,68,0.08);padding:16px;border-radius:0 12px 12px 0}
#certCanvas{display:none}
.ace-label{display:inline-block;width:36px;height:36px;border-radius:50%;text-align:center;line-height:36px;font-weight:900;font-size:0.9rem}
.ace-a{background:linear-gradient(135deg,#ec4899,#f43f5e);color:#fff}
.ace-c{background:linear-gradient(135deg,#f59e0b,#f97316);color:#fff}

        'net exports': ['net exports','exports minus imports','X - M','2 - 3','negative 1','-1 trillion','trade deficit']

// ===== GRADING =====
function submitAll() {
  const prompt = PROMPTS[state.selectedPrompt];
  let totalEarned = 0;
  let totalPossible = 0;

  prompt.parts.forEach((part, pi) => {
    const resp = state.responses[pi] || {a:'',c:'',e:''};
    const fullText = (resp.a + ' ' + resp.c + ' ' + resp.e).toLowerCase();

    let partGrade = { earned: 0, possible: 0, details: [] };

    // Grade each required concept
    part.required.forEach(req => {
      const acceptedPhrases = part.accepted[req] || [req];
      const found = acceptedPhrases.some(phrase => fullText.includes(phrase.toLowerCase()));
      partGrade.possible += 1;
      if (found) partGrade.earned += 1;
      partGrade.details.push({
        concept: req,
        found: found,
        accepted: acceptedPhrases
      });
    });

    // Bonus: check ACE structure
    const hasA = resp.a.trim().length > 15;
    const hasC = resp.c.trim().length > 15;
    const hasE = resp.e.trim().length > 15;

    partGrade.possible += 1;
    if (hasA && hasC && hasE) {
      partGrade.earned += 1;
      partGrade.details.push({concept:'A.C.E. Structure (all 3 sections completed)',found:true,accepted:['Complete A, C, and E sections']});
    } else {
      partGrade.details.push({concept:'A.C.E. Structure (all 3 sections completed)',found:false,accepted:['Complete A, C, and E sections']});
    }

    // Penalty: check for fluff phrases
    const fluff = ['i think','in my opinion','it depends','interesting','well,','this is a topic','many people'];
    const hasFluff = fluff.some(f => fullText.includes(f));
    if (hasFluff) {
      partGrade.details.push({concept:'Directness (no fluff/opinion phrases)',found:false,accepted:['Avoid: "I think", "In my opinion", "It depends"'],penalty:true});
    }

    state.grades[pi] = partGrade;
    totalEarned += partGrade.earned;
    totalPossible += partGrade.possible;
  });

  state.totalScore = totalEarned;
  state.maxScore = totalPossible;
  showScreen('grade');
  renderGrade();
}

function renderCert() {
  const prompt = PROMPTS[state.selectedPrompt];
  const pct = Math.round((state.totalScore / state.maxScore) * 100);
  const apScore = pct >= 90 ? 5 : pct >= 75 ? 4 : pct >= 60 ? 3 : pct >= 40 ? 2 : 1;
  const today = new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});

  // Draw certificate on canvas
  const cv = document.getElementById('certCanvas');
  const ctx = cv.getContext('2d');

  // Background
  const bg = ctx.createLinearGradient(0,0,1200,800);
  bg.addColorStop(0,'#0f0a1e');
  bg.addColorStop(0.5,'#1a1040');
  bg.addColorStop(1,'#0f0a1e');
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,1200,800);

  // Border
  ctx.strokeStyle = '#8b5cf6';
  ctx.lineWidth = 4;
  ctx.strokeRect(30,30,1140,740);
  ctx.strokeStyle = '#3b82f6';
  ctx.lineWidth = 2;
  ctx.strokeRect(40,40,1120,720);

  // Corner decorations
  const corners = [[50,50],[1150,50],[50,750],[1150,750]];
  corners.forEach(([cx,cy]) => {
    ctx.fillStyle = '#8b5cf6';
    ctx.beginPath(); ctx.arc(cx,cy,8,0,Math.PI*2); ctx.fill();
  });

  // Title
  ctx.fillStyle = '#e8e0f0';
  ctx.font = 'bold 48px Inter, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('CERTIFICATE OF ACHIEVEMENT', 600, 130);

  // Divider
  const divGrad = ctx.createLinearGradient(200,0,1000,0);
  divGrad.addColorStop(0,'transparent');
  divGrad.addColorStop(0.3,'#8b5cf6');
  divGrad.addColorStop(0.7,'#3b82f6');
  divGrad.addColorStop(1,'transparent');
  ctx.strokeStyle = divGrad;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(200,155); ctx.lineTo(1000,155); ctx.stroke();

  // AP Score badge
  const scoreGrad = ctx.createLinearGradient(520,180,680,320);
  scoreGrad.addColorStop(0, apScore>=4?'#22c55e':'#f59e0b');
  scoreGrad.addColorStop(1, apScore>=4?'#10b981':'#f97316');
  ctx.fillStyle = scoreGrad;
  ctx.beginPath(); ctx.arc(600,260,65,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 72px Inter, sans-serif';
  ctx.fillText(apScore, 600, 285);
  ctx.font = 'bold 16px Inter, sans-serif';
  ctx.fillText('AP SCORE', 600, 340);

  // Prompt title
  ctx.fillStyle = '#c4b5fd';
  ctx.font = '24px Inter, sans-serif';
  ctx.fillText(prompt.title, 600, 400);

  // Topic & Score
  ctx.fillStyle = '#9ca3af';
  ctx.font = '18px Inter, sans-serif';
  ctx.fillText(`${prompt.topic} | ${state.totalScore}/${state.maxScore} points (${pct}%)`, 600, 440);

  // Achievement text
  ctx.fillStyle = '#e8e0f0';
  ctx.font = '22px Inter, sans-serif';
  ctx.fillText('Has demonstrated proficiency in AP Economics', 600, 500);
  ctx.fillText('Free Response writing using the A.C.E. method', 600, 530);

  // Date & Teacher
  ctx.fillStyle = '#9ca3af';
  ctx.font = '18px Inter, sans-serif';
  ctx.fillText(today, 600, 600);

  // Signature line
  ctx.strokeStyle = '#6b7280';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(400,670); ctx.lineTo(800,670); ctx.stroke();
  ctx.fillStyle = '#c4b5fd';
  ctx.font = 'italic 20px Inter, sans-serif';
  ctx.fillText('Coach Smith', 600, 660);
  ctx.fillStyle = '#6b7280';
  ctx.font = '14px Inter, sans-serif';
  ctx.fillText("Coach Smith's Classroom | AP Econ FRQ Writing Lab", 600, 700);

  // Show preview and download
  const dataUrl = cv.toDataURL('image/png');
  document.getElementById('screenCert').innerHTML = `
  <div class="fade-in text-center">
    <h2 class="text-2xl font-black mb-4">Your Certificate!</h2>
    <img src="${dataUrl}" class="max-w-full rounded-xl border border-purple-500/30 mb-6 mx-auto" style="max-height:500px">
    <div class="flex flex-wrap gap-3 justify-center">
      <a href="${dataUrl}" download="FRQ_Certificate_${prompt.id}.png" class="btn btn-success">Download Certificate</a>
      <button class="btn btn-primary" onclick="startPick()">Try Another Prompt</button>
      <button class="btn btn-outline" onclick="renderIntro();showScreen('intro')">Back to Start</button>
    </div>
  </div>`;
}

// ===== INIT =====
renderIntro();
</script>
</body>
</html>
